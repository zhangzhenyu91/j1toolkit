<!DOCTYPE html>
<!--
  方案四 ·「流光溢彩」现代渐变风 —— 检修一班工具箱（班组应用聚合平台）
  ----------------------------------------------------------------------
  主色板：
    主渐变   #5F7CFF → #8A5CFF → #B06BFF（160deg，蓝紫流光）
    激活紫   #6A5CFF（TabBar / 强调）
    内容底色 #F4F6FB；输入框底 #F2F4FB；卡片 #FFFFFF
    文字主色 #1B2440；次要文字 #7A86A1
  设计要点：
    1. 登录页整屏蓝紫渐变 + 流光光斑，Logo 为半透明白色玻璃拟态方块，年轻通透。
    2. 输入区为白色 22px 大圆角浮层卡片，输入框浅紫灰 #F2F4FB / 12px 圆角；
       主按钮蓝紫渐变 + rgba(111,91,255,0.35) 柔和投影，浮于卡片之上。
    3. 首页/我的页顶部蓝紫渐变 Hero（状态栏 + 导航 + 用户卡片置于其上，白字），
       用户卡片为 rgba(255,255,255,0.16) 玻璃拟态，内容区 #F4F6FB + 白卡 18px 圆角。
    4. 宫格图标各用不同渐变底（蓝紫/紫粉/粉橙/青绿/蓝青/紫金/翠绿）+ 白色图标，
       “敬请期待”以浅灰虚线描边占位，体现应用入口预留。
    5. TabBar 白底 + 顶部发丝线，激活项采用蓝紫渐变图标与文字，层级克制清晰。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案四 · 流光溢彩 — 检修一班工具箱</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#EEF1FA 0%,#E6EAF6 100%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    color:#1B2440;
  }

  /* ---------- 页面外层标题栏 ---------- */
  .top { text-align:center; padding:44px 20px 8px; }
  .top .tag {
    display:inline-block; font-size:12px; font-weight:600; letter-spacing:2px;
    color:#fff; padding:5px 14px; border-radius:999px;
    background:linear-gradient(135deg,#5F7CFF,#8A5CFF 55%,#B06BFF);
    box-shadow:0 6px 16px rgba(111,91,255,.35);
  }
  .top h1 { font-size:26px; font-weight:700; margin-top:14px; letter-spacing:1px; }
  .top p { font-size:13px; color:#7A86A1; margin-top:8px; letter-spacing:.5px; }

  /* ---------- 机框舞台 ---------- */
  .stage {
    display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start;
    gap:56px; padding:40px 24px 72px;
  }
  .device-wrap { display:flex; flex-direction:column; align-items:center; }
  .device {
    padding:12px; background:#10131C; border-radius:58px;
    box-shadow:0 34px 70px rgba(27,36,64,.28), 0 6px 18px rgba(27,36,64,.16),
               inset 0 0 0 1.5px rgba(255,255,255,.06);
  }
  .screen {
    width:375px; height:812px; border-radius:46px; overflow:hidden;
    position:relative; display:flex; flex-direction:column; background:#F4F6FB;
  }
  .caption { margin-top:20px; font-size:14px; font-weight:600; color:#3B4767; letter-spacing:1px; }

  /* ---------- 灵动岛 & 状态栏 ---------- */
  .island {
    position:absolute; top:11px; left:50%; transform:translateX(-50%);
    width:112px; height:32px; border-radius:20px; background:#0B0E17; z-index:30;
  }
  .statusbar {
    height:54px; flex:none; display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 30px 8px; position:relative; z-index:20; color:#fff;
  }
  .statusbar .time { font-size:15px; font-weight:600; letter-spacing:.5px; }
  .statusbar .sicons { display:flex; align-items:center; gap:7px; }

  /* ---------- 登录页 ---------- */
  .scr-login { background:linear-gradient(160deg,#5F7CFF 0%,#8A5CFF 52%,#B06BFF 100%); }
  .blob { position:absolute; border-radius:50%; pointer-events:none; }
  .scr-login .b1 { width:260px; height:260px; top:-90px; right:-80px;
    background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.34),rgba(255,255,255,0) 68%); }
  .scr-login .b2 { width:200px; height:200px; bottom:130px; left:-90px;
    background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.22),rgba(255,255,255,0) 70%); }
  .scr-login .b3 { width:150px; height:150px; top:180px; left:-50px;
    background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.18),rgba(255,255,255,0) 70%); }

  .login-body { flex:1; display:flex; flex-direction:column; align-items:center; position:relative; z-index:10; }
  .logo-glass {
    width:76px; height:76px; border-radius:22px; margin-top:44px;
    background:rgba(255,255,255,.20); border:1px solid rgba(255,255,255,.48);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 14px 30px rgba(64,38,160,.25), inset 0 1px 0 rgba(255,255,255,.5);
    color:#fff;
  }
  .login-body h1 { font-size:22px; font-weight:700; color:#fff; margin-top:18px; letter-spacing:2px; }
  .login-body .slogan { font-size:12.5px; color:rgba(255,255,255,.82); margin-top:7px; letter-spacing:3px; }

  .login-card {
    width:calc(100% - 44px); margin-top:30px; background:#fff; border-radius:22px;
    padding:24px 20px 22px;
    box-shadow:0 20px 44px rgba(56,32,132,.28);
  }
  .field {
    display:flex; align-items:center; gap:10px; height:48px; padding:0 14px;
    background:#F2F4FB; border-radius:12px; color:#A6AEC5;
  }
  .field + .field { margin-top:14px; }
  .field input {
    flex:1; border:none; outline:none; background:transparent;
    font-size:14px; color:#1B2440; font-family:inherit;
  }
  .field input::placeholder { color:#9AA3BC; }
  .btn-primary {
    margin-top:20px; height:48px; border-radius:12px; border:none; width:100%;
    font-size:16px; font-weight:600; color:#fff; letter-spacing:6px; font-family:inherit;
    background:linear-gradient(135deg,#5F7CFF 0%,#8A5CFF 100%);
    box-shadow:0 10px 22px rgba(111,91,255,.35);
    display:flex; align-items:center; justify-content:center;
  }

  .divider {
    display:flex; align-items:center; gap:12px; margin:26px 40px 0;
    font-size:11.5px; color:rgba(255,255,255,.78); letter-spacing:1px;
  }
  .divider::before,.divider::after { content:""; flex:1; height:1px; background:rgba(255,255,255,.38); }

  .btn-wechat {
    margin:16px 22px 0; height:46px; border-radius:23px;
    border:1px solid rgba(255,255,255,.55); background:rgba(255,255,255,.16);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center; gap:8px;
    color:#fff; font-size:14.5px; font-weight:500; letter-spacing:1px;
  }

  .agree {
    margin-top:auto; display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:11px; color:rgba(255,255,255,.78);
  }
  .cb {
    width:15px; height:15px; border-radius:4.5px; background:#fff; flex:none;
    display:flex; align-items:center; justify-content:center; color:#6A5CFF;
    box-shadow:0 2px 6px rgba(56,32,132,.25);
  }
  .agree a { color:#fff; font-weight:600; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.75); }
  .version { text-align:center; font-size:10.5px; color:rgba(255,255,255,.55); letter-spacing:1px; padding:14px 0 18px; }

  /* ---------- 渐变 Hero（首页/我的共用） ---------- */
  .hero {
    flex:none; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#5F7CFF 0%,#8A5CFF 52%,#B06BFF 100%);
    border-radius:0 0 26px 26px; display:flex; flex-direction:column;
  }
  .hero .hb1 { width:220px; height:220px; top:-70px; right:-70px;
    background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.30),rgba(255,255,255,0) 68%); }
  .hero .hb2 { width:160px; height:160px; bottom:-60px; left:-60px;
    background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.20),rgba(255,255,255,0) 70%); }
  .navbar {
    height:48px; flex:none; display:flex; align-items:center; justify-content:center;
    position:relative; z-index:10;
  }
  .navbar .title { font-size:17px; font-weight:600; color:#fff; letter-spacing:1.5px; }

  .user-card {
    position:relative; z-index:10; margin:16px 18px 24px; padding:18px;
    border-radius:18px; background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.30);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
    display:flex; align-items:center; gap:14px;
  }
  .avatar {
    width:54px; height:54px; border-radius:16px; flex:none;
    background:linear-gradient(135deg,#8A5CFF,#B06BFF);
    border:1.5px solid rgba(255,255,255,.55);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:21px; font-weight:600;
  }
  .user-card .info { flex:1; min-width:0; }
  .user-card .hello { font-size:17px; font-weight:600; color:#fff; letter-spacing:.5px; }
  .user-card .role { font-size:12px; color:rgba(255,255,255,.80); margin-top:6px; letter-spacing:.5px; }
  .user-card .sun { color:rgba(255,255,255,.85); flex:none; }

  /* ---------- 内容区 ---------- */
  .content { flex:1; position:relative; z-index:5; }
  .panel {
    margin:18px 16px 0; background:#fff; border-radius:18px;
    box-shadow:0 10px 26px rgba(27,36,64,.06);
  }
  .panel-head { display:flex; align-items:center; gap:9px; padding:18px 18px 4px; }
  .panel-head .bar { width:4px; height:15px; border-radius:2px;
    background:linear-gradient(180deg,#5F7CFF,#B06BFF); }
  .panel-head .t { font-size:15.5px; font-weight:600; letter-spacing:.5px; }

  .grid {
    display:grid; grid-template-columns:repeat(4,1fr);
    row-gap:26px; padding:20px 14px 24px;
  }
  .g-item { display:flex; flex-direction:column; align-items:center; }
  .g-icon {
    width:50px; height:50px; border-radius:15px; color:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 16px rgba(27,36,64,.12);
  }
  .g1 { background:linear-gradient(135deg,#5F7CFF,#8A5CFF); }   /* 蓝紫 */
  .g2 { background:linear-gradient(135deg,#9D5CFF,#E26BF5); }   /* 紫粉 */
  .g3 { background:linear-gradient(135deg,#FF6B9D,#FF9A62); }   /* 粉橙 */
  .g4 { background:linear-gradient(135deg,#14C8A8,#3ED47E); }   /* 青绿 */
  .g5 { background:linear-gradient(135deg,#38BDF8,#5F7CFF); }   /* 蓝青 */
  .g6 { background:linear-gradient(135deg,#A66BFF,#FFC24B); }   /* 紫金 */
  .g7 { background:linear-gradient(135deg,#34D399,#A3E635); }   /* 翠绿 */
  .g-item .lb { font-size:11px; color:#1B2440; margin-top:8px; letter-spacing:.5px; }
  .g-icon.soon {
    background:#F1F3F9; border:1.5px dashed #C9D0E2; box-shadow:none; color:#B7BFD3;
  }
  .g-item .lb.soon { color:#A6AEC5; }

  /* ---------- 我的页 ---------- */
  .list { padding:6px 0; }
  .row {
    display:flex; align-items:center; gap:12px; padding:13px 16px;
  }
  .row + .row { border-top:1px solid #F0F2F9; }
  .row .ric {
    width:36px; height:36px; border-radius:11px; flex:none; color:#fff;
    display:flex; align-items:center; justify-content:center;
  }
  .row .rl { flex:1; font-size:14px; letter-spacing:.5px; }
  .row .rv { font-size:12px; color:#7A86A1; margin-right:2px; }
  .row .chev { color:#C4CADB; flex:none; }

  .btn-logout {
    margin:16px 16px 0; height:52px; background:#fff; border-radius:18px;
    box-shadow:0 10px 26px rgba(27,36,64,.06);
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:500; color:#F04438; letter-spacing:2px;
  }

  /* ---------- TabBar ---------- */
  .tabbar-wrap {
    position:absolute; left:0; right:0; bottom:0; z-index:25;
    background:rgba(255,255,255,.97); border-top:1px solid #ECEFF6;
  }
  .tabbar { padding:9px 0 0; display:flex; }
  .tab {
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:#9AA3BC; font-size:10.5px; letter-spacing:1px;
  }
  .tab.on { color:transparent; background:linear-gradient(135deg,#5F7CFF,#8A5CFF);
    -webkit-background-clip:text; background-clip:text; font-weight:600; }
  .home-indicator { width:134px; height:5px; border-radius:2.5px; background:#1B2440; margin:12px auto 8px; }
    /* ---------- 窄屏自适应：保持三机框同排 ---------- */
    @media (max-width: 1380px) { .stage { zoom: .94; } }
    @media (max-width: 1280px) { .stage { zoom: .85; } }
    @media (max-width: 1170px) { .stage { zoom: .76; } }
    @media (max-width: 1060px) { .stage { zoom: .68; } }
    @media (max-width: 960px)  { .stage { zoom: .60; } }
</style>
</head>

    <linearGradient id="grad-tab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5F7CFF"/>
      <stop offset="1" stop-color="#8A5CFF"/>

  </defs>
</svg>

<header class="top">
  <span class="tag">方案四</span>
  <h1>流光溢彩 · 现代渐变风</h1>
  <p>整屏蓝紫渐变与玻璃拟态质感，年轻、活力、通透的班组应用聚合平台</p>

  <!-- ============ ① 登录页 ============ -->
  <figure class="device-wrap">

              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="11" width="12" height="8.5" rx="2.5"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/></svg>

            微信一键登录
          </div>

          <div class="agree">
            <span class="cb">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>

          <div class="version">v1.0.0</div>
        </div>
      </div>
    </div>
    <figcaption class="caption">① 登录页</figcaption>
  </figure>

  <!-- ============ ② 首页 · 应用中心 ============ -->
  <figure class="device-wrap">
    <div class="device">
      <div class="screen">
        <div class="island"></div>

        <div class="hero">
          <div class="blob hb1"></div>
          <div class="blob hb2"></div>
          <div class="statusbar">
            <span class="time">9:41</span>
            <span class="sicons">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2.5" width="3" height="9.5" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>

              <svg width="26" height="12" viewBox="0 0 26 12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="1.5" width="20" height="9" rx="2.8"/><rect x="3.2" y="3.7" width="13" height="4.6" rx="1.4" fill="currentColor" stroke="none"/><path d="M23 4.2v3.6" stroke-linecap="round" stroke-width="1.8"/></svg>
            </span>
          </div>
          <div class="navbar"><span class="title">检修一班工具箱</span></div>

          <div class="user-card">
            <div class="avatar">张</div>

              <div class="role">检修一班 · 高级技师</div>

            <svg class="sun" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </div>
        </div>

        <div class="content">
          <div class="panel">
            <div class="panel-head">
              <span class="bar"></span>
              <span class="t">应用中心</span>
            </div>
            <div class="grid">
