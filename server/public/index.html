<!DOCTYPE html>
<!-- Shade 壹匣 · 网页版门户工作台（方案十二「包豪斯几何」：几何构成用户大卡 + 应用中心 + 硬影语言） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · Shade 壹匣</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  /* ============================================================
     本页样式 · 包豪斯几何（基准 design/redesign/12-包豪斯几何-Web首页.html）
     几何装饰全部纯 CSS（伪元素 / border-radius / clip-path），无图片依赖；
     入场编排 fill-mode:both 落位静止，可 hover 下沉的卡片改用 backwards
     （forwards 填充会锁定 transform、吞掉 hover 下沉，backwards 视觉一致且落位后交还控制权）
     ============================================================ */

  /* ===== 用户大卡：左文右形的几何构成 ===== */
  .user-card { overflow: hidden; animation: riseIn .7s var(--ease) .05s both; }
  .uc-body { display: grid; grid-template-columns: 1fr 320px; min-height: 262px; }
  .uc-main { position: relative; z-index: 2; padding: 36px 40px 32px; }
  .kicker {
    display: inline-flex; align-items: center; gap: 9px;
    font-size: 11px; font-weight: 800; letter-spacing: 3.5px; color: var(--sub);
    animation: riseIn .6s var(--ease) .2s both;
  }
  .kicker::before { content: ""; width: 9px; height: 9px; background: var(--red); }
  .uc-hello-row { margin-top: 20px; display: flex; align-items: center; gap: 18px; }
  .uc-avatar {
    width: 62px; height: 62px; flex: none; border-radius: 0;
    background: var(--navy); color: #fff; border: 2px solid var(--navy);
    box-shadow: inset 0 0 0 3px var(--yellow);
    display: flex; align-items: center; justify-content: center;
    font-size: 25px; font-weight: 800;
    animation: riseIn .7s var(--ease) .25s both;
  }
  .uc-hello { font-size: 50px; line-height: 1.12; font-weight: 800; letter-spacing: -1px; overflow: hidden; }
  .uc-hello span { display: block; animation: riseIn .75s var(--ease) .32s both; }
  .uc-meta {
    margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    animation: riseIn .7s var(--ease) .46s both;
  }
  .uc-date { font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: 1px; }
  .uc-role { display: inline-flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--sub); }
  .uc-role .uname { letter-spacing: .5px; }

  /* 右侧几何舞台（黄正圆 × 蓝下半圆 × 红三角 × 墨点 × 刻度环 × 红斜条；纯装饰不响应指针） */
  .uc-geo { position: relative; border-left: 1.5px solid var(--line); }
  .geo-stage { position: absolute; inset: 0; pointer-events: none; }
  .geo { position: absolute; animation: geoIn 1.1s var(--ease) both; }
  .g-circle-y { width: 172px; height: 172px; right: 58px; top: 34px; animation-delay: .5s; }
  .g-circle-y > i { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--yellow); }
  .g-semi-b { width: 138px; height: 138px; right: 128px; top: 108px; animation-delay: .65s; }
  .g-semi-b > i { display: block; width: 138px; height: 69px; background: var(--orange); border-radius: 0 0 138px 138px; }
  .g-tri-r { width: 78px; height: 78px; right: 18px; top: 14px; animation-delay: .8s; }
  .g-tri-r > i { display: block; width: 100%; height: 100%; background: var(--red); clip-path: polygon(50% 0, 100% 100%, 0 100%); transform: rotate(14deg); }
  .g-dot-ink { width: 24px; height: 24px; right: 198px; top: 62px; animation-delay: .95s; }
  .g-dot-ink > i { display: block; width: 100%; height: 100%; border-radius: 50%; background: var(--navy); }
  /* 墨环刻度：46s 慢转（全页仅两处的氛围动效之一） */
  .g-ring {
    position: absolute; width: 236px; height: 236px; right: 26px; top: -34px;
    border-radius: 50%; border: 2px dashed rgba(17, 17, 17, .28);
    animation: spinSlow 46s linear infinite;
  }
  .hero-slash {
    position: absolute; left: -34px; bottom: 40px; width: 160px; height: 5px;
    background: var(--red); transform: rotate(-24deg); transform-origin: left center;
    animation: slashIn .8s var(--ease) .9s both;
  }
  .uc-side {
    position: absolute; right: 20px; bottom: 16px; z-index: 2; text-align: right;
    font-size: 11px; line-height: 1.9; letter-spacing: 2px; color: var(--sub);
    animation: riseIn .7s var(--ease) .85s both;
  }

  /* ===== 板块标题入场（红方块 + 标题为 theme.css 既有语言） ===== */
  .section-title { animation: riseIn .6s var(--ease) both; }
  .sec-msg { animation-delay: .34s; }
  .sec-app { animation-delay: .5s; }
  .sec-ext { animation-delay: .64s; }

  /* ===== 消息通知卡（直角红方未读点 + 发丝线分隔） ===== */
  .notice-card { overflow: hidden; animation: riseIn .7s var(--ease) .42s backwards; }
  .nt-badge {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--red); color: #fff; border-radius: 0; padding: 4px 12px;
    font-size: 11px; font-weight: 800; letter-spacing: 1px;
    box-shadow: var(--hard-s);
  }
  .nt-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  #noticeBadge { cursor: pointer; }
  .nt-item {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    transition: background .18s var(--ease);
    animation: rowIn .55s var(--ease) both;
  }
  .nt-item:nth-child(1) { animation-delay: .05s; }
  .nt-item:nth-child(2) { animation-delay: .12s; }
  .nt-item:nth-child(3) { animation-delay: .19s; }
  .nt-item:last-child { border-bottom: none; }
  .nt-item:hover { background: var(--paper); }
  .nt-dot { width: 8px; height: 8px; flex: none; background: var(--red); }
  .nt-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .nt-item.unread .nt-title { font-weight: 800; }
  .nt-time { flex: none; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--sub); font-variant-numeric: tabular-nums; }

  /* ===== 应用中心宫格（几何圆形图标 + 右上 ¼ 圆角标，蓝/黄交替） ===== */
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .app-card {
    display: block; padding: 24px; color: inherit; overflow: hidden;
    animation: cardIn .65s var(--ease) backwards;
  }
  .app-card:link, .app-card:visited { color: inherit; }
  .apps .app-card:nth-child(1) { animation-delay: 0s; }
  .apps .app-card:nth-child(2) { animation-delay: .07s; }
  .apps .app-card:nth-child(3) { animation-delay: .14s; }
  .apps .app-card:nth-child(4) { animation-delay: .21s; }
  .apps .app-card:nth-child(5) { animation-delay: .28s; }
  .apps .app-card:nth-child(6) { animation-delay: .35s; }
  .apps .app-card:nth-child(n+7) { animation-delay: .42s; }
  /* 外部应用同步渲染，入场时延接在板块标题之后 */
  #extGrid .app-card:nth-child(1) { animation-delay: .7s; }
  #extGrid .app-card:nth-child(2) { animation-delay: .78s; }
  #extGrid .app-card:nth-child(3) { animation-delay: .86s; }
  #extGrid .app-card:nth-child(n+4) { animation-delay: .94s; }
  /* 右上 ¼ 圆几何（对应设计稿 .ca-qb / .ca-qy，奇蓝偶黄交替） */
  .app-card:not(.app-soon)::before {
    content: ""; position: absolute; top: 0; right: 0; width: 42px; height: 42px;
    background: var(--orange); border-radius: 0 0 0 42px; pointer-events: none;
  }
  .apps .app-card:nth-child(even):not(.app-soon)::before { background: var(--yellow); }
  /* hover 下沉吃影 + 微倾（theme .card-hover 的 translate(2px,2px) 之上叠加 rotate） */
  .app-card.card-hover:hover { transform: translate(2px, 2px) rotate(-.4deg); box-shadow: var(--hard-s); }
  /* 图标几何圆形：红/蓝/黄三色循环，黄底配墨图标（Shade.icon 的 stroke 属性由 CSS 覆写） */
  .app-ic {
    position: relative; width: 54px; height: 54px; border-radius: 50%;
    background: var(--red);
    display: flex; align-items: center; justify-content: center;
    transition: transform .3s var(--ease);
  }
  .app-ic svg { width: 25px; height: 25px; stroke: #fff; color: #fff; }
  .app-card:hover .app-ic { transform: rotate(-8deg) scale(1.06); }
  .apps .app-card:nth-child(3n+2) .app-ic { background: var(--orange); }
  .apps .app-card:nth-child(3n) .app-ic { background: var(--yellow); }
  .apps .app-card:nth-child(3n) .app-ic svg { stroke: var(--navy); color: var(--navy); }
  .app-card h4 { margin-top: 16px; font-size: 17px; font-weight: 800; letter-spacing: 1px; }
  .app-card > p { margin-top: 9px; font-size: 12.5px; color: var(--sub); line-height: 1.85; min-height: 46px; }
  .app-meta { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1.5px solid var(--line); }
  /* 分类标签：小号宽字距（实色块样式走 theme .tag 体系） */
  .app-meta .tag { letter-spacing: 1.5px; }
  .app-go { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 800; letter-spacing: 1px; color: var(--navy); }
  .app-go svg { width: 15px; height: 15px; color: var(--red); transition: transform .18s var(--ease); }
  .app-card:hover .app-go svg { transform: translateX(4px); }
  /* 「敬请期待」虚线占位 */
  .app-soon {
    background: transparent; border: 2px dashed var(--dash); box-shadow: none;
    min-height: 190px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 9px; cursor: default;
  }
  /* 与 nth-child 三色循环同优先级、源码居后取胜：占位卡图标保持虚线墨灰，不吃三色 */
  .apps .app-card.app-soon .app-ic { width: 48px; height: 48px; background: transparent; border: 2px dashed var(--dash); }
  .apps .app-card.app-soon .app-ic svg { width: 22px; height: 22px; stroke: var(--dash); color: var(--dash); }
  .apps .app-card.app-soon:hover .app-ic { transform: none; }
  .app-soon h4 { margin-top: 2px; font-size: 14px; color: var(--ph); }
  .app-soon p { font-size: 11.5px; color: var(--ph); }
  /* 宫格内空态占满整行 */
  .apps .empty { grid-column: 1 / -1; background: #fff; border: 2px solid var(--navy); border-radius: var(--radius); box-shadow: var(--hard); }
  /* 骨架卡片 */
  .app-sk { height: 190px; }

  /* ===== 外部应用（墨边纸底圆形图标 + 黄三角角标，对应设计稿 .ext / .ca-try） ===== */
  #extGrid .app-card:not(.app-soon)::before {
    width: 34px; height: 34px; background: var(--yellow); border-radius: 0;
    clip-path: polygon(100% 0, 100% 100%, 0 0);
  }
  #extGrid .app-ic { background: var(--paper); border: 2px solid var(--navy); }
  #extGrid .app-ic svg { stroke: var(--red); color: var(--red); }
  #extGrid .app-card:nth-child(3n+2) .app-ic svg { stroke: var(--orange); color: var(--orange); }
  #extGrid .app-card:nth-child(3n) .app-ic svg { stroke: var(--navy); color: var(--navy); }

  /* ===== 安全提示条（黄底 + 两端墨斜纹，22s 缓移——全页仅两处的氛围动效之二） ===== */
  .safety {
    position: relative; overflow: hidden; margin-top: 26px;
    display: flex; align-items: center; gap: 16px;
    background: var(--yellow); padding: 16px 24px;
    animation: riseIn .7s var(--ease) .78s both;
  }
  .safety::before, .safety::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 56px;
    background: repeating-linear-gradient(-45deg, var(--navy) 0 7px, transparent 7px 16px);
    background-size: 200% 100%; opacity: .92;
    animation: stripeMove 22s linear infinite;
  }
  .safety::before { left: 0; }
  .safety::after { right: 0; }
  .safety .si {
    position: relative; z-index: 2; width: 40px; height: 40px; flex: none; margin-left: 42px;
    border-radius: 50%; background: var(--navy); color: var(--yellow);
    display: flex; align-items: center; justify-content: center;
  }
  .safety .si svg { width: 20px; height: 20px; }
  .safety .safety-tx {
    position: relative; z-index: 2; margin-right: 42px;
    font-size: 13.5px; font-weight: 600; letter-spacing: 1px; line-height: 1.8; color: var(--navy);
  }
  .safety b { font-weight: 800; }

  /* ===== 弹层（直角 + 2px 墨边 + 硬影；按钮走 theme .btn 体系） ===== */
  .mask {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(17, 17, 17, .45);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .mask.show { display: flex; }
  .modal {
    width: 100%; max-width: 560px; background: #fff; border: 2px solid var(--navy);
    border-radius: 0; overflow: hidden;
    box-shadow: 8px 8px 0 rgba(17, 17, 17, .9);
    animation: fadeUp .3s var(--ease) both;
  }
  .modal-hd {
    display: flex; align-items: center; gap: 10px; padding: 15px 20px;
    border-bottom: 2px solid var(--navy);
    font-size: 15px; font-weight: 800; letter-spacing: 2px;
  }
  .modal-hd .x {
    margin-left: auto; width: 30px; height: 30px; flex: none;
    border: 2px solid transparent; border-radius: 0; background: none; cursor: pointer;
    color: var(--sub); display: flex; align-items: center; justify-content: center;
    transition: color .15s, background .15s, border-color .15s;
  }
  .modal-hd .x:hover { color: var(--navy); background: var(--yellow); border-color: var(--navy); }
  .modal-hd .x svg { width: 15px; height: 15px; }
  /* 「全部已读」隐藏时关闭按钮由自身 margin-left:auto 右对齐 */
  #noticeReadAll { margin-left: auto; }
  #noticeReadAll[hidden] { display: none; }
  #noticeReadAll[hidden] + .x { margin-left: auto; }
  .nm-list { max-height: 62vh; overflow-y: auto; }
  .nm-item { padding: 15px 20px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .18s var(--ease); }
  .nm-item:last-child { border-bottom: none; }
  .nm-item:hover { background: var(--paper); }
  .nm-head { display: flex; align-items: center; gap: 10px; }
  .nm-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .nm-item.unread .nm-title { font-weight: 800; }
  /* 内容默认两行折叠，点击条目展开全文（Markdown 渲染，含图片） */
  .nm-content {
    margin-top: 7px; font-size: 12.5px; color: var(--sub); line-height: 1.8;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .nm-item.open .nm-content { display: block; }
  /* Markdown 排版（对齐 callme.html 结构，色板换为包豪斯几何） */
  .nm-content h1, .nm-content h2, .nm-content h3, .nm-content h4 { font-size: 14px; font-weight: 700; color: var(--navy); margin: 8px 0 4px; }
  .nm-content p { margin: 4px 0; }
  .nm-content ul, .nm-content ol { margin: 4px 0 4px 1.2em; padding: 0; }
  .nm-content li { margin: 2px 0; }
  .nm-content code { font-family: Menlo, Consolas, monospace; font-size: .92em; color: var(--orange); background: var(--paper); padding: 1px 5px; }
  .nm-content pre { background: var(--paper); border: 1.5px solid var(--line); border-radius: 0; padding: 10px; margin: 8px 0; overflow-x: auto; }
  .nm-content blockquote { border-left: 3px solid var(--orange); margin: 6px 0; padding: 2px 10px; color: var(--sub); background: var(--paper); }
  .nm-content a { color: var(--orange); }
  .nm-content hr { border: none; border-top: 1px solid var(--line); margin: 10px 0; }
  .nm-content table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; }
  .nm-content th, .nm-content td { border: 1px solid var(--line); padding: 5px 9px; }
  .nm-content th { background: var(--paper); color: var(--navy); }
  .nm-content .md-img { display: block; max-width: 100%; border-radius: 0; margin: 6px 0; }
  .nm-content .md-code { margin: 8px 0; }
  .nm-content .md-code-h { display: none; } /* 通知弹层不提供复制按钮 */
  /* 超管删除入口（标题行右侧红色小字钮） */
  .nm-del {
    flex: none; font-size: 12px; font-weight: 700; color: var(--red); cursor: pointer;
    padding: 3px 8px; border: 1.5px solid transparent;
    transition: border-color .15s, background .15s;
  }
  .nm-del:hover { border-color: var(--red); background: rgba(210, 39, 48, .08); }
  /* 删除确认弹层（复用 .mask/.modal；对齐 admin.html 删除班组确认） */
  .modal-bd { padding: 18px 22px 6px; }
  .modal-ft { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px 18px; }
  .modal-bd .tip { font-size: 13px; color: var(--sub); line-height: 1.7; }

  /* ===== 动效定义 ===== */
  @keyframes riseIn { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rowIn { from { transform: translateX(-26px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes cardIn { from { transform: translateY(32px) rotate(-2deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes geoIn {
    0% { transform: rotate(-150deg) translate(110px, -70px); opacity: 0; }
    45% { opacity: 1; }
    68% { transform: rotate(10deg) translate(-8px, 5px); }
    100% { transform: none; opacity: 1; }
  }
  @keyframes slashIn { from { transform: rotate(-24deg) scaleX(0); opacity: 0; } to { transform: rotate(-24deg) scaleX(1); opacity: 1; } }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  @keyframes stripeMove { to { background-position: 90px 0; } }

  /* ===== 响应式 ===== */
  @media (max-width: 1080px) {
    .uc-body { grid-template-columns: 1fr 260px; }
    .uc-hello { font-size: 40px; }
  }
  @media (max-width: 640px) {
    .uc-body { grid-template-columns: 1fr; min-height: 0; }
    .uc-main { padding: 28px 22px 26px; }
    .uc-geo { display: none; }
    .uc-hello { font-size: 32px; letter-spacing: -.5px; }
    .uc-avatar { width: 50px; height: 50px; font-size: 20px; }
    .topbar-nav { display: none; }
    .safety .si { margin-left: 30px; }
    .safety .safety-tx { margin-right: 30px; }
  }
</style>
</head>
<body>
<!-- 顶部导航由 Shade.topbar({active:'index'}) 统一渲染（见 script） -->

<main class="page">
  <!-- 用户大卡（左侧问候 / 右侧几何构成舞台；卡顶三色带已取消，.hazard-top 空壳 div 不再渲染） -->
  <section class="card user-card">
    <div class="hazard-top"></div>
    <div class="uc-body">
      <div class="uc-main">
        <span class="kicker">WORKBENCH · 工作台</span>
        <div class="uc-hello-row">
          <div class="uc-avatar" id="ucAvatar">·</div>
          <h2 class="uc-hello"><span id="helloText">你好</span></h2>
        </div>
        <div class="uc-meta">
          <span class="uc-date" id="dateText"></span>
          <span class="uc-role" id="roleRow"></span>
        </div>
      </div>
      <div class="uc-geo">
        <div class="geo-stage" aria-hidden="true">
          <span class="g-ring"></span>
          <span class="geo g-circle-y"><i></i></span>
          <span class="geo g-semi-b"><i></i></span>
          <span class="geo g-tri-r"><i></i></span>
          <span class="geo g-dot-ink"><i></i></span>
          <span class="hero-slash"></span>
        </div>
        <div class="uc-side" id="sideInfo"></div>
      </div>
    </div>
  </section>

  <!-- 消息通知 -->
  <div class="section-title sec-msg"><h3>消息通知</h3><span class="more" id="noticeBadge">加载中…</span></div>
  <section class="card card-hover notice-card" id="noticeCard">
    <div id="noticeTop"><div class="loading"><span class="spin"></span>加载中</div></div>
  </section>

  <!-- 应用中心 -->
  <div class="section-title sec-app"><h3>应用中心</h3><span class="more" id="appCount">加载中…</span></div>
  <section class="apps" id="appGrid">
    <div class="card app-sk skeleton"></div>
    <div class="card app-sk skeleton"></div>
    <div class="card app-sk skeleton"></div>
  </section>

  <!-- 外部应用（纯链接跳转，全员可见，不接入权限机制；清单在 script 的 EXT_APPS 本地维护） -->
  <div class="section-title sec-ext"><h3>外部应用</h3><span class="more">点击跳转 · 全员可用</span></div>
  <section class="apps" id="extGrid"></section>

  <!-- 安全提示条 -->
  <section class="card safety">
    <span class="si" id="safetyIcon"></span>
    <span class="safety-tx"><b>安全生产，预防为主。</b>上工前请确认劳保用品佩戴齐全，作业按规程执行。</span>
  </section>
</main>

<!-- 通知列表弹层 -->
<div class="mask" id="noticeMask">
  <div class="modal">
    <div class="modal-hd">消息通知<button class="btn btn-sm" id="noticeReadAll" hidden>全部已读</button><button class="x" id="noticeClose" title="关闭"></button></div>
    <div class="nm-list" id="noticeList"></div>
  </div>
</div>

<!-- 删除通知二次确认弹层（全员可用：超管全局删除，其余角色仅从本人列表移除） -->
<div class="mask" id="noticeDelMask">
  <div class="modal">
    <div class="modal-hd"><span>删除通知</span><button class="x" id="noticeDelClose" title="关闭"></button></div>
    <div class="modal-bd">
      <div class="tip" id="noticeDelTip"></div>
    </div>
    <div class="modal-ft">
      <button class="btn" id="noticeDelCancel">取消</button>
      <button class="btn btn-danger" id="noticeDelOk">确认删除</button>
    </div>
  </div>
</div>

<script src="/assets/icons.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/md.js"></script>
<script>
  Shade.requireAuth();
  // 统一顶部导航（工作台为当前页；管理入口按缓存角色显隐，接口资料回来后再校正）
  Shade.topbar({ active: 'index' });

  // 应用落地页映射统一取自 Shade.APP_NAV（common.js 单一来源，与顶栏导航同源；网页版路由，与小程序分包无关）

  // 应用描述与特性标签（接口无此字段，按设计稿 方案A② 的文案本地维护；新应用未登记时不渲染该行）
  var APP_META = {
    'call-me': {
      desc: '对接 WeKnora 企业知识库，规程、图纸与检修经验随问随答，流式输出、来源可溯。',
      tags: [['AI 问答', 'tag-orange'], ['WeKnora', 'tag-navy']],
    },
    'work-log': {
      desc: '班组出工记录、水印照片存证与防伪码核验，月历视图一目了然，日志真实可查。',
      tags: [['记录存证', 'tag-orange'], ['防伪核验', 'tag-navy']],
    },
    'safe-day': {
      desc: '上传班组活动 PDF / Office 文件，Dify 工作流自动生成活动记录，一键下载归档。',
      tags: [['文件生成', 'tag-orange'], ['Dify', 'tag-navy']],
    },
    'kvm': {
      desc: '接入 GLKVM Cloud 设备中台，现场设备在线状态实时查看，一键开启远程终端与桌面控制。',
      tags: [['远程终端', 'tag-orange'], ['桌面控制', 'tag-navy']],
    },
    'quiz': {
      desc: 'Excel 导入题库即导即练，单选 / 多选 / 判断全覆盖，错题自动归集专项攻克，AI 逐题生成解析。',
      tags: [['刷题练习', 'tag-orange'], ['AI 解析', 'tag-navy']],
    },
  };

  // 静态图标注入
  document.getElementById('safetyIcon').innerHTML = Shade.icon('shield', 18);

  // 外部应用（纯链接跳转，全员可见，不接入权限机制；新增/下架在此维护）
  var EXT_APPS = [
    { name: '网盘', url: 'https://cloud.j1net.com', icon: 'cloud',
      desc: '班组文件云端存储与共享，资料随时随地安全存取。' },
    { name: '机械作业距离预警', url: 'https://ula-admin.j1net.com/login.php', icon: 'warn',
      desc: '机械作业安全距离实时监测与预警管理后台。' },
    { name: 'Dify', url: 'https://ai.j1net.com', icon: 'robot',
      desc: 'AI 应用搭建平台，工作流与智能体可视化管理。' },
  ];

  // 渲染外部应用宫格（样式与应用中心一致，新窗口打开）
  function renderExtApps() {
    document.getElementById('extGrid').innerHTML = EXT_APPS.map(function (it) {
      return '<a class="card card-hover app-card" href="' + it.url + '" target="_blank" rel="noopener">' +
        '<div class="app-ic">' + Shade.icon(it.icon, 26, '#1D4ED8') + '</div>' +
        '<h4>' + Shade.esc(it.name) + '</h4>' +
        '<p>' + Shade.esc(it.desc) + '</p>' +
        '<div class="app-meta"><span class="tag tag-navy">外部链接</span>' +
        '<span class="app-go">打开应用' + Shade.icon('arrow-right', 14) + '</span></div>' +
        '</a>';
    }).join('');
  }
  renderExtApps();

  // 按时段问候
  function greeting() {
    var h = new Date().getHours();
    if (h < 6) return '夜深了';
    if (h < 9) return '早上好';
    if (h < 12) return '上午好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }

  // 渲染用户资料（接口失败时回退本地缓存）
  function renderProfile(u) {
    var name = u.nickname || u.username || '班组成员';
    var ch = name.charAt(0);
    document.getElementById('miniAvatar').textContent = ch;
    document.getElementById('ucAvatar').textContent = ch;
    document.getElementById('topName').textContent = name;
    document.getElementById('helloText').textContent = greeting() + '，' + name;

    var now = new Date();
    var week = '日一二三四五六'.charAt(now.getDay());
    document.getElementById('dateText').textContent =
      now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · 星期' + week;

    // 角色徽章文案统一走 Shade.roleText（描边徽章样式不变）
    var roleHtml = '<span class="badge-outline">' + Shade.roleText(u.role) + '</span>';
    if (u.username) roleHtml += '<span class="uname">账号：' + Shade.esc(u.username) + '</span>';
    document.getElementById('roleRow').innerHTML = roleHtml;

    // 管理入口仅 admin 可见
    if (u.role === 'admin') document.getElementById('navAdmin').hidden = false;

    document.getElementById('sideInfo').innerHTML =
      '班组数字化工具平台<br> Shade 壹匣 · 网页版';
  }

  // 渲染应用宫格
  function renderApps(list) {
    var grid = document.getElementById('appGrid');
    var html = '';
    list.forEach(function (item) {
      var nav = Shade.APP_NAV[item.app_key];
      var href = nav ? nav.href : '';
      var meta = APP_META[item.app_key];
      var tags = meta
        ? meta.tags.map(function (t) { return '<span class="tag ' + t[1] + '">' + t[0] + '</span>'; }).join('')
        : '';
      html += '<a class="card card-hover app-card" href="' + (href || 'javascript:void 0') + '"' +
        (href ? '' : ' data-soon="1"') + '>' +
        '<div class="app-ic">' + Shade.icon(item.icon || 'app', 26, '#1D4ED8') + '</div>' +
        '<h4>' + Shade.esc(item.name) + '</h4>' +
        (meta ? '<p>' + Shade.esc(meta.desc) + '</p>' : '') +
        '<div class="app-meta">' + tags +
        '<span class="app-go">进入应用' + Shade.icon('arrow-right', 14) + '</span></div>' +
        '</a>';
    });
    // 虚线占位入口
    html += '<div class="card app-card app-soon">' +
      '<div class="app-ic">' + Shade.icon('ellipsis', 22) + '</div>' +
      '<h4>敬请期待</h4><p>新应用接入中</p>' +
      '</div>';
    grid.innerHTML = html;

    document.getElementById('appCount').textContent =
      '按权限自动下发 · 共 ' + list.length + ' 个可用应用';

    if (!list.length) {
      grid.innerHTML = '<div class="empty">' + Shade.icon('app', 44) +
        '<p>暂无可用应用，请联系管理员开通权限</p></div>' +
        '<div class="card app-card app-soon"><div class="app-ic">' + Shade.icon('ellipsis', 22) +
        '</div><h4>敬请期待</h4><p>新应用接入中</p></div>';
    }

    // 未开通网页版的应用：拦截并提示
    grid.querySelectorAll('[data-soon]').forEach(function (el) {
      el.addEventListener('click', function () {
        Shade.toast('该应用暂未开通网页版，请使用小程序访问', 'info');
      });
    });
  }

  // ===== 消息通知 =====
  var noticeTop = [];   // 工作台卡内最新 3 条
  var noticeItems = []; // 弹层全量列表（limit=100）
  var noticeUnread = 0; // 未读数（接口下发，随已读操作本地递减）

  // 未读徽章：板块标题右侧橙色胶囊（无未读时显示「查看全部」入口提示）；同步弹层「全部已读」按钮显隐
  function renderNoticeBadge() {
    document.getElementById('noticeBadge').innerHTML = noticeUnread > 0
      ? '<span class="nt-badge">' + noticeUnread + ' 条未读</span>'
      : '查看全部';
    document.getElementById('noticeReadAll').hidden = noticeUnread <= 0;
  }

  // 工作台通知卡：最新 3 条（未读标题前加橙色圆点、加粗）
  function noticeCardRowHtml(n) {
    return '<div class="nt-item' + (n.read ? '' : ' unread') + '">' +
      (n.read ? '' : '<span class="nt-dot"></span>') +
      '<span class="nt-title">' + Shade.esc(n.title) + '</span>' +
      '<span class="nt-time">' + Shade.fmtDate(n.createdAt, true) + '</span>' +
      '</div>';
  }
  function renderNoticeCard() {
    var box = document.getElementById('noticeTop');
    box.innerHTML = noticeTop.length
      ? noticeTop.map(noticeCardRowHtml).join('')
      : '<div class="empty">' + Shade.icon('notification', 44) + '<p>暂无通知</p></div>';
  }

  // 拉取通知卡数据（失败静默：仅卡内提示，不阻断工作台）
  async function loadNotices() {
    try {
      var r = await Shade.api('/api/v1/notice/list?limit=3');
      noticeTop = (r.data && r.data.items) || [];
      noticeUnread = (r.data && r.data.unread) || 0;
      renderNoticeBadge();
      renderNoticeCard();
    } catch (e) {
      document.getElementById('noticeBadge').textContent = '查看全部';
      document.getElementById('noticeTop').innerHTML = '<div class="empty">' +
        Shade.icon('warn', 44) + '<p>' + Shade.esc(e.message || '通知加载失败') + '</p></div>';
    }
  }

  // 弹层列表行（未读圆点 + 加粗高亮；内容默认两行折叠，点击展开全文；Markdown 渲染，失败回退转义纯文本）
  function noticeContentHtml(n) {
    return renderMd(n.content) || Shade.esc(n.content).replace(/\n/g, '<br>');
  }
  function isAdmin() {
    var u = Shade.user();
    return !!u && u.role === 'admin';
  }
  function noticeModalRowHtml(n) {
    return '<div class="nm-item' + (n.read ? '' : ' unread') + '" data-id="' + n.id + '">' +
      '<div class="nm-head">' +
        (n.read ? '' : '<span class="nt-dot"></span>') +
        '<span class="nm-title">' + Shade.esc(n.title) + '</span>' +
        '<span class="nt-time">' + Shade.fmtDate(n.createdAt, true) + '</span>' +
        '<span class="nm-del" data-id="' + n.id + '" title="删除该通知">删除</span>' +
      '</div>' +
      '<div class="nm-content">' + noticeContentHtml(n) + '</div>' +
    '</div>';
  }

  // 打开通知列表弹层：拉全量（limit=100）
  async function openNoticeModal() {
    document.getElementById('noticeMask').classList.add('show');
    var list = document.getElementById('noticeList');
    list.innerHTML = '<div class="loading"><span class="spin"></span>加载中</div>';
    try {
      var r = await Shade.api('/api/v1/notice/list?limit=100');
      noticeItems = (r.data && r.data.items) || [];
      noticeUnread = (r.data && r.data.unread) || 0;
      renderNoticeBadge();
      list.innerHTML = noticeItems.length
        ? noticeItems.map(noticeModalRowHtml).join('')
        : '<div class="empty">' + Shade.icon('notification', 44) + '<p>暂无通知</p></div>';
    } catch (e) {
      list.innerHTML = '<div class="empty">' + Shade.icon('warn', 44) +
        '<p>' + Shade.esc(e.message || '通知加载失败') + '</p></div>';
    }
  }

  // 本地置已读：未读数递减、刷新徽章 / 工作台卡 / 弹层行（调用前需确认该条原为未读）
  function markNoticeReadLocal(id) {
    var n = noticeItems.find(function (x) { return x.id === id; });
    if (n) n.read = 1;
    var t = noticeTop.find(function (x) { return x.id === id; });
    if (t && !t.read) { t.read = 1; renderNoticeCard(); }
    noticeUnread = Math.max(0, noticeUnread - 1);
    renderNoticeBadge();
    var row = document.querySelector('.nm-item[data-id="' + id + '"]');
    if (row) {
      row.classList.remove('unread');
      var dot = row.querySelector('.nt-dot');
      if (dot) dot.remove();
    }
  }

  // 弹层条目点击：展开 / 收起全文；未读条目上报已读后本地置已读、更新徽章；点「删除」走确认弹层
  document.getElementById('noticeList').addEventListener('click', async function (e) {
    var del = e.target.closest('.nm-del');
    if (del) {
      askDeleteNotice(Number(del.dataset.id));
      return;
    }
    var row = e.target.closest('.nm-item');
    if (!row) return;
    row.classList.toggle('open');
    var id = Number(row.dataset.id);
    var n = noticeItems.find(function (x) { return x.id === id; });
    if (!n || n.read) return;
    try {
      await Shade.api('/api/v1/notice/' + id + '/read', { method: 'POST' });
      markNoticeReadLocal(id);
    } catch (err) { /* 已读上报失败静默，保留未读态 */ }
  });

  // ---------- 删除通知（全员可用：超管全局删除，其余角色仅从本人列表移除；二次确认，删除后同步列表 / 工作台卡 / 未读数） ----------
  var noticeDelId = 0;
  function askDeleteNotice(id) {
    var n = noticeItems.find(function (x) { return x.id === id; });
    if (!n) return;
    noticeDelId = id;
    document.getElementById('noticeDelTip').textContent = isAdmin()
      ? '确定删除通知「' + n.title + '」吗？删除后所有成员均不可见，且不可恢复。'
      : '确定删除通知「' + n.title + '」吗？删除后仅从您的通知列表移除，不影响其他成员。';
    document.getElementById('noticeDelMask').classList.add('show');
  }
  document.getElementById('noticeDelOk').addEventListener('click', async function () {
    if (!noticeDelId) return;
    var btn = this;
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      await Shade.api('/api/v1/notice/' + noticeDelId, { method: 'DELETE' });
      var wasUnread = noticeItems.some(function (x) { return x.id === noticeDelId && !x.read; });
      noticeItems = noticeItems.filter(function (x) { return x.id !== noticeDelId; });
      noticeTop = noticeTop.filter(function (x) { return x.id !== noticeDelId; });
      if (wasUnread) noticeUnread = Math.max(0, noticeUnread - 1);
      renderNoticeBadge();
      renderNoticeCard();
      document.getElementById('noticeList').innerHTML = noticeItems.length
        ? noticeItems.map(noticeModalRowHtml).join('')
        : '<div class="empty">' + Shade.icon('notification', 44) + '<p>暂无通知</p></div>';
      document.getElementById('noticeDelMask').classList.remove('show');
      Shade.toast('已删除', 'success');
    } catch (e) {
      Shade.toast(e.message, 'error');
    } finally {
      btn.disabled = false;
      noticeDelId = 0;
    }
  });
  document.getElementById('noticeDelCancel').addEventListener('click', function () {
    document.getElementById('noticeDelMask').classList.remove('show');
  });
  document.getElementById('noticeDelClose').innerHTML = Shade.icon('close', 16);
  document.getElementById('noticeDelClose').addEventListener('click', function () {
    document.getElementById('noticeDelMask').classList.remove('show');
  });

  // 全部已读（有未读时显示）
  document.getElementById('noticeReadAll').addEventListener('click', async function () {
    var btn = this;
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      await Shade.api('/api/v1/notice/read-all', { method: 'POST' });
      noticeUnread = 0;
      noticeItems.forEach(function (n) { n.read = 1; });
      noticeTop.forEach(function (n) { n.read = 1; });
      renderNoticeBadge();
      renderNoticeCard();
      document.querySelectorAll('#noticeList .nm-item.unread').forEach(function (row) {
        row.classList.remove('unread');
        var dot = row.querySelector('.nt-dot');
        if (dot) dot.remove();
      });
    } catch (e) {
      Shade.toast(e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  // 整卡与「查看全部」入口均可打开弹层
  document.getElementById('noticeCard').addEventListener('click', openNoticeModal);
  document.getElementById('noticeBadge').addEventListener('click', openNoticeModal);
  document.getElementById('noticeClose').innerHTML = Shade.icon('close', 16);
  document.getElementById('noticeClose').addEventListener('click', function () {
    document.getElementById('noticeMask').classList.remove('show');
  });
  document.getElementById('noticeMask').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });

  // 加载数据
  (async function () {
    /* 用户资料刷新（接口失败回退本地缓存）：顶栏 #miniAvatar/#topName 由 refreshUser 统一更新，用户卡等页面元素进回调 */
    await Shade.refreshUser(function (u) { if (u) renderProfile(u); });
    try {
      var r2 = await Shade.api('/api/v1/app/list');
      // 网页端宫格按 terminal 过滤：只展示 双端/PC端 应用（移动端应用仅小程序可见）
      renderApps((r2.data.list || []).filter(function (item) { return item.terminal !== 'mobile'; }));
    } catch (e) {
      document.getElementById('appCount').textContent = '加载失败';
      document.getElementById('appGrid').innerHTML =
        '<div class="empty">' + Shade.icon('warn', 44) +
        '<p>' + Shade.esc(e.message || '应用列表加载失败') + '</p></div>';
    }
    loadNotices(); // 通知卡独立拉取，失败静默不阻断
    Shade.reveal();
  })();
</script>
</body>
</html>
