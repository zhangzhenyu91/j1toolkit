<!DOCTYPE html>
<!-- Shade 壹匣 · 网页版门户工作台（方案A「安全橙传承」②：顶部导航 + 警示斜纹用户卡 + 应用中心） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · Shade 壹匣</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  /* ===== 用户大卡（警示斜纹 + 问候） ===== */
  .user-card { overflow: hidden; }
  .uc-body { display: flex; align-items: center; gap: 18px; padding: 24px 28px; }
  .uc-avatar {
    width: 62px; height: 62px; flex: none; border-radius: 17px;
    background: var(--navy); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 700;
  }
  .uc-hello { font-size: 20px; font-weight: 800; letter-spacing: .5px; }
  .uc-hello small { margin-left: 10px; font-size: 12px; font-weight: 500; color: var(--ph); letter-spacing: 1px; }
  .uc-role { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--sub); }
  .uc-role .uname { color: var(--ph); }
  .uc-side { margin-left: auto; text-align: right; font-size: 12px; color: var(--ph); line-height: 1.9; letter-spacing: .5px; }

  /* ===== 应用中心宫格（宽屏自然多列） ===== */
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .app-card { display: block; padding: 22px; color: inherit; }
  .app-card:link, .app-card:visited { color: inherit; }
  .app-ic {
    width: 50px; height: 50px; border-radius: 14px;
    background: var(--orange-soft); color: var(--orange);
    display: flex; align-items: center; justify-content: center;
    transition: transform .3s;
  }
  .app-card:hover .app-ic { transform: scale(1.08) rotate(-4deg); }
  .app-ic svg { width: 26px; height: 26px; }
  .app-card h4 { margin-top: 16px; font-size: 15.5px; font-weight: 800; letter-spacing: .5px; }
  .app-card > p { margin-top: 8px; font-size: 12.5px; color: var(--sub); line-height: 1.8; min-height: 45px; }
  .app-meta { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hair); }
  .app-go { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: var(--orange); }
  .app-go svg { width: 14px; height: 14px; transition: transform .3s; }
  .app-card:hover .app-go svg { transform: translateX(4px); }
  /* 「敬请期待」虚线占位 */
  .app-soon {
    background: transparent; border: 1.5px dashed var(--dash); box-shadow: none;
    min-height: 150px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 9px;
  }
  .app-soon .app-ic { width: 44px; height: 44px; background: transparent; border: 1.5px dashed var(--dash); color: #C6BA9C; }
  .app-soon .app-ic svg { width: 22px; height: 22px; }
  .app-soon h4 { margin-top: 2px; font-size: 13.5px; color: var(--ph); }
  .app-soon p { font-size: 11.5px; color: #C6BA9C; }
  /* 宫格内空态占满整行 */
  .apps .empty { grid-column: 1 / -1; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-card); }
  /* 骨架卡片 */
  .app-sk { height: 150px; }

  /* ===== 安全提示条 ===== */
  .safety {
    margin-top: 26px; display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; font-size: 12.5px; color: var(--sub); letter-spacing: .5px;
  }
  .safety .si {
    width: 34px; height: 34px; flex: none; border-radius: 9px;
    background: var(--orange-soft); color: var(--orange);
    display: flex; align-items: center; justify-content: center;
  }
  .safety .si svg { width: 18px; height: 18px; }
  .safety b { color: var(--navy); letter-spacing: 1px; }

  /* ===== 消息通知卡 ===== */
  .notice-card { overflow: hidden; }
  .nt-badge {
    display: inline-block; border-radius: 999px; padding: 2px 10px;
    background: var(--orange); color: #fff;
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
  }
  #noticeBadge { cursor: pointer; }
  .nt-item { display: flex; align-items: center; gap: 9px; padding: 13px 20px; border-bottom: 1px solid var(--hair); }
  .nt-item:last-child { border-bottom: none; }
  .nt-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--orange); }
  .nt-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .nt-item.unread .nt-title { font-weight: 700; }
  .nt-time { flex: none; font-size: 12px; color: var(--ph); }

  /* ===== 通知列表弹层（仿管理页 .mask/.modal 弹层） ===== */
  .mask {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(27, 39, 64, .42);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .mask.show { display: flex; }
  .modal {
    width: 100%; max-width: 560px; background: #fff; border-radius: 14px; overflow: hidden;
    box-shadow: 0 24px 60px rgba(34, 49, 78, .25);
    animation: fadeUp .35s cubic-bezier(.16, 1, .3, 1) both;
  }
  .modal-hd {
    display: flex; align-items: center; gap: 10px; padding: 16px 22px;
    border-bottom: 1px solid var(--hair);
    font-size: 15.5px; font-weight: 800; letter-spacing: 1px;
  }
  .modal-hd .x {
    border: none; background: none; cursor: pointer;
    color: var(--ph); padding: 4px; border-radius: 6px; transition: color .2s, background .2s;
  }
  .modal-hd .x:hover { color: var(--navy); background: var(--paper); }
  .modal-hd .x svg { width: 16px; height: 16px; }
  /* 「全部已读」与关闭按钮的右对齐：按钮隐藏时关闭按钮补上 auto 外边距 */
  #noticeReadAll { margin-left: auto; }
  #noticeReadAll[hidden] { display: none; }
  #noticeReadAll[hidden] + .x { margin-left: auto; }
  .nm-list { max-height: 62vh; overflow-y: auto; }
  .nm-item { padding: 14px 22px; border-bottom: 1px solid var(--hair); cursor: pointer; transition: background .2s; }
  .nm-item:last-child { border-bottom: none; }
  .nm-item:hover { background: #FBF9F3; }
  .nm-head { display: flex; align-items: center; gap: 9px; }
  .nm-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .nm-item.unread .nm-title { font-weight: 700; }
  /* 内容默认两行折叠，点击条目展开全文（Markdown 渲染，含图片） */
  .nm-content {
    margin-top: 7px; font-size: 12.5px; color: var(--sub); line-height: 1.8;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .nm-item.open .nm-content { display: block; }
  /* Markdown 排版（对齐 callme.html 色板） */
  .nm-content h1, .nm-content h2, .nm-content h3, .nm-content h4 { font-size: 14px; font-weight: 700; color: var(--navy); margin: 8px 0 4px; }
  .nm-content p { margin: 4px 0; }
  .nm-content ul, .nm-content ol { margin: 4px 0 4px 1.2em; padding: 0; }
  .nm-content li { margin: 2px 0; }
  .nm-content code { font-family: Menlo, Consolas, monospace; font-size: .92em; color: #D85A12; }
  .nm-content pre { background: #F7F3EA; border: 1px solid var(--hair); border-radius: 8px; padding: 10px; margin: 8px 0; overflow-x: auto; }
  .nm-content blockquote { border-left: 3px solid var(--orange); margin: 6px 0; padding: 2px 10px; color: var(--sub); background: #FDF6EF; }
  .nm-content a { color: var(--orange); }
  .nm-content hr { border: none; border-top: 1px solid var(--hair); margin: 10px 0; }
  .nm-content table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; }
  .nm-content th, .nm-content td { border: 1px solid var(--hair); padding: 5px 9px; }
  .nm-content th { background: #FDF6EF; color: var(--navy); }
  .nm-content .md-img { display: block; max-width: 100%; border-radius: 8px; margin: 6px 0; }
  .nm-content .md-code { margin: 8px 0; }
  .nm-content .md-code-h { display: none; } /* 通知弹层不提供复制按钮 */
  /* 超管删除入口（标题行右侧红色小字钮） */
  .nm-del { flex: none; font-size: 12px; color: var(--red); cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .nm-del:hover { background: #FBEBEB; }
  /* 删除确认弹层（复用 .mask/.modal；对齐 admin.html 删除班组确认） */
  .modal-bd { padding: 18px 22px 6px; }
  .modal-ft { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px 18px; }
  .modal-bd .tip { font-size: 13px; color: var(--sub); line-height: 1.7; }

  @media (max-width: 640px) {
    .uc-body { flex-wrap: wrap; }
    .uc-side { display: none; }
    .topbar-nav { display: none; }
  }
</style>
</head>
<body>
<!-- 顶部导航由 Shade.topbar({active:'index'}) 统一渲染（见 script） -->

<main class="page">
  <!-- 用户大卡 -->
  <section class="card user-card rv">
    <div class="hazard-top"></div>
    <div class="uc-body">
      <div class="uc-avatar" id="ucAvatar">·</div>
      <div>
        <div class="uc-hello"><span id="helloText">你好</span><small id="dateText"></small></div>
        <div class="uc-role" id="roleRow"></div>
      </div>
      <div class="uc-side" id="sideInfo"></div>
    </div>
  </section>

  <!-- 消息通知 -->
  <div class="section-title rv"><h3>消息通知</h3><span class="more" id="noticeBadge">加载中…</span></div>
  <section class="card card-hover notice-card rv" id="noticeCard">
    <div id="noticeTop"><div class="loading"><span class="spin"></span>加载中</div></div>
  </section>

  <!-- 应用中心 -->
  <div class="section-title rv"><h3>应用中心</h3><span class="more" id="appCount">加载中…</span></div>
  <section class="apps rv" id="appGrid">
    <div class="card app-sk skeleton"></div>
    <div class="card app-sk skeleton"></div>
    <div class="card app-sk skeleton"></div>
  </section>

  <!-- 外部应用（纯链接跳转，全员可见，不接入权限机制；清单在 script 的 EXT_APPS 本地维护） -->
  <div class="section-title rv"><h3>外部应用</h3><span class="more">点击跳转 · 全员可用</span></div>
  <section class="apps rv" id="extGrid"></section>

  <!-- 安全提示条 -->
  <section class="card safety rv">
    <span class="si" id="safetyIcon"></span>
    <span><b>安全生产，预防为主。</b>上工前请确认劳保用品佩戴齐全，作业按规程执行。</span>
  </section>
</main>

<!-- 通知列表弹层 -->
<div class="mask" id="noticeMask">
  <div class="modal">
    <div class="modal-hd">消息通知<button class="btn btn-sm" id="noticeReadAll" hidden>全部已读</button><button class="x" id="noticeClose" title="关闭"></button></div>
    <div class="nm-list" id="noticeList"></div>
  </div>
</div>

<!-- 删除通知二次确认弹层（仅超管可见入口） -->
<div class="mask" id="noticeDelMask">
  <div class="modal">
    <div class="modal-hd"><span>删除通知</span><button class="x" id="noticeDelClose" title="关闭"></button></div>
    <div class="modal-bd">
      <div class="tip" id="noticeDelTip"></div>
    </div>
    <div class="modal-ft">
      <button class="btn" id="noticeDelCancel">取消</button>
      <button class="btn btn-danger" id="noticeDelOk">确认删除</button>
    </div>
  </div>
</div>

<script src="/assets/icons.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/md.js"></script>
<script>
  Shade.requireAuth();
  // 统一顶部导航（工作台为当前页；管理入口按缓存角色显隐，接口资料回来后再校正）
  Shade.topbar({ active: 'index' });

  // 应用落地页映射（网页版路由，与小程序分包无关；key 与 sys_app 种子一致）
  var APP_ROUTES = {
    'call-me': '/callme.html',
    'quiz': '/quiz.html',
    'work-log': '/worklog.html',
    'safe-day': '/safeday.html',
    'kvm': '/kvm.html',
  };

  // 应用描述与特性标签（接口无此字段，按设计稿 方案A② 的文案本地维护；新应用未登记时不渲染该行）
  var APP_META = {
    'call-me': {
      desc: '对接 WeKnora 企业知识库，规程、图纸与检修经验随问随答，流式输出、来源可溯。',
      tags: [['AI 问答', 'tag-orange'], ['WeKnora', 'tag-navy']],
    },
    'work-log': {
      desc: '班组出工记录、水印照片存证与防伪码核验，月历视图一目了然，日志真实可查。',
      tags: [['记录存证', 'tag-orange'], ['防伪核验', 'tag-navy']],
    },
    'safe-day': {
      desc: '上传班组活动 PDF / Office 文件，Dify 工作流自动生成活动记录，一键下载归档。',
      tags: [['文件生成', 'tag-orange'], ['Dify', 'tag-navy']],
    },
    'kvm': {
      desc: '接入 GLKVM Cloud 设备中台，现场设备在线状态实时查看，一键开启远程终端与桌面控制。',
      tags: [['远程终端', 'tag-orange'], ['桌面控制', 'tag-navy']],
    },
    'quiz': {
      desc: 'Excel 导入题库即导即练，单选 / 多选 / 判断全覆盖，错题自动归集专项攻克，AI 逐题生成解析。',
      tags: [['刷题练习', 'tag-orange'], ['AI 解析', 'tag-navy']],
    },
  };

  // 静态图标注入
  document.getElementById('safetyIcon').innerHTML = Shade.icon('shield', 18);

  // 外部应用（纯链接跳转，全员可见，不接入权限机制；新增/下架在此维护）
  var EXT_APPS = [
    { name: '网盘', url: 'https://cloud.j1net.com', icon: 'cloud',
      desc: '班组文件云端存储与共享，资料随时随地安全存取。' },
    { name: '机械作业距离预警', url: 'https://ula-admin.j1net.com/login.php', icon: 'warn',
      desc: '机械作业安全距离实时监测与预警管理后台。' },
    { name: 'Dify', url: 'https://ai.j1net.com', icon: 'robot',
      desc: 'AI 应用搭建平台，工作流与智能体可视化管理。' },
  ];

  // 渲染外部应用宫格（样式与应用中心一致，新窗口打开）
  function renderExtApps() {
    document.getElementById('extGrid').innerHTML = EXT_APPS.map(function (it) {
      return '<a class="card card-hover app-card" href="' + it.url + '" target="_blank" rel="noopener">' +
        '<div class="app-ic">' + Shade.icon(it.icon, 26, '#F26D21') + '</div>' +
        '<h4>' + Shade.esc(it.name) + '</h4>' +
        '<p>' + Shade.esc(it.desc) + '</p>' +
        '<div class="app-meta"><span class="tag tag-navy">外部链接</span>' +
        '<span class="app-go">打开应用' + Shade.icon('arrow-right', 14) + '</span></div>' +
        '</a>';
    }).join('');
  }
  renderExtApps();

  // 按时段问候
  function greeting() {
    var h = new Date().getHours();
    if (h < 6) return '夜深了';
    if (h < 9) return '早上好';
    if (h < 12) return '上午好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }

  // 渲染用户资料（接口失败时回退本地缓存）
  function renderProfile(u) {
    var name = u.nickname || u.username || '班组成员';
    var ch = name.charAt(0);
    document.getElementById('miniAvatar').textContent = ch;
    document.getElementById('ucAvatar').textContent = ch;
    document.getElementById('topName').textContent = name;
    document.getElementById('helloText').textContent = greeting() + '，' + name;

    var now = new Date();
    var week = '日一二三四五六'.charAt(now.getDay());
    document.getElementById('dateText').textContent =
      now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · 星期' + week;

    // 角色徽章：admin→管理员，其他→普通用户（描边徽章样式不变）
    var roleHtml = '<span class="badge-outline">' + (u.role === 'admin' ? '管理员' : '普通用户') + '</span>';
    if (u.username) roleHtml += '<span class="uname">账号：' + Shade.esc(u.username) + '</span>';
    document.getElementById('roleRow').innerHTML = roleHtml;

    // 管理入口仅 admin 可见
    if (u.role === 'admin') document.getElementById('navAdmin').hidden = false;

    document.getElementById('sideInfo').innerHTML =
      '班组数字化工具平台<br> Shade 壹匣 · 网页版';
  }

  // 渲染应用宫格
  function renderApps(list) {
    var grid = document.getElementById('appGrid');
    var html = '';
    list.forEach(function (item) {
      var href = APP_ROUTES[item.app_key] || '';
      var meta = APP_META[item.app_key];
      var tags = meta
        ? meta.tags.map(function (t) { return '<span class="tag ' + t[1] + '">' + t[0] + '</span>'; }).join('')
        : '';
      html += '<a class="card card-hover app-card" href="' + (href || 'javascript:void 0') + '"' +
        (href ? '' : ' data-soon="1"') + '>' +
        '<div class="app-ic">' + Shade.icon(item.icon || 'app', 26, '#F26D21') + '</div>' +
        '<h4>' + Shade.esc(item.name) + '</h4>' +
        (meta ? '<p>' + Shade.esc(meta.desc) + '</p>' : '') +
        '<div class="app-meta">' + tags +
        '<span class="app-go">进入应用' + Shade.icon('arrow-right', 14) + '</span></div>' +
        '</a>';
    });
    // 虚线占位入口
    html += '<div class="card app-card app-soon">' +
      '<div class="app-ic">' + Shade.icon('ellipsis', 22) + '</div>' +
      '<h4>敬请期待</h4><p>新应用接入中</p>' +
      '</div>';
    grid.innerHTML = html;

    document.getElementById('appCount').textContent =
      '按权限自动下发 · 共 ' + list.length + ' 个可用应用';

    if (!list.length) {
      grid.innerHTML = '<div class="empty">' + Shade.icon('app', 44) +
        '<p>暂无可用应用，请联系管理员开通权限</p></div>' +
        '<div class="card app-card app-soon"><div class="app-ic">' + Shade.icon('ellipsis', 22) +
        '</div><h4>敬请期待</h4><p>新应用接入中</p></div>';
    }

    // 未开通网页版的应用：拦截并提示
    grid.querySelectorAll('[data-soon]').forEach(function (el) {
      el.addEventListener('click', function () {
        Shade.toast('该应用暂未开通网页版，请使用小程序访问', 'info');
      });
    });
  }

  // ===== 消息通知 =====
  var noticeTop = [];   // 工作台卡内最新 3 条
  var noticeItems = []; // 弹层全量列表（limit=100）
  var noticeUnread = 0; // 未读数（接口下发，随已读操作本地递减）

  // 未读徽章：板块标题右侧橙色胶囊（无未读时显示「查看全部」入口提示）；同步弹层「全部已读」按钮显隐
  function renderNoticeBadge() {
    document.getElementById('noticeBadge').innerHTML = noticeUnread > 0
      ? '<span class="nt-badge">' + noticeUnread + ' 条未读</span>'
      : '查看全部';
    document.getElementById('noticeReadAll').hidden = noticeUnread <= 0;
  }

  // 工作台通知卡：最新 3 条（未读标题前加橙色圆点、加粗）
  function noticeCardRowHtml(n) {
    return '<div class="nt-item' + (n.read ? '' : ' unread') + '">' +
      (n.read ? '' : '<span class="nt-dot"></span>') +
      '<span class="nt-title">' + Shade.esc(n.title) + '</span>' +
      '<span class="nt-time">' + Shade.fmtDate(n.createdAt, true) + '</span>' +
      '</div>';
  }
  function renderNoticeCard() {
    var box = document.getElementById('noticeTop');
    box.innerHTML = noticeTop.length
      ? noticeTop.map(noticeCardRowHtml).join('')
      : '<div class="empty">' + Shade.icon('notification', 44) + '<p>暂无通知</p></div>';
  }

  // 拉取通知卡数据（失败静默：仅卡内提示，不阻断工作台）
  async function loadNotices() {
    try {
      var r = await Shade.api('/api/v1/notice/list?limit=3');
      noticeTop = (r.data && r.data.items) || [];
      noticeUnread = (r.data && r.data.unread) || 0;
      renderNoticeBadge();
      renderNoticeCard();
    } catch (e) {
      document.getElementById('noticeBadge').textContent = '查看全部';
      document.getElementById('noticeTop').innerHTML = '<div class="empty">' +
        Shade.icon('error-circle', 44) + '<p>' + Shade.esc(e.message || '通知加载失败') + '</p></div>';
    }
  }

  // 弹层列表行（未读圆点 + 加粗高亮；内容默认两行折叠，点击展开全文；Markdown 渲染，失败回退转义纯文本）
  function noticeContentHtml(n) {
    return renderMd(n.content) || Shade.esc(n.content).replace(/\n/g, '<br>');
  }
  function isAdmin() {
    var u = Shade.user();
    return !!u && u.role === 'admin';
  }
  function noticeModalRowHtml(n) {
    return '<div class="nm-item' + (n.read ? '' : ' unread') + '" data-id="' + n.id + '">' +
      '<div class="nm-head">' +
        (n.read ? '' : '<span class="nt-dot"></span>') +
        '<span class="nm-title">' + Shade.esc(n.title) + '</span>' +
        '<span class="nt-time">' + Shade.fmtDate(n.createdAt, true) + '</span>' +
        (isAdmin() ? '<span class="nm-del" data-id="' + n.id + '" title="删除该通知">删除</span>' : '') +
      '</div>' +
      '<div class="nm-content">' + noticeContentHtml(n) + '</div>' +
    '</div>';
  }

  // 打开通知列表弹层：拉全量（limit=100）
  async function openNoticeModal() {
    document.getElementById('noticeMask').classList.add('show');
    var list = document.getElementById('noticeList');
    list.innerHTML = '<div class="loading"><span class="spin"></span>加载中</div>';
    try {
      var r = await Shade.api('/api/v1/notice/list?limit=100');
      noticeItems = (r.data && r.data.items) || [];
      noticeUnread = (r.data && r.data.unread) || 0;
      renderNoticeBadge();
      list.innerHTML = noticeItems.length
        ? noticeItems.map(noticeModalRowHtml).join('')
        : '<div class="empty">' + Shade.icon('notification', 44) + '<p>暂无通知</p></div>';
    } catch (e) {
      list.innerHTML = '<div class="empty">' + Shade.icon('error-circle', 44) +
        '<p>' + Shade.esc(e.message || '通知加载失败') + '</p></div>';
    }
  }

  // 本地置已读：未读数递减、刷新徽章 / 工作台卡 / 弹层行（调用前需确认该条原为未读）
  function markNoticeReadLocal(id) {
    var n = noticeItems.find(function (x) { return x.id === id; });
    if (n) n.read = 1;
    var t = noticeTop.find(function (x) { return x.id === id; });
    if (t && !t.read) { t.read = 1; renderNoticeCard(); }
    noticeUnread = Math.max(0, noticeUnread - 1);
    renderNoticeBadge();
    var row = document.querySelector('.nm-item[data-id="' + id + '"]');
    if (row) {
      row.classList.remove('unread');
      var dot = row.querySelector('.nt-dot');
      if (dot) dot.remove();
    }
  }

  // 弹层条目点击：展开 / 收起全文；未读条目上报已读后本地置已读、更新徽章；超管点「删除」走确认弹层
  document.getElementById('noticeList').addEventListener('click', async function (e) {
    var del = e.target.closest('.nm-del');
    if (del) {
      askDeleteNotice(Number(del.dataset.id));
      return;
    }
    var row = e.target.closest('.nm-item');
    if (!row) return;
    row.classList.toggle('open');
    var id = Number(row.dataset.id);
    var n = noticeItems.find(function (x) { return x.id === id; });
    if (!n || n.read) return;
    try {
      await Shade.api('/api/v1/notice/' + id + '/read', { method: 'POST' });
      markNoticeReadLocal(id);
    } catch (err) { /* 已读上报失败静默，保留未读态 */ }
  });

  // ---------- 删除通知（仅超管；二次确认，删除后同步列表 / 工作台卡 / 未读数） ----------
  var noticeDelId = 0;
  function askDeleteNotice(id) {
    var n = noticeItems.find(function (x) { return x.id === id; });
    if (!n) return;
    noticeDelId = id;
    document.getElementById('noticeDelTip').textContent =
      '确定删除通知「' + n.title + '」吗？删除后所有成员均不可见，且不可恢复。';
    document.getElementById('noticeDelMask').classList.add('show');
  }
  document.getElementById('noticeDelOk').addEventListener('click', async function () {
    if (!noticeDelId) return;
    var btn = this;
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      await Shade.api('/api/v1/notice/' + noticeDelId, { method: 'DELETE' });
      var wasUnread = noticeItems.some(function (x) { return x.id === noticeDelId && !x.read; });
      noticeItems = noticeItems.filter(function (x) { return x.id !== noticeDelId; });
      noticeTop = noticeTop.filter(function (x) { return x.id !== noticeDelId; });
      if (wasUnread) noticeUnread = Math.max(0, noticeUnread - 1);
      renderNoticeBadge();
      renderNoticeCard();
      document.getElementById('noticeList').innerHTML = noticeItems.length
        ? noticeItems.map(noticeModalRowHtml).join('')
        : '<div class="empty">' + Shade.icon('notification', 44) + '<p>暂无通知</p></div>';
      document.getElementById('noticeDelMask').classList.remove('show');
      Shade.toast('已删除', 'success');
    } catch (e) {
      Shade.toast(e.message, 'error');
    } finally {
      btn.disabled = false;
      noticeDelId = 0;
    }
  });
  document.getElementById('noticeDelCancel').addEventListener('click', function () {
    document.getElementById('noticeDelMask').classList.remove('show');
  });
  document.getElementById('noticeDelClose').innerHTML = Shade.icon('close', 16);
  document.getElementById('noticeDelClose').addEventListener('click', function () {
    document.getElementById('noticeDelMask').classList.remove('show');
  });

  // 全部已读（有未读时显示）
  document.getElementById('noticeReadAll').addEventListener('click', async function () {
    var btn = this;
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      await Shade.api('/api/v1/notice/read-all', { method: 'POST' });
      noticeUnread = 0;
      noticeItems.forEach(function (n) { n.read = 1; });
      noticeTop.forEach(function (n) { n.read = 1; });
      renderNoticeBadge();
      renderNoticeCard();
      document.querySelectorAll('#noticeList .nm-item.unread').forEach(function (row) {
        row.classList.remove('unread');
        var dot = row.querySelector('.nt-dot');
        if (dot) dot.remove();
      });
    } catch (e) {
      Shade.toast(e.message, 'error');
    } finally {
      btn.disabled = false;
    }
  });

  // 整卡与「查看全部」入口均可打开弹层
  document.getElementById('noticeCard').addEventListener('click', openNoticeModal);
  document.getElementById('noticeBadge').addEventListener('click', openNoticeModal);
  document.getElementById('noticeClose').innerHTML = Shade.icon('close', 16);
  document.getElementById('noticeClose').addEventListener('click', function () {
    document.getElementById('noticeMask').classList.remove('show');
  });
  document.getElementById('noticeMask').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });

  // 加载数据
  (async function () {
    /* 用户资料刷新（接口失败回退本地缓存）：顶栏 #miniAvatar/#topName 由 refreshUser 统一更新，用户卡等页面元素进回调 */
    await Shade.refreshUser(function (u) { if (u) renderProfile(u); });
    try {
      var r2 = await Shade.api('/api/v1/app/list');
      // 网页端宫格按 terminal 过滤：只展示 双端/PC端 应用（移动端应用仅小程序可见）
      renderApps((r2.data.list || []).filter(function (item) { return item.terminal !== 'mobile'; }));
    } catch (e) {
      document.getElementById('appCount').textContent = '加载失败';
      document.getElementById('appGrid').innerHTML =
        '<div class="empty">' + Shade.icon('error-circle', 44) +
        '<p>' + Shade.esc(e.message || '应用列表加载失败') + '</p></div>';
    }
    loadNotices(); // 通知卡独立拉取，失败静默不阻断
    Shade.reveal();
  })();
</script>
</body>
</html>
