  /* ================= 分片上传（init → 并发 3 片 PUT → complete；429/409 退避重传） ================= */
  var uploads = [];   // 任务列表：{id,file,name,size,space,path,state,received,doneChunks,totalChunks,chunkSize,uploadId,err}
  var upSeq = 0;
  var upRunning = false;

  function pickFiles() {
    var fi = $('#fileInput');
    fi.value = '';
    fi.click();
  }
  function uploadFiles(fileList) {
    if (S.search) { Shade.toast('搜索状态下请先返回目录浏览再上传', 'info'); return; }
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    var added = 0;
    files.forEach(function (f) {
      if (S.maxMb && f.size > S.maxMb * 1024 * 1024) {
        Shade.toast('「' + f.name + '」超过单文件上限 ' + S.maxMb + ' MB，已跳过', 'error');
        return;
      }
      uploads.push({
        id: ++upSeq, file: f, name: f.name, size: f.size,
        space: S.space, path: S.path,
        state: 'pending', received: 0, doneChunks: 0, totalChunks: 0,
        chunkSize: 0, uploadId: null, err: '',
      });
      added++;
    });
    if (!added) return;
    renderGrid(); renderUpanel();
    pumpUploads();
  }
  // 逐文件顺序执行（同一时刻仅一个文件在传，片级并发 3）
  async function pumpUploads() {
    if (upRunning) return;
    upRunning = true;
    for (;;) {
      var t = null;
      for (var i = 0; i < uploads.length; i++) {
        if (uploads[i].state === 'pending') { t = uploads[i]; break; }
      }
      if (!t) break;
      await uploadOne(t);
    }
    upRunning = false;
    renderUpanel(); renderGrid();
  }
  async function uploadOne(t) {
    t.state = 'uploading'; t.err = '';
    renderUpanel(); renderGrid();
    try {
      var init = await ndPost('/upload/init', { space: t.space, path: t.path, name: t.name, size: t.size });
      if (t.state === 'aborted') return;
      if (init.instant || init.state === 'completed') { finishUpload(t); return; } // 0 字节直接建成
      t.uploadId = init.upload_id;
      t.chunkSize = init.chunk_size;
      t.totalChunks = init.total_chunks;
      t.received = init.received_bytes || 0;
      // 断点续传：快照已收到的分片直接跳过
      var received = expandRanges(init.received || []);
      var indices = [];
      for (var i = 0; i < t.totalChunks; i++) if (!received.has(i)) indices.push(i);
      t.doneChunks = t.totalChunks - indices.length;
      var cursor = 0;
      var workers = [];
      for (var w = 0; w < 3; w++) {
        workers.push((async function () {
          // 任一片失败或任务取消后（state 变更）其余 worker 及时收兵
          while (cursor < indices.length && t.state === 'uploading') {
            var idx = indices[cursor++];
            await putChunk(t, idx);
            t.doneChunks++;
            paintTask(t);
          }
        })());
      }
      await Promise.all(workers);
      if (t.state === 'aborted') return;
      // 合并落盘（可能长时间阻塞；被掐断时用 status 轮询兜底终态）
      try {
        var fin = await ndPost('/upload/complete', { upload_id: t.uploadId });
        if (fin && fin.received_bytes != null) t.received = fin.received_bytes;
      } catch (e) {
        if (!(await pollStatus(t))) throw e;
      }
      finishUpload(t);
    } catch (e) {
      if (t.state === 'aborted') return;
      t.state = 'error';
      t.err = e.message || '上传失败';
      Shade.toast('「' + t.name + '」上传失败：' + t.err, 'error');
      renderUpanel(); renderGrid();
    }
  }
  // PUT 单分片（裸字节；429/409 带 retry 标记退避 1~2s 重传，每片最多 5 次）
  async function putChunk(t, idx) {
    var start = idx * t.chunkSize;
    var blob = t.file.slice(start, Math.min(start + t.chunkSize, t.size));
    for (var attempt = 1; ; attempt++) {
      if (t.state !== 'uploading') return; // 已取消/已失败，放弃本片
      try {
        var res = await Shade.apiRaw(API + '/upload/chunk', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/octet-stream',
            'X-Upload-Id': t.uploadId,
            'X-Chunk-Index': String(idx),
          },
          body: blob,
        });
        var j = await res.json().catch(function () { return null; });
        if (j && j.code === 0) {
          var snap = j.data || {};
          t.received = snap.received_bytes != null ? snap.received_bytes : Math.min(t.received + blob.size, t.size);
          return;
        }
        var retry = (j && j.data && j.data.retry) || res.status === 429 || res.status === 409;
        var msg = (j && j.message) || ('HTTP ' + res.status);
        if (retry && attempt < 5) { await sleep(1000 + Math.random() * 1000); continue; }
        throw new Error(msg);
      } catch (e) {
        if (attempt < 5 && /网络异常/.test(e && e.message || '')) { await sleep(1000 + Math.random() * 1000); continue; }
        throw e;
      }
    }
  }
  async function pollStatus(t) {
    for (var i = 0; i < 3; i++) {
      await sleep(2000);
      try {
        var s = await nd('/upload/status?upload_id=' + encodeURIComponent(t.uploadId));
        if (s && s.received_bytes != null) { t.received = s.received_bytes; paintTask(t); }
        if (s && s.state === 'completed') return true;
      } catch (e) { /* 继续轮询 */ }
    }
    return false;
  }
  function expandRanges(ranges) {
    var set = new Set();
    (ranges || []).forEach(function (r) {
      if (!Array.isArray(r)) return;
      for (var i = r[0]; i <= r[1]; i++) set.add(i);
    });
    return set;
  }
  function finishUpload(t) {
    t.state = 'done';
    t.received = t.size;
    renderUpanel();
    Shade.toast('「' + t.name + '」上传完成', 'success');
    var inView = S.view === 'files' && !S.search && S.space === t.space && S.path === t.path;
    var cell = inView ? gridEl.querySelector('.g-up[data-task="' + t.id + '"]') : null;
    if (cell) {
      // 浅蓝「上传中」变绿「已完成」停留 1.2s → 整格淡出 → 静默刷新列表出新条目
      paintCellDone(cell, t);
      setTimeout(function () {
        cell.classList.add('gone');
        setTimeout(function () { loadList(true); }, 260);
      }, 1200);
    } else if (inView) {
      loadList(true);
    } else {
      renderUpanel(); renderGrid();
    }
    setTimeout(function () { removeTask(t.id); }, 1600);
  }
  function paintCellDone(cell, t) {
    var tag = cell.querySelector('.g-tag');
    if (tag) { tag.className = 'g-tag tag st-ok'; tag.innerHTML = '<i></i>已完成'; }
    var bar = cell.querySelector('.g-prog i');
    if (bar) bar.style.width = '100%';
    var sub = cell.querySelector('.g-sub');
    if (sub) sub.textContent = '已完成 · ' + fmtSize(t.size);
  }
  async function cancelUpload(id) {
    var t = uploads.find(function (x) { return x.id === id; });
    if (!t) return;
    if (t.state === 'uploading' || t.state === 'pending') {
      t.state = 'aborted';
      if (t.uploadId) { try { await ndPost('/upload/abort', { upload_id: t.uploadId }); } catch (e) { /* 忽略 */ } }
      Shade.toast('已取消上传：' + t.name, 'info');
    }
    removeTask(id);
  }
  // 失败重试：重新 init 取会话快照，已收到的分片自动跳过（断点续传）
  function retryUpload(id) {
    var t = uploads.find(function (x) { return x.id === id; });
    if (!t || t.state !== 'error') return;
    t.state = 'pending'; t.err = '';
    renderUpanel(); renderGrid();
    pumpUploads();
  }
  function removeTask(id) {
    var i = uploads.findIndex(function (x) { return x.id === id; });
    if (i >= 0) uploads.splice(i, 1);
    renderUpanel(); renderGrid();
  }
  function pctOf(t) { return t.size ? Math.min(100, Math.round(t.received / t.size * 100)) : 100; }
  function upSubText(t) {
    if (t.state === 'error') return t.err || '上传失败';
    if (t.state === 'pending') return '等待上传 · ' + fmtSize(t.size);
    if (t.state === 'done') return '已完成 · ' + fmtSize(t.size);
    var s = fmtSize(t.received) + ' / ' + fmtSize(t.size) + ' · ' + pctOf(t) + '%';
    if (t.totalChunks) s += ' · 分片 ' + Math.min(t.doneChunks, t.totalChunks) + '/' + t.totalChunks;
    return s;
  }
  // 当前目录的内联上传格（浏览态且目标目录一致才显示）
  function currentDirTasks() {
    if (S.view !== 'files' || S.search) return [];
    return uploads.filter(function (t) {
      return t.space === S.space && t.path === S.path
        && (t.state === 'pending' || t.state === 'uploading' || t.state === 'error');
    });
  }
  // delayMs >= 0 时随网格一起编排式入场
  function uploadCellHtml(t, delayMs) {
    var tag = t.state === 'error'
      ? '<span class="g-tag tag st-bad"><i></i>失败</span>'
      : (t.state === 'done'
        ? '<span class="g-tag tag st-ok"><i></i>已完成</span>'
        : '<span class="g-tag tag st-info"><i></i>' + (t.state === 'pending' ? '排队中' : '上传中') + '</span>');
    return '<div class="g-cell g-up' + (t.state === 'error' ? ' err' : '') + (delayMs >= 0 ? ' cell-in' : '')
      + '"' + (delayMs >= 0 ? ' style="animation-delay:' + delayMs + 'ms"' : '') + ' data-task="' + t.id + '">'
      + '<span class="g-x" title="取消上传">' + Shade.icon('close', 11) + '</span>'
      + tag
      + '<div class="g-icon">' + fileIconHtml(t.name, false, 48) + '</div>'
      + '<span class="g-name">' + esc(t.name) + '</span>'
      + '<div class="g-prog"><i style="width:' + (t.state === 'error' ? 100 : pctOf(t)) + '%"></i></div>'
      + '<span class="g-sub">' + esc(upSubText(t)) + '</span>'
      + '</div>';
  }
  // 进度tick只做定点刷新，避免整格重建导致缩略图闪烁
  function paintTask(t) {
    var cell = gridEl.querySelector('.g-up[data-task="' + t.id + '"]');
    if (cell) {
      var bar = cell.querySelector('.g-prog i');
      if (bar) bar.style.width = pctOf(t) + '%';
      var sub = cell.querySelector('.g-sub');
      if (sub) sub.textContent = upSubText(t);
    }
    var row = document.querySelector('#upanel .up-row[data-task="' + t.id + '"]');
    if (row) {
      var rb = row.querySelector('.uprog i');
      if (rb) rb.style.width = pctOf(t) + '%';
      var rs = row.querySelector('.up-sub');
      if (rs) rs.textContent = upSubText(t);
    }
  }
  function renderUpanel() {
    var panel = $('#upanel');
    if (!uploads.length) { panel.hidden = true; panel.innerHTML = ''; return; }
    var active = 0, pend = 0, fail = 0;
    uploads.forEach(function (t) {
      if (t.state === 'uploading') active++;
      else if (t.state === 'pending') pend++;
      else if (t.state === 'error') fail++;
    });
    var sum = [];
    if (active) sum.push(active + ' 个上传中');
    if (pend) sum.push(pend + ' 个排队');
    if (fail) sum.push(fail + ' 个失败');
    if (!sum.length) sum.push('已完成');
    panel.innerHTML = '<div class="up-head"><b>上传任务</b><span>' + sum.join(' · ') + '</span></div>'
      + '<div class="up-list">' + uploads.map(upRowHtml).join('') + '</div>';
    panel.hidden = false;
  }
  function upRowHtml(t) {
    var showBar = t.state !== 'pending';
    var ops = (t.state === 'error' ? '<span class="up-lk" data-up="retry">重试</span>' : '')
      + '<span class="up-ic" data-up="x" title="' + (t.state === 'uploading' || t.state === 'pending' ? '取消' : '移除') + '">'
      + Shade.icon('close', 13) + '</span>';
    return '<div class="up-row' + (t.state === 'error' ? ' err' : '') + '" data-task="' + t.id + '">'
      + fileIconHtml(t.name, false, 28)
      + '<div class="up-main"><span class="up-name" title="' + esc(t.name) + '">' + esc(t.name) + '</span>'
      + (showBar ? '<div class="uprog"><i style="width:' + pctOf(t) + '%"></i></div>' : '')
      + '<span class="up-sub">' + esc(upSubText(t)) + '</span></div>'
      + '<div class="up-ops">' + ops + '</div></div>';
  }

  /* ================= 事件绑定 ================= */
  function bindEvents() {

    $('#btnMkdir').innerHTML = Shade.icon('folder-add', 15) + '新建文件夹';
    $('#btnUpload').innerHTML = Shade.icon('upload', 15) + '上传文件';

        if (S.view === 'shares') loadShares();

      });
    });

    // 空间分段

      var b = e.target.closest('button[data-space]');
      if (b) switchSpace(b.dataset.space);

    // 新建文件夹 / 上传文件 / 文件选择
    $('#btnMkdir').addEventListener('click', openMkdir);
    $('#btnUpload').addEventListener('click', pickFiles);
    $('#fileInput').addEventListener('change', function () {
      uploadFiles(this.files);
      this.value = '';
    });

    // 搜索：回车检索（输入法组词中不触发）；× 清空回到浏览
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) doSearch(this.value);
    });
    searchInput.addEventListener('input', function () {
      $('#searchClear').hidden = !S.search && !this.value;
    });
    $('#searchClear').addEventListener('click', function () {
      if (S.search) exitSearch();
      else { searchInput.value = ''; this.hidden = true; }
    });

    // 面包屑导航
    $('#crumb').addEventListener('click', function (e) {
      var a = e.target.closest('a');
      if (!a) return;
      if (a.dataset.nav === 'exit') { exitSearch(); return; }
      if (a.dataset.path != null) {
        if (S.search) { S.search = null; searchInput.value = ''; }
        navTo(a.dataset.path);
      }
    });

    // 网格：框选（空白 pointerdown）/ 点选 / 双击打开 / 右键菜单 / 上传格取消
    gridwrap.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      if (e.target.closest('.g-cell')) return; // 格子上的按下走 click/dblclick
      startRubber(e);
    });
    gridwrap.addEventListener('click', function (e) {
      var x = e.target.closest('.g-x');
      if (x) {
        var upCell = x.closest('.g-up');
        if (upCell) cancelUpload(Number(upCell.dataset.task));
        return;
      }
      if (e.target.closest('[data-retry]')) { reloadCurrent(); return; }
      var cell = e.target.closest('.g-cell[data-rel]');
      if (!cell) return;
      var idx = Number(cell.dataset.idx), rel = cell.dataset.rel;
      if (e.shiftKey && anchorIdx >= 0 && anchorIdx < S.items.length) {
        var a = Math.min(anchorIdx, idx), b = Math.max(anchorIdx, idx);
        var ns = (e.ctrlKey || e.metaKey) ? new Set(sel) : new Set();
        for (var i = a; i <= b; i++) if (S.items[i]) ns.add(S.items[i]._rel);
        setSel(ns);
      } else if (e.ctrlKey || e.metaKey) {
        var ns2 = new Set(sel);
        if (ns2.has(rel)) ns2.delete(rel); else ns2.add(rel);
        setSel(ns2);
        anchorIdx = idx;
      } else {
        setSel(new Set([rel]));
        anchorIdx = idx;
      }
    });
    gridwrap.addEventListener('dblclick', function (e) {
      var cell = e.target.closest('.g-cell[data-rel]');
      if (!cell) return;
      openItem(S.items[Number(cell.dataset.idx)]);
    });
    gridwrap.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      var cell = e.target.closest('.g-cell[data-rel]');
      if (cell) {
        var rel = cell.dataset.rel;
        if (!sel.has(rel)) { setSel(new Set([rel])); anchorIdx = Number(cell.dataset.idx); }
        openItemMenu(e.clientX, e.clientY);
      } else if (!e.target.closest('.g-up')) {
        openBlankMenu(e.clientX, e.clientY);
      }
    });

    // 选中操作区（顶部工具条）：下载/分享/移动/复制/删除/取消选择
    $('#selbar').addEventListener('click', function (e) {
      var b = e.target.closest('[data-sel]');
      if (!b) return;
      var items = selItems();
      var act = b.dataset.sel;
      if (act === 'clear') { setSel(new Set()); return; }
      if (!items.length) return;
      if (act === 'dl') downloadItems(items);
      else if (act === 'share') openShareModal(items);
      else if (act === 'move') moveCopyItems('move', items);
      else if (act === 'copy') moveCopyItems('copy', items);
      else if (act === 'del') removeItems(items);
    });

    // 分享管理：scope 切换（类切换 + pill 滑动）/ 重试 / 行操作
    $('#shareNotice').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-scope]');
      if (!b || b.dataset.scope === shareScope) return;
      shareScope = b.dataset.scope;
      var seg = $('#shareScopeSeg');
      $$('button', seg).forEach(function (x) { x.classList.toggle('on', x === b); });
      moveSegPill(seg, false);
      loadShares();
    });
    $('#shareTblCard').addEventListener('click', function (e) {
      if (e.target.closest('[data-sh-retry]')) { loadShares(); return; }
      var opEl = e.target.closest('[data-op]');
      if (!opEl || opEl.classList.contains('dis')) return;
      var tr = opEl.closest('tr[data-sid]');
      if (tr) shareOp(tr.dataset.sid, opEl.dataset.op);
    });

    // 上传面板：重试 / 取消（移除）
    $('#upanel').addEventListener('click', function (e) {
      var act = e.target.closest('[data-up]');
      if (!act) return;
      var row = act.closest('.up-row[data-task]');
      if (!row) return;
      var id = Number(row.dataset.task);
      if (act.dataset.up === 'retry') retryUpload(id);
      else cancelUpload(id);
    });

    // 拖入上传：整个网格区为投放面（目录项跳过）
    var dragDepth = 0;
    var viewFiles = $('#viewFiles');
    viewFiles.addEventListener('dragenter', function (e) {
      e.preventDefault();
      dragDepth++;
      if (!S.search) gridwrap.classList.add('dragover');
    });
    viewFiles.addEventListener('dragover', function (e) { e.preventDefault(); });
    viewFiles.addEventListener('dragleave', function (e) {
      e.preventDefault();
      if (--dragDepth <= 0) { dragDepth = 0; gridwrap.classList.remove('dragover'); }
    });
    viewFiles.addEventListener('drop', function (e) {
      e.preventDefault();
      dragDepth = 0;
      gridwrap.classList.remove('dragover');
      uploadFiles(dropFiles(e.dataTransfer));
    });

    // 窗口缩放：分段 pill 直接落位（不滑动）
    window.addEventListener('resize', function () {
      moveSegPill($('#spaceSeg'), true);
      var ss = $('#shareScopeSeg');
      if (ss) moveSegPill(ss, true);
    });

    // Esc：先关右键菜单，再清空选择；弹层打开时让位给 Shade.modal
    Shade.escGuard = function () {
      if (closeCtxMenu()) return true;
      if (document.querySelector('.mask.open')) return false;
      if (sel.size) { setSel(new Set()); return true; }
      return false;
    };
  }
    // 提取拖放文件（跳过目录项；items 不可用的浏览器回退 files）
  function dropFiles(dt) {
    var out = [];
    var items = (dt && dt.items) || [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.kind !== 'file') continue;
      var entry = it.webkitGetAsEntry && it.webkitGetAsEntry();
      if (entry && !entry.isFile) { Shade.toast('暂不支持拖入文件夹上传', 'info'); continue; }
      var f = it.getAsFile();
      if (f) out.push(f);
    }
    if (!items.length && dt && dt.files && dt.files.length) {
      out = Array.prototype.slice.call(dt.files);
    }
    return out;
  }
</script>
</body>
</html>
