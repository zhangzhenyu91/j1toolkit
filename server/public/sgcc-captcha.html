<!DOCTYPE html>
<!--
  商旅平台滑块验证页（顶象无感验证接力，2026-08-28）
  用途：商旅登录按风控动态出图形码或顶象滑块，图形码对云服务器 IP 间歇可用（风控窗口 99000），
        不可用时降级到本页——在我们域名下用商旅的顶象 appId 渲染同款滑块，
        用户拖完后把 captchaToken（滑块凭据）+ constId（顶象设备指纹）回传给调用方，
        由后端随登录接口（sendSmsCode/v3、smstoken/v4、token/v4）上送完成绑定。
  调用方式：
    - 小程序 web-view：/sgcc-captcha.html?from=mp（wx.miniProgram.postMessage 回传后 navigateBack）
    - 网页端 iframe：直接嵌入，监听 window message（type: 'sgcc-captcha'）回传（worklog.html 代绑定弹层使用）
  appId 取自 2026-08-28 商旅 App 抓包（cap.dingxiang-inc.com/api/a?ak=...），为 App 端硬编码值、随 App 版本稳定；若 App 大版本升级更换则改此一处。
  隐私口径：页面文案统称「商旅平台」，不出现平台所属方名称。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安全验证 · 商旅平台</title>
<link rel="stylesheet" href="/assets/theme.css">
<style>
  body { background: var(--paper); margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 28px 16px; }
  .tip { font-size: 14px; color: var(--sub); line-height: 1.7; margin: 0 2px 14px; }
  .tip b { color: var(--navy); font-weight: 600; }
  .cap-card { background: #fff; border-radius: 10px; padding: 18px 14px; box-shadow: 0 1px 4px rgba(34,49,78,.06); }
  #cap { display: flex; justify-content: center; min-height: 42px; overflow: hidden; }
  /* 顶象 v5 组件容器链被 SDK 样式锁在 192px（canvas 实为 330px，右半被裁），强制放宽到 330 */
  #cap .dx_captcha_basic_wrapper,
  #cap .dx_captcha_basic_main-box,
  #cap .dx_captcha_basic_box,
  #cap .dx_captcha_basic_bg { width: 330px !important; }
  #cap .dx_captcha_basic_wrapper { transform-origin: top left; }
  .status { margin-top: 14px; font-size: 13px; text-align: center; line-height: 1.6; }
  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }
  .status.muting { color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <p class="tip">绑定商旅账号需要先完成一次<b>安全验证</b>（与商旅 App 登录同款），请拖动下方滑块。</p>
  <div class="cap-card"><div id="cap"></div></div>
  <div class="status muting" id="status">滑块加载中…</div>
</div>
<script src="https://res.wx.qq.com/open/js/jweixin-1.3.2.js"></script>
<script>
(function () {
  var APPID = '9df66798b2919e1a4d4e6ec2e498dcfe'; // 商旅平台顶象 appId（2026-08-28 抓包实测）
  var statusEl = document.getElementById('status');
  var constId = '';
  function say(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + cls; }

  // ---------- http → https 强制改写（顶象 SDK 部分资源仍走 http，web-view 混合内容会被拦） ----------
  function toHttps(u) {
    return (typeof u === 'string' && u.indexOf('http://') === 0 && u.indexOf('dingxiang-inc.com') > 0)
      ? u.replace(/^http:\/\//, 'https://') : u;
  }
  function fixUrlStr(s) { return typeof s === 'string' ? s.replace(/http:\/\/([\w.-]*dingxiang-inc\.com)/g, 'https://$1') : s; }
  // ① 原型级 src 改写：SDK 给 script/img.src 赋 http 值时在赋值瞬间转 https（先于资源加载，MutationObserver 追不上）
  [HTMLScriptElement.prototype, HTMLImageElement.prototype].forEach(function (proto) {
    var d = Object.getOwnPropertyDescriptor(proto, 'src');
    if (d && d.set) {
      Object.defineProperty(proto, 'src', {
        get: d.get, configurable: true,
        set: function (v) { d.set.call(this, toHttps(v)); }
      });
    }
  });
  // ② setAttribute('src'/'style') 与 style 属性赋值、innerHTML/insertAdjacentHTML 拼 HTML 同样改写
  var xsetAttr = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (k, v) {
    if (k === 'src' || k === 'style') v = fixUrlStr(v);
    return xsetAttr.call(this, k, v);
  };
  var xInnerHTML = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  if (xInnerHTML && xInnerHTML.set) {
    Object.defineProperty(Element.prototype, 'innerHTML', {
      get: xInnerHTML.get, configurable: true,
      set: function (v) { xInnerHTML.set.call(this, fixUrlStr(v)); }
    });
  }
  var xInsertHTML = Element.prototype.insertAdjacentHTML;
  if (xInsertHTML) {
    Element.prototype.insertAdjacentHTML = function (pos, html) {
      return xInsertHTML.call(this, pos, fixUrlStr(html));
    };
  }
  ['background', 'backgroundImage', 'maskImage', 'webkitMaskImage', 'cssText'].forEach(function (prop) {
    var d = Object.getOwnPropertyDescriptor(CSSStyleDeclaration.prototype, prop);
    if (d && d.set) {
      Object.defineProperty(CSSStyleDeclaration.prototype, prop, {
        get: d.get, configurable: true,
        set: function (v) { d.set.call(this, fixUrlStr(v)); }
      });
    }
  });
  var xsetProp = CSSStyleDeclaration.prototype.setProperty;
  CSSStyleDeclaration.prototype.setProperty = function (k, v, p) {
    return xsetProp.call(this, k, fixUrlStr(v), p);
  };
  // ③ MutationObserver 兜底：组件子树内任何属性出现 dingxiang http 值即刻改写（覆盖未钩路径）
  new MutationObserver(function (muts) {
    muts.forEach(function (m) {
      var els = m.type === 'attributes' ? [m.target] : m.addedNodes;
      for (var i = 0; i < els.length; i += 1) {
        var el = els[i];
        if (!el || el.nodeType !== 1 || !el.attributes) continue;
        for (var j = 0; j < el.attributes.length; j += 1) {
          var a = el.attributes[j];
          if (a.value && a.value.indexOf('http://') === 0 && a.value.indexOf('dingxiang-inc.com') > 0) {
            el.setAttribute(a.name, fixUrlStr(a.value));
          }
        }
        if (el.style && el.style.cssText && el.style.cssText.indexOf('http://') >= 0) {
          el.style.cssText = fixUrlStr(el.style.cssText);
        }
      }
    });
  }).observe(document.getElementById('cap'), { childList: true, subtree: true, attributes: true });
  // ④ XHR：open 时改写 URL；send 时顺带捕 constId（校验请求体 c 参数即设备指纹，与 token 同源）
  var xopen = XMLHttpRequest.prototype.open, xsend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (m, u) {
    u = toHttps(u);
    this.__dxUrl = u;
    return xopen.apply(this, [m, u].concat([].slice.call(arguments, 2)));
  };
  XMLHttpRequest.prototype.send = function (body) {
    try {
      if (this.__dxUrl && this.__dxUrl.indexOf('dingxiang-inc.com') >= 0 && body) {
        var s = String(body);
        var mm = s.match(/(?:^|&)c=([^&]*)/) || s.match(/"c"\s*:\s*"([^"]*)"/);
        if (mm) constId = decodeURIComponent(mm[1]);
      }
    } catch (e) { /* 忽略 */ }
    return xsend.apply(this, arguments);
  };
  // ⑤ fetch：同样改写 URL
  if (window.fetch) {
    var xfetch = window.fetch;
    window.fetch = function (u, opt) {
      return xfetch.call(this, typeof u === 'string' ? toHttps(u) : u, opt);
    };
  }

  function onSuccess(captchaToken) {
    say('验证成功，正在返回…', 'ok');
    var payload = { captchaToken: captchaToken, constId: constId };
    if (window.wx && wx.miniProgram) {
      // 小程序 web-view：postMessage 在 navigateBack 时同步给小程序 bindmessage
      wx.miniProgram.postMessage({ data: payload });
      setTimeout(function () { wx.miniProgram.navigateBack(); }, 400);
    } else if (window.parent !== window) {
      // 网页端 iframe（worklog.html 代绑定弹层）：父页监听 message
      window.parent.postMessage({ type: 'sgcc-captcha', captchaToken: payload.captchaToken, constId: payload.constId }, location.origin);
    } else {
      say('验证成功', 'ok');
    }
  }

  // 组件宽 330，窄屏（卡片内宽不足）时整体等比缩放，并补偿占位高度
  function fitWidget() {
    var tries = [400, 1200, 2500];
    tries.forEach(function (ms) {
      setTimeout(function () {
        var cap = document.getElementById('cap');
        var w = cap && cap.querySelector('.dx_captcha_basic_wrapper');
        if (!w) return;
        var avail = cap.clientWidth;
        if (avail >= 334 || avail <= 0) return;
        var scale = avail / 330;
        w.style.transform = 'scale(' + scale + ')';
        cap.style.height = Math.round(w.offsetHeight * scale) + 'px';
      }, ms);
    });
  }

  function start() {
    if (!window._dx || !window._dx.Captcha) { say('验证组件加载失败，请检查网络后返回重试', 'err'); return; }
    try {
      window._dx.Captcha(document.getElementById('cap'), {
        appId: APPID,
        apiServer: 'https://cap.dingxiang-inc.com', // v5 显式指定 https，避免 web-view 混合内容拦截
        style: 'embed',
        success: onSuccess,
        fail: function () { say('验证未通过，请再试一次', 'err'); }
      });
      say('请拖动滑块完成验证', 'muting');
      fitWidget();
    } catch (e) {
      say('验证组件初始化失败：' + (e && e.message), 'err');
    }
  }

  var s = document.createElement('script');
  s.src = 'https://cdn.dingxiang-inc.com/ctu-group/captcha-ui/v5/index.js'; // v5 版 SDK（老版资源走 http 会被 web-view 拦）
  s.id = 'dx-captcha-script';
  s.crossOrigin = 'anonymous';
  s.onload = start;
  s.onerror = function () { say('验证组件加载失败，请检查网络后返回重试', 'err'); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
