# 文件分享推送 API（壹匣集成）：/api/fileshare/ → 本机 fileshare 服务（0.0.0.0:8901）
# 随 extras 机制被 /etc/kvmd/nginx-kvmd.conf 的 443 server 块自动 include
location /api/fileshare/ {
    rewrite ^/api/fileshare/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8901;
    include /etc/kvmd/nginx/loc-proxy.conf;
    # 上传不限体积（覆盖 http 块默认的 client_max_body_size 8k）
    client_max_body_size 0;
    proxy_read_timeout 300s;
    auth_request off;
}
