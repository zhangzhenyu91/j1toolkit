<!DOCTYPE html>
<!-- Shade 壹匣 · 题库刷题网页版（刷题练习 + 题库管理双页签，页签参考出工日志 wl-tabs：文字 + 橙色滑动指示条；
     「题库管理」页签仅 admin / team_admin 可见，普通用户仅刷题练习）
     刷题练习：左卡我的题库（个人口径，GET /banks，进度条 + 题库池弹层入口）+ 右卡题库主页（GET /banks/:id/home
     统计行 + 顺序/随机/错题/收藏四入口，对齐小程序 bank 页）；点入口进刷题页（接管右卡）：顶行 返回 + 答题/背题切换
     + 进度 x/total，选项仅字母圈 + 文字无卡片底、左边界对齐题干内容首字；解析态 = 正确答案/您的选择 + 本人/全员统计
     + 错题本动态 + 试题详解卡；底栏 收藏/对错计数/答题卡/设置 + 主按钮，支持 ← → 方向键切题；
     断点续刷（localStorage quiz_seq_{bankId}）与做题记录恢复（取题 withRecord=1）同小程序，答题卡居中弹层可清空做题记录；
     题库管理：原双卡视图不变（左题库列表 GET /banks/manage + 右题目表格/导入/AI 解析轮询）；
     班组隔离：超管页签旁班组切换下拉（localStorage.quiz_team_id，管理请求统一带 team_id，见 qz()）；
     API 直连主平台 /api/v1/quiz/*（Bearer token 经 Shade.api） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>题库刷题 · Shade 壹匣</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  /* ===== 整页不滚动：仅卡片内部滚动（body 锁定 100vh，骨架同 worklog） ===== */
  html, body { height: 100%; }
  body { overflow: hidden; }
  body > .topbar { flex: none; }
  /* theme.css 的 .page 带 margin:0 auto，flex 容器内显式 width:100% 恢复满宽（同 worklog 口径） */
  .page { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; padding: 22px 40px 30px; }
  .qz-wrap { flex: 1; min-height: 0; width: 100%; display: flex; gap: 20px; margin-top: 16px; }
  .qz-wrap[hidden] { display: none !important; } /* author display 规则优先于 UA [hidden]，显式兜底 */

  /* 答题对错用色对齐设计稿：克制绿 #2BA471（theme 无此 token，页内定义；解析状态「已解析」标签用） */
  .tag-green { background: #E8F5EF; color: #2BA471; }

  /* 细滚动条：半透明藏青，全页滚动区统一口径（同 worklog） */
  .side-scroll, .qtable { scrollbar-width: thin; scrollbar-color: rgba(34, 49, 78, .2) transparent; }
  .side-scroll::-webkit-scrollbar, .qtable::-webkit-scrollbar, .m-scroll::-webkit-scrollbar { width: 5px; }
  .side-scroll::-webkit-scrollbar-thumb, .qtable::-webkit-scrollbar-thumb,
  .m-scroll::-webkit-scrollbar-thumb { background: rgba(34, 49, 78, .16); border-radius: 3px; }
  .side-scroll::-webkit-scrollbar-thumb:hover, .qtable::-webkit-scrollbar-thumb:hover,
  .m-scroll::-webkit-scrollbar-thumb:hover { background: rgba(34, 49, 78, .34); }
  .side-scroll::-webkit-scrollbar-track, .qtable::-webkit-scrollbar-track,
  .m-scroll::-webkit-scrollbar-track { background: transparent; }

  /* ===== 左卡：题库列表 ===== */
  .qz-side { width: 300px; flex: none; min-height: 0; display: flex; flex-direction: column; padding: 18px 16px; }
  .qz-side [hidden] { display: none !important; } /* author display 规则优先于 UA [hidden]，显式兜底 */
  .side-head { flex: none; display: flex; align-items: center; gap: 8px; }
  .side-head b { flex: 1; font-size: 15.5px; font-weight: 800; letter-spacing: 1px; }
  .mini-btn {
    width: 30px; height: 30px; flex: none; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    color: var(--sub); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color .25s, color .25s;
  }
  .mini-btn:hover { border-color: var(--orange); color: var(--orange); }
  .mini-btn svg { width: 15px; height: 15px; }
  .side-team { flex: none; margin-top: 12px; }
  .side-scroll { flex: 1; min-height: 0; overflow-y: auto; margin-top: 12px; padding-right: 2px; }
  .side-item {
    position: relative; display: flex; align-items: center; gap: 10px; padding: 11px 12px;
    border: 1px solid transparent; border-radius: 9px; cursor: pointer; transition: background .2s;
  }
  .side-item + .side-item { margin-top: 8px; }
  .side-item:hover { background: var(--paper); }
  .side-item.on { background: var(--orange-soft); }
  .side-item.on .tx b { color: var(--orange); }
  .side-item > svg { flex: none; }
  .side-item .tx { flex: 1; min-width: 0; }
  .side-item .tx b { display: block; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-item .tx span { display: block; margin-top: 2px; font-size: 10.5px; color: var(--ph); }
  /* 题库项的编辑/删除小图标 */
  .side-item .ops { display: flex; gap: 2px; flex: none; }
  .side-item .ops button {
    border: none; background: none; padding: 5px; color: var(--ph); cursor: pointer;
    border-radius: 6px; display: flex; transition: color .2s, background .2s;
  }
  .side-item .ops button:hover { color: var(--orange); background: #fff; }
  .side-item .ops svg { width: 14px; height: 14px; }
  .side-scroll .empty { padding: 36px 8px; }
  .sk-item { height: 54px; border-radius: 9px; }
  .sk-item + .sk-item { margin-top: 8px; }

  /* ===== 右卡：题库管理 ===== */
  .qz-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 20px 24px; }
  .qz-main [hidden] { display: none !important; }
  .pane { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: paneIn .34s cubic-bezier(.16, 1, .3, 1); }
  @keyframes paneIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .progress { height: 6px; border-radius: 3px; background: #EFE9DA; overflow: hidden; }
  .progress i { display: block; height: 100%; border-radius: 3px; background: var(--orange); transition: width .3s; }

  .mg-head { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .mg-head .tx { flex: 1; min-width: 220px; }
  .mg-head .tx b { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .mg-head .tx p { margin-top: 3px; font-size: 11.5px; color: var(--sub); }
  /* AI 解析进行中通知条（5s 轮询，归零停） */
  .ai-notice {
    flex: none; margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: var(--orange-soft);
    display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 600; color: #9A5B2E;
  }
  .ai-notice > svg { width: 15px; height: 15px; flex: none; }
  .ai-notice .txt { flex: 1; min-width: 0; }
  .ai-notice .progress { width: 180px; flex: none; }
  .ai-notice b { white-space: nowrap; }
  .mg-tools { flex: none; margin-top: 14px; display: flex; align-items: center; gap: 10px; }
  .mg-search { position: relative; width: 260px; }
  .mg-search > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--ph); pointer-events: none; }
  .mg-search .input { height: 36px; padding-left: 36px; font-size: 12.5px; }
  .mg-total { margin-left: auto; font-size: 11.5px; color: var(--ph); letter-spacing: 1px; }
  /* 题目表格：行内 flex，表头 sticky， tbody 区独立滚动 */
  .qtable { flex: 1; min-height: 0; overflow-y: auto; margin-top: 12px; border: 1px solid var(--hair); border-radius: 10px; }
  .qtable .tr { display: flex; align-items: center; gap: 12px; padding: 11px 14px; font-size: 12.5px; background: #fff; }
  .qtable .tr + .tr { border-top: 1px solid var(--hair); }
  .qtable .tr.hd { position: sticky; top: 0; z-index: 1; background: #FBF9F2; font-size: 11.5px; font-weight: 700; color: var(--sub); letter-spacing: 1px; }
  .qtable .c-t { width: 52px; flex: none; justify-content: center; }
  .qtable .c-q { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .qtable .c-a { width: 64px; flex: none; font-weight: 800; }
  .qtable .c-s { width: 92px; flex: none; }
  .qtable .c-o { width: 64px; flex: none; display: flex; gap: 10px; }
  .qtable .c-o button {
    border: none; background: none; padding: 3px; color: var(--ph); cursor: pointer;
    display: flex; border-radius: 6px; transition: color .2s, background .2s;
  }
  .qtable .c-o button:hover { color: var(--orange); background: var(--paper); }
  .qtable .c-o svg { width: 15px; height: 15px; }
  .tag-retry { cursor: pointer; }
  .qtable .empty { padding: 44px 20px; }
  /* 分页器 */
  .pager { flex: none; margin-top: 12px; display: flex; justify-content: flex-end; gap: 6px; }
  .pager button {
    min-width: 28px; height: 28px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); background: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 11.5px; color: var(--sub);
    cursor: pointer; font-family: inherit; transition: border-color .2s, color .2s;
  }
  .pager button:hover:not([disabled]) { border-color: var(--orange); color: var(--orange); }
  .pager button.on { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 700; }
  .pager button[disabled] { opacity: .45; cursor: not-allowed; }
  .pager .pg-dots { min-width: 20px; border: none; background: none; cursor: default; color: var(--ph); }

  /* ===== 通用弹层（题库 / 题目编辑；同 worklog 结构：外壳保圆角、滚动内凹 .m-scroll） ===== */
  .mask {
    position: fixed; inset: 0; z-index: 320; padding: 24px;
    background: rgba(27, 39, 64, .5); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .3s;
  }
  .mask.open { opacity: 1; }
  .modal {
    background: #fff; border-radius: 14px; width: 560px; max-width: 94vw; max-height: 86vh;
    overflow: hidden; padding: 6px; display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(27, 39, 64, .25);
    transform: translateY(16px) scale(.98); transition: transform .35s cubic-bezier(.16, 1, .3, 1);
  }
  .mask.open .modal { transform: none; }
  .m-scroll {
    flex: 1; min-height: 0; overflow-y: auto; border-radius: 9px; padding: 14px 18px 16px;
    scrollbar-gutter: stable both-edges; scrollbar-width: thin; scrollbar-color: rgba(34, 49, 78, .2) transparent;
  }
  .m-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .m-title { font-size: 15.5px; font-weight: 800; letter-spacing: 1px; }
  .m-x {
    margin-left: auto; width: 30px; height: 30px; border: none; border-radius: 8px; background: var(--paper);
    color: var(--sub); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .25s, color .25s;
  }
  .m-x:hover { background: var(--orange-soft); color: var(--orange); }
  .m-x svg { width: 14px; height: 14px; }
  .m-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  /* 弹层表单 */
  .f-label { margin: 14px 0 8px; font-size: 12.5px; font-weight: 800; letter-spacing: 1px; }
  .imp-err-tip { margin-top: 12px; font-size: 12.5px; color: var(--sub); }
  .imp-err { display: flex; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .imp-err b { flex: none; color: var(--red); }
  .imp-err span { color: var(--navy); line-height: 1.6; }
  .f-tip { margin-top: 6px; font-size: 11px; color: var(--ph); letter-spacing: .5px; }
  .type-seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; }
  .type-seg button {
    border: none; background: transparent; height: 30px; padding: 0 16px; border-radius: 7px;
    font-size: 12.5px; color: var(--sub); letter-spacing: 1px; cursor: pointer; font-family: inherit;
    transition: background .25s, color .25s;
  }
  .type-seg button:hover { color: var(--navy); }
  .type-seg button.on { background: var(--navy); color: #fff; font-weight: 700; }
  .opt-edit { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .opt-edit .ab {
    width: 26px; height: 26px; flex: none; border-radius: 50%; border: 1.5px solid var(--dash);
    color: var(--sub); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800;
  }
  .opt-edit .input { height: 38px; flex: 1; }
  .ans-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .a-chip {
    min-width: 38px; height: 32px; padding: 0 13px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--sub); font-size: 12.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; transition: border-color .2s, background .2s, color .2s;
  }
  .a-chip:hover { border-color: var(--orange); color: var(--orange); }
  .a-chip.on { border-color: var(--orange); background: var(--orange-soft); color: var(--orange); }

  /* ===== 页签：刷题练习 / 题库管理（与出工日志 wl-tabs 同族：文字 + 橙色滑动指示条） ===== */
  .qz-tabs { position: relative; flex: none; display: flex; gap: 4px; border-bottom: 1px solid var(--hair); }
  .qz-tabs button {
    padding: 11px 20px; border: none; background: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 14px; font-weight: 600; color: var(--sub); letter-spacing: 1.5px;
    transition: color .25s; font-family: inherit;
  }
  .qz-tabs button:hover { color: var(--navy); }
  .qz-tabs button.on { color: var(--orange); font-weight: 700; }
  .qz-tabs button svg { width: 15px; height: 15px; }
  .qz-tab-ind {
    position: absolute; bottom: -1px; left: 0; width: 0; height: 3px;
    border-radius: 2px; background: var(--orange);
    transition: left .3s cubic-bezier(.16, 1, .3, 1), width .3s cubic-bezier(.16, 1, .3, 1);
  }

  /* ===== 刷题练习 · 左卡我的题库（个人口径进度） ===== */
  #wrapPractice .side-item .pg { margin-top: 7px; display: flex; align-items: center; gap: 8px; }
  #wrapPractice .side-item .pg .progress { flex: 1; height: 5px; }
  #wrapPractice .side-item .pg > span { font-size: 10px; color: var(--ph); white-space: nowrap; }

  /* ===== 刷题练习 · 右卡题库主页（统计行 + 四宫格入口） ===== */
  .bh-stats { display: flex; padding: 15px 0; border: 1px solid var(--hair); border-radius: 10px; }
  .bh-stats .cell { flex: 1; text-align: center; position: relative; }
  .bh-stats .cell + .cell::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 1px; background: var(--hair2); }
  .bh-stats b { font-size: 20px; font-weight: 800; }
  .bh-stats b em { font-style: normal; color: var(--orange); }
  .bh-stats span { display: block; margin-top: 4px; font-size: 10.5px; color: var(--sub); letter-spacing: 1px; }
  .bh-grid { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bh-entry { border: 1px solid var(--hair); border-radius: 10px; padding: 13px 14px; display: flex; align-items: center; gap: 11px; cursor: pointer; transition: border-color .2s; }
  .bh-entry:hover { border-color: var(--orange); }
  .bh-entry .ib { width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--orange-soft); color: var(--orange); display: flex; align-items: center; justify-content: center; }
  .bh-entry .tx { flex: 1; min-width: 0; }
  .bh-entry .tx b { font-size: 13.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
  .bh-entry .tx p { margin-top: 3px; font-size: 11px; color: var(--sub); }
  .bh-entry > svg { flex: none; color: var(--ph); }

  /* ===== 刷题页（右卡接管）：顶行 返回 + 答题/背题 + 进度 + x/total ===== */
  #panePractice { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #panePractice[hidden] { display: none !important; } /* author display 规则优先于 UA [hidden]，显式兜底 */
  .pv-top { flex: none; display: flex; align-items: center; gap: 14px; }
  .pv-back { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; font-weight: 700; color: var(--navy); cursor: pointer; }
  .pv-back:hover { color: var(--orange); }
  .pv-title { font-size: 13.5px; font-weight: 800; white-space: nowrap; }
  .pv-vm { flex: none; display: inline-flex; background: #EFE9DA; border-radius: 7px; padding: 2px; }
  .pv-vm i { font-style: normal; font-size: 11.5px; font-weight: 700; padding: 3px 12px; border-radius: 5px; color: var(--sub); cursor: pointer; }
  .pv-vm i.on { background: var(--navy); color: #fff; }
  .pv-pg { flex: 1; display: flex; align-items: center; gap: 12px; }
  .pv-pg .progress { flex: 1; }
  .pv-pg b { font-size: 12.5px; font-weight: 800; white-space: nowrap; }
  .pv-col { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(34, 49, 78, .2) transparent; }
  .pv-col::-webkit-scrollbar { width: 5px; }
  .pv-col::-webkit-scrollbar-thumb { background: rgba(34, 49, 78, .16); border-radius: 3px; }
  .pv-col-in { max-width: 840px; padding: 16px 2px 4px; }
  .pv-stem { padding: 16px 15px; font-size: 15.5px; font-weight: 700; line-height: 1.8; }
  .pv-stem .tag { margin-right: 7px; vertical-align: 2px; }
  /* 选项：无卡片底，仅字母圈 + 文字；左边界对齐题干内容首字（题干卡内边距 15px + 题型 tag ≈47px + 间距 7px） */
  .pv-opt { display: flex; align-items: center; gap: 11px; padding: 7px 15px 7px 69px; font-size: 14px; line-height: 1.7; cursor: pointer; border-radius: 8px; }
  .pv-opt .ab {
    width: 26px; height: 26px; flex: none; border-radius: 50%; border: 1.5px solid var(--dash);
    color: var(--sub); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 800;
    transition: border-color .2s, background .2s, color .2s;
  }
  .pv-opt.sq .ab { border-radius: 7px; }
  .pv-opt:not(.lock):hover .ab { border-color: var(--orange); color: var(--orange); }
  .pv-opt.sel .ab { border-color: var(--orange); background: var(--orange); color: #fff; }
  .pv-opt.right .ab { border-color: #2BA471; background: #2BA471; color: #fff; }
  .pv-opt.wrong .ab { border-color: var(--red); background: var(--red); color: #fff; }
  .pv-opt .tx { min-width: 0; }
  .pv-opt.lock { cursor: default; }
  /* 解析态（正确答案/您的选择 + 统计 + 错题本动态）与试题详解卡 */
  .r-line { margin-top: 14px; padding: 12px 14px; background: #fff; border: 1px solid var(--hair); border-radius: 10px; }
  .r-main { display: flex; gap: 22px; font-size: 13px; font-weight: 700; }
  .r-main b { margin-left: 6px; }
  .r-main b.ok { color: #2BA471; }
  .r-main b.bad { color: var(--red); }
  .r-sub { margin-top: 6px; font-size: 11px; color: var(--sub); }
  .r-sub.orange { color: var(--orange); font-weight: 700; }
  .pv-ana { margin-top: 14px; padding: 14px 15px; background: var(--orange-soft); border-radius: 10px; }
  .pv-ana .hd { display: flex; align-items: center; gap: 8px; color: var(--orange); font-size: 13.5px; font-weight: 800; letter-spacing: 1px; }
  .pv-ana .bd { margin-top: 9px; font-size: 12.8px; line-height: 1.8; color: #4A5670; }
  .pv-ana .ft { margin-top: 9px; font-size: 10.5px; color: #C29B7E; letter-spacing: .5px; }
  /* 底栏：收藏 / 对错计数 / 答题卡 / 设置 + 主按钮 */
  .pv-foot { flex: none; display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--hair2); }
  .pv-chipbtn {
    display: inline-flex; align-items: center; gap: 5px; background: var(--paper); border: 1px solid var(--hair2);
    border-radius: 16px; padding: 5px 12px; font-size: 11.5px; color: var(--sub); font-weight: 600; cursor: pointer;
    transition: color .2s, border-color .2s; font-family: inherit;
  }
  .pv-chipbtn:hover { color: var(--orange); border-color: var(--orange); }
  .pv-chipbtn.faved { color: var(--orange); border-color: var(--orange); }
  .pv-chipbtn svg { width: 13px; height: 13px; }
  .pv-foot .sp { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .pv-hint { font-size: 11px; color: var(--ph); letter-spacing: 1px; }
  .qz-ok { color: #2BA471; }
  .qz-bad { color: var(--red); }
  /* 答题卡弹层（题型分区块 chips + 图例 + 底部清空做题记录） */
  .pv-sheet-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
  .pv-chip {
    height: 34px; border-radius: 8px; background: #EDE7D8; color: var(--sub);
    display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; cursor: pointer;
    transition: box-shadow .15s;
  }
  .pv-chip:hover { box-shadow: inset 0 0 0 2px var(--orange); }
  .pv-chip.ok { background: #2BA471; color: #fff; }
  .pv-chip.bad { background: var(--red); color: #fff; }
  .pv-chip.cur { box-shadow: inset 0 0 0 2px var(--orange); color: var(--navy); background: #fff; }
  .pv-legend { display: flex; gap: 16px; margin: 2px 0 4px; font-size: 11px; color: var(--sub); }
  .pv-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: #EDE7D8; margin-right: 5px; }
  .pv-legend i.g { background: #2BA471; }
  .pv-legend i.r { background: var(--red); }
  .pv-clear { text-align: center; font-size: 12px; font-weight: 700; color: var(--red); cursor: pointer; margin-top: 14px; }
  .pv-clear.disabled { color: var(--ph); cursor: not-allowed; }
  /* 刷题设置（答对自动下一题 / 选项乱序；本地 storage quiz_settings 持久化） */
  .pv-set-row { display: flex; align-items: center; gap: 10px; padding: 12px 2px; }
  .pv-set-row + .pv-set-row { border-top: 1px solid var(--hair); }
  .pv-set-row .tx { flex: 1; min-width: 0; }
  .pv-set-row .tx b { font-size: 13.5px; font-weight: 800; }
  .pv-set-row .tx p { margin-top: 3px; font-size: 11px; color: var(--sub); }
  .pv-sw { width: 40px; height: 22px; flex: none; border-radius: 11px; background: #E5DFCE; position: relative; cursor: pointer; transition: background .25s; }
  .pv-sw .dot { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .25s; box-shadow: 0 1px 3px rgba(34,49,78,.2); }
  .pv-sw.on { background: var(--orange); }
  .pv-sw.on .dot { left: 20px; }

  /* 窄屏回退：左右卡收窄 */
  @media (max-width: 900px) {
    .page { padding: 16px; }
    .qz-side { width: 240px; }
    .qz-main { padding: 16px; }
  }
</style>
</head>
<body>
<!-- 顶部导航由 Shade.topbar({active:'quiz'}) 统一渲染（见 script） -->

<main class="page">
  <!-- 页签：刷题练习 / 题库管理（文字 + 橙色滑动指示条；题库管理仅管理角色可见，首次切入才加载管理数据） -->
  <div class="qz-tabs fade-up" id="qzTabs">
    <button class="on" data-p="practice">刷题练习</button>
    <button data-p="manage" id="tabManage" hidden>题库管理</button>
    <span class="qz-tab-ind" id="qzTabInd"></span>
  </div>

  <!-- 刷题练习：左卡我的题库 + 右卡题库主页 / 刷题页 -->
  <div class="qz-wrap fade-up" id="wrapPractice">
    <aside class="card qz-side">
      <div class="side-head">
        <b>我的题库</b>
        <button class="mini-btn" id="btnPool" title="题库池"></button>
      </div>
      <div class="side-scroll" id="pvSideScroll">
        <div id="pvBankList"></div>
      </div>
    </aside>
    <section class="card qz-main">
      <div class="pane" id="paneBankHome"></div>
      <div id="panePractice" hidden></div>
    </section>
  </div>

  <!-- 题库管理：左卡题库列表（新建/导入/超管班组切换）+ 右卡题目表格/AI 解析 -->
  <div class="qz-wrap fade-up" id="wrapManage" hidden>
    <!-- 左卡：题库管理（新建 / 导入按钮；超管另见班组切换） -->
    <aside class="card qz-side">
      <div class="side-head">
        <b>题库管理</b>
        <button class="mini-btn" id="btnNewBank" title="新建题库"></button>
        <button class="mini-btn" id="btnQuickImport" title="导入 Excel"></button>
      </div>
      <div class="side-team" id="sideTeam" hidden>
        <select id="teamSel" title="仅超级管理员可切换班组；其余角色固定为本班组"></select>
      </div>
      <div class="side-scroll" id="sideScroll">
        <div id="bankList"></div>
      </div>
    </aside>

    <!-- 右卡：头部按钮组 + AI 解析通知条 + 搜索 + 题目表格 + 分页 -->
    <section class="card qz-main">
      <div class="pane" id="paneManage">
        <div class="mg-head" id="mgHead"></div>
        <div class="ai-notice" id="aiNotice" hidden></div>
        <div class="mg-tools">
          <div class="mg-search" id="mgSearch"><input class="input" id="mgQ" placeholder="搜索题干" maxlength="50"></div>
          <span class="mg-total" id="mgTotal"></span>
        </div>
        <div class="qtable" id="mgTable"></div>
        <div class="pager" id="mgPager"></div>
      </div>
    </section>
  </div>
</main>

<!-- 题库 Excel 导入：隐藏文件选择（仅 .xlsx ≤10MB，前端先校验） -->
<input type="file" id="impFile" accept=".xlsx" hidden>

<script src="/assets/icons.js"></script>
<script src="/assets/common.js"></script>
<script>
/* ============================================================
   题库刷题网页版：刷题练习 + 题库管理双页签
   刷题练习：我的题库（GET /banks）→ 题库主页（GET /banks/:id/home）→ 顺序/随机/错题/收藏四模式刷题
   （大纲 lite=1 + 分批拉题；seq/rand 带 withRecord=1 恢复历史作答；断点 localStorage quiz_seq_{bankId}；
   答题卡弹层可清空做题记录；设置 答对自动下一题/选项乱序 存 localStorage quiz_settings）
   题库管理：原双卡（/banks/manage + 题目表格/导入/AI 解析轮询），页签首次切入才加载
   接口同源 /api/v1/quiz/*，响应信封由 Shade.api 解包（code!==0 抛错）；模板 xlsx 走 fetch + blob 下载
   ============================================================ */
(function () {
'use strict';
Shade.requireAuth();
/* 统一顶部导航（当前应用：题库刷题） */
Shade.topbar({ active: 'quiz' });

/* ================= 工具 ================= */
var $ = Shade.$, $$ = Shade.$$;
var esc = Shade.esc;
var API = '/api/v1/quiz';
var LETTERS = 'ABCDEF'; // 选项字母（最多 6 项 A~F）
var TYPE_META = {
  single: { tag: '单选', cls: 'tag-orange' },
  multiple: { tag: '多选', cls: 'tag-orange' },
  judge: { tag: '判断', cls: 'tag-navy' }
};

/* ================= 全局状态 ================= */
var me = Shade.user() || {};
var state = {
  role: me.role || 'user',                                    // admin 超管 / team_admin 班组管理员 / user 普通用户
  isManager: me.role === 'admin' || me.role === 'team_admin', // 管理角色：题库/题目增删改、导入
  teamId: 0,       // 超管当前切换的班组 id（0=未指定，由后端落默认班组；非超管恒 0）
  banks: null,     // 题库列表（null=加载中）
  banksErr: '',
  mBankId: 0,      // 当前题库 id
  mq: null,        // 题目分页（见 newMq）
  pollTimer: 0     // AI 解析进度轮询定时器
};
function newMq() {
  return { page: 1, size: 20, q: '', total: 0, list: null, err: '' };
}
state.mq = newMq();

/* 班组隔离：超管所有 /quiz/* 请求统一带 team_id（query，与后端 resolveReqTeam 同口径） */
function qz(path) { return Shade.withTeam(path, state.teamId); }
function findBank(id) {
  var b = null;
  (state.banks || []).forEach(function (x) { if (x.id === id) b = x; });
  return b;
}
/* 当前生效题库 */
function curBank() {
  return findBank(state.mBankId);
}
/* AI 解析进度：x=已解析，y=应解析总数（已解析+排队中） */
function aiProgress(b) {
  var a = (b && b.analysis) || {};
  return { x: a.done || 0, y: (a.done || 0) + (a.pending || 0), pending: a.pending || 0, failed: a.failed || 0, none: a.none || 0 };
}
/* 题库范围 tag：all=橙「全部池」；team=藏青班组名（teamName 缺省落「班组池」） */
function scopeTag(b) {
  if (b && b.scope === 'all') return '<span class="tag tag-orange">全部池</span>';
  return '<span class="tag tag-navy">' + esc((b && b.teamName) || '班组池') + '</span>';
}
/* 当前生效班组名（超管班组切换下拉选中项；题库「上传至」radio 文案用） */
function curTeamName() {
  var sel = $('#teamSel');
  var opt = sel && sel.options && sel.options[sel.selectedIndex];
  return opt ? opt.text : '当前班组';
}
/* 判断题答案字母转中文（options 固定 ["正确","错误"]，A=正确 B=错误） */
function answerText(type, answer) {
  if (type === 'judge') return answer === 'A' ? '正确' : '错误';
  return answer || '';
}

/* ================= 通用弹层（Shade.modal 动态弹层：可叠层，Esc / 点遮罩关闭） ================= */
/* 通用确认弹层（叠层）：返回 Promise<boolean>，遮罩/Esc/取消均视为否 */
function confirmAction(opts) {
  return new Promise(function (resolve) {
    var done = false;
    function finish(v) { if (!done) { done = true; resolve(v); } }
    var html = Shade.mHead(opts.title)
      + '<div style="font-size:13px;line-height:1.8">' + esc(opts.content) + '</div>'
      + '<div class="m-foot"><button class="btn btn-sm" data-a="no">取消</button>'
      + '<button class="btn btn-sm ' + (opts.danger ? 'btn-danger' : 'btn-accent') + '" data-a="yes">' + esc(opts.confirmText || '确定') + '</button></div>';
    var inst = Shade.modal(html, { width: 420, onClose: function () { finish(false); } });
    $('[data-a="no"]', inst.box).addEventListener('click', inst.close);
    $('[data-a="yes"]', inst.box).addEventListener('click', function () { finish(true); inst.close(); });
  });
}

/* ================= 超管班组切换器 ================= */
/* 自绘下拉（原 select 隐藏保留为数据源），#sideTeam 侧栏块初始隐藏，超管加载班组列表后显示（装配见 init 内 Shade.setupTeamSel） */
var teamDd = Shade.dropdown($('#teamSel'), { width: '100%', height: 36 });

/* 切换班组后整页重载：清空全部按班组缓存（题库 / 管理分页） */
function reloadTeamData() {
  mgBooted = true;
  stopPoll();
  state.banks = null; state.banksErr = '';
  state.mBankId = 0;
  state.mq = newMq();
  $('#mgQ').value = '';
  boot();
}

/* ================= 左卡数据 ================= */
async function loadBanks(quiet) {
  if (!quiet) { state.banks = null; state.banksErr = ''; renderSide(); }
  try {
    /* 管理口径固定 GET /banks/manage（可管理列表，含 scope/teamName） */
    var r = await Shade.api(qz(API + '/banks/manage'));
    state.banks = (r.data && r.data.list) || [];
    state.banksErr = '';
  } catch (e) {
    if (!quiet) { state.banks = []; state.banksErr = e.message; }
  }
  renderSide();
}

/* ================= 左卡渲染 ================= */
function bankMetaManage(b) {
  var p = aiProgress(b);
  var t = b.questionCount + ' 题 · ';
  if (p.pending > 0) t += '解析中 ' + p.x + '/' + p.y;
  else if (p.failed > 0) t += p.failed + ' 题解析失败';
  else if (p.none > 0) t += p.none + ' 题待解析';
  else t += '解析完成';
  return t;
}
function renderSide() {
  var box = $('#bankList');
  if (!state.banks) {
    box.innerHTML = '<div class="skeleton sk-item"></div><div class="skeleton sk-item"></div><div class="skeleton sk-item"></div>';
    return;
  }
  if (state.banksErr) {
    box.innerHTML = '<div class="empty">' + Shade.icon('error-circle', 40) + '<p>' + esc(state.banksErr) + '</p>'
      + '<button class="btn btn-sm" id="sideRetry">重试</button></div>';
    $('#sideRetry').addEventListener('click', function () { loadBanks(); });
    return;
  }
  if (!state.banks.length) {
    /* 空态：无可管理题库，引导新建导入 */
    box.innerHTML = '<div class="empty">' + Shade.icon('book', 40)
      + '<p>暂无题库</p>'
      + '<p style="font-size:11px">点击右上角 + 新建题库，Excel 一键导入</p></div>';
    return;
  }
  box.innerHTML = state.banks.map(function (b) {
    var on = b.id === state.mBankId;
    /* 列表项带范围 tag（all 橙「全部池」/ team 藏青班组名） */
    var metaHtml = scopeTag(b) + ' ' + esc(bankMetaManage(b));
    var ops = '<span class="ops"><button data-op="edit" data-id="' + b.id + '" title="编辑题库">' + Shade.icon('edit', 14) + '</button>'
      + '<button data-op="del" data-id="' + b.id + '" title="删除题库">' + Shade.icon('delete', 14) + '</button></span>';
    return '<div class="side-item' + (on ? ' on' : '') + '" data-id="' + b.id + '">'
      + Shade.icon('book', 17, on ? '#F26D21' : '#6B7690')
      + '<div class="tx"><b>' + esc(b.name) + '</b><span>' + metaHtml + '</span></div>' + ops + '</div>';
  }).join('');
}

/* ================= 进入页面（管理角色） ================= */
async function boot() {
  stopPoll();
  renderSide();
  await loadBanks();
  enterManage();
}

/* ================= 题库管理 ================= */
function enterManage() {
  if (!state.banks.length) {
    state.mBankId = 0;
    state.mq = newMq();
    renderMgHead(); renderMgNotice(); renderMgTable(); renderPager();
    $('#mgTotal').textContent = '';
    return;
  }
  if (!state.mBankId || !findBank(state.mBankId)) { state.mBankId = state.banks[0].id; state.mq.page = 1; }
  renderSide();
  renderMgHead(); renderMgNotice();
  loadMgQuestions();
  syncPoll();
}
function renderMgHead() {
  var b = curBank();
  var head = $('#mgHead');
  if (!b) {
    head.innerHTML = '<div class="tx"><b>暂无题库</b><p>点击左卡右上角 + 新建题库</p></div>';
    return;
  }
  var p = aiProgress(b);
  var sub = b.questionCount + ' 题 · 已解析 ' + p.x + ' · 解析中 ' + p.pending + ' · 失败 ' + p.failed
    + (b.description ? ' · ' + b.description : '');
  head.innerHTML = '<div class="tx"><b>' + esc(b.name) + ' ' + scopeTag(b) + ' <span class="badge-outline">AI 解析</span></b>'
    + '<p>' + esc(sub) + '</p></div>'
    + '<button class="btn btn-sm" id="mgTpl">' + Shade.icon('download', 14) + '下载模板</button>'
    + '<button class="btn btn-sm btn-accent" id="mgImport">' + Shade.icon('upload', 14) + '导入 Excel</button>'
    + '<button class="btn btn-sm" id="mgRetry"' + (p.pending === 0 && (p.failed + p.none) > 0 ? '' : ' disabled') + '>' + Shade.icon('refresh', 14) + (p.failed > 0 ? '重试失败解析' : '继续解析') + '</button>'
    + '<button class="btn btn-sm btn-primary" id="mgAdd">' + Shade.icon('add', 14) + '新增题目</button>';
}
function renderMgNotice() {
  var b = curBank();
  var box = $('#aiNotice');
  var p = b ? aiProgress(b) : null;
  if (!b || !p.pending) { box.hidden = true; return; }
  box.hidden = false;
  var pct = p.y ? Math.round(p.x / p.y * 100) : 0;
  box.innerHTML = Shade.icon('lightbulb', 15)
    + '<span class="txt">「' + esc(b.name) + '」AI 解析进行中，期间可正常刷题</span>'
    + '<div class="progress"><i style="width:' + pct + '%"></i></div><b>' + p.x + ' / ' + p.y + '</b>';
}
/* 解析状态三态标签：已解析绿 / 解析中橙 / 失败红（点击重试，走库级 analyze-retry） */
function stTag(q) {
  var s = q.analysisStatus || 'none';
  if (s === 'done') return '<span class="tag tag-green">已解析</span>';
  if (s === 'pending') return '<span class="tag tag-orange">解析中…</span>';
  if (s === 'failed') return '<span class="tag tag-red tag-retry" title="点击重试解析">失败 · 重试</span>';
  return '<span class="tag tag-navy">未解析</span>';
}
function renderMgTable() {
  var mq = state.mq;
  var box = $('#mgTable');
  var hd = '<div class="tr hd"><span class="c-t">题型</span><span class="c-q">题干</span>'
    + '<span class="c-a">答案</span><span class="c-s">解析状态</span><span class="c-o">操作</span></div>';
  if (!state.mBankId) {
    box.innerHTML = hd + '<div class="empty">' + Shade.icon('book', 44) + '<p>暂无题库</p></div>';
    return;
  }
  if (!mq.list) {
    box.innerHTML = hd + '<div class="loading"><span class="spin"></span>题目加载中…</div>';
    return;
  }
  if (mq.err) {
    box.innerHTML = hd + '<div class="empty">' + Shade.icon('error-circle', 44) + '<p>' + esc(mq.err) + '</p>'
      + '<button class="btn btn-sm" id="mqRetry">重试</button></div>';
    $('#mqRetry').addEventListener('click', function () { loadMgQuestions(); });
    return;
  }
  if (!mq.list.length) {
    box.innerHTML = hd + '<div class="empty">' + Shade.icon('search', 44)
      + '<p>' + (mq.q ? '未搜到相关题目' : '暂无题目，点击右上角导入或新增') + '</p></div>';
    return;
  }
  box.innerHTML = hd + mq.list.map(function (q) {
    var tm = TYPE_META[q.type] || TYPE_META.single;
    return '<div class="tr">'
      + '<span class="tag ' + tm.cls + ' c-t">' + tm.tag + '</span>'
      + '<span class="c-q" title="' + esc(q.content) + '">' + esc(q.content) + '</span>'
      + '<span class="c-a">' + esc(answerText(q.type, q.answer)) + '</span>'
      + '<span class="c-s">' + stTag(q) + '</span>'
      + '<span class="c-o"><button data-op="edit" data-id="' + q.id + '" title="编辑">' + Shade.icon('edit', 15) + '</button>'
      + '<button data-op="del" data-id="' + q.id + '" title="删除">' + Shade.icon('delete', 15) + '</button></span></div>';
  }).join('');
}
function renderPager() {
  var mq = state.mq;
  var box = $('#mgPager');
  var pages = Math.max(1, Math.ceil(mq.total / mq.size));
  if (!state.mBankId || pages <= 1) { box.innerHTML = ''; return; }
  var cur = mq.page;
  var nums = [];
  if (pages <= 7) {
    for (var i = 1; i <= pages; i++) nums.push(i);
  } else {
    nums.push(1);
    var lo = Math.max(2, cur - 1), hi = Math.min(pages - 1, cur + 1);
    if (lo > 2) nums.push('…');
    for (var j = lo; j <= hi; j++) nums.push(j);
    if (hi < pages - 1) nums.push('…');
    nums.push(pages);
  }
  box.innerHTML = '<button data-pg="' + (cur - 1) + '"' + (cur <= 1 ? ' disabled' : '') + '>‹</button>'
    + nums.map(function (p) {
      if (p === '…') return '<button class="pg-dots" disabled>…</button>';
      return '<button data-pg="' + p + '"' + (p === cur ? ' class="on"' : '') + '>' + p + '</button>';
    }).join('')
    + '<button data-pg="' + (cur + 1) + '"' + (cur >= pages ? ' disabled' : '') + '>›</button>';
}
async function loadMgQuestions(quiet) {
  var mq = state.mq;
  if (!state.mBankId) { mq.list = []; mq.total = 0; renderMgTable(); renderPager(); return; }
  if (!quiet) { mq.list = null; mq.err = ''; renderMgTable(); }
  try {
    var url = API + '/banks/' + state.mBankId + '/questions?page=' + mq.page + '&size=' + mq.size
      + '&q=' + encodeURIComponent(mq.q || '');
    var r = await Shade.api(qz(url));
    mq.list = (r.data && r.data.list) || [];
    mq.total = (r.data && r.data.total) || 0;
    mq.err = '';
    /* 页码越界回退（删除尾页最后一条后自动回一页） */
    if (!mq.list.length && mq.page > 1 && mq.total > 0) {
      mq.page = Math.max(1, Math.ceil(mq.total / mq.size));
      return loadMgQuestions(true);
    }
  } catch (e) {
    if (!quiet) { mq.list = []; mq.err = e.message; }
  }
  renderMgTable();
  renderPager();
  $('#mgTotal').textContent = mq.err ? '' : ('共 ' + mq.total + ' 题');
}
/* AI 解析进度轮询：当前题库有排队时 5s 一刷 /banks/manage，归零停 */
function stopPoll() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = 0; }
}
function syncPoll() {
  var b = curBank();
  if (!b || !aiProgress(b).pending) { stopPoll(); return; }
  if (state.pollTimer) return;
  state.pollTimer = setInterval(async function () {
    try {
      await loadBanks(true);          // 左卡与头部统计静默刷新
      renderMgHead(); renderMgNotice();
      loadMgQuestions(true);          // 表格解析状态标签同步
    } catch (e) { /* 轮询失败下轮再试 */ }
    var nb = curBank();
    if (!nb || !aiProgress(nb).pending) stopPoll();
  }, 5000);
}

/* 题目弹层：题型切换动态选项行（A~F 可加可删，判断题固定 正确/错误 两项） */
function openQuestionModal(q) {
  var isEdit = !!q;
  var qm = {
    id: q ? q.id : 0,
    type: q ? q.type : 'single',
    options: q && q.options ? q.options.slice() : ['', ''],
    answer: q ? String(q.answer || '').split('') : []
  };
  if (qm.type === 'judge') qm.options = ['正确', '错误'];

  var html = Shade.mHead(isEdit ? '编辑题目' : '新增题目')
    + '<div class="f-label">题型</div><div class="type-seg" id="qmType">'
    + '<button data-t="single">单选题</button><button data-t="multiple">多选题</button><button data-t="judge">判断题</button></div>'
    + '<div class="f-label">题干</div>'
    + '<textarea class="input" id="qmContent" placeholder="请输入题干">' + esc(q ? q.content : '') + '</textarea>'
    + '<div class="f-label">选项</div><div id="qmOpts"></div>'
    + '<button class="btn btn-sm" id="qmAddOpt" style="margin-top:10px">' + Shade.icon('add', 14) + '添加选项</button>'
    + '<div class="f-label">答案</div><div class="ans-chips" id="qmAns"></div>'
    + '<div class="f-tip" id="qmAnsTip"></div>'
    + '<div class="f-label">解析</div>'
    + '<textarea class="input" id="qmAnalysis" placeholder="留空则由 AI 自动生成">' + esc(q ? (q.analysis || '') : '') + '</textarea>'
    + '<div class="m-foot"><button class="btn btn-sm" data-a="no">取消</button>'
    + '<button class="btn btn-sm btn-primary" data-a="yes">保存</button></div>';
  var inst = Shade.modal(html, { width: 620 });

  function renderType() {
    $$('#qmType button', inst.box).forEach(function (b) { b.classList.toggle('on', b.dataset.t === qm.type); });
    $('#qmAddOpt', inst.box).style.display = qm.type === 'judge' ? 'none' : '';
  }
  function renderOpts() {
    var box = $('#qmOpts', inst.box);
    if (qm.type === 'judge') {
      box.innerHTML = ['正确', '错误'].map(function (t, i) {
        return '<div class="opt-edit"><span class="ab">' + LETTERS[i] + '</span>'
          + '<input class="input" value="' + t + '" disabled></div>';
      }).join('');
      return;
    }
    box.innerHTML = qm.options.map(function (text, i) {
      return '<div class="opt-edit"><span class="ab">' + LETTERS[i] + '</span>'
        + '<input class="input" data-i="' + i + '" value="' + esc(text) + '" placeholder="选项 ' + LETTERS[i] + '" maxlength="200">'
        + '<button class="mini-btn qm-del" data-i="' + i + '" title="删除选项"'
        + (qm.options.length <= 2 ? ' disabled style="opacity:.4;cursor:not-allowed"' : '') + '>'
        + Shade.icon('delete', 14) + '</button></div>';
    }).join('');
  }
  function renderAns() {
    var box = $('#qmAns', inst.box);
    var tip = $('#qmAnsTip', inst.box);
    if (qm.type === 'judge') {
      box.innerHTML = ['A', 'B'].map(function (L, i) {
        return '<button class="a-chip' + (qm.answer.indexOf(L) >= 0 ? ' on' : '') + '" data-l="' + L + '">'
          + (i === 0 ? '正确' : '错误') + '</button>';
      }).join('');
      tip.textContent = '判断题答案：A=正确，B=错误';
      return;
    }
    tip.textContent = qm.type === 'multiple' ? '多选题可点选多个选项字母' : '单选题点选一个选项字母';
    box.innerHTML = qm.options.map(function (_, i) {
      var L = LETTERS[i];
      return '<button class="a-chip' + (qm.answer.indexOf(L) >= 0 ? ' on' : '') + '" data-l="' + L + '">' + L + '</button>';
    }).join('');
  }
  /* 选项行是非受控 input，结构操作前先把当前输入值收回 qm.options */
  function syncOptsFromInputs() {
    if (qm.type === 'judge') return;
    $$('input[data-i]', $('#qmOpts', inst.box)).forEach(function (inp) {
      qm.options[Number(inp.dataset.i)] = inp.value;
    });
  }
  renderType(); renderOpts(); renderAns();

  $('#qmType', inst.box).addEventListener('click', function (e) {
    var b = e.target.closest('button[data-t]');
    if (!b || b.dataset.t === qm.type) return;
    syncOptsFromInputs();
    qm.type = b.dataset.t;
    /* 切题型重置选项与答案，避免旧答案字母错位 */
    if (qm.type === 'judge') { qm.options = ['正确', '错误']; qm.answer = []; }
    else { qm.options = ['', '']; qm.answer = []; }
    renderType(); renderOpts(); renderAns();
  });
  $('#qmAddOpt', inst.box).addEventListener('click', function () {
    syncOptsFromInputs();
    if (qm.options.length >= 6) { Shade.toast('最多 6 个选项（A~F）', 'info'); return; }
    qm.options.push('');
    renderOpts(); renderAns();
  });
  $('#qmOpts', inst.box).addEventListener('click', function (e) {
    var del = e.target.closest('.qm-del');
    if (!del || del.disabled) return;
    syncOptsFromInputs();
    qm.options.splice(Number(del.dataset.i), 1);
    qm.answer = []; // 删除选项后字母前移，原答案对应关系失效，清空重选
    renderOpts(); renderAns();
  });
  $('#qmAns', inst.box).addEventListener('click', function (e) {
    var c = e.target.closest('.a-chip');
    if (!c) return;
    var L = c.dataset.l;
    if (qm.type === 'multiple') {
      var i = qm.answer.indexOf(L);
      if (i >= 0) qm.answer.splice(i, 1);
      else qm.answer.push(L);
    } else {
      qm.answer = [L];
    }
    renderAns();
  });

  $('[data-a="no"]', inst.box).addEventListener('click', inst.close);
  $('[data-a="yes"]', inst.box).addEventListener('click', async function () {
    syncOptsFromInputs();
    var content = $('#qmContent', inst.box).value.trim();
    var analysis = $('#qmAnalysis', inst.box).value.trim();
    if (!content) { Shade.toast('请填写题干', 'info'); return; }
    if (qm.type !== 'judge' && qm.options.some(function (t) { return !t.trim(); })) {
      Shade.toast('请填写完整选项内容', 'info'); return;
    }
    if (!qm.answer.length) { Shade.toast('请设置答案', 'info'); return; }
    var body = {
      type: qm.type,
      content: content,
      options: qm.type === 'judge' ? ['正确', '错误'] : qm.options.map(function (t) { return t.trim(); }),
      answer: qm.answer.slice().sort().join(''),
      analysis: analysis // 留空则由后端排队 AI 生成
    };
    this.disabled = true;
    try {
      if (isEdit) await Shade.api(qz(API + '/questions/' + qm.id), { method: 'PUT', body: body });
      else await Shade.api(qz(API + '/banks/' + state.mBankId + '/questions'), { method: 'POST', body: body });
      Shade.toast(isEdit ? '题目已保存' : '题目已新增', 'success');
      inst.close();
      loadBanks(true);
      renderMgHead(); renderMgNotice();
      loadMgQuestions(true);
      syncPoll();
    } catch (e) {
      Shade.toast(e.message, 'error');
      this.disabled = false;
    }
  });
}

  var yes = await confirmAction({

  /* 题干搜索：防抖 300ms */
  var qTimer = 0;
  $('#mgQ').addEventListener('input', function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () {
      state.mq.q = $('#mgQ').value.trim();
      state.mq.page = 1;
      loadMgQuestions();
    }, 300);
  });
  /* Excel 导入：隐藏 file input（仅 .xlsx ≤10MB，前端先校验） */
  $('#impFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    if (!/\.xlsx$/i.test(f.name)) { Shade.toast('仅支持 .xlsx 文件', 'error'); return; }
    if (f.size > 10 * 1024 * 1024) { Shade.toast('文件不能超过 10MB', 'error'); return; }
    importExcel(f);
  });
}

/* ================= 刷题练习（个人口径，接口与小程序 pkg-quiz 同口径） ================= */
var P_LIMIT = 20; // 每批拉题数（与后端/小程序一致）
var pv = {
  banks: null, banksErr: '',   // 我的题库列表（GET /banks）
  bankId: 0, home: null, homeErr: '',
  mode: 'seq',                  // seq 顺序 / rand 随机 / wrong 错题 / fav 收藏
  viewMode: 'answer',           // answer 答题 / recite 背题
  outline: [],                  // [{id,type,myRight?}] 题序大纲
  cache: {},                    // 批首下标 → 题目数组
  results: {},                  // qid → { selected, right, answer, analysis, wrong, stats }（含历史恢复）
  myRight: {},                  // qid → 1/0 最近作答对错（底栏计数与答题卡着色数据源）
  favs: {},                     // qid → 1/0
  shuffle: {},                  // qid → 展示位→原选项下标（选项乱序；已答题保留以与其作答记录一致）
  idx: 0, sel: [], inflight: null, submitting: false, favBusy: false,
  started: false,               // 刷题页是否接管右卡
  settings: { autoNext: false, shuffleOpt: false },
  autoTimer: 0
};

function pvTypeText(t) { return t === 'multiple' ? '多选题' : t === 'judge' ? '判断题' : '单选题'; }
function pvModeText(m) { return m === 'rand' ? '随机练习' : m === 'wrong' ? '错题专项练习' : m === 'fav' ? '收藏练习' : '顺序练习'; }
/* 刷题设置（本地 storage quiz_settings 持久化，与小程序端同键同口径） */
function pvLoadSettings() {
  try {
    var s = JSON.parse(localStorage.getItem('quiz_settings') || '{}');
    pv.settings.autoNext = !!s.autoNext;
    pv.settings.shuffleOpt = !!s.shuffleOpt;
  } catch (e) { /* 忽略坏数据 */ }
}
function pvSaveSettings() { localStorage.setItem('quiz_settings', JSON.stringify(pv.settings)); }
/* 已答/对错计数（底栏与答题卡；seq/rand 含历史恢复，统一以 myRight 为准） */
function pvCounts() {
  var answered = 0, right = 0;
  Object.keys(pv.myRight).forEach(function (k) { answered += 1; if (pv.myRight[k]) right += 1; });
  return { answered: answered, right: right, wrong: answered - right };
}
/* 选项乱序：生成长度 n 的随机排列（展示位 → 原选项下标；Fisher-Yates） */
function pvShuffleIdx(n) {
  var a = [];
  for (var i = 0; i < n; i += 1) a.push(i);
  for (var i = a.length - 1; i > 0; i -= 1) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pvClearSession() {
  pv.outline = []; pv.cache = {}; pv.results = {}; pv.myRight = {}; pv.favs = {}; pv.shuffle = {};
  pv.idx = 0; pv.sel = []; pv.inflight = null;
  if (pv.autoTimer) { clearTimeout(pv.autoTimer); pv.autoTimer = 0; }
}

/* ---------- 左卡：我的题库 ---------- */
async function pvLoadBanks(quiet) {
  if (!quiet) { pv.banks = null; pv.banksErr = ''; pvRenderSide(); }
  try {
    var r = await Shade.api(API + '/banks');
    pv.banks = (r.data && r.data.list) || [];
    pv.banksErr = '';
  } catch (e) {
    if (!quiet) { pv.banks = []; pv.banksErr = e.message; }
  }
  pvRenderSide();
  /* 选中态兜底：未选或已选库被移出 → 回退到第一本 */
  var exists = pv.bankId && (pv.banks || []).some(function (b) { return b.id === pv.bankId; });
  if (!exists) {
    if (pv.banks && pv.banks.length) pvSelectBank(pv.banks[0].id);
    else { pv.bankId = 0; pv.home = null; pvRenderHome(); }
  }
}
function pvRenderSide() {
  var box = $('#pvBankList');
  if (!pv.banks) {
    box.innerHTML = '<div class="skeleton sk-item"></div><div class="skeleton sk-item"></div><div class="skeleton sk-item"></div>';

  }
  if (pv.banksErr) {

      + '<button class="btn btn-sm" id="pvSideRetry">重试</button></div>';
    $('#pvSideRetry').addEventListener('click', function () { pvLoadBanks(); });
    return;
  }
  if (!pv.banks.length) {
    box.innerHTML = '<div class="empty">' + Shade.icon('book', 40)
      + '<p>还没有题库</p>'
      + '<p style="font-size:11px">点右上角罗盘图标，从题库池添加</p></div>';

  }
  box.innerHTML = pv.banks.map(function (b) {
    var on = b.id === pv.bankId;

      + '<div class="tx"><b>' + esc(b.name) + '</b><span>' + meta + '</span>' + pg + '</div></div>';
  }).join('');
}

/* ---------- 刷题：大纲 + 分批取题（与小程序 practice 页同口径） ---------- */
async function pvFetchOutline() {
  var url = API + '/practice/questions?mode=' + pv.mode + '&lite=1&bankId=' + pv.bankId;
  if (pv.mode === 'seq' || pv.mode === 'rand') url += '&withRecord=1'; // 恢复历史作答对错
  var r = await Shade.api(url);
  pv.outline = (r.data && r.data.list) || [];
  pv.myRight = {};
  pv.outline.forEach(function (o) { if (o.myRight !== undefined) pv.myRight[o.id] = o.myRight; });
}
async function pvEnsureBatch(idx, silent) {
  var start = Math.floor(idx / P_LIMIT) * P_LIMIT;
  if (pv.cache[start]) return;
  /* 有进行中的请求先等它落定（跳题与预拉可能撞批），再复查缓存 */
  if (pv.inflight) {
    await pv.inflight.catch(function () {});
    if (pv.cache[start]) return;
  }
  var url = API + '/practice/questions?mode=' + pv.mode + '&offset=' + start + '&limit=' + P_LIMIT + '&bankId=' + pv.bankId;
  if (pv.viewMode === 'recite') url += '&withAnswer=1';
  else if (pv.mode === 'seq' || pv.mode === 'rand') url += '&withRecord=1';
  pv.inflight = Shade.api(url);
  try {
    var r = await pv.inflight;
    var raw = (r.data && r.data.list) || [];
    var map = {};
    raw.forEach(function (q) { map[q.id] = q; });
    /* 按大纲区间 id 对齐重排（对不上则按响应原序兜底） */
    var seg = pv.outline.slice(start, start + P_LIMIT).map(function (o) { return map[o.id]; }).filter(Boolean);
    pv.cache[start] = seg.length ? seg : raw;
    pv.cache[start].forEach(function (q) {
      pv.favs[q.id] = q.fav ? 1 : 0;
      /* 历史作答恢复为解析态（本 session 已答过的保留——其结果带作答统计与错题本动态） */
      if (q.myAnswer && !pv.results[q.id]) {
        pv.results[q.id] = {
          selected: String(q.myAnswer).split(''),
          right: !!q.myRight,
          answer: q.answer || '',
          analysis: q.analysis || '',
          wrong: { inBook: false, rightStreak: 0, removed: false },
          stats: null
        };
      }
    });
  } finally {
    pv.inflight = null;
  }
}
function pvGetQ(idx) {
  var start = Math.floor(idx / P_LIMIT) * P_LIMIT;
  return (pv.cache[start] || [])[idx - start] || null;
}

/* ---------- 刷题：进入 / 渲染 / 切题 ---------- */
async function pvStart(mode) {
  if (!pv.bankId) return;
  pvClearSession();
  pv.mode = mode;
  try {
    await pvFetchOutline();
    if (!pv.outline.length) { pvShowEmpty(mode); return; }
    /* seq 断点恢复（大纲下标；题库缩水越界则兜底到末尾题） */
    if (mode === 'seq') {
      var saved = Number(localStorage.getItem('quiz_seq_' + pv.bankId)) || 0;
      pv.idx = Math.min(Math.max(saved, 0), pv.outline.length - 1);
    }
    await pvEnsureBatch(pv.idx, true);
    if (!pvGetQ(pv.idx)) { Shade.toast('题目加载失败，请重试', 'error'); return; }
    pv.started = true;
    $('#paneBankHome').hidden = true;
    $('#panePractice').hidden = false;
    pvRender();
  } catch (e) { Shade.toast(e.message, 'error'); }
}
function pvShowEmpty(mode) {
  pv.started = true;
  $('#paneBankHome').hidden = true;
  var pane = $('#panePractice');
  pane.hidden = false;
  var t = mode === 'wrong' ? '暂无错题，继续保持' : mode === 'fav' ? '暂无收藏题目，刷题时点星标收藏' : '该题库暂无题目';
  pane.innerHTML = '<div class="empty" style="margin:auto">' + Shade.icon('check-circle', 44, '#2BA471')
    + '<p>' + t + '</p><button class="btn btn-sm" id="pvBack2">返回题库主页</button></div>';
}
function pvResultHtml(res, q) {
  var order = pv.shuffle[q.id];
  var answerText = res.answer || '';
  if (order && answerText) {
    answerText = answerText.split('').map(function (ol) {
      var di = order.indexOf(LETTERS.indexOf(ol));
      return di >= 0 ? LETTERS[di] : ol;
    }).sort().join('');
  }
  var yourText = (res.selected || []).slice().sort().join('');
  if (q.type === 'judge') {
    var jm = { A: '正确', B: '错误' };
    answerText = jm[answerText] || answerText;
    yourText = jm[yourText] || yourText;
  }
  var banner = '';
  var w = res.wrong || {};
  if (res.right) {
    if (w.removed) banner = '已移出错题本';
    else if (w.inBook && w.rightStreak > 0) banner = '再答对 ' + Math.max(3 - w.rightStreak, 0) + ' 次移出错题本';
  } else if (w.inBook !== false) banner = '已自动加入错题本';
  var st = res.stats || {};
  return '<div class="r-line"><div class="r-main"><span>正确答案<b class="ok">' + esc(answerText) + '</b></span>'
    + (yourText ? '<span>您的选择<b class="' + (res.right ? 'ok' : 'bad') + '">' + esc(yourText) + '</b></span>' : '') + '</div>'
    + (st.myTimes ? '<div class="r-sub">本人作答 ' + st.myTimes + ' 次 · 正确率 ' + st.myRightRate + '%</div>' : '')
    + (st.allTimes ? '<div class="r-sub">全员作答 ' + st.allTimes + ' 次 · 正确率 ' + st.allRightRate + '%</div>' : '')
    + (banner ? '<div class="r-sub orange">' + banner + '</div>' : '') + '</div>';
}
function pvAnalysisHtml(text) {
  return '<div class="pv-ana"><div class="hd">' + Shade.icon('lightbulb', 15) + '试题详解</div>'
    + '<div class="bd">' + (text ? esc(text) : '解析生成中，稍后可查看') + '</div>'
    + (text ? '<div class="ft">解析内容仅供参考</div>' : '') + '</div>';
}
function pvRender() {
  var pane = $('#panePractice');
  var total = pv.outline.length;
  var q = pvGetQ(pv.idx);
  if (!total || !q) {
    pane.innerHTML = '<div class="loading" style="margin:auto"><span class="spin"></span>题目加载中…</div>';
    return;
  }
  var bankName = '';
  (pv.banks || []).forEach(function (b) { if (b.id === pv.bankId) bankName = b.name; });
  var recite = pv.viewMode === 'recite';
  var res = pv.results[q.id];
  var type = q.type || 'single';
  var submitted = recite || !!res;
  var pct = total ? Math.min(100, Math.round(((pv.idx + 1) / total) * 100)) : 0;
  /* 选项乱序映射（展示位 i → 原选项下标）：仅答题模式、单/多选、开启设置且未答时新建；已答题保留 */
  var order = null;
  if (!recite && type !== 'judge') {
    if (pv.shuffle[q.id]) order = pv.shuffle[q.id];
    else if (pv.settings.shuffleOpt && !res) order = pv.shuffle[q.id] = pvShuffleIdx((q.options || []).length);
  }
  var checkSvg = Shade.icon('check', 13, '#fff');
  var closeSvg = Shade.icon('close', 13, '#fff');
  var optsHtml = (q.options || []).map(function (_, i) {
    var origIdx = order ? order[i] : i;
    var letter = LETTERS[i] || String(i + 1);
    var origLetter = LETTERS[origIdx] || letter;
    var text = q.options[origIdx];
    var cls = '', inner = letter;
    if (recite) {
      /* 背题：直接标出正确答案，其余普通 */
      if ((q.answer || '').indexOf(origLetter) >= 0) { cls = 'right'; inner = checkSvg; }
    } else if (!res) {
      if (pv.sel.indexOf(letter) >= 0) cls = 'sel';
    } else {
      /* 解析态：正确项统一绿勾，错选项红叉，其余普通 */
      var inAns = (res.answer || '').indexOf(origLetter) >= 0;
      var inSel = (res.selected || []).indexOf(letter) >= 0;
      if (inAns) { cls = 'right'; inner = checkSvg; }
      else if (inSel) { cls = 'wrong'; inner = closeSvg; }
    }
    return '<div class="pv-opt' + (type === 'multiple' ? ' sq' : '') + (cls ? ' ' + cls : '') + (submitted ? ' lock' : '')
      + '" data-l="' + letter + '"><span class="ab">' + inner + '</span><span class="tx">' + esc(text) + '</span></div>';
  }).join('');

  var mid = '';
  if (!recite && res) mid += pvResultHtml(res, q);
  if (submitted) mid += pvAnalysisHtml(recite ? (q.analysis || '') : ((res && res.analysis) || ''));

  var counts = pvCounts();
  var footMain = '';
  if (!recite && !submitted && type === 'multiple') {
    footMain = '<button class="btn btn-sm btn-primary" id="pvSubmit"' + (pv.sel.length ? '' : ' disabled') + '>提交答案</button>';
  } else if (submitted) {
    footMain = '<button class="btn btn-sm btn-primary" id="pvNext">' + (pv.idx >= total - 1 ? '完成' : '下一题') + '</button>';
  } else {
    footMain = '<span class="pv-hint">点选即判分 · ← → 方向键切题</span>';
  }

  pane.innerHTML = '<div class="pv-top">'
    + '<span class="pv-back" id="pvBack">' + Shade.icon('chevron-left', 15) + '题库主页</span>'
    + '<b class="pv-title">' + esc(bankName) + ' · ' + pvModeText(pv.mode) + '</b>'
    + '<span class="pv-vm" id="pvVm"><i data-v="answer" class="' + (recite ? '' : 'on') + '">答题</i><i data-v="recite" class="' + (recite ? 'on' : '') + '">背题</i></span>'
    + '<div class="pv-pg"><div class="progress"><i style="width:' + pct + '%"></i></div><b>' + (pv.idx + 1) + ' / ' + total + '</b></div>'
    + '</div>'
    + '<div class="pv-col" id="pvCol"><div class="pv-col-in">'
    + '<div class="card pv-stem"><span class="tag ' + (type === 'judge' ? 'tag-navy' : 'tag-orange') + '">' + pvTypeText(type) + '</span>' + esc(q.content || '') + '</div>'
    + optsHtml + mid
    + '</div></div>'
    + '<div class="pv-foot">'
    + '<button class="pv-chipbtn' + (pv.favs[q.id] ? ' faved' : '') + '" id="pvFav">' + Shade.icon('star', 13) + '收藏</button>'
    + '<span class="pv-chipbtn">' + Shade.icon('check', 12, '#2BA471') + counts.right + Shade.icon('close', 12, '#CF4444') + counts.wrong + '</span>'
    + '<button class="pv-chipbtn" id="pvSheet">' + Shade.icon('view-module', 13) + '答题卡 ' + counts.answered + '/' + total + '</button>'
    + '<button class="pv-chipbtn" id="pvSet">' + Shade.icon('setting', 13) + '设置</button>'
    + '<span class="sp">' + footMain + '</span>'
    + '</div>';
  var col = $('#pvCol');
  if (col) col.scrollTop = 0;
}
async function pvGo(idx) {
  if (idx < 0 || idx >= pv.outline.length) return;
  if (pv.autoTimer) { clearTimeout(pv.autoTimer); pv.autoTimer = 0; }
  try {
    await pvEnsureBatch(idx, false);
  } catch (e) { Shade.toast(e.message, 'error'); return; }
  if (!pvGetQ(idx)) { Shade.toast('题目加载失败，请重试', 'error'); return; }
  pv.idx = idx;
  pv.sel = [];
  /* seq 断点保存（大纲下标，0 起） */
  if (pv.mode === 'seq') localStorage.setItem('quiz_seq_' + pv.bankId, String(pv.idx));
  pvRender();
}

/* ---------- 刷题：作答 / 收藏 / 模式切换 ---------- */
function pvOnOpt(letter) {
  if (pv.viewMode === 'recite' || pv.submitting) return;
  var q = pvGetQ(pv.idx);
  if (!q || pv.results[q.id]) return;
  if (q.type === 'multiple') {
    /* 多选：勾选切换，底部「提交答案」判分 */
    var i = pv.sel.indexOf(letter);
    pv.sel = i >= 0 ? pv.sel.filter(function (l) { return l !== letter; }) : pv.sel.concat(letter);
    pvRender();
    return;
  }
  /* 单选/判断：点选即判分（短暂延时先呈现选中态再出结果） */
  pv.sel = [letter];
  pvRender();
  pv.submitting = true;
  setTimeout(function () {
    pvSubmit().finally(function () { pv.submitting = false; });
  }, 150);
}
async function pvSubmit() {
  var q = pvGetQ(pv.idx);
  if (!q || pv.results[q.id] || pv.viewMode === 'recite') return;
  /* 多选答案按字母序拼接（如 AC）；乱序题把展示字母映射回原始字母再提交 */
  var order = pv.shuffle[q.id];
  var answer = pv.sel.map(function (l) { return order ? LETTERS[order[LETTERS.indexOf(l)]] : l; }).sort().join('');
  if (!answer) return;
  try {
    var r = await Shade.api(API + '/practice/answer', { method: 'POST', body: { questionId: q.id, answer: answer } });
    var d = r.data || {};
    pv.results[q.id] = {
      selected: pv.sel.slice(),
      right: !!d.right,
      answer: d.answer || '',
      analysis: d.analysis || '',
      wrong: d.wrong || {},
      stats: d.stats || null
    };
    pv.myRight[q.id] = d.right ? 1 : 0; // 计数与答题卡着色数据源同步
    pv.sel = [];
    pvRender();
    if (d.wrong && d.wrong.removed) Shade.toast('已移出错题本', 'success');
    /* 答对自动下一题（设置开启；答错停留看解析；末尾题不自动） */
    if (pv.settings.autoNext && d.right && pv.idx < pv.outline.length - 1) {
      var qid = q.id;
      pv.autoTimer = setTimeout(function () {
        pv.autoTimer = 0;
        var cur = pvGetQ(pv.idx);
        if (cur && cur.id === qid) pvGo(pv.idx + 1); // 期间已手动切题则不自动
      }, 500);
    }
  } catch (e) { Shade.toast(e.message, 'error'); }
}
async function pvToggleFav() {
  if (pv.favBusy) return;
  var q = pvGetQ(pv.idx);
  if (!q) return;
  pv.favBusy = true;
  var was = pv.favs[q.id] ? 1 : 0;
  pv.favs[q.id] = was ? 0 : 1; // 先本地后请求，失败回滚
  pvRender();
  try {
    await Shade.api(API + '/favorites/' + q.id, { method: was ? 'DELETE' : 'POST' });
    Shade.toast(was ? '已取消收藏' : '已收藏', 'success');
  } catch (e) {
    pv.favs[q.id] = was;
    pvRender();
    Shade.toast(e.message, 'error');
  } finally { pv.favBusy = false; }
}
/* 答题 / 背题切换：两模式出参不同（背题带答案），批次缓存整体作废后按新模式重拉 */
async function pvSwitchView(v) {
  if (v === pv.viewMode) return;
  var old = pv.viewMode;
  var oldCache = pv.cache;
  pv.cache = {};
  pv.viewMode = v;
  try {
    await pvEnsureBatch(pv.idx, false);
  } catch (e) {
    pv.viewMode = old; pv.cache = oldCache;
    Shade.toast(e.message, 'error');
    return;
  }
  pv.sel = [];
  pvRender();
}

/* ---------- 刷题：答题卡弹层 / 清空做题记录 / 设置 ---------- */
function pvOpenSheet() {
  var recite = pv.viewMode === 'recite';
  var counts = pvCounts();
  var secs = [];
  ['single', 'multiple', 'judge'].forEach(function (t) {
    var items = [];
    pv.outline.forEach(function (o, i) {
      if ((o.type || 'single') !== t) return;
      var st = '';
      if (!recite) {
        var my = pv.myRight[o.id]; // 含历史恢复（seq/rand）与本 session 作答
        if (my !== undefined) st = my ? 'ok' : 'bad';
      }
      items.push('<div class="pv-chip' + (st ? ' ' + st : '') + (i === pv.idx ? ' cur' : '') + '" data-i="' + i + '">' + (i + 1) + '</div>');
    });
    if (items.length) {
      secs.push('<div class="f-label" style="margin:14px 0 8px;">' + pvTypeText(t) + '<span style="color:var(--ph); font-weight:600;">（' + items.length + ' 题）</span></div>'
        + '<div class="pv-sheet-grid">' + items.join('') + '</div>');
    }
  });
  var canReset = !recite && counts.answered > 0;
  var html = Shade.mHead('答题卡（已答 ' + counts.answered + '/' + pv.outline.length + '）')
    + '<div class="pv-legend"><span><i></i>未作答</span><span><i class="g"></i>答对</span><span><i class="r"></i>答错</span></div>'
    + secs.join('')
    + '<div class="pv-clear' + (canReset ? '' : ' disabled') + '" data-a="reset">清空做题记录（错题本保留）</div>';
  var inst = Shade.modal(html, { width: 680 });
  $$('.pv-chip', inst.box).forEach(function (c) {
    c.addEventListener('click', function () {
      var i = Number(c.dataset.i);
      inst.close();
      if (i !== pv.idx) pvGo(i);
    });
  });
  $('[data-a="reset"]', inst.box).addEventListener('click', function () {
    if (!canReset) return;
    inst.close();
    pvResetRecords();
  });
}
async function pvResetRecords() {
  var yes = await confirmAction({
    title: '清空做题记录？',
    content: '仅清空本题库的练习记录与进度，错题本保留。',
    confirmText: '确认清空', danger: true
  });
  if (!yes) return;
  try {
    await Shade.api(API + '/practice/reset', { method: 'POST', body: { bankId: pv.bankId } });
  } catch (e) { Shade.toast(e.message, 'error'); return; }
  /* 清空本地断点与已答状态（rand 大纲一并换新的随机序） */
  pv.cache = {}; pv.results = {}; pv.favs = {}; pv.shuffle = {}; pv.sel = [];
  pv.idx = 0;
  if (pv.mode === 'seq') localStorage.removeItem('quiz_seq_' + pv.bankId);
  try {
    await pvFetchOutline();
    if (!pv.outline.length) { pvShowEmpty(pv.mode); return; }
    await pvEnsureBatch(pv.idx, true);
    pvRender();
  } catch (e) { Shade.toast(e.message, 'error'); return; }
  Shade.toast('已清空做题记录', 'success');
}
function pvOpenSettings() {
  function row(key, title, desc) {
    return '<div class="pv-set-row"><div class="tx"><b>' + title + '</b><p>' + desc + '</p></div>'
      + '<span class="pv-sw' + (pv.settings[key] ? ' on' : '') + '" data-k="' + key + '"><i class="dot"></i></span></div>';
  }
  var html = Shade.mHead('刷题设置')
    + row('autoNext', '答对自动下一题', '答错停留看解析，末尾题不自动')
    + row('shuffleOpt', '选项乱序', '仅答题模式单选/多选未答题生效，已答题保留作答时显示');
  var inst = Shade.modal(html, { width: 440 });
  $$('.pv-sw', inst.box).forEach(function (sw) {
    sw.addEventListener('click', function () {
      var k = sw.dataset.k;
      pv.settings[k] = !pv.settings[k];
      sw.classList.toggle('on', pv.settings[k]);
      pvSaveSettings();
      /* 选项乱序关闭：清掉未答题的乱序映射（已答题保留，保证与其作答记录一致） */
      if (k === 'shuffleOpt' && !pv.settings[k]) {
        Object.keys(pv.shuffle).forEach(function (qid) {
          if (!pv.results[qid]) delete pv.shuffle[qid];
        });
        pv.sel = [];
      }
      if (pv.started && pv.outline.length && !$('#panePractice').hidden) pvRender();
    });
  });
}

/* ---------- 刷题：返回主页 / 选题库 / 题库池 ---------- */
function pvExit() {
  pv.started = false;
  if (pv.autoTimer) { clearTimeout(pv.autoTimer); pv.autoTimer = 0; }
  $('#panePractice').hidden = true;
  $('#paneBankHome').hidden = false;
  pvLoadBanks(true); // 进度已变，静默刷新左卡与主页
  pvLoadHome(true);
}
async function pvSelectBank(id) {
  var needExit = pv.started;
  pv.bankId = id;
  if (needExit) pvExit(); /* pvExit 会以新选中库静默刷新主页 */
  else pvLoadHome();
  pvRenderSide();
}
/* 题库池弹层：可见题库（全部池 + 生效班组池），添加 / 移出我的题库 */
async function pvOpenPool() {
  var r;
  try { r = await Shade.api(qz(API + '/banks/pool')); }
  catch (e) { Shade.toast(e.message, 'error'); return; }
  var list = (r.data && r.data.list) || [];
  var mine = {};
  (pv.banks || []).forEach(function (b) { mine[b.id] = 1; });
  var body = list.length ? list.map(function (b) {
    var added = mine[b.id] ? 1 : 0;
    return '<div class="imp-err" style="align-items:center; padding:11px 2px;"><div style="flex:1; min-width:0;">'
      + '<b style="font-size:13px; color:var(--navy); display:flex; align-items:center; gap:6px;">' + esc(b.name) + ' ' + scopeTag(b) + '</b>'
      + '<p style="font-size:11px; color:var(--sub); margin-top:2px;">' + b.questionCount + ' 题' + (b.description ? ' · ' + esc(b.description) : '') + '</p></div>'
      + '<button class="btn btn-sm ' + (added ? '' : 'btn-accent') + '" data-id="' + b.id + '" data-added="' + added + '">' + (added ? '移出' : '添加') + '</button></div>';
  }).join('') : '<div class="empty">' + Shade.icon('book', 40) + '<p>暂无可添加的题库</p></div>';
  var inst = Shade.modal(Shade.mHead('题库池')
    + '<div class="imp-err-tip">从班组池 / 全部池把题库添加进「我的题库」，移出保留练习记录与错题</div>' + body, { width: 520 });
  $$('button[data-id]', inst.box).forEach(function (btn) {
    btn.addEventListener('click', async function () {
      var id = Number(btn.dataset.id);
      btn.disabled = true;
      try {
        await Shade.api(qz(API + '/banks/' + id + '/join'), { method: btn.dataset.added === '1' ? 'DELETE' : 'POST' });
        await pvLoadBanks(true);
        btn.dataset.added = btn.dataset.added === '1' ? '0' : '1';
        btn.textContent = btn.dataset.added === '1' ? '移出' : '添加';
        btn.className = 'btn btn-sm ' + (btn.dataset.added === '1' ? '' : 'btn-accent');
        btn.disabled = false;
      } catch (e) {
        btn.disabled = false;
        Shade.toast(e.message, 'error');
      }
    });
  });
}

/* ---------- 刷题练习：事件绑定 ---------- */
function bindPracticeEvents() {
  /* 左卡：选题库 */
  $('#pvSideScroll').addEventListener('click', function (e) {
    var item = e.target.closest('.side-item[data-id]');
    if (!item) return;
    var id = Number(item.dataset.id);
    if (id !== pv.bankId) pvSelectBank(id);
  });
  $('#btnPool').addEventListener('click', pvOpenPool);
  /* 题库主页：四入口（0 题入口给提示，对齐小程序） */
  $('#paneBankHome').addEventListener('click', function (e) {
    var en = e.target.closest('.bh-entry[data-m]');
    if (!en) return;
    var m = en.dataset.m;
    var h = pv.home || {};
    if (m === 'seq' || m === 'rand') {
      if (!h.questionCount) { Shade.toast('该题库暂无题目', 'info'); return; }
      pvStart(m);
    } else if (m === 'wrong') {
      if (!h.wrongCount) { Shade.toast('暂无错题，继续保持', 'info'); return; }
      pvStart('wrong');
    } else if (m === 'fav') {
      if (!h.favCount) { Shade.toast('暂无收藏，刷题时点星标收藏题目', 'info'); return; }
      pvStart('fav');
    }
  });
  /* 刷题页：整 pane 每次重渲染，统一委托 */
  $('#panePractice').addEventListener('click', function (e) {
    if (e.target.closest('#pvBack') || e.target.closest('#pvBack2')) { pvExit(); return; }
    var vm = e.target.closest('#pvVm i');
    if (vm) { pvSwitchView(vm.dataset.v); return; }
    if (e.target.closest('#pvFav')) { pvToggleFav(); return; }
    if (e.target.closest('#pvSheet')) { pvOpenSheet(); return; }
    if (e.target.closest('#pvSet')) { pvOpenSettings(); return; }
    if (e.target.closest('#pvSubmit')) { pvSubmit(); return; }
    if (e.target.closest('#pvNext')) {
      if (pv.idx >= pv.outline.length - 1) pvExit();
      else pvGo(pv.idx + 1);
      return;
    }
    var opt = e.target.closest('.pv-opt');
    if (opt && !opt.classList.contains('lock')) pvOnOpt(opt.dataset.l);
  });
  /* 键盘：← → 切题（非刷题页签 / 弹层打开 / 输入焦点时不劫持） */
  document.addEventListener('keydown', function (e) {
    if (!pv.started || $('#wrapPractice').hidden || $('#panePractice').hidden) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
    if (document.querySelector('.mask.open')) return;
    if (e.key === 'ArrowLeft') pvGo(pv.idx - 1);
    else pvGo(pv.idx + 1);
  });
}

/* ================= 页签切换（刷题练习 / 题库管理） ================= */
var mgBooted = false;
function moveTabInd() {
  var on = $('#qzTabs button.on');
  var ind = $('#qzTabInd');
  if (!on) { ind.style.width = '0'; return; }
  ind.style.left = on.offsetLeft + 'px';
  ind.style.width = on.offsetWidth + 'px';
}
function switchTab(p) {
  $$('#qzTabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.p === p); });
  $('#wrapPractice').hidden = p !== 'practice';
  $('#wrapManage').hidden = p !== 'manage';
  moveTabInd();
  /* 管理数据首次切入才加载（普通用户无此页签） */
  if (p === 'manage' && !mgBooted) { mgBooted = true; boot(); }
}

/* ================= 初始化 ================= */
(function init() {
  /* 静态图标注入 */
  $('#btnNewBank').innerHTML = Shade.icon('add', 15);
  $('#btnQuickImport').innerHTML = Shade.icon('upload', 15);
  $('#btnPool').innerHTML = Shade.icon('compass', 15);
  $('#mgSearch').insertAdjacentHTML('afterbegin', Shade.icon('search', 15));
  /* 页签：题库管理仅管理角色可见；点击切换（文字 + 橙色滑动指示条） */
  if (state.isManager) $('#tabManage').hidden = false;
  $('#qzTabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-p]');
    if (!b || b.hidden) return;
    switchTab(b.dataset.p);
  });
  pvLoadSettings();
  bindPracticeEvents();
  bindEvents();
  pvLoadBanks();
  /* 超管班组切换器：数据源 GET /admin/teams（仅启用班组），localStorage.quiz_team_id 持久化，切换后管理数据重载；
     题库池弹层请求随生效班组（qz()），练习数据为个人口径不受影响 */
  if (state.role === 'admin') {
    Shade.setupTeamSel({
      select: $('#teamSel'), dropdown: teamDd, storageKey: 'quiz_team_id',
      showEl: $('#sideTeam'),
      onChange: function (v) { state.teamId = v; reloadTeamData(); }
    }).then(function (ts) { if (ts) state.teamId = ts.getTeamId(); });
  }
  requestAnimationFrame(moveTabInd);
  window.addEventListener('resize', moveTabInd);
})();
})();
</script>
