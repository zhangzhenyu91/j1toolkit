<!doctype html>
<!-- Shade 壹匣 · 树障隐患记录网页版（「政企蓝白」token；骨架同 worklog.html：100vh 锁高 + 悬浮卡片 + 页签内部滚动）
     功能：看板四格（未处理 / 本周新增 / 垂直距离≤阈值未处理 / 已处理，仅记录页签一级「线路视图」顶部展示）
     + 记录页签两级导航——一级线路视图（顶部搜索框输入即过滤线路名/电压等级 + 线路大卡片网格：标题「110kV 孝西线」
     + 未处理 n（品牌蓝）+ 垂直距离≤阈值「要紧」m（>0 红字、=0 灰字，无阈值不显；两项均 0 时计数整体置灰）+ 总数灰字；
     排序 要紧降 > 未处理降 > 电压等级数值降 > 线路名 zh-CN 升序，「未匹配线路」伪组卡恒排尾；线路卡 stagger 上浮入场，点卡进二级）
     / 二级台账视图（← 返回线路 + 线路标题计数 + 扁平完整记录卡片流，批量处理开关在本级工具条，视图切换 fade+slide）；
     导出走右下角全局悬浮按钮（FAB 弹层：范围 全部线路 / 当前线路（一级视图为「选择线路」下拉）+ 按线路分表 split=1 勾选，
     预览 /export/preview 经 Shade.openPreviewUrl 打开、下载 apiRaw + saveBlob，分线路带 ?line=）+ 记录 / 暂存区 / 冲突三页签；
     台账记录卡片扁平展示（无详情弹层分级，顺序后端已排好：未处理在前已处理在后 > 区段升序）：默认折叠态一卡两行——
     标题行 区段 + 垂距双大字同级、左对齐（垂距 ≤ 阈值红显）+ 状态点标（未处理橙·已处理绿，处理后整卡降饱和过渡）
     + 卡内折叠/展开开关（点卡非交互区同效），次级行 树种×数量 / 水平距离 / 发现时间（found_at 空则省略）；辅证照片条折叠态即展示（有图才渲染、只读，
     点图进大图查看器）；展开态另出全字段网格（垂直超阈值红底突出）
     + 已处理信息 + 处理前/后照片两区（可上传可删，缩略图进大图查看器）
     + 卡内 处理（未处理）/ 删除（班管·超管）按钮，操作后随 loadRecords 同步重绘（折叠只藏展开区块，摘要与辅证条常驻）；
     支持批量勾选批量处理（批量模式下点卡 = 勾选）；暂存区 / 冲突页签与阈值设置 / 同步至内网仅超管·班组管理员可见（服务端 requireDictAdmin 同拦）；
     班组隔离：超管页头班组切换下拉（localStorage.treehazard_team_id，全部 /treehazard/* 请求统一带 team_id，见 th()），
     非超管固定本班、未分配班组整页空态（屏十口径）；API 直连主平台 /api/v1/treehazard/*（Bearer token 经 Shade.api） -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>树障隐患记录 · Shade 壹匣</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/theme.css" />
    <style>
      /* ============================================================
     树障隐患记录页内样式 ·「政企蓝白」（色板全部走 theme.css 变量，骨架口径同 worklog）
     ============================================================ */
      /* ===== 整页不滚动：仅页签内容区内部滚动（body 锁定 100vh，主内容 flex 撑满剩余视口） ===== */
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* theme.css 的 .page 带 margin:0 auto，flex 容器内显式 width:100% 恢复满宽（同 worklog 口径） */
      .page {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        padding-bottom: 24px;
      }
      .th-wrap {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .th-wrap [hidden] {
        display: none !important;
      } /* author display 规则优先于 UA [hidden]，显式兜底 */

      /* ===== 入场关键帧：k-fade / k-rise 共享自 theme.css（一次上浮/淡入后静止） ===== */
      /* 线路 ↔ 台账视图切换：内容整体 fade + slide（renderRecords 重渲染时由 JS 挂 .view-in 触发） */
      .view-in {
        animation: k-rise 0.34s var(--ease);
      }

      /* ===== 页头：标题 + 副标；右侧操作区（班组切换） ===== */
      .th-head {
        flex: none;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 14px 24px;
        flex-wrap: wrap;
      }
      .th-head .section-title {
        display: block;
        margin: 0;
      }
      .th-kick {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
        color: var(--orange);
        animation: k-fade 0.5s var(--ease) 0.06s both;
      }
      .th-head .section-title h3 {
        margin-top: 6px;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 1px;
        animation: k-fade 0.55s var(--ease) 0.12s both;
      }
      .th-head .section-title .more {
        display: block;
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--sub);
        letter-spacing: 0.5px;
        animation: k-fade 0.55s var(--ease) 0.2s both;
      }
      .th-head .acts {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        animation: k-fade 0.55s var(--ease) 0.28s both;
      }

      /* ===== 看板四格卡（白卡 + tabular-nums） ===== */
      .th-dash {
        flex: none;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-top: 16px;
        animation: k-fade 0.55s var(--ease) 0.3s both;
      }
      @media (max-width: 900px) {
        .th-dash {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .dc {
        padding: 16px 20px 14px;
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .dc-n {
        font-size: 26px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .dc-n.blue {
        color: var(--orange);
      }
      .dc-n.red {
        color: var(--red);
      }
      .dc-n.green {
        color: var(--green);
      }
      .dc-n.mut {
        font-size: 14px;
        color: var(--ph);
        font-weight: 600;
        letter-spacing: 1px;
      }
      .dc-n.zero {
        color: var(--ph);
      } /* 要紧类计数为 0：不标红，弱化为辅助灰（仅 >0 才红显） */
      .dc-t {
        font-size: 12px;
        color: var(--sub);
        letter-spacing: 0.5px;
      }
      /* 班管/超管待办小字入口（暂存 / 冲突角标同源 dashboard 计数） */
      .dash-todo {
        grid-column: 1 / -1;
        margin-top: -4px;
        font-size: 12px;
        color: var(--sub);
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dash-todo > svg {
        width: 14px;
        height: 14px;
        color: var(--yellow);
        flex: none;
      }
      .dash-todo a {
        font-weight: 700;
        cursor: pointer;
      }

      /* ===== 工具行：阈值设置 / 同步至内网（仅管理角色可见，非管理角色整行隐藏） ===== */
      .th-tools {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
        animation: k-fade 0.55s var(--ease) 0.36s both;
      }
      .sync-hint {
        font-size: 11.5px;
        color: var(--ph);
        letter-spacing: 0.5px;
      }

      /* ===== 记录页签一级「线路视图」：搜索框 + 线路大卡片网格 ===== */
      .rec-bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .rec-bar .spring {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .rec-search {
        flex: 1;
        min-width: 220px;
        max-width: 420px;
        height: 36px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--fill);
        border-radius: 8px;
      }
      .rec-search svg {
        flex: none;
        width: 15px;
        height: 15px;
        color: var(--ph);
      }
      .rec-search input {
        flex: 1;
        min-width: 0;
        border: none;
        background: transparent;
        outline: none;
        font-size: 13px;
        color: var(--navy);
        font-family: inherit;
        letter-spacing: 0.5px;
      }
      .lc-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
        padding-bottom: 64px;
      }
      .lc {
        padding: 18px 20px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        transition:
          transform 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
        animation: k-rise 0.5s var(--ease) both; /* 编排式上浮入场，逐卡时延链由行内 animation-delay 给出（≤0.9s） */
      }
      .lc:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }
      .lc-main {
        flex: 1;
        min-width: 0;
      }
      .lc-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .lc-stats {
        margin-top: 10px;
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
      .lc-stats b {
        margin-left: 3px;
        font-size: 17px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .lc-unh,
      .lc-unh b {
        color: var(--orange);
      } /* 未处理：品牌蓝（#0E3DA8，克制不刺眼） */
      .lc-key,
      .lc-key b {
        color: var(--red);
      } /* 要紧：未处理且垂直距离 ≤ 阈值 */
      .lc-total {
        color: var(--ph);
      }
      .lc-clear .lc-unh,
      .lc-clear .lc-unh b,
      .lc-clear .lc-key,
      .lc-clear .lc-key b {
        color: var(--ph);
      } /* 未处理与要紧均为 0：计数整体置灰 */
      .lc-go {
        flex: none;
        display: flex;
        color: var(--ph);
      }
      .lc-go svg {
        width: 16px;
        height: 16px;
      }

      /* ===== 记录页签二级「台账视图」顶栏：返回 + 线路标题 + 计数小字 + 批量开关 ===== */
      .ledger-title {
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .ledger-sub {
        font-size: 12px;
        color: var(--ph);
        letter-spacing: 0.5px;
        font-variant-numeric: tabular-nums;
      }
      .ledger-sub .ls-unh {
        color: var(--orange);
      } /* 未处理>0：品牌蓝（与线路卡同口径，不亮眼） */
      .ledger-sub .ls-key {
        color: var(--red);
      } /* 要紧>0：危险红 */
      #recBody {
        padding-bottom: 64px;
      } /* 底部内容给右下角 FAB 留位 */

      /* ===== 导出 FAB（右下角悬浮圆形品牌蓝，点击弹层选范围/分表） ===== */
      .fab {
        position: fixed;
        right: 28px;
        bottom: 28px;
        z-index: 110;
        width: 52px;
        height: 52px;
        border: none;
        border-radius: 50%;
        background: var(--orange);
        color: var(--on-brand);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(14, 61, 168, 0.32);
        transition:
          transform 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      .fab:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 26px rgba(14, 61, 168, 0.4);
      }
      .fab svg {
        width: 22px;
        height: 22px;
      }
      .fab[hidden] {
        display: none !important;
      } /* author display:flex 优先于 UA [hidden]，显式兜底（同 .th-wrap 口径） */

      /* ===== 导出弹层：范围单选 / 分表勾选 ===== */
      .ex-opt {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        font-size: 13px;
        color: var(--navy);
        letter-spacing: 0.5px;
        cursor: pointer;
      }
      .ex-opt input {
        width: 15px;
        height: 15px;
        accent-color: var(--orange);
        cursor: pointer;
        flex: none;
      }
      .ex-opt.dis {
        color: var(--ph);
        cursor: not-allowed;
      }
      .ex-opt.dis input {
        cursor: not-allowed;
      }

      /* ===== 三页签：下划线式页签，激活蓝字 + 2px 蓝条（同 worklog wl-tabs 口径；角标红胶囊） ===== */
      .th-tabs {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 14px;
        border-bottom: 1px solid var(--line);
        animation: k-fade 0.55s var(--ease) 0.4s both;
      }
      .th-tabs button {
        position: relative;
        padding: 9px 14px;
        border: none;
        background: transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        letter-spacing: 0.5px;
        transition: color 0.15s;
      }
      .th-tabs button:hover {
        color: var(--navy);
      }
      .th-tabs button.on {
        color: var(--orange);
      }
      .th-tabs button.on::after {
        content: '';
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: -1px;
        height: 2px;
        background: var(--orange);
        border-radius: 2px;
      }
      .th-tabs button svg {
        width: 15px;
        height: 15px;
      }
      .th-tabs button[hidden] {
        display: none !important;
      }
      .bdg {
        min-width: 17px;
        height: 17px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--red);
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        line-height: 17px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .th-tab-ind {
        display: none;
      } /* 滑动指示条按稿弃用（激活态已由蓝字 + 蓝条表达）；节点保留供 Shade.moveTabInd 写值 */

      /* ===== 主体：三页签共用列表位，内容各自内部滚动 ===== */
      .th-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        margin-top: 14px;
      }
      .th-body .pane {
        display: none;
        flex: 1;
        min-height: 0;
      }
      .th-body .pane.on {
        display: flex;
        flex-direction: column;
        animation: paneIn 0.34s var(--ease);
      }
      .pane-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-right: 10px;
        scrollbar-gutter: stable;
        scrollbar-width: thin;
        scrollbar-color: rgba(29, 33, 41, 0.2) transparent;
      }
      .pane-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .pane-scroll::-webkit-scrollbar-thumb {
        background: rgba(29, 33, 41, 0.16);
        border-radius: 8px;
      }
      .pane-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(29, 33, 41, 0.34);
      }
      .pane-scroll::-webkit-scrollbar-track {
        background: transparent;
      }

      .linkbtn {
        border: none;
        background: transparent;
        color: var(--orange);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 8px;
        transition: background 0.2s;
      }
      .linkbtn:hover {
        background: var(--orange-soft);
      }
      .linkbtn.dgr {
        color: var(--red);
      }
      .linkbtn.dgr:hover {
        background: var(--danger-soft);
      }

      /* ===== 记录页签二级「台账视图」：扁平完整隐患卡片（全字段 + 照片三区 + 卡内操作，无详情弹层分级） ===== */
      .rec {
        margin-bottom: 14px;
        padding: 15px 22px;
        position: relative;
        transition:
          transform 0.18s var(--ease),
          box-shadow 0.18s var(--ease),
          opacity 0.3s var(--ease);
      }
      .rec:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }
      .rec.done {
        opacity: 0.62;
      } /* 已处理卡整体降饱和（处理后随刷新过渡至此态） */
      .rec {
        cursor: pointer;
      } /* 点卡（非交互区）= 折叠/展开（与卡内开关同效，批量模式 = 勾选） */
      /* 辅证照片条：折叠态即展示（有图才渲染，只读），位于次级行与展开区之间 */
      .rec-evi {
        margin-top: 10px;
      }
      .rec-top {
        display: flex;
        align-items: baseline;
        gap: 12px 16px;
        flex-wrap: wrap;
      }
      .rec-sec {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      /* 垂直距离与区段同级双大字（浏览主看这两项）；≤ 阈值红显 */
      .rec-vert {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--navy);
        font-variant-numeric: tabular-nums;
      }
      .rec-vert.danger {
        color: var(--red);
      }
      /* 次级字段行：树种×数量 / 水平距离 / 发现时间 */
      .rec-subline {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .rec-sub {
        font-size: 13px;
        font-weight: 600;
        color: var(--navy);
        letter-spacing: 0.5px;
      }
      .rec-dist {
        font-size: 13px;
        color: var(--sub);
        letter-spacing: 0.5px;
        font-variant-numeric: tabular-nums;
      }
      /* 状态点标：圆点 + 文字（未处理橙 / 已处理绿） */
      .rec-tag {
        margin-left: auto;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .rec-tag::before {
        content: '';
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      .rec-tag.un {
        background: var(--warn-soft);
        color: var(--warn-text);
      }
      .rec-tag.un::before {
        background: var(--yellow);
      }
      .rec-tag.ok {
        background: var(--ok-soft);
        color: var(--ok-text);
      }
      .rec-tag.ok::before {
        background: var(--ok-text);
      }
      /* 批量勾选框（批量模式才渲染；已处理卡为禁用态） */
      .rec-ck {
        flex: none;
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: 1.5px solid var(--dash);
        background: var(--card);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: transparent;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .rec-ck svg {
        width: 12px;
        height: 12px;
      }
      .rec-ck:hover {
        border-color: var(--orange);
      }
      .rec-ck.on {
        border-color: var(--orange);
        background: var(--orange);
        color: var(--on-brand);
      }
      .rec-ck.dis {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .rec-ck.dis:hover {
        border-color: var(--dash);
      }
      /* 卡片内操作行：删除（班管/超管）居左，处理（未处理）居右 */
      .rec-acts {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
      }
      /* 折叠/展开开关（标题行右端，每卡一枚）：折叠态整卡只留 区段/垂距/树种×数量/水平距离/发现时间 两行摘要，其余整块隐藏 */
      .rec-fold {
        flex: none;
        width: 26px;
        height: 26px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--ph);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .rec-fold:hover {
        color: var(--orange);
        border-color: var(--orange);
      }
      .rec-fold svg {
        width: 13px;
        height: 13px;
        transition: transform 0.2s var(--ease);
      }
      .rec:not(.fold) .rec-fold svg {
        transform: rotate(180deg);
      } /* 展开态旋 180°，图标固定 chevron-down 不换名 */
      /* 折叠：隐藏其他信息 / 照片 / 操作按钮（grid 0fr→1fr 高度过渡 + 淡入，同 worklog combo-list 口径；.rec-more-in 为折叠必需内层） */
      .rec-more {
        display: grid;
        grid-template-rows: 1fr;
        opacity: 1;
        transition:
          grid-template-rows 0.28s var(--ease),
          opacity 0.22s ease,
          margin-top 0.28s var(--ease);
      }
      .rec.fold .rec-more {
        grid-template-rows: 0fr;
        opacity: 0;
      }
      .rec-more-in {
        min-height: 0;
        overflow: hidden;
      }
      /* 卡片内信息行：紧凑行式字段流（标签小灰字 + 值同行内联），宽屏一行、窄屏两行自适应 */
      .rf-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        margin-top: 8px;
      }
      .rf {
        font-size: 12.5px;
        color: var(--navy);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .rf i {
        font-style: normal;
        color: var(--ph);
        margin-right: 4px;
      }
      /* 卡片内已处理信息行（绿点 + 处理人/处理情况/处理时间） */
      .rec-handled {
        margin-top: 12px;
        padding: 9px 12px;
        border-radius: 8px;
        background: var(--ok-soft);
        display: flex;
        align-items: center;
        gap: 8px 14px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--ok-text);
        letter-spacing: 0.5px;
      }
      .rec-handled::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        flex: none;
      }
      .rec-handled b {
        font-weight: 700;
      }
      /* 卡片内照片三区：辅证（只读，有图才显示）/ 处理前 / 处理后横向分区（窄屏自动换列），缩略图网格（参考出工日志：圆角无描边） */
      .ph-zones {
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
      }
      .ph-zhead {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--sub);
        letter-spacing: 1px;
      }
      .ph-add {
        margin-left: auto;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--orange);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .ph-add:hover {
        border-color: var(--orange);
        background: var(--orange-soft);
      }
      .ph-add svg {
        width: 12px;
        height: 12px;
      }
      .ph-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }
      .ph {
        position: relative;
        height: 88px;
        border-radius: 8px;
        overflow: hidden;
        cursor: zoom-in;
        background: var(--fill);
      }
      .ph img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .ph-x {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 20px;
        height: 20px;
        border-radius: 6px;
        border: none;
        background: rgba(29, 33, 41, 0.72);
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .ph:hover .ph-x {
        opacity: 1;
      }
      .ph-x svg {
        width: 10px;
        height: 10px;
      }
      .ph-none {
        grid-column: 1 / -1;
        font-size: 11.5px;
        color: var(--ph);
        letter-spacing: 0.5px;
        padding: 8px 0;
      }

      /* ===== 暂存区页签：批次卡 + 批次详情（inline 编辑表格） ===== */
      .stg-card {
        margin-bottom: 14px;
        padding: 16px 22px;
        cursor: pointer;
        transition:
          transform 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      .stg-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }
      .stg-top {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .stg-top b {
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .stg-meta {
        font-size: 12px;
        color: var(--ph);
        letter-spacing: 0.5px;
        font-variant-numeric: tabular-nums;
      }
      .stg-go {
        margin-left: auto;
        font-size: 12px;
        font-weight: 700;
        color: var(--orange);
      }
      /* 审核备注：浅底 + 左色条警示块（直角，同「政企蓝白」警示信息块族） */
      .stg-note {
        margin-top: 10px;
        padding: 9px 12px;
        background: var(--warn-soft);
        border-left: 4px solid var(--yellow);
        font-size: 12.5px;
        color: var(--sub);
        line-height: 1.7;
        letter-spacing: 0.5px;
      }
      .stg-note b {
        color: var(--navy);
      }
      .stg-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .stg-bar .back {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .stg-bar .spring {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .stg-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .stg-title small {
        margin-left: 8px;
        font-size: 11.5px;
        color: var(--ph);
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }
      /* 批次详情表格：15 业务列 inline 输入，横向滚动 */
      .stg-table {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        scrollbar-width: thin;
      }
      .stg-tb {
        border-collapse: collapse;
        min-width: 1680px;
        width: 100%;
      }
      .stg-tb th,
      .stg-tb td {
        padding: 7px 8px;
        border-bottom: 1px solid var(--hair);
        font-size: 12px;
        text-align: left;
        white-space: nowrap;
      }
      .stg-tb th {
        position: sticky;
        top: 0;
        background: var(--fill);
        font-size: 11px;
        font-weight: 700;
        color: var(--sub);
        letter-spacing: 0.5px;
        z-index: 1;
      }
      .stg-tb tr:last-child td {
        border-bottom: none;
      }
      .stg-in {
        width: 92px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 8px;
        font-size: 12px;
        color: var(--navy);
        font-family: inherit;
        outline: none;
        background: var(--card);
        transition: border-color 0.15s;
      }
      .stg-in:focus {
        border-color: var(--orange);
      }
      .stg-in.w-line {
        width: 130px;
      }
      .stg-in.w-note {
        width: 120px;
      }
      .stg-in[type='date'] {
        width: 128px;
      }
      .stg-ck {
        width: 16px;
        height: 16px;
        accent-color: var(--orange);
        cursor: pointer;
      }

      /* ===== 冲突页签：对照卡（系统值 | 内网值，差异字段标红） ===== */
      .cft {
        margin-bottom: 16px;
        padding: 16px 22px;
      }
      .cft-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .cft-head b {
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .cft-head .cft-time {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--ph);
        letter-spacing: 0.5px;
        font-variant-numeric: tabular-nums;
      }
      .cft-cmp {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 12px;
      }
      @media (max-width: 1000px) {
        .cft-cmp {
          grid-template-columns: 1fr;
        }
      }
      .cft-col {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .cft-col-h {
        padding: 9px 14px;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 1px;
        background: var(--fill);
        border-bottom: 1px solid var(--line);
      }
      .cft-rows {
        padding: 4px 14px 10px;
      }
      .cft-r {
        display: flex;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px dashed var(--hair);
        font-size: 12.5px;
      }
      .cft-r:last-child {
        border-bottom: none;
      }
      .cft-r .k {
        flex: none;
        width: 84px;
        color: var(--ph);
        letter-spacing: 1px;
      }
      .cft-r .v {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        word-break: break-all;
        font-variant-numeric: tabular-nums;
      }
      .cft-r .v.df {
        color: var(--red);
        font-weight: 700;
      }
      .cft-acts {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
      }

      /* ===== 批量处理底部悬浮条 ===== */
      .batch-bar {
        position: fixed;
        left: 50%;
        bottom: 56px;
        transform: translateX(-50%);
        z-index: 120;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 12px 10px 20px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        box-shadow: var(--shadow-hover);
        animation: k-fade 0.3s var(--ease) both;
      }
      .batch-bar[hidden] {
        display: none !important;
      } /* author display:flex 优先于 UA [hidden]，显式兜底（同 .th-wrap 口径） */
      .batch-bar .bc {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.5px;
        font-variant-numeric: tabular-nums;
      }

      /* ===== 大图遮罩层（Lightbox：照片查看，Esc / 点击遮罩关闭，← → 切换；z-index 高于弹层 .mask(320)，从卡片照片上直接打开） ===== */
      .lb {
        position: fixed;
        inset: 0;
        z-index: 340;
        padding: 36px;
        background: rgba(29, 33, 41, 0.85);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .lb.open {
        opacity: 1;
        pointer-events: auto;
      }
      .lb-stage {
        position: relative;
        max-width: min(78vw, 1080px);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lb-img {
        max-width: 100%;
        max-height: 84vh;
        border-radius: 8px;
        border: 2px solid var(--paper);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .lb-count {
        position: absolute;
        bottom: -30px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.8);
        font-size: 12px;
        letter-spacing: 2px;
        font-variant-numeric: tabular-nums;
      }
      .lb-x,
      .lb-arrow {
        position: absolute;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--navy);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--hard-s);
        transition:
          transform 0.15s var(--ease),
          box-shadow 0.15s var(--ease);
      }
      .lb-x:hover,
      .lb-arrow:hover {
        transform: translate(2px, 2px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .lb-x {
        top: 18px;
        right: 18px;
        width: 38px;
        height: 38px;
      }
      .lb-x svg {
        width: 17px;
        height: 17px;
      }
      .lb-arrow {
        top: 50%;
        translate: 0 -50%;
        width: 42px;
        height: 42px;
      }
      .lb-arrow:hover {
        transform: none;
      }
      .lb-arrow svg {
        width: 18px;
        height: 18px;
      }
      .lb-arrow.l {
        left: 14px;
      }
      .lb-arrow.r {
        right: 14px;
      }

      /* ===== 通用弹层（处理 / 阈值设置；结构 .mask>.modal>.m-scroll，Shade.modal 注入） ===== */
      .mask {
        position: fixed;
        inset: 0;
        z-index: 320;
        padding: 24px;
        background: var(--overlay);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .mask.open {
        opacity: 1;
      }
      .modal {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        width: 560px;
        max-width: 94vw;
        max-height: 86vh;
        overflow: hidden;
        padding: 6px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        transform: translateY(16px) scale(0.98);
        transition: transform 0.35s var(--ease);
      }
      .m-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        border-radius: 8px;
        padding: 14px 18px 16px;
        scrollbar-gutter: stable both-edges;
        scrollbar-width: thin;
        scrollbar-color: rgba(29, 33, 41, 0.2) transparent;
      }
      .m-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .m-scroll::-webkit-scrollbar-thumb {
        background: rgba(29, 33, 41, 0.16);
        border-radius: 8px;
      }
      .m-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(29, 33, 41, 0.34);
      }
      .m-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .mask.open .modal {
        transform: none;
      }
      .m-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .m-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .m-x {
        margin-left: auto;
        width: 30px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--navy);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .m-x:hover {
        background: var(--inverse-bg);
        color: var(--inverse-text);
      }
      .m-x svg {
        width: 14px;
        height: 14px;
      }
      .m-foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }

      /* ===== 弹层表单（f-lab / f-sel / f-ta / chips 快捷胶囊，口径同 worklog 编辑弹层） ===== */
      .f-lab {
        display: block;
        font-size: 12px;
        color: var(--ph);
        letter-spacing: 1px;
        margin: 14px 0 7px;
      }
      .f-lab:first-of-type {
        margin-top: 2px;
      }
      .f-sel,
      .f-ta {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        outline: none;
        font-size: 13px;
        color: var(--navy);
        font-family: inherit;
        transition:
          border-color 0.15s var(--ease),
          box-shadow 0.15s var(--ease);
      }
      .f-sel {
        height: 40px;
        padding: 0 10px;
      }
      .f-sel:focus,
      .f-ta:focus {
        border-color: var(--orange);
        box-shadow: var(--hard-s);
      }
      .f-ta {
        min-height: 96px;
        padding: 10px 12px;
        line-height: 1.7;
        resize: vertical;
      }
      .f-hint {
        margin-top: 6px;
        font-size: 11px;
        color: var(--ph);
        letter-spacing: 0.5px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--navy);
        font-size: 12.5px;
        padding: 4px 13px;
        cursor: pointer;
        font-family: inherit;
        transition:
          border-color 0.2s,
          color 0.2s,
          background 0.2s;
      }
      .chip:hover {
        border-color: var(--orange);
        color: var(--orange);
      }

      /* ===== 动效降级 ===== */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001s !important;
        }
        .rec-more {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="th-wrap">
        <!-- 页头：标题 + 副标；右侧班组切换（仅超管可见，Shade.setupTeamSel 装配） -->
        <div class="th-head">
          <div class="section-title">
            <span class="th-kick">TREE HAZARD</span>
            <h3>树障隐患记录</h3>
            <span class="more">树木排查隐患的登记、处理与统计</span>
          </div>
          <div class="acts">
            <select id="teamSel"></select>
          </div>
        </div>

        <!-- 看板四格卡 + 管理待办入口 -->
        <div class="th-dash" id="dash">
          <div class="card dc">
            <span class="dc-n blue" id="dUnh">—</span><span class="dc-t">未处理</span>
          </div>
          <div class="card dc">
            <span class="dc-n" id="dWeek">—</span><span class="dc-t">本周新增</span>
          </div>
          <div class="card dc">
            <span class="dc-n red" id="dOver">—</span
            ><span class="dc-t" id="dOverLab">垂直距离≤阈值未处理</span>
          </div>
          <div class="card dc">
            <span class="dc-n green" id="dHand">—</span><span class="dc-t">已处理</span>
          </div>
          <div class="dash-todo" id="dashTodo" hidden></div>
        </div>

        <!-- 工具行：阈值设置 / 同步至内网 / 同步知识库（仅管理角色可见，非管理角色整行隐藏；导出统一走右下角 FAB） -->
        <div class="th-tools" hidden>
          <button class="btn btn-sm" id="btnThreshold" hidden>阈值设置</button>
          <button class="btn btn-sm" id="btnSync" hidden>同步至内网</button>
          <button class="btn btn-sm" id="btnWxSync" hidden>同步知识库</button>
          <span class="sync-hint" id="syncHint" hidden></span>
        </div>

        <!-- 页签：记录 / 暂存区（管理）/ 冲突（管理） -->
        <div class="th-tabs" id="thTabs">
          <button data-p="records" class="on">记录</button>
          <button data-p="staging" id="tabStaging" hidden>
            暂存区 <span class="bdg" id="bdgStaging" hidden></span>
          </button>
          <button data-p="conflicts" id="tabConflicts" hidden>
            冲突 <span class="bdg" id="bdgConflicts" hidden></span>
          </button>
          <span class="th-tab-ind" id="thTabInd"></span>
        </div>

        <!-- 页签主体 -->
        <div class="th-body">
          <div class="pane on" id="paneRecords">
            <!-- 一级「线路视图」顶栏：搜索框（输入即过滤线路名/电压等级） -->
            <div class="rec-bar" id="recBarLines">
              <label class="rec-search" id="recSearchBox">
                <input
                  id="recSearch"
                  maxlength="32"
                  autocomplete="off"
                  placeholder="搜索线路名称 / 电压等级"
                />
              </label>
            </div>
            <!-- 二级「台账视图」顶栏：返回 + 线路标题与计数 + 批量处理开关（仅本视图可用） -->
            <div class="rec-bar" id="recBarLedger" hidden>
              <button class="btn btn-sm" id="btnBackLines">返回线路</button>
              <span class="ledger-title" id="ledgerTitle"></span>
              <span class="ledger-sub" id="ledgerSub"></span>
              <span class="spring">
                <button class="btn btn-sm" id="btnBatch">批量处理</button>
              </span>
            </div>
            <div class="pane-scroll" id="recBody"></div>
          </div>
          <div class="pane" id="paneStaging"><div class="pane-scroll" id="stgBody"></div></div>
          <div class="pane" id="paneConflicts"><div class="pane-scroll" id="cftBody"></div></div>
        </div>
      </div>
    </main>

    <!-- 未分配班组整页空态（Shade.renderNoTeam 填充） -->
    <div id="noTeam" hidden></div>

    <!-- 照片上传：隐藏文件选择（accept image/*，选后 canvas 重绘为 jpeg dataURL 上传） -->
    <input type="file" id="photoInput" accept="image/*" multiple hidden />

    <!-- 照片大图遮罩层 -->
    <div class="lb" id="lightbox"></div>

    <!-- 批量处理底部悬浮条 -->
    <div class="batch-bar" id="batchBar" hidden>
      <span class="bc" id="batchCnt">已选 0 条</span>
      <button class="btn btn-sm btn-primary" id="batchGo">批量处理</button>
      <button class="btn btn-sm" id="batchCancel">退出</button>
    </div>

    <!-- 导出 FAB（右下角悬浮圆形品牌蓝；点击弹层选导出范围 / 按线路分表，再预览或下载） -->
    <button class="fab" id="fabExport" title="导出统计表"></button>

    <script src="/assets/icons.js"></script>
    <script src="/assets/common.js"></script>
    <script>
      /* ============================================================
   树障隐患记录网页版：看板 / 记录两级导航（线路大卡 → 线路台账）/ 导出 FAB（范围 + 按线路分表）/ 记录·暂存区·冲突三页签
   （暂存区·冲突·阈值设置·同步至内网仅超管 / 班组管理员可见可用，服务端 requireDictAdmin 同拦；
   记录处理与照片上传全员可用，照片删除限上传者本人或班管/超管；接口 /api/v1/treehazard/* 按生效班组隔离）
   ============================================================ */
      (function () {
        'use strict';
        Shade.requireAuth();
        /* 统一左侧图标导航栏（当前应用：树障隐患记录） */
        Shade.topbar({ active: 'treehazard' });

        /* ================= 工具 ================= */
        var $ = Shade.$,
          $$ = Shade.$$;
        var esc = Shade.esc;
        var me = Shade.user() || {};
        /* 超管 / 班组管理员（暂存区·冲突·阈值·同步·删记录等管理类入口的可见性口径） */
        var isManager = me.role === 'admin' || me.role === 'team_admin';

        /* 卡片紧凑信息行字段（区段/垂距在标题行，树种×数量/水平距离/发现时间在次级行，不重复占位；空值字段跳过） */
        var COMPACT_FIELDS = [
          ['position_note', '位置备注'],
          ['diameter', '直径(cm)'],
          ['dist_small', '距小号(m)'],
          ['dist_big', '距大号(m)'],
          ['finder_name', '发现人'],
        ];
        /* 15 业务列（发现 12 列 + 处理 3 列）：暂存区编辑与冲突对照共用（key 与后端列名一致） */
        var BIZ_FIELDS = [
          ['voltage_level', '电压等级'],
          ['line_name', '线路名称'],
          ['section', '区段'],
          ['tree_species', '树种'],
          ['tree_count', '数量'],
          ['dist_small', '距小号'],
          ['dist_big', '距大号'],
          ['diameter', '直径'],
          ['horizontal', '水平'],
          ['vertical', '垂直'],
          ['finder_name', '发现人'],
          ['found_at', '发现时间'],
          ['handler_name', '处理人'],
          ['handle_note', '处理情况'],
          ['handled_at', '处理时间'],
        ];

        /* ================= 全局状态 ================= */
        var state = {
          teamId: 0, // 超管当前切换的班组 id（0=未指定，由后端落默认班组；非超管恒 0）
          tab: 'records', // 当前页签：records 记录 | staging 暂存区 | conflicts 冲突
          dash: null, // 看板数据 {unhandled, week_new, over_threshold, handled, threshold, pending_conflicts, staging_batches}
          rec: null, // 记录响应 {threshold, lines:[{voltage_level,line_name,records}], unmatched:[...]}
          view: 'lines', // 记录页签视图：lines 线路大卡（一级） | ledger 线路台账（二级）
          curLine: '', // 台账视图当前线路名（'__unmatched__' = 未匹配线路伪组）
          lineSearch: '', // 线路视图搜索串（输入即过滤线路名/电压等级）
          batch: { on: false, sel: {} }, // 批量处理模式（仅台账视图可用）：sel 为 记录id→true
          exp: {}, // 台账卡折叠/展开状态（记录id→true=展开；默认折叠，仅两行摘要）
          upTarget: null, // 照片上传目标 {recordId, kind}
          lb: { list: [], idx: 0 }, // 大图层（list 为当前照片组 url 数组）
          stg: { list: null, detail: null, err: '' }, // 暂存区：批次列表 / 批次详情 {batch, records}
          stgSel: {}, // 批次详情逐行勾选（暂存记录 id→true）
          cft: { list: null, err: '' }, // 冲突列表
          sync: null, // 同步状态 {enabled, running, last, nextNight}（后端未启用时仅 {enabled:false,last:null}）
        };

        /* 班组隔离：超管所有 /treehazard/* 请求统一带 team_id（query 优先于 body，后端 resolveReqTeam 同口径） */
        function th(path) {
          return Shade.withTeam(path, state.teamId);
        }
        /* POST/PUT 的 body 注入 team_id（manage.js teamBody 口径；query 已带时冗余无害） */
        function teamBody(o) {
          return state.teamId ? Object.assign({ team_id: state.teamId }, o) : o;
        }

        /* 空值展示占位 */
        function dash(v) {
          var s = String(v == null ? '' : v).trim();
          return s || '—';
        }
        /* 距离展示幂等：纯数字拼 m 后缀；已带单位或其他文本原样（空 → —） */
        function fmtM(v) {
          var s = String(v == null ? '' : v).trim();
          if (!s) return '—';
          return /^\d+(\.\d+)?$/.test(s) ? s + 'm' : s;
        }
        /* 垂直距离是否超阈值（vertical_num 非空且 ≤threshold） */
        function overThreshold(r, threshold) {
          return (
            threshold !== null &&
            threshold !== undefined &&
            r.vertical_num !== null &&
            r.vertical_num !== undefined &&
            Number(r.vertical_num) <= Number(threshold)
          );
        }
        /* 全部记录拍平（lines + unmatched，保持分组顺序） */
        function allRecords() {
          var out = [];
          if (!state.rec) return out;
          (state.rec.lines || []).forEach(function (g) {
            out = out.concat(g.records || []);
          });
          return out.concat(state.rec.unmatched || []);
        }

        /* ================= 看板 ================= */
        async function loadDashboard() {
          try {
            var r = await Shade.api(th('/api/v1/treehazard/dashboard'));
            state.dash = r.data || {};
          } catch (e) {
            state.dash = null;
            Shade.toast(e.message, 'error');
          }
          renderDashboard();
        }
        function renderDashboard() {
          var d = state.dash || {};
          $('#dUnh').textContent = d.unhandled == null ? '—' : d.unhandled;
          $('#dWeek').textContent = d.week_new == null ? '—' : d.week_new;
          $('#dHand').textContent = d.handled == null ? '—' : d.handled;
          var over = $('#dOver'),
            lab = $('#dOverLab');
          if (d.threshold === null || d.threshold === undefined) {
            /* 未设阈值：数字位显示「未设阈值」弱化文案 */
            over.textContent = '未设阈值';
            over.className = 'dc-n mut';
            lab.textContent = '垂直距离≤阈值未处理';
          } else {
            over.textContent = d.over_threshold == null ? '—' : d.over_threshold;
            /* 要紧类计数仅 >0 才红显，=0 弱化为辅助灰 */
            over.className = 'dc-n ' + (d.over_threshold > 0 ? 'red' : 'zero');
            lab.textContent = '垂直距离≤' + d.threshold + 'm 未处理';
          }
          /* 页签角标（仅管理角色有对应页签） */
          var stgN = d.staging_batches || 0,
            cftN = d.pending_conflicts || 0;
          $('#bdgStaging').hidden = !stgN;
          $('#bdgStaging').textContent = stgN;
          $('#bdgConflicts').hidden = !cftN;
          $('#bdgConflicts').textContent = cftN;
          /* 管理待办小字入口：暂存 n 批 · 冲突 n 条（点击切对应页签） */
          var todo = $('#dashTodo');
          if (isManager && (stgN || cftN)) {
            var parts = [];
            if (stgN) parts.push('<a data-go="staging">暂存 ' + stgN + ' 批</a>');
            if (cftN) parts.push('<a data-go="conflicts">冲突 ' + cftN + ' 条</a>');
            todo.innerHTML =
              Shade.icon('warn', 14) + '<span>待办：</span>' + parts.join('<span>·</span>');
            todo.hidden = false;
          } else {
            todo.hidden = true;
            todo.innerHTML = '';
          }
        }

        /* ================= 记录页签 ================= */
        /* 记录加载：quiet=true 时不显加载块（照片上传 / 处理后静默刷新，滚动位保持） */
        async function loadRecords(quiet) {
          var body = $('#recBody');
          if (!quiet)
            body.innerHTML = '<div class="loading"><span class="spin"></span>加载中…</div>';
          var st = body.scrollTop;
          try {
            var r = await Shade.api(th('/api/v1/treehazard/records'));
            state.rec = r.data || { threshold: null, lines: [], unmatched: [] };
            renderRecords();
            if (quiet) body.scrollTop = st;
          } catch (e) {
            state.rec = null;
            body.innerHTML =
              '<div class="empty">' +
              Shade.icon('warn', 44) +
              '<p>' +
              esc(e.message) +
              '</p>' +
              '<p><button class="btn btn-sm" id="recRetry">重试</button></p></div>';
          }
        }

        /* 视图切换同步：看板仅「记录」页签展示（线路视图与台账视图均保留），暂存区/冲突页签不显示；搜索栏 / 台账栏随视图显隐 */
        function syncView() {
          var inRec = state.tab === 'records';
          $('#dash').style.display = inRec ? '' : 'none';
          $('#recBarLines').hidden = !(inRec && state.view === 'lines');
          $('#recBarLedger').hidden = !(inRec && state.view === 'ledger');
        }
        /* 视图内容重渲染时触发 fade+slide 入场（重挂 .view-in 强制重放） */
        function playViewIn() {
          var body = $('#recBody');
          body.classList.remove('view-in');
          void body.offsetWidth;
          body.classList.add('view-in');
        }
        /* 进入二级台账视图（line 为线路名；'__unmatched__' = 未匹配线路伪组） */
        function openLedger(line) {
          state.view = 'ledger';
          state.curLine = line;
          syncView();
          renderRecords();
          playViewIn();
          $('#recBody').scrollTop = 0;
        }
        /* 返回一级线路视图（批量模式仅台账视图可用，退出即收） */
        function backToLines() {
          if (state.batch.on) setBatchMode(false);
          state.view = 'lines';
          state.curLine = '';
          syncView();
          renderRecords();
          playViewIn();
        }

        /* 记录卡片：照片三区（辅证只读 / 处理前 / 处理后，可上传区右上角「+」）——台账视图卡片内使用 */
        function photoZoneHtml(r, kind, label, canUpload) {
          var photos = (r.photos || []).filter(function (p) {
            return p.kind === kind;
          });
          var inner;
          if (photos.length) {
            inner = photos
              .map(function (p) {
                /* 删除权限：班管/超管 或 上传者本人 */
                var canDel = isManager || Number(p.uploaded_by) === Number(me.id);
                return (
                  '<figure class="ph" data-url="' +
                  esc(p.url) +
                  '" data-kind="' +
                  kind +
                  '">' +
                  '<img src="' +
                  esc(p.url) +
                  '" loading="lazy" alt="' +
                  label +
                  '">' +
                  (canDel
                    ? '<button class="ph-x" data-phdel="' +
                      p.id +
                      '" data-rid="' +
                      r.id +
                      '" title="删除照片">' +
                      Shade.icon('close', 9) +
                      '</button>'
                    : '') +
                  '</figure>'
                );
              })
              .join('');
          } else {
            inner =
              '<div class="ph-none">' +
              (kind === 'evidence' ? '辅证照片由排查系统提供' : '暂无照片') +
              '</div>';
          }
          return (
            '<div class="ph-zone">' +
            '<div class="ph-zhead"><span>' +
            label +
            '</span>' +
            (canUpload
              ? '<button class="ph-add" data-up="' +
                kind +
                '" data-rid="' +
                r.id +
                '" title="上传照片">' +
                Shade.icon('add', 12) +
                '</button>'
              : '') +
            '</div>' +
            '<div class="ph-grid">' +
            inner +
            '</div>' +
            '</div>'
          );
        }

        /* 记录卡片 HTML（扁平完整卡，无详情弹层分级；默认折叠态一卡两行）：
   标题行 = 区段 + 垂直距离双大字同级、左对齐（垂距 ≤ 阈值红显）+ 状态点标 + 折叠/展开开关 + 批量勾选框；
   次级行 = 树种×数量 / 水平距离 / 发现时间（found_at 空则省略）；辅证照片条（rec-evi，有图才渲染）折叠态即展示，点图开大图预览；
   展开态（.rec-more）另出紧凑信息行（位置备注/直径/距小号/距大号/发现人，
   空值跳过，宽屏一行窄屏两行）+ 已处理信息 + 照片两区（处理前/后可上传可删）+ 卡内操作（处理：未处理卡；删除：班管/超管）。
   点卡（非交互区）折叠/展开同开关；卡内全部交互走 #recBody 事件委派（见 initEvents），重绘无需重绑 */
        function recCardHtml(r, threshold) {
          var done = r.status === 'handled';
          var expanded = !!state.exp[r.id];
          var head = [];
          /* 批量模式：未处理卡可勾选，已处理卡禁用态 */
          if (state.batch.on) {
            if (done) head.push('<span class="rec-ck dis" title="已处理记录不可选"></span>');
            else
              head.push(
                '<span class="rec-ck' +
                  (state.batch.sel[r.id] ? ' on' : '') +
                  '" data-ck="' +
                  r.id +
                  '">' +
                  Shade.icon('check', 12) +
                  '</span>'
              );
          }
          head.push('<b class="rec-sec">' + esc(dash(r.section)) + '</b>');
          head.push(
            '<span class="rec-vert' +
              (overThreshold(r, threshold) ? ' danger' : '') +
              '" title="垂直距离">垂距 ' +
              esc(fmtM(r.vertical)) +
              '</span>'
          );
          head.push(
            done
              ? '<span class="rec-tag ok">已处理</span>'
              : '<span class="rec-tag un">未处理</span>'
          );
          head.push(
            '<button class="rec-fold" data-fold="' +
              r.id +
              '" title="' +
              (expanded ? '折叠' : '展开') +
              '">' +
              Shade.icon('chevron-down', 13) +
              '</button>'
          );
          /* 次级字段行：树种×数量 / 水平距离 / 发现时间（仅 found_at，空值省略） */
          var sub = [];
          var species = String(r.tree_species || '').trim();
          if (species)
            sub.push(
              '<span class="rec-sub">' +
                esc(species) +
                (String(r.tree_count || '').trim() ? ' × ' + esc(r.tree_count) : '') +
                '</span>'
            );
          sub.push('<span class="rec-dist">水平 ' + esc(fmtM(r.horizontal)) + '</span>');
          var foundAt = String(r.found_at == null ? '' : r.found_at).trim();
          if (foundAt) sub.push('<span class="rec-dist">发现时间 ' + esc(foundAt) + '</span>');
          /* 紧凑信息行：标签+值同行内联，空值字段不渲染（垂直超阈值红显由标题行承担） */
          var infoItems = COMPACT_FIELDS.map(function (f) {
            var v = String(r[f[0]] == null ? '' : r[f[0]]).trim();
            return v ? '<span class="rf"><i>' + f[1] + '</i>' + esc(v) + '</span>' : '';
          }).filter(Boolean);
          var grid = infoItems.length ? '<div class="rf-row">' + infoItems.join('') + '</div>' : '';
          /* 已处理信息行：处理人 / 处理情况 / 处理时间 */
          var handled = done
            ? '<div class="rec-handled"><span>处理人 <b>' +
              esc(dash(r.handler_name)) +
              '</b></span>' +
              '<span>处理情况 <b>' +
              esc(dash(r.handle_note)) +
              '</b></span>' +
              '<span>处理时间 <b>' +
              esc(dash(r.handled_at)) +
              '</b></span></div>'
            : '';
          /* 辅证照片条：折叠态即展示（有图才渲染，只读），点击缩略图开大图预览；处理前/后两区留在展开区 */
          var hasEvidence = (r.photos || []).some(function (p) {
            return p.kind === 'evidence';
          });
          var evidence = hasEvidence
            ? '<div class="rec-evi">' + photoZoneHtml(r, 'evidence', '辅证照片', false) + '</div>'
            : '';
          var photos =
            '<div class="ph-zones">' +
            photoZoneHtml(r, 'before', '处理前', true) +
            photoZoneHtml(r, 'after', '处理后', true) +
            '</div>';
          /* 卡内操作：删除居左（班管/超管），处理居右（未处理时；复用处理弹层 openHandleModal） */
          var acts = [];
          if (isManager)
            acts.push(
              '<button class="btn btn-sm btn-danger" data-ddel="' +
                r.id +
                '" style="margin-right:auto">删除</button>'
            );
          if (!done)
            acts.push(
              '<button class="btn btn-sm btn-primary" data-dhandle="' + r.id + '">处理</button>'
            );
          return (
            '<div class="card rec' +
            (done ? ' done' : '') +
            (expanded ? '' : ' fold') +
            '" data-id="' +
            r.id +
            '">' +
            '<div class="rec-top">' +
            head.join('') +
            '</div>' +
            '<div class="rec-subline">' +
            sub.join('') +
            '</div>' +
            evidence +
            '<div class="rec-more"><div class="rec-more-in">' +
            grid +
            handled +
            photos +
            (acts.length ? '<div class="rec-acts">' + acts.join('') + '</div>' : '') +
            '</div></div>' +
            '</div>'
          );
        }

        /* 渲染分派：按当前视图渲染一级线路大卡 / 二级线路台账 */
        function renderRecords() {
          if (!state.rec) return;
          if (state.view === 'ledger') renderLedger();
          else renderLineCards();
        }

        /* ================= 一级「线路视图」：线路大卡片网格 ================= */
        /* 单线路计数：未处理数 / 其中要紧数（未处理且垂直距离 ≤ 阈值）/ 总数 */
        function lineStats(recs, threshold) {
          var unh = 0,
            key = 0;
          recs.forEach(function (r) {
            if (r.status === 'handled') return;
            unh++;
            if (overThreshold(r, threshold)) key++;
          });
          return { unh: unh, key: key, total: recs.length };
        }
        /* 线路大卡：标题（电压等级+线路名，Shade.fmtKv 幂等）+ 未处理（品牌蓝）/ 要紧（>0 红字、=0 灰字，无阈值不显）/ 总数（灰）；
   未处理与要紧均为 0 时计数整体置灰（lc-clear）；idx 用于 stagger 入场时延链（≤0.9s 封顶） */
        function lineCardHtml(title, st, threshold, lineKey, idx) {
          var clear = st.unh === 0 && st.key === 0;
          var delay = Math.min(idx * 0.05, 0.4).toFixed(2); // 逐卡 50ms 递增，0.4s 封顶（+0.5s 时长 ≤0.9s）
          return (
            '<div class="card lc' +
            (clear ? ' lc-clear' : '') +
            '" data-line="' +
            esc(lineKey) +
            '" title="点击进入线路台账"' +
            ' style="animation-delay:' +
            delay +
            's">' +
            '<div class="lc-main"><div class="lc-title">' +
            esc(title) +
            '</div>' +
            '<div class="lc-stats">' +
            '<span class="lc-unh">未处理<b>' +
            st.unh +
            '</b></span>' +
            (threshold === null || threshold === undefined
              ? ''
              : '<span class="' +
                (st.key > 0 ? 'lc-key' : 'lc-total') +
                '" title="未处理且垂直距离≤阈值">要紧<b>' +
                st.key +
                '</b></span>') +
            '<span class="lc-total">共 ' +
            st.total +
            ' 条</span>' +
            '</div></div>' +
            '<span class="lc-go">' +
            Shade.icon('chevron-right', 16) +
            '</span>' +
            '</div>'
          );
        }
        /* 电压等级数值提取（排序用；非数字回退 0） */
        function voltageNum(v) {
          var n = parseFloat(String(v == null ? '' : v).replace(/[^\d.]/g, ''));
          return isNaN(n) ? 0 : n;
        }
        /* 线路卡排序：要紧数降序 > 未处理数降序 > 电压等级数值降序 > 线路名称升序（zh-CN） */
        function sortLineGroups(list, threshold) {
          var stats = {};
          list.forEach(function (g) {
            stats[g.line_name] = lineStats(g.records || [], threshold);
          });
          return list.slice().sort(function (a, b) {
            var sa = stats[a.line_name],
              sb = stats[b.line_name];
            if (sb.key !== sa.key) return sb.key - sa.key;
            if (sb.unh !== sa.unh) return sb.unh - sa.unh;
            var dv = voltageNum(b.voltage_level) - voltageNum(a.voltage_level);
            if (dv) return dv;
            return String(a.line_name || '').localeCompare(String(b.line_name || ''), 'zh-CN');
          });
        }
        function renderLineCards() {
          var body = $('#recBody');
          var threshold = state.rec.threshold;
          var raw = (state.lineSearch || '').trim();
          var kw = raw.toLowerCase();
          var html = [];
          var idx = 0;
          sortLineGroups(state.rec.lines || [], threshold).forEach(function (g) {
            var title = Shade.fmtKv(g.voltage_level) + ' ' + g.line_name;
            /* 输入即过滤：标题（含电压等级幂等格式）与原始线路名双通道匹配 */
            if (
              kw &&
              title.toLowerCase().indexOf(kw) < 0 &&
              String(g.line_name || '')
                .toLowerCase()
                .indexOf(kw) < 0
            )
              return;
            html.push(
              lineCardHtml(
                title,
                lineStats(g.records || [], threshold),
                threshold,
                g.line_name,
                idx++
              )
            );
          });
          /* 「未匹配线路」伪组作为一张卡参与（恒排尾，不参与排序） */
          var un = state.rec.unmatched || [];
          if (un.length && (!kw || '未匹配线路'.indexOf(raw) >= 0)) {
            html.push(
              lineCardHtml(
                '未匹配线路',
                lineStats(un, threshold),
                threshold,
                '__unmatched__',
                idx++
              )
            );
          }
          body.innerHTML = html.length
            ? '<div class="lc-grid">' + html.join('') + '</div>'
            : '<div class="empty">' +
              Shade.icon(kw ? 'search' : 'task', 44) +
              '<p>' +
              (kw
                ? '未找到匹配「' + esc(raw) + '」的线路'
                : '暂无运维线路，可先到「班组数据」维护') +
              '</p></div>';
        }

        /* ================= 二级「台账视图」：单线路记录卡片流 ================= */
        /* 当前台账线路组（线路已不存在时返回 null，由 renderLedger 回退线路视图） */
        function currentLedgerGroup() {
          if (!state.rec) return null;
          if (state.curLine === '__unmatched__') {
            var un = state.rec.unmatched || [];
            return un.length ? { title: '未匹配线路', records: un, lineName: '' } : null;
          }
          var g = null;
          (state.rec.lines || []).forEach(function (x) {
            if (x.line_name === state.curLine) g = x;
          });
          return g
            ? {
                title: Shade.fmtKv(g.voltage_level) + ' ' + g.line_name,
                records: g.records || [],
                lineName: g.line_name,
              }
            : null;
        }
        function renderLedger() {
          var body = $('#recBody');
          var threshold = state.rec.threshold;
          var g = currentLedgerGroup();
          if (!g) {
            backToLines();
            return;
          } // 数据刷新后线路已消失（如班组切换/删除），回退线路视图
          var st = lineStats(g.records, threshold);
          $('#ledgerTitle').textContent = g.title;
          $('#ledgerSub').innerHTML =
            '<span class="' +
            (st.unh > 0 ? 'ls-unh' : '') +
            '">未处理 ' +
            st.unh +
            '</span>' +
            (threshold === null || threshold === undefined
              ? ''
              : ' · <span class="' +
                (st.key > 0 ? 'ls-key' : '') +
                '">要紧 ' +
                st.key +
                '</span>') +
            ' · 共 ' +
            st.total +
            ' 条';
          /* 勾选集合剔除已不可选项（已处理 / 已删除），防底部悬浮条计数残留 */
          if (state.batch.on) {
            var valid = {};
            allRecords().forEach(function (r) {
              if (r.status !== 'handled') valid[r.id] = true;
            });
            Object.keys(state.batch.sel).forEach(function (id) {
              if (!valid[id]) delete state.batch.sel[id];
            });
          }
          body.innerHTML =
            g.records
              .map(function (r) {
                return recCardHtml(r, threshold);
              })
              .join('') ||
            '<div class="empty">' + Shade.icon('task', 44) + '<p>该线路下暂无记录</p></div>';
          syncBatchBar();
        }

        /* ================= 批量处理模式 ================= */
        function selectedIds() {
          return Object.keys(state.batch.sel)
            .map(Number)
            .filter(function (n) {

        function setBatchMode(on) {
          state.batch.on = on;
          state.batch.sel = {};
          $('#btnBatch').textContent = on ? '退出批量' : '批量处理';
          $('#batchBar').hidden = !on;
          $('#recBody').classList.toggle('batching', on); // 批量模式点卡 = 勾选（光标提示）
          renderRecords();
        }
        /* 底部悬浮条已选计数同步（勾选变化就地更新，不重渲染卡片） */
        function syncBatchBar() {
          var n = selectedIds().length;
          $('#batchCnt').textContent = '已选 ' + n + ' 条';
          $('#batchGo').disabled = !n;
        }

        /* ================= 处理弹层（单条 / 批量共用） ================= */
        /* ids：待处理记录 id 数组；提交走 /records/:id/handle（单条）或 /records/handle-batch（批量） */
        function openHandleModal(ids) {
          if (!ids.length) return;

            '">' +
            '<label class="f-lab">处理情况</label>' +

            '<div class="chips" style="margin-top:8px">' +
            '<button class="chip" data-q="削枝">削枝</button><button class="chip" data-q="砍伐">砍伐</button>' +
            '</div>' +
            '<label class="f-lab">处理时间</label>' +

          var inst = Shade.modal(html, { width: 460 });
          /* 快捷胶囊：点击填入/替换处理情况 */
          $$('.chip[data-q]', inst.box).forEach(function (c) {

          $('[data-a="yes"]', inst.box).addEventListener('click', async function () {

                });
                setBatchMode(false); // 批量处理成功：退出批量模式
              } else {
                await Shade.api(th('/api/v1/treehazard/records/' + ids[0] + '/handle'), {
                  method: 'POST',
                  body: body,
                });

              Shade.toast('已处理', 'success');

        /* ================= 记录操作：删除（班管/超管） ================= */

        /* ================= 照片：上传 / 删除 / 大图查看 ================= */
        /* 选片 → canvas 重绘导出 jpeg dataURL，上传前转 multipart Blob（统一格式、归一 EXIF 方向，最大 50MB） */
        function readPhotoDataUrl(file) {
          return new Promise(function (resolve, reject) {
            var fr = new FileReader();
            fr.onerror = function () {
              reject(new Error('照片读取失败'));
            };
            fr.onload = function () {
              var img = new Image();
              img.onload = function () {
                var w = img.naturalWidth,
                  h = img.naturalHeight;
                var sc = Math.min(1, 2560 / Math.max(w, h));
                var cv = document.createElement('canvas');
                cv.width = Math.max(1, Math.round(w * sc));
                cv.height = Math.max(1, Math.round(h * sc));
                cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
                resolve(cv.toDataURL('image/jpeg', 0.88));
              };
              img.onerror = function () {
                reject(new Error('照片解析失败，请更换图片'));
              };
              img.src = fr.result;
            };
            fr.readAsDataURL(file);
          });
        }
        /* 处理前/后照片大多不止一张：支持一次多选，逐张串行上传（进度 n/m），结束统一刷新 */
        async function uploadPhoto(files) {
          var target = state.upTarget;
          if (!target || !files || !files.length) return;
          var list = Array.prototype.slice.call(files).filter(function (f) {
            return /^image\//i.test(f.type || '');
          });
          if (!list.length) {
            Shade.toast('请选择图片文件', 'info');
            return;
          }
          var wait = Shade.modal(
            '<div class="loading"><span class="spin"></span>正在上传 0/' + list.length + '…</div>',
            { width: 280 }
          );
          var okCount = 0,
            failCount = 0,
            firstErr = '';
          for (var i = 0; i < list.length; i++) {
            try {
              var dataUrl = await readPhotoDataUrl(list[i]);
              var match = /^data:(image\/(?:jpeg|png));base64,(.+)$/.exec(dataUrl || '');
              if (!match) throw new Error('照片格式应为 jpeg/png');
              var raw = atob(match[2]);
              var bytes = new Uint8Array(raw.length);
              for (var j = 0; j < raw.length; j++) bytes[j] = raw.charCodeAt(j);
              var fd = new FormData();
              fd.append('image', new Blob([bytes], { type: match[1] }));
              var extra = teamBody({});
              if (extra.team_id) fd.append('team_id', String(extra.team_id));
              await Shade.api(
                th('/api/v1/treehazard/records/' + target.recordId + '/photos?kind=' + target.kind),
                {
                  method: 'POST',
                  body: fd,
                }
              );
              okCount++;
            } catch (e) {
              failCount++;
              if (!firstErr) firstErr = e.message || String(e); // 保留首个失败原因（含后端错误信息）供失败提示
            }
            var ld = wait.box.querySelector('.loading');
            if (ld)
              ld.innerHTML =
                '<span class="spin"></span>正在上传 ' +
                (okCount + failCount) +
                '/' +
                list.length +
                '…';
          }
          wait.close();
          if (!okCount) {
            Shade.toast(firstErr ? '上传失败：' + firstErr : '上传失败，请重试', 'error');
            return;
          }
          Shade.toast(
            failCount
              ? '上传完成：成功 ' +
                  okCount +
                  ' 张，失败 ' +
                  failCount +
                  ' 张' +
                  (firstErr ? '（' + firstErr + '）' : '')
              : '已上传 ' + okCount + ' 张',
            failCount ? 'info' : 'success'
          );
          loadRecords(true);
        }
        async function deletePhoto(recordId, photoId) {
          var yes = await Shade.confirm({
            title: '删除照片',
            content: '确定删除这张照片吗？',
            confirmText: '删除',
            danger: true,
          });
          if (!yes) return;
          try {
            await Shade.api(th('/api/v1/treehazard/records/' + recordId + '/photos/' + photoId), {
              method: 'DELETE',
            });
            Shade.toast('已删除', 'success');
            loadRecords(true);
          } catch (e) {
            Shade.toast(e.message, 'error');
          }
        }

        /* 大图层：list 为当前照片组 url 数组，idx 初始下标；Esc 经 Shade.escGuard 优先关大图层 */
        function openLightbox(list, idx) {
          state.lb.list = list;
          state.lb.idx = idx;
          renderLightbox();
          $('#lightbox').classList.add('open');
        }
        function closeLightbox() {
          $('#lightbox').classList.remove('open');
          state.lb.list = [];
          state.lb.idx = 0;
        }
        function shiftLightbox(step) {
          var n = state.lb.list.length;
          if (!n) return;
          state.lb.idx = (state.lb.idx + step + n) % n;
          renderLightbox();
        }
        function renderLightbox() {
          var list = state.lb.list,
            idx = state.lb.idx;
          $('#lightbox').innerHTML =
            '<div class="lb-stage">' +
            '<img class="lb-img" src="' +
            esc(list[idx]) +
            '" alt="照片大图">' +
            '<div class="lb-count">' +
            (idx + 1) +
            ' / ' +
            list.length +
            '</div>' +
            '</div>' +
            '<button class="lb-x" id="lbX">' +
            Shade.icon('close', 17) +
            '</button>' +
            (list.length > 1
              ? '<button class="lb-arrow l" id="lbPrev">' +
                Shade.icon('chevron-left', 18) +
                '</button>' +
                '<button class="lb-arrow r" id="lbNext">' +
                Shade.icon('chevron-right', 18) +
                '</button>'
              : '');
          $('#lbX').addEventListener('click', function (e) {
            e.stopPropagation();
            closeLightbox();
          });
          if ($('#lbPrev'))
            $('#lbPrev').addEventListener('click', function (e) {
              e.stopPropagation();
              shiftLightbox(-1);
            });
          if ($('#lbNext'))
            $('#lbNext').addEventListener('click', function (e) {

        /* ================= 导出：FAB 弹层（范围单选 + 按线路分表）→ 预览（Shade.openPreviewUrl 打开）/ 下载（apiRaw + saveBlob） ================= */
        /* query 由导出弹层拼好传入：分线路带 line=，勾选分表且范围为全部线路时带 split=1 */
        async function exportPreview(btn, query) {
          btn.disabled = true;
          try {
            var r = await Shade.api(th('/api/v1/treehazard/export/preview' + (query || '')));
            if (r.data && r.data.url) {
              Shade.openPreviewUrl(r.data.url);
              return;
            }
            throw new Error('预览地址为空');
          } catch (e) {
            Shade.toast(e.message, 'error');
          } finally {
            btn.disabled = false;
          }
        }
        async function exportDownload(btn, query) {
          btn.disabled = true;
          try {
            /* 走 :name.xlsx 文件名变体路径，供查看器按扩展名识别格式；文件名以 Content-Disposition 为准 */
            var res = await Shade.apiRaw(
              th('/api/v1/treehazard/export/树木统计表.xlsx' + (query || ''))
            );
            if (!res.ok) {
              var ej = null;
              try {
                ej = await res.json();
              } catch (e) {}
              throw new Error((ej && ej.message) || '导出失败（' + res.status + '）');
            }
            await Shade.saveBlob(res, '树木统计表.xlsx');
          } catch (e) {
            Shade.toast(e.message, 'error');

            btn.disabled = false;

        /* 导出弹层（FAB 点击）：
   台账视图范围两项（默认「当前线路」；未匹配线路伪组不支持单线路导出，该项禁用）；线路视图默认「全部线路」，
   第二项为「选择线路」下拉（下拉即选中该单选）；「按线路分表」仅全部线路范围可勾（其余禁用并灰显说明） */
        function openExportModal() {
          if (!state.rec) {
            Shade.toast('记录加载中，请稍候', 'info');
            return;
          }
          var inLedger = state.tab === 'records' && state.view === 'ledger';
          var g = inLedger ? currentLedgerGroup() : null;
          var canCur = !!(g && g.lineName); // 未匹配线路伪组聚合多条线路名，无法映射单一线路参数
          var lines = state.rec.lines || [];
          var html =
            Shade.mHead('导出统计表') +
            '<label class="f-lab">导出范围</label>' +
            (inLedger
              ? '<label class="ex-opt' +
                (canCur ? '' : ' dis') +
                '"><input type="radio" name="exRange" value="line"' +
                (canCur ? ' checked' : ' disabled') +
                '> 当前线路（' +
                esc(g ? g.title : '') +
                '）</label>' +
                '<label class="ex-opt"><input type="radio" name="exRange" value="all"' +
                (canCur ? '' : ' checked') +
                '> 全部线路</label>'
              : '<label class="ex-opt"><input type="radio" name="exRange" value="all" checked> 全部线路</label>' +
                '<label class="ex-opt' +
                (lines.length ? '' : ' dis') +
                '"><input type="radio" name="exRange" value="line"' +
                (lines.length ? '' : ' disabled') +
                '> 选择线路</label>' +
                '<select class="f-sel" id="exLine" style="margin-top:2px" disabled>' +
                lines
                  .map(function (x) {
                    return (
                      '<option value="' +
                      esc(x.line_name) +
                      '">' +
                      esc(Shade.fmtKv(x.voltage_level) + ' ' + x.line_name) +
                      '</option>'
                    );
                  })
                  .join('') +
                '</select>') +
            '<label class="f-lab">分表</label>' +
            '<label class="ex-opt" id="exSplitOpt"><input type="checkbox" id="exSplit"> 按线路分表（每条线路一个工作表，表名 = 电压等级 + 线路名称）</label>' +
            '<div class="f-hint" id="exSplitHint">仅「全部线路」范围可分表；导出范围非全部线路时此项不可用。</div>' +
            '<div class="m-foot"><button class="btn btn-sm" data-ex="preview">' +
            Shade.icon('file', 15) +
            '预览</button>' +
            '<button class="btn btn-sm btn-primary" data-ex="download">' +
            Shade.icon('download', 15) +
            '下载</button></div>';
          var inst = Shade.modal(html, { width: 460 });
          var splitCk = $('#exSplit', inst.box);
          var splitOpt = $('#exSplitOpt', inst.box);
          var splitHint = $('#exSplitHint', inst.box);
          var lineSel = $('#exLine', inst.box);
          function curRange() {
            var v = 'all';
            $$('input[name="exRange"]', inst.box).forEach(function (r) {
              if (r.checked) v = r.value;
            });
            return v;
          }
          /* 分表勾选随范围联动：非全部线路 → 禁用 + 摘勾 + 灰显说明 */
          function syncSplit() {
            var off = curRange() !== 'all';
            splitCk.disabled = off;
            if (off) splitCk.checked = false;
            splitOpt.classList.toggle('dis', off);
            splitHint.style.opacity = off ? '.55' : '';
            if (lineSel) lineSel.disabled = curRange() !== 'line';
          }
          $$('input[name="exRange"]', inst.box).forEach(function (r) {
            r.addEventListener('change', syncSplit);
          });
          if (lineSel) {
            /* 下拉选线即视为选中「选择线路」 */
            lineSel.addEventListener('change', function () {
              var radio = $('input[name="exRange"][value="line"]', inst.box);
              if (radio && !radio.checked) {
                radio.checked = true;
                syncSplit();
              }
            });
          }
          syncSplit();
          /* 拼导出 query：分线路 line=（未匹配伪组无 lineName，已被 canCur 拦截）；全部线路 + 勾选分表 → split=1 */
          function buildQuery() {
            var range = curRange();
            var lineName = '';
            if (range === 'line')
              lineName = inLedger ? (g ? g.lineName : '') : lineSel ? lineSel.value : '';
            if (range === 'line' && !lineName) {
              Shade.toast('请选择线路', 'info');
              return null;
            }
            var q = [];
            if (lineName) q.push('line=' + encodeURIComponent(lineName));
            if (range === 'all' && splitCk.checked && !splitCk.disabled) q.push('split=1');
            return q.length ? '?' + q.join('&') : '';
          }
          $('[data-ex="preview"]', inst.box).addEventListener('click', function () {
            var q = buildQuery();
            if (q === null) return;
            inst.close();
            exportPreview(this, q);
          });
          $('[data-ex="download"]', inst.box).addEventListener('click', function () {
            var q = buildQuery();
            if (q === null) return;
            inst.close();
            exportDownload(this, q);
          });
        }

        /* ================= 冲突页签（班管/超管） ================= */
        async function loadConflicts() {
          var body = $('#cftBody');
          body.innerHTML = '<div class="loading"><span class="spin"></span>加载中…</div>';
          try {
