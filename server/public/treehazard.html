        /* 系统当前值：冲突行平铺字段（LEFT JOIN 当前记录；记录已删时回退服务端快照） */
        function cftServerVal(c, key) {
          var v = c[key];
          if ((v === null || v === undefined) && c.server_snapshot) v = c.server_snapshot[key];
          return v;
        }
        /* 两列对照（系统值 | 内网值）：15 业务列 + 状态行，差异字段标红 */
        function cftCardHtml(c) {
          var snap = c.intranet_snapshot || {};
          var lineName = cftServerVal(c, 'line_name');
          var section = cftServerVal(c, 'section');
          /* 单元格等值判定（日期已归一 yyyy-MM-dd；数字类「3」与「3.0」视为相同，与后端 diff 口径一致） */
          function sameVal(key, a, b) {
            var sa = String(a == null ? '' : a).trim();
            var sb = String(b == null ? '' : b).trim();
            if (sa === sb) return true;
            if (
              [
                'voltage_level',
                'tree_count',
                'dist_small',
                'dist_big',
                'diameter',
                'horizontal',
                'vertical',
              ].indexOf(key) >= 0 &&
              sa &&
              sb
            ) {
              var na = Number(sa),
                nb = Number(sb);
              if (!isNaN(na) && !isNaN(nb)) return na === nb;
            }
            return false;
          }
          function cellVal(key, raw) {
            if (key === 'voltage_level') return Shade.fmtKv(raw);
            return dash(raw);
          }
          var rowsServer = '',
            rowsIntranet = '';
          BIZ_FIELDS.forEach(function (f) {
            var key = f[0],
              label = f[1];
            var sv = cftServerVal(c, key);
            var iv = snap[key];
            var diff = !sameVal(key, sv, iv);
            rowsServer +=
              '<div class="cft-r"><span class="k">' +
              label +
              '</span><span class="v' +
              (diff ? ' df' : '') +
              '">' +
              esc(cellVal(key, sv)) +
              '</span></div>';
            rowsIntranet +=
              '<div class="cft-r"><span class="k">' +
              label +
              '</span><span class="v' +
              (diff ? ' df' : '') +
              '">' +
              esc(cellVal(key, iv)) +
              '</span></div>';
          });
          /* 状态行：内网侧按 handled_at 推导（handled_at 空 → 未处理，同后端 intranetFields 口径） */
          var sStatus =
            c.record_status || (c.server_snapshot && c.server_snapshot.status) || 'unhandled';
          var iStatus = String(snap.handled_at || '').trim() ? 'handled' : 'unhandled';
          var stDiff = sStatus !== iStatus;
          var stText = function (s) {
            return s === 'handled' ? '已处理' : '未处理';
          };
          rowsServer +=
            '<div class="cft-r"><span class="k">状态</span><span class="v' +
            (stDiff ? ' df' : '') +
            '">' +
            stText(sStatus) +
            '</span></div>';
          rowsIntranet +=
            '<div class="cft-r"><span class="k">状态</span><span class="v' +
            (stDiff ? ' df' : '') +
            '">' +
            stText(iStatus) +
            '</span></div>';

          return (
            '<div class="card cft" data-cid="' +
            c.id +
            '">' +
            '<div class="cft-head"><b>' +
            esc(dash(lineName)) +
            ' · ' +
            esc(dash(section)) +
            '</b>' +
            '<span class="cft-time">' +
            esc(Shade.fmtDate(c.created_at, true)) +
            '</span></div>' +
            '<div class="cft-cmp">' +
            '<div class="cft-col"><div class="cft-col-h">系统值</div><div class="cft-rows">' +
            rowsServer +
            '</div></div>' +
            '<div class="cft-col"><div class="cft-col-h">内网值</div><div class="cft-rows">' +
            rowsIntranet +
            '</div></div>' +
            '</div>' +
            '<div class="cft-acts">' +
            '<button class="btn btn-sm" data-keep="server">以系统为准</button>' +
            '<button class="btn btn-sm btn-primary" data-keep="intranet">以内网为准</button>' +
            '</div></div>'
          );
        }
        function renderConflicts() {
          var body = $('#cftBody');
          if (state.cft.err) {
            body.innerHTML =
              '<div class="empty">' +
              Shade.icon('warn', 44) +
              '<p>' +
              esc(state.cft.err) +
              '</p>' +
              '<p><button class="btn btn-sm" data-cft="reload">重试</button></p></div>';
            return;
          }
          if (!state.cft.list.length) {
            body.innerHTML =
              '<div class="empty">' +
              Shade.icon('check-circle', 44) +
              '<p>暂无待解决冲突</p></div>';
            return;
          }
          body.innerHTML = state.cft.list.map(cftCardHtml).join('');
        }
        /* 解决冲突：keep=server 保留系统值 / intranet 采用内网值；解决后就地移除该卡并刷新角标 */
        async function resolveConflict(card, keep, btn) {
          var id = Number(card.dataset.cid);
          btn.disabled = true;
          try {
            await Shade.api(th('/api/v1/treehazard/conflicts/' + id + '/resolve'), {
              method: 'POST',
              body: teamBody({ keep: keep }),
            });
            state.cft.list = state.cft.list.filter(function (c) {
              return c.id !== id;
            });
            card.remove();
            if (!state.cft.list.length) renderConflicts();
            Shade.toast(keep === 'intranet' ? '已按内网值更新' : '已保留系统值', 'success');
            loadDashboard();
            if (keep === 'intranet') loadRecords(true); // 内网值已覆盖记录，卡片流静默刷新
          } catch (e) {
            btn.disabled = false;
            Shade.toast(e.message, 'error');
          }
        }

        /* ================= 页签切换（记录 / 暂存区 / 冲突） ================= */
        function switchTab(p) {
          if (state.tab === p) return;
          state.tab = p;
          $$('#thTabs button[data-p]').forEach(function (b) {
            b.classList.toggle('on', b.dataset.p === p);

          Shade.moveTabInd($('#thTabs button.on'), $('#thTabInd'));
          $$('.th-body .pane').forEach(function (el) {
            el.classList.toggle('on', el.id === 'pane' + p.charAt(0).toUpperCase() + p.slice(1));
          });
          syncView(); // 看板显隐随「记录页签 + 台账视图」组合联动
          /* 暂存区 / 冲突每次切回都重拉（可能被其他管理员改动） */
          if (p === 'staging') loadStaging();
          if (p === 'conflicts') loadConflicts();
        }

        /* ================= 事件绑定 ================= */
        function initEvents() {
          /* 页签点击 */
          $('#thTabs').addEventListener('click', function (e) {
            var b = e.target.closest('button[data-p]');
            if (!b || b.hidden) return;
            switchTab(b.dataset.p);
          });
          /* 看板待办入口：点击切对应页签 */
          $('#dashTodo').addEventListener('click', function (e) {
            var a = e.target.closest('a[data-go]');
            if (a) switchTab(a.dataset.go);
          });
          /* 线路视图搜索：输入即过滤线路名 / 电压等级 */
          $('#recSearch').addEventListener('input', function () {
            state.lineSearch = this.value;
            if (state.rec) renderLineCards();
          });
          /* 台账视图返回线路 + 导出 FAB */
          $('#btnBackLines').addEventListener('click', backToLines);
          $('#fabExport').addEventListener('click', openExportModal);
          /* 阈值 / 同步 / 批量开关 */
          $('#btnThreshold').addEventListener('click', openThresholdModal);
          $('#btnSync').addEventListener('click', function () {
            pushSync(this);
          });
          $('#btnWxSync').addEventListener('click', function () {
            pushWxSync(this);
          });
          $('#btnBatch').addEventListener('click', function () {
            setBatchMode(!state.batch.on);
          });
          $('#batchGo').addEventListener('click', function () {
            openHandleModal(selectedIds());
          });
          $('#batchCancel').addEventListener('click', function () {
            setBatchMode(false);
          });
          /* 记录重试（空态/错误态内按钮，动态节点用事件委托） */
          $('#recBody').addEventListener('click', function (e) {
            if (e.target.closest('#recRetry')) {
              loadRecords();
            }
          });
          /* 折叠/展开就地切换（开关按钮与点卡共用）：就地切 .fold 类不重绘（照片缩略图/滚动位不动） */
          function toggleCardFold(fid, card) {
            if (state.exp[fid]) delete state.exp[fid];
            else state.exp[fid] = true;
            var on = !!state.exp[fid];
            var target = card || $('.rec[data-id="' + fid + '"]', $('#recBody'));
            if (target) target.classList.toggle('fold', !on);
            var btn = target ? target.querySelector('[data-fold]') : null;
            if (btn) {
              btn.title = on ? '折叠' : '展开';
            }
          }
          /* 记录卡片流委派：线路大卡（进台账）/ 卡内交互（删照片 / 上传照片 / 处理 / 删记录 / 缩略图大图）/ 勾选框 /
     点卡（非交互区）= 折叠/展开（非批量模式；拖拽选中文字时不触发）；批量模式点卡 = 勾选 */
          $('#recBody').addEventListener('click', function (e) {
            var lc = e.target.closest('.lc[data-line]');
            if (lc) {
              openLedger(lc.dataset.line);
              return;
            }
            /* 折叠/展开开关（每卡一枚） */
            var foldBtn = e.target.closest('[data-fold]');
            if (foldBtn) {
              toggleCardFold(Number(foldBtn.dataset.fold), foldBtn.closest('.rec[data-id]'));
              return;
            }
            /* 卡内操作优先（不触发批量勾选） */
            var delPh = e.target.closest('[data-phdel]');
            if (delPh) {
              deletePhoto(Number(delPh.dataset.rid), Number(delPh.dataset.phdel));
              return;
            }
            var up = e.target.closest('[data-up]');
            if (up) {
              state.upTarget = { recordId: Number(up.dataset.rid), kind: up.dataset.up };
              $('#photoInput').click();
              return;
            }
            var hBtn = e.target.closest('[data-dhandle]');
            if (hBtn) {
              openHandleModal([Number(hBtn.dataset.dhandle)]);
              return;
            }
            var dBtn = e.target.closest('[data-ddel]');
            if (dBtn) {
              deleteRecord(Number(dBtn.dataset.ddel));
              return;
            }
            /* 缩略图 → 大图（同照片组内左右切换；z-index 340 恒高于弹层，遮罩阻断下方交互） */
            var fig = e.target.closest('.ph[data-url]');
            if (fig && e.target.tagName === 'IMG') {
              var figs = $$('.ph[data-url]', fig.parentNode);
              var list = figs.map(function (f) {
                return f.dataset.url;
              });
              openLightbox(list, figs.indexOf(fig));
              return;
            }
            var ck = e.target.closest('.rec-ck[data-ck]');
            if (ck) {
              var cid = Number(ck.dataset.ck);
              if (state.batch.sel[cid]) delete state.batch.sel[cid];
              else state.batch.sel[cid] = true;
              ck.classList.toggle('on');
              syncBatchBar();
              return;
            }
            /* 非批量模式：点卡（上述卡内交互与缩略图优先；拖拽选中文字时不触发）= 折叠/展开 */
            if (!state.batch.on) {
              var recCard0 = e.target.closest('.rec[data-id]');
              if (recCard0 && !window.getSelection().toString())
                toggleCardFold(Number(recCard0.dataset.id), recCard0);
              return;
            }
            /* 批量模式：点卡任意处 = 勾选（上述卡内交互优先；已处理卡勾选框为禁用态无 data-ck，整卡不响应） */
            if (state.batch.on) {
              var recCard = e.target.closest('.rec[data-id]');
              if (!recCard) return;
              var cardCk = recCard.querySelector('.rec-ck[data-ck]');
              if (!cardCk) return;
              var cid2 = Number(cardCk.dataset.ck);
              if (state.batch.sel[cid2]) delete state.batch.sel[cid2];
              else state.batch.sel[cid2] = true;
              cardCk.classList.toggle('on');
              syncBatchBar();
            }
          });
          /* 照片上传：隐藏 file input（accept image/*，可一次多选） */
          $('#photoInput').addEventListener('change', function () {
            var files = this.files;
            this.value = '';
            if (!files || !files.length) return;
            uploadPhoto(files);
          });
          /* 大图层：点遮罩关闭 / Esc 优先关大图层 / ← → 切换
     （.lb z-index:340 恒高于弹层 .mask(320)，大图打开即视觉最顶层、遮罩阻断下方交互，方向键始终归大图层） */
          $('#lightbox').addEventListener('click', function (e) {
            if (e.target === this) closeLightbox();
          });
          Shade.escGuard = function () {
            if ($('#lightbox').classList.contains('open')) {
              closeLightbox();
              return true;
            }
            return false;
          };
          document.addEventListener('keydown', function (e) {
            if (!$('#lightbox').classList.contains('open')) return;
            if (e.key === 'ArrowLeft') shiftLightbox(-1);
            else if (e.key === 'ArrowRight') shiftLightbox(1);
          });
          /* 暂存区委派：批次卡 / 返回 / 勾选 / 保存 / 转入 / 废弃 / 重试 */
          $('#stgBody').addEventListener('click', function (e) {
            var act = e.target.closest('[data-stg]');
            if (act) {
              var a = act.dataset.stg;
              if (a === 'reload') {
                loadStaging();
                return;
              }
              if (a === 'back') {
                state.stg.detail = null;
                renderStagingList();
                return;
              }
              if (a === 'save') {
                var tr = act.closest('tr[data-sid]');
                if (tr) saveStagingRow(tr, act);
                return;
              }
              if (a === 'import-all') {
                importBatch(null);
                return;
              }
              if (a === 'import-sel') {
                var ids = Object.keys(state.stgSel)
                  .filter(function (k) {
                    return state.stgSel[k];
                  })
                  .map(Number);
                if (!ids.length) {
                  Shade.toast('请先勾选要转入的记录', 'info');
                  return;
                }
                importBatch(ids);
                return;
              }
              if (a === 'discard') {
                discardBatch();
                return;
              }
              return; // ck / ck-all 走 change 事件
            }
            /* 批次卡（点击非操作区）→ 进入详情 */
            var card = e.target.closest('.stg-card[data-batch]');
            if (card) openBatch(Number(card.dataset.batch));
          });
          /* 暂存区勾选（change 委托：逐行 / 全选） */
          $('#stgBody').addEventListener('change', function (e) {
            var ck = e.target.closest('[data-stg="ck"]');
            if (ck) {
              var tr = ck.closest('tr[data-sid]');
              if (tr) state.stgSel[Number(tr.dataset.sid)] = ck.checked;
              /* 就地刷新「转入选中」按钮计数与可用态，不重绘表格（避免打断编辑输入） */
              var selN = Object.keys(state.stgSel).filter(function (k) {
                return state.stgSel[k];
              }).length;
              var btn = $('[data-stg="import-sel"]', $('#stgBody'));
              if (btn) {
                btn.disabled = !selN;
                btn.textContent = '转入选中（' + selN + '）';
              }
              return;
            }
            var all = e.target.closest('[data-stg="ck-all"]');
            if (all) {
              $$('#stgBody [data-stg="ck"]').forEach(function (c) {
                c.checked = all.checked;
                var tr = c.closest('tr[data-sid]');
                if (tr) state.stgSel[Number(tr.dataset.sid)] = all.checked;
              });
              var btn2 = $('[data-stg="import-sel"]', $('#stgBody'));
              var n = all.checked
                ? state.stg.detail && state.stg.detail.records
                  ? state.stg.detail.records.length
                  : 0
                : 0;
              if (btn2) {
                btn2.disabled = !n;
                btn2.textContent = '转入选中（' + n + '）';
              }
            }
          });
          /* 冲突委派：重试 / 解决 */
          $('#cftBody').addEventListener('click', function (e) {
            var re = e.target.closest('[data-cft="reload"]');
            if (re) {
              loadConflicts();
              return;
            }
            var btn = e.target.closest('[data-keep]');
            if (btn) {
              var card = btn.closest('.cft[data-cid]');
              if (card) resolveConflict(card, btn.dataset.keep, btn);
            }
          });
        }

        /* ================= 未分配班组空态（屏十口径） ================= */
        function renderNoTeam() {
          $('.th-head .acts').style.display = 'none';
          $('#dash').style.display = 'none';
          $('.th-tools').style.display = 'none';
          $('#thTabs').style.display = 'none';
          $('.th-body').style.display = 'none';
          $('#fabExport').hidden = true;
          Shade.renderNoTeam($('#noTeam'));
        }

        /* ================= 班组切换后整页重载 ================= */
        function reloadTeamData() {
          state.rec = null;
          state.dash = null;
          /* 视图状态复位：回一级线路视图并清空搜索（线路集合随班组变化） */
          state.view = 'lines';
          state.curLine = '';
          state.lineSearch = '';
          $('#recSearch').value = '';
          state.batch = { on: false, sel: {} };
          state.exp = {}; // 卡片折叠状态随班组切换复位
          state.stg = { list: null, detail: null, err: '' };
          state.stgSel = {};
          state.cft = { list: null, err: '' };
          state.sync = null;
          syncView();
          setBatchMode(false);
          loadDashboard();
          loadRecords();
          if (isManager) {
            loadSyncStatus();
            if (state.tab === 'staging') loadStaging();
            if (state.tab === 'conflicts') loadConflicts();
          }
        }

        /* ================= 启动 ================= */
        async function init() {
          /* 静态图标注入 */
          $('#fabExport').innerHTML = Shade.icon('download', 22);
          $('#recSearchBox').insertAdjacentHTML('afterbegin', Shade.icon('search', 15));
          $('#btnBackLines').innerHTML = Shade.icon('chevron-left', 14) + '返回线路';
          $('#btnThreshold').innerHTML = Shade.icon('setting', 15) + '阈值设置';
          $('#btnSync').innerHTML = Shade.icon('refresh', 15) + '同步至内网';
          $('#btnWxSync').innerHTML = Shade.icon('book', 15) + '同步知识库';
          $('#btnBatch').innerHTML = Shade.icon('check-circle', 15) + '批量处理';
          $$('#thTabs button[data-p]').forEach(function (b) {
            b.insertAdjacentHTML(
              'afterbegin',
              Shade.icon({ records: 'task', staging: 'folder', conflicts: 'warn' }[b.dataset.p], 14)
            );
          });
          Shade.moveTabInd($('#thTabs button.on'), $('#thTabInd'), true); // 页签指示条首帧落位

          /* 左侧导航栏用户：接口失败回退本地缓存 */
          Shade.refreshUser();

          me = Shade.user() || {};
          isManager = me.role === 'admin' || me.role === 'team_admin';
          /* 管理角色入口显隐：暂存区 / 冲突页签 + 阈值设置 + 同步至内网 + 同步知识库（工具行整行仅管理角色可见） */
          if (isManager) {
            $('#tabStaging').hidden = false;
            $('#tabConflicts').hidden = false;
            $('.th-tools').hidden = false;
            $('#btnThreshold').hidden = false;
            $('#btnSync').hidden = false;
            $('#btnWxSync').hidden = false;
          }

          /* 班组隔离门控：非超管未分配班组 → 整页空态（屏十口径）；超管先选定切换班组再出数 */
          if (me.role !== 'admin' && !me.team_id) {
            renderNoTeam();
            return;
          }
          /* 班组切换下拉：全员先换自绘下拉并隐藏（原生 select 保留为数据源），超管由 setupTeamSel 显示 */
          var teamDd = Shade.dropdown($('#teamSel'), {
            width: 'auto',
            minWidth: '132px',
            height: 36,
          });
          teamDd.el.style.display = 'none';
          if (me.role === 'admin') {
            /* 超管班组切换器：数据源 GET /admin/teams（仅启用班组），localStorage.treehazard_team_id 持久化，切换后整页数据重载 */
            var teamSel = await Shade.setupTeamSel({
              select: $('#teamSel'),
              dropdown: teamDd,
              storageKey: 'treehazard_team_id',
              showEl: teamDd.el,
              onChange: function (v) {
                state.teamId = v;
                reloadTeamData();
              },
            });
            if (teamSel) state.teamId = teamSel.getTeamId();
          }

          initEvents();
          loadDashboard();
          loadRecords();
          if (isManager) loadSyncStatus();
        }
        init();
      })();
    </script>
  </body>
</html>
