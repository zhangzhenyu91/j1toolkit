<!DOCTYPE html>
<!-- Shade 壹匣 · 出工日志网页版（方案A「安全橙传承」④：月历验证状态色点 + 当日日志卡片）
     功能与小程序端对齐：月历着色 / 当日卡片 / 水印照片大图 / 卡片直改（改派车·用车人·目的地 / 巡视内容（派车车辆上方）/ 打卡 /
     照片人名·重新验证·删除 / 备注（文字+附件，目的地下方；附件图片·视频媒体层预览、Office 文档 basemetas 预览，均可下载）/ 新建·删除日志）；
     右侧列表位为「记录 / 批量下载 / 验证报告」三页签（原批量下载、验证报告弹层已页签化；验证报告范围 = 不通过 ∪ 有备注）；
     API 直连主平台 /api/v1/worklog/*（Bearer token 经 Shade.api），ZIP 打包走 POST /api/v1/worklog/zip（fetch + blob） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出工日志 · Shade 壹匣</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  /* ===== 整页不滚动：仅日志卡片列表内部滚动（body 锁定 100vh，主内容 flex 撑满剩余视口） ===== */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  body > .topbar { flex: none; }
  /* theme.css 的 .page 带 margin:0 auto，body 为 flex 容器时 auto 外边距会使 stretch 失效、
     页面宽度退化为按内容收缩（空态/有记录态版心不一致的根源），此处显式 width:100% 恢复满宽 */
  .page { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; }
  /* 版心：页头行与两栏主体共用同一居中栏宽（宽屏限宽居中），空态/有记录态版心一致不跳变 */
  .wl-wrap { flex: 1; min-height: 0; width: 100%; max-width: 1560px; margin: 0 auto; display: flex; flex-direction: column; }
  .wl-head { flex: none; }

  /* ===== 页头操作区 ===== */
  .wl-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .wl-head .section-title { margin: 0; }
  .wl-head .acts { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  /* 全部 / 仅看我 分段开关 */
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: #fff; border: 1px solid var(--line); border-radius: 9px; }
  .seg button {
    border: none; background: transparent; height: 30px; padding: 0 14px; border-radius: 7px;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--sub); letter-spacing: 1px; cursor: pointer;
    transition: background .25s, color .25s;
  }
  .seg button:hover { color: var(--navy); }
  .seg button.on { background: var(--navy); color: #fff; font-weight: 700; }

  /* ===== 记录 / 批量下载 / 验证报告 页签：与顶栏导航、管理页页签同族（文字 + 橙色滑动指示条） ===== */
  .wl-tabs { position: relative; display: flex; gap: 4px; margin-top: 14px; border-bottom: 1px solid var(--hair); }
  .wl-tabs button {
    padding: 11px 20px; border: none; background: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 14px; font-weight: 600; color: var(--sub); letter-spacing: 1.5px;
    transition: color .25s;
  }
  .wl-tabs button:hover { color: var(--navy); }
  .wl-tabs button.on { color: var(--orange); }
  .wl-tabs button svg { width: 15px; height: 15px; }
  .wl-tab-ind {
    position: absolute; bottom: -1px; left: 0; width: 0; height: 3px;
    border-radius: 2px; background: var(--orange);
    transition: left .3s cubic-bezier(.16, 1, .3, 1), width .3s cubic-bezier(.16, 1, .3, 1);
  }

  /* ===== 主体两栏：左月历 / 右当日卡片流（撑满剩余高度，列内容超高时各自内部滚动） ===== */
  .wl-body { display: flex; gap: 20px; margin-top: 16px; flex: 1; min-height: 0; }

  /* ----- 月历卡（自适应内容高度，超高时自身滚动，不再 sticky——全局已无滚动条） ----- */
  .cal { width: 400px; flex: none; padding: 20px 22px 16px; align-self: flex-start; max-height: 100%; overflow-y: auto; }
  .cal-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .cal-h b { font-size: 15.5px; font-weight: 800; letter-spacing: 1px; }
  .cal-today {
    border: none; background: transparent; color: var(--orange); font-size: 11.5px; font-weight: 700;
    letter-spacing: 1px; cursor: pointer; padding: 3px 6px; border-radius: 6px; transition: background .25s;
  }
  .cal-today:hover { background: var(--orange-soft); }
  .cal-nav { margin-left: auto; display: flex; gap: 6px; }
  .cal-nav button {
    width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 7px; background: #fff;
    display: flex; align-items: center; justify-content: center; color: var(--sub); cursor: pointer;
    transition: border-color .25s, color .25s;
  }
  .cal-nav button:hover { border-color: var(--orange); color: var(--orange); }
  .cal-nav svg { width: 13px; height: 13px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-wd { text-align: center; font-size: 11px; color: var(--ph); padding: 6px 0; letter-spacing: 1px; }
  .day {
    position: relative; aspect-ratio: 1.08; display: flex; flex-direction: column; align-items: center;
    justify-content: center; border-radius: 9px; font-size: 13px; cursor: pointer;
    border: 1px solid transparent; transition: background .2s, box-shadow .2s;
  }
  .day:hover { background: var(--paper); }
  .day.dim { color: #CFC7B2; cursor: default; }
  .day.dim:hover { background: transparent; }
  .day .ds { display: flex; gap: 3px; height: 5px; margin-top: 3px; }
  .dt { width: 5px; height: 5px; border-radius: 50%; }
  .dt-ok { background: var(--green); }
  .dt-bad { background: var(--red); }
  /* 黄点 = 验证通过但有备注 */
  .dt-warn { background: #EAB308; }
  .day.today { background: var(--navy); color: #fff; font-weight: 700; }
  .day.today .dt-ok { background: #7ED3A5; }
  .day.today .dt-warn { background: #F5D96B; }
  .day.sel { box-shadow: 0 0 0 2px var(--orange); }
  .cal-lg {
    display: flex; gap: 16px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair);
    font-size: 11px; color: var(--sub); letter-spacing: .5px;
  }
  .cal-lg span { display: flex; align-items: center; gap: 6px; }
  .cal-lg .dt { width: 6px; height: 6px; }

  /* ----- 当日日志卡片流（日期导航由月历承担，无日期条，卡顶与月历卡顶齐平） ----- */
  .wl-list { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  /* 记录 / 批量下载 / 验证报告 三页签共用同一列表位：切换时上浮淡入，页签内容各自内部滚动 */
  .wl-list .pane { display: none; flex: 1; min-height: 0; }
  .wl-list .pane.on { display: flex; flex-direction: column; animation: paneIn .34s cubic-bezier(.16, 1, .3, 1); }
  @keyframes paneIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .pane > .rep-bar { flex: none; margin-bottom: 12px; }
  .pane-scroll {
    flex: 1; min-height: 0; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: rgba(34, 49, 78, .2) transparent;
  }
  .pane-foot { flex: none; display: flex; align-items: center; gap: 12px; padding-top: 14px; }
  .pane-foot .sp { margin-left: auto; display: flex; gap: 10px; }
  /* 页头控件按页签显隐用 hidden 属性；author display 规则优先级高于 UA [hidden]，需显式兜底 */
  .wl-head [hidden] { display: none !important; }
  /* 日志卡片列表容器：页面唯一滚动区；scrollbar-gutter 常驻槽位，滚动条出现/消失不引起横向抖动 */
  #cardFlow {
    flex: 1; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; transition: opacity .18s ease;
    scrollbar-width: thin; scrollbar-color: rgba(34, 49, 78, .2) transparent;
  }
  /* 切日/切范围加载中：保留旧内容微透明过渡（不再骨架闪屏），期间禁点 */
  #cardFlow.switching { opacity: .45; pointer-events: none; }
  /* 细滚动条：半透明藏青、悬停加深（弹层 .m-scroll 同口径，比米色实心更轻） */
  #cardFlow::-webkit-scrollbar, .cal::-webkit-scrollbar, .pane-scroll::-webkit-scrollbar { width: 5px; }
  #cardFlow::-webkit-scrollbar-thumb, .cal::-webkit-scrollbar-thumb, .pane-scroll::-webkit-scrollbar-thumb {
    background: rgba(34, 49, 78, .16); border-radius: 3px;
  }
  #cardFlow::-webkit-scrollbar-thumb:hover, .cal::-webkit-scrollbar-thumb:hover,
  .pane-scroll::-webkit-scrollbar-thumb:hover { background: rgba(34, 49, 78, .34); }
  #cardFlow::-webkit-scrollbar-track, .cal::-webkit-scrollbar-track, .pane-scroll::-webkit-scrollbar-track { background: transparent; }
  .linkbtn {
    border: none; background: transparent; color: var(--orange); font-size: 12px; font-weight: 700;
    letter-spacing: 1px; cursor: pointer; padding: 4px 6px; border-radius: 6px; transition: background .25s;
  }
  .linkbtn:hover { background: var(--orange-soft); }
  .photo-cnt { font-size: 11.5px; color: var(--ph); letter-spacing: 1px; }

  /* ----- 日志卡片 ----- */
  .log-card { overflow: hidden; margin-bottom: 16px; }
  .log-h { display: flex; align-items: center; gap: 10px; padding: 15px 22px; border-bottom: 1px solid var(--hair); }
  .log-h b { font-size: 15px; font-weight: 800; letter-spacing: .5px; }
  .log-h small { font-size: 11.5px; color: var(--ph); letter-spacing: 1px; }
  .log-h .tag { margin-left: auto; }
  /* 卡片主体：左栏信息 / 右栏照片两栏，黄金分割（照片侧为大侧 61.8%），间以发丝竖线 */
  .log-body { display: flex; align-items: stretch; }
  .log-side-l { width: 38.2%; flex: none; min-width: 0; display: flex; flex-direction: column; }
  .log-side-r { flex: 1; min-width: 0; border-left: 1px solid var(--hair); display: flex; flex-direction: column; }
  .log-rows { padding: 6px 22px; }
  .lrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--hair); }
  .lrow:last-child { border-bottom: none; }
  .lrow .li {
    width: 30px; height: 30px; flex: none; border-radius: 8px; background: var(--orange-soft);
    color: var(--orange); display: flex; align-items: center; justify-content: center;
  }
  .lrow .li svg { width: 16px; height: 16px; }
  .lrow .lk { width: 56px; flex: none; font-size: 12px; color: var(--ph); }
  .lrow .lv { font-size: 13.5px; font-weight: 600; }
  .lrow .lv small { display: block; margin-top: 2px; font-size: 11px; color: var(--ph); font-weight: 400; }
  /* 卡片头部可点击：打开改派车/用车人编辑弹层（同小程序点车牌头部） */
  .log-h { cursor: pointer; transition: background .25s; }
  .log-h:hover { background: #FFFDF9; }
  .log-h .he {
    flex: none; width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    color: var(--ph); transition: color .25s, background .25s;
  }
  .log-h:hover .he { color: var(--orange); background: var(--orange-soft); }
  .log-h .he svg { width: 14px; height: 14px; }
  /* 用车人打卡胶囊（点击切换打卡，同小程序 chips 直改） */
  .mchip {
    display: inline-flex; align-items: center; gap: 5px; margin: 2px 6px 2px 0; padding: 2px 10px;
    border: 1px solid var(--dash); border-radius: 999px; font-size: 12px; font-weight: 400; color: var(--sub);
    cursor: pointer; user-select: none; transition: border-color .25s, color .25s, background .25s;
  }
  .mchip:hover { border-color: var(--orange); color: var(--orange); }
  /* 已打卡为绿色（与「已验证」日历色点同 token）；.mchip.on 与 .mchip:hover 等优先级且居后，悬停仍保持绿色 */
  .mchip.on { border-color: var(--green); color: var(--green); background: #EAF5EF; font-weight: 600; }
  .m-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--dash); }
  .mchip.on .m-dot { background: var(--green); }
  /* 左栏底部操作行（margin-top:auto 沉底，与右侧照片区高度无关） */
  .log-acts { display: flex; justify-content: flex-end; margin-top: auto; padding: 4px 22px 14px; }
  .act-del {
    border: none; background: transparent; color: var(--red); font-size: 12px; letter-spacing: 1px;
    cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background .25s;
  }
  .act-del:hover { background: #FBE9E9; }
  /* 未通过原因逐行（上方留 12px 呼吸，与卡片头部分隔线节奏一致） */
  .fail-list { margin: 12px 22px 0; padding: 10px 14px; border-radius: 9px; background: #FBE9E9; }
  .fail-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--red); padding: 2.5px 0; }
  .fail-row svg { width: 13px; height: 13px; flex: none; }
  /* 巡视内容块（点击弹层看全文） */
  .patrol {
    margin: 12px 22px 0; padding: 10px 14px; border: 1px solid var(--hair); border-radius: 9px;
    font-size: 12.5px; color: var(--navy); line-height: 1.7; cursor: pointer;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    transition: border-color .25s, background .25s;
  }
  .patrol:hover { border-color: var(--orange); background: #FFFDF9; }
  .patrol .p-tag {
    display: inline-block; margin-right: 8px; font-size: 10.5px; font-weight: 700; color: var(--orange);
    background: var(--orange-soft); border-radius: 4px; padding: 1px 6px; letter-spacing: 1px;
  }
  /* 巡视内容块（点击弹层修改，同小程序） */
  .patrol .p-edit { float: right; color: var(--ph); display: flex; align-items: center; }
  .patrol .p-edit svg { width: 12px; height: 12px; }
  .patrol:hover .p-edit { color: var(--orange); }
  .patrol.none { color: var(--ph); }
  /* 备注块（左栏目的地下方；浅黄底 + 黄签黄字，与小程序及验证报告备注同色 #EAB308；
     无文字且无附件时不渲染，点击块进编辑） */
  .rmk {
    margin: 12px 22px 0; padding: 10px 14px; border: 1px solid #EFE3BC; background: #FDF6E3;
    border-radius: 9px; cursor: pointer; transition: border-color .25s, background .25s;
  }
  .rmk:hover { border-color: #EAB308; background: #FCF3D7; }
  .rmk .rk-tag {
    display: inline-block; margin-right: 8px; font-size: 10.5px; font-weight: 700; color: #fff;
    background: #EAB308; border-radius: 4px; padding: 1px 6px; letter-spacing: 1px;
  }
  .rmk .rk-edit { float: right; color: var(--ph); display: flex; align-items: center; }
  .rmk .rk-edit svg { width: 12px; height: 12px; }
  .rmk:hover .rk-edit { color: #EAB308; }
  .rmk .rk-text { font-size: 12.5px; font-weight: 700; color: #EAB308; line-height: 1.7; word-break: break-all; }
  /* 附件：图片 / 视频缩略图（视频深色底 + 播放标；点击进媒体大图层） */
  .rmk .rk-files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .rk-thumb {
    position: relative; width: 52px; height: 52px; border-radius: 8px; overflow: hidden;
    border: 1px solid #EFE3BC; background: var(--navy); cursor: zoom-in; display: block;
  }
  .rk-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rk-thumb .rk-play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .rk-thumb .rk-play svg { width: 20px; height: 20px; }
  /* 附件：Office 文档仅可点击文件名（下划线 + 安全橙，点击 basemetas 预览），行尾下载钮 */
  .rmk .rk-docs { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .rk-doc { display: flex; align-items: center; gap: 7px; font-size: 12px; min-width: 0; }
  .rk-doc > svg { width: 13px; height: 13px; flex: none; color: var(--ph); }
  .rk-doc .fn {
    color: var(--orange); font-weight: 600; text-decoration: underline; text-underline-offset: 2px;
    cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rk-doc .dl {
    flex: none; margin-left: auto; color: var(--ph); cursor: pointer; display: flex; align-items: center;
    padding: 3px; border-radius: 5px; transition: color .25s, background .25s;
  }
  .rk-doc .dl:hover { color: var(--orange); background: var(--orange-soft); }
  .rk-doc .dl svg { width: 13px; height: 13px; }
  /* 左栏操作行「备注」入口（与删除同族文字钮） */
  .log-acts { gap: 4px; }
  .act-note {
    border: none; background: transparent; color: var(--sub); font-size: 12px; letter-spacing: 1px;
    cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: background .25s, color .25s;
  }
  .act-note:hover { background: var(--paper); color: var(--navy); }
  /* 水印照片网格（右栏内）：flex:1 + 行高 1fr 均分吃满右栏剩余高度，照片少时自动拉长与左侧信息栏底部齐平；
     照片多于左侧时按 .ph 最小高度（≈4/3）自然撑开卡片 */
  .ph-lab { padding: 14px 22px 8px; font-size: 12px; color: var(--ph); letter-spacing: 1px; }
  .photos {
    display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; gap: 10px;
    padding: 0 22px 20px; flex: 1;
  }
  .ph {
    position: relative; min-height: 148px; border-radius: 9px; overflow: hidden; cursor: pointer;
    border: 1px solid var(--hair); background: var(--paper); transition: transform .3s, box-shadow .3s;
  }
  .ph:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph-st {
    position: absolute; top: 6px; left: 6px; border-radius: 4px; padding: 1px 6px;
    font-size: 10px; font-weight: 700; letter-spacing: .5px; color: #fff;
  }
  .ph-st.pass { background: rgba(242, 109, 33, .92); }
  .ph-st.ing { background: rgba(107, 118, 144, .92); }
  .ph-st.fail { background: rgba(207, 68, 68, .92); }
  .ph-miss { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
  .ph-mis { border-radius: 4px; padding: 1px 5px; font-size: 9.5px; font-weight: 700; color: #fff; background: rgba(207, 68, 68, .92); }
  .ph-info {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 8px 4px; display: flex; justify-content: space-between;
    font-size: 9.5px; color: rgba(255, 255, 255, .94); letter-spacing: .5px;
    background: linear-gradient(transparent, rgba(34, 49, 78, .68));
  }
  /* 无照片占位：虚线框撑满右栏（flex:1），边框可见、底部与左侧内容齐平 */
  .photos-empty {
    flex: 1; min-height: 140px; margin: 14px 22px 20px; border: 1.5px dashed var(--dash); border-radius: 9px;
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--ph); letter-spacing: 1px;
  }

  /* ===== 骨架屏 ===== */
  .sk-card { padding: 22px; margin-bottom: 16px; }
  .sk-l { height: 14px; border-radius: 6px; margin-bottom: 12px; }
  .sk-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
  .sk-row i { aspect-ratio: 4 / 3; border-radius: 9px; }

  /* ===== 大图遮罩层（Lightbox） ===== */
  .lb {
    position: fixed; inset: 0; z-index: 300; padding: 36px;
    background: rgba(27, 39, 64, .84); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; gap: 18px;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .lb.open { opacity: 1; pointer-events: auto; }
  .lb-stage { position: relative; max-width: min(68vw, 960px); display: flex; align-items: center; justify-content: center; }
  .lb-img {
    max-width: 100%; max-height: 84vh; border-radius: 12px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .4); opacity: 0; transition: opacity .4s;
  }
  .lb-img.show { opacity: 1; }
  .lb-count {
    position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%);

  /* 防伪码提示（防伪码只嵌印在水印照片画面中，接口不返回，此处引导核对） */
  .acode {

  .acode small { font-size: 10.5px; color: var(--ph); line-height: 1.7; letter-spacing: .5px; }
  /* 信息卡内照片操作（重新验证 / 修改人名 / 删除，同小程序卡片直改） */
  .lb-acts { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair); display: flex; flex-direction: column; gap: 8px; }
  .lb-acts .btn { width: 100%; justify-content: center; }
  .lb-acts .act-danger { color: var(--red); }
  .lb-acts .act-danger:hover { background: #FBE9E9; border-color: var(--red); }

  /* ===== 编辑弹层表单（改派车 / 巡视内容 / 照片人名） ===== */
  .f-lab { display: block; font-size: 12px; color: var(--ph); letter-spacing: 1px; margin: 14px 0 7px; }
  .f-lab:first-of-type { margin-top: 2px; }
  .f-sel, .f-ta {
    width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; outline: none;

  }
  .f-sel { height: 36px; padding: 0 10px; }
  .f-sel:focus, .f-ta:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(242, 109, 33, .12); }
  .f-sel:disabled { background: var(--paper); color: var(--ph); cursor: not-allowed; }
  .f-ta { min-height: 110px; padding: 10px 12px; line-height: 1.7; resize: vertical; }
  .f-hint { margin-top: 6px; font-size: 11px; color: var(--ph); letter-spacing: .5px; }
  /* 备注编辑弹层附件：缩略图 × 移除 + 虚线添加钮；文档文件条 */
  .att-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .att-cell { position: relative; width: 56px; height: 56px; }
  .att-thumb {
    width: 56px; height: 56px; border-radius: 8px; border: 1px solid var(--hair); overflow: hidden;
    background: var(--navy); display: flex; align-items: center; justify-content: center; color: #fff;
  }
  .att-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .att-thumb .att-play svg { width: 22px; height: 22px; }
  .att-x {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--navy); color: #fff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .att-x svg { width: 10px; height: 10px; }
  .att-add {
    width: 56px; height: 56px; border-radius: 8px; border: 1.5px dashed var(--dash); background: transparent;
    color: var(--ph); cursor: pointer; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; font-size: 10px; letter-spacing: 0; transition: border-color .25s, color .25s;
  }
  .att-add:hover { border-color: var(--orange); color: var(--orange); }

  .att-docs { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }

  .att-docrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att-docrow .att-x { position: static; width: 20px; height: 20px; background: transparent; color: var(--ph); }
  .att-docrow .att-x:hover { color: var(--red); }
  .att-docrow .att-x svg { width: 11px; height: 11px; }
  /* 点亮 chips（用车人选择 / 照片人名 / 快捷输入共用） */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--sub);

    transition: border-color .25s, color .25s, background .25s;
  }
  .chip:hover:not(:disabled) { border-color: var(--orange); color: var(--orange); }
  .chip.on { border-color: var(--orange); background: var(--orange-soft); color: var(--orange); font-weight: 600; }
  .chip:disabled { opacity: .45; cursor: not-allowed; }
  .chip.sm { padding: 3px 10px; font-size: 11.5px; }

  /* ===== 下载页签（日期范围 + 按月分组勾选；页签内嵌后自适应列宽） ===== */
  .dl-meta { margin-left: auto; font-size: 11.5px; color: var(--ph); letter-spacing: 1px; }
  .dl-month { font-size: 12.5px; font-weight: 800; letter-spacing: 1px; margin: 14px 0 8px; }
  .dl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }

  .dl-ph.sel .dl-tick { background: var(--orange); border-color: var(--orange); color: #fff; }
  .dl-day {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 6px 3px; text-align: center;
    font-size: 9.5px; color: rgba(255, 255, 255, .95); letter-spacing: .5px;
    background: linear-gradient(transparent, rgba(34, 49, 78, .68));
  }

  /* ===== 通用弹层（巡视内容 / 编辑 / 新建日志；下载与报告已页签化不再用弹层） ===== */
  .mask {
    position: fixed; inset: 0; z-index: 320; padding: 24px;
    background: rgba(27, 39, 64, .5); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .3s;
  }
  .mask.open { opacity: 1; }
  /* 外壳 overflow:hidden 保四角圆角；滚动内凹到 .m-scroll（外壳 6px 内边距 + 内层自带圆角），
     滚动条不贴右缘、不挤直角，样式维持细暖色 */
  .modal {
    background: #fff; border-radius: 14px; width: 560px; max-width: 94vw; max-height: 86vh;
    overflow: hidden; padding: 6px; display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(27, 39, 64, .25);
    transform: translateY(16px) scale(.98); transition: transform .35s cubic-bezier(.16, 1, .3, 1);
  }
  .m-scroll {
    flex: 1; min-height: 0; overflow-y: auto; border-radius: 9px; padding: 14px 18px 16px;
    scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: rgba(34, 49, 78, .2) transparent;
  }
  /* 细滚动条：半透明藏青、悬停加深，与页面滚动区同口径 */
  .m-scroll::-webkit-scrollbar { width: 5px; }
  .m-scroll::-webkit-scrollbar-thumb { background: rgba(34, 49, 78, .16); border-radius: 3px; }
  .m-scroll::-webkit-scrollbar-thumb:hover { background: rgba(34, 49, 78, .34); }
  .m-scroll::-webkit-scrollbar-track { background: transparent; }
  .mask.open .modal { transform: none; }
  .m-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .m-title { font-size: 15.5px; font-weight: 800; letter-spacing: 1px; }
  .m-x {
    margin-left: auto; width: 30px; height: 30px; border: none; border-radius: 8px; background: var(--paper);
    color: var(--sub); cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .25s, color .25s;
  }
  .m-x:hover { background: var(--orange-soft); color: var(--orange); }
  .m-x svg { width: 14px; height: 14px; }
  .m-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  /* ===== 验证报告 ===== */
  .rep-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .rep-bar input[type="date"] {
    height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px;
    font-size: 12.5px; color: var(--navy); background: #fff; outline: none; font-family: inherit;
    transition: border-color .25s, box-shadow .25s;
  }
  .rep-bar input[type="date"]:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(242, 109, 33, .12); }
  .rep-sep { color: var(--ph); font-size: 12px; }
  .rep-total { margin-left: auto; font-size: 11.5px; color: var(--ph); letter-spacing: 1px; }
  .rep-mine {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub);
    cursor: pointer; user-select: none; letter-spacing: 1px;
  }
  .rep-mine .sw {
    width: 30px; height: 17px; border-radius: 9px; background: var(--dash); position: relative;
    transition: background .25s; flex: none;
  }
  .rep-mine .sw::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; transition: left .25s; box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
  }
  .rep-mine.on { color: var(--orange); }
  .rep-mine.on .sw { background: var(--orange); }
  .rep-mine.on .sw::after { left: 15px; }
  .rep-date { font-size: 12.5px; font-weight: 800; letter-spacing: 1px; margin: 14px 0 8px; }
  .rep-date .cnt { margin-left: 8px; font-size: 11px; font-weight: 400; color: var(--red); }
  /* 报告行：上行车牌 + 用车人 + 跳转箭头，下行不通过说明独占一行自然换行（页签内嵌白底卡片） */
  .rep-row {
    display: block; padding: 12px 16px; border: 1px solid var(--hair); background: #fff;
    border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: border-color .25s, background .25s;
  }
  .rep-row:hover { border-color: var(--orange); background: #FFFDF9; }
  .rep-top { display: flex; align-items: center; gap: 12px; }
  .rep-plate { flex: none; font-size: 13.5px; font-weight: 700; }
  .rep-members { font-size: 12px; color: var(--sub); line-height: 1.6; }
  .rep-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .reason {
    font-style: normal; font-size: 11px; font-weight: 700; color: var(--red);
    background: #FBE9E9; border-radius: 5px; padding: 3px 9px; letter-spacing: .5px; line-height: 1.55;
  }
  /* 通过 / 免验证标识签（报告范围扩为「不通过 ∪ 有备注」后用于区分） */
  .reason.ok { color: var(--green); background: #EAF5EF; }
  .reason.exempt { color: var(--sub); background: var(--paper); }
  /* 报告备注行：明金黄 #EAB308；不展示文件，有附件时行首曲别针标记 */
  .rep-rmk { display: flex; align-items: flex-start; gap: 6px; margin-top: 8px; font-size: 12px; font-weight: 700; color: #EAB308; line-height: 1.6; }
  .rep-rmk svg { width: 13px; height: 13px; flex: none; margin-top: 2px; }
  /* 日期标题右侧备注计数（未通过计数沿用 .cnt 红色） */
  .rep-date .cnt2 { margin-left: 8px; font-size: 11px; font-weight: 400; color: var(--ph); }
  .rep-go { margin-left: auto; flex: none; color: var(--ph); display: flex; }
  .rep-go svg { width: 14px; height: 14px; }
  .rep-row:hover .rep-go { color: var(--orange); }

  /* ===== 卡片入场动效（克制：短距上浮 + 错峰） ===== */
  .anim-in { opacity: 0; transform: translateY(14px); transition: opacity .5s ease, transform .5s cubic-bezier(.16, 1, .3, 1); }
  .anim-in.in { opacity: 1; transform: none; }

  @media (max-width: 1024px) {
    .wl-body { flex-direction: column; }
    /* 窄屏纵向排列：月历限高（自身滚动），避免挤压下方日志列表 */
    .cal { width: 100%; max-height: 46vh; }
  }
  @media (max-width: 640px) {
    .photos { grid-template-columns: repeat(2, 1fr); }
    /* 窄屏卡片两栏回退为上下堆叠 */
    .log-body { flex-direction: column; }
    .log-side-l { width: 100%; }
    .log-side-r { border-left: none; border-top: 1px solid var(--hair); margin-top: 12px; }

    .lb-main { flex-direction: column; align-items: center; }
    .lb-side { width: 100%; max-height: none; }
    .topbar-nav { display: none; }
  }
</style>

<script>
/* ============================================================
   出工日志网页版：月历 / 当日卡片 / 照片大图 / 卡片直改 / 记录·批量下载·验证报告三页签（原下载、报告弹层已页签化）

   验证报告范围 = 不通过记录 ∪ 有备注记录（备注黄色行，不展示文件，有附件以曲别针标记）
   （水印照片上传依赖小程序拍摄·裁剪·定位加水印流程，网页端不提供，见回报说明）

(function () {
'use strict';
Shade.requireAuth();
/* 统一顶部导航（当前应用：出工日志） */
Shade.topbar({ active: 'worklog' });

/* ================= 工具 ================= */
var $ = function (s, c) { return (c || document).querySelector(s); };
var $$ = function (s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); };
var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function parseDate(s) { var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }

function fmtDateCN(s) { var d = parseDate(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + DOW[d.getDay()]; }
function todayStr() { return fmtDate(new Date()); }
/* 「2026 年 8 月」 */
function fmtMonthCN(m) { var a = m.split('-'); return a[0] + ' 年 ' + (+a[1]) + ' 月'; }
/* 报告默认范围：当天 ≤10 号 → 上月整月，否则本月 1 号 ~ 今天（沿用旧网页端口径） */
function defaultRange() {
  var now = new Date();
  if (now.getDate() <= 10) {
    return {
      from: fmtDate(new Date(now.getFullYear(), now.getMonth() - 1, 1)),
      to: fmtDate(new Date(now.getFullYear(), now.getMonth(), 0))
    };
  }
  return { from: fmtDate(new Date(now.getFullYear(), now.getMonth(), 1)), to: fmtDate(now) };
}

var modalStack = [];
function mHead(title) {
  return '<div class="m-head"><span class="m-title">' + esc(title) + '</span>'
    + '<button class="m-x">' + Shade.icon('close', 14) + '</button></div>';

function createModal(html, opts) {
  opts = opts || {};
  var mask = document.createElement('div');
  mask.className = 'mask';
  var box = document.createElement('div');
  box.className = 'modal';
  if (opts.width) box.style.width = opts.width + 'px';
  /* 内容包一层滚动容器：外壳 overflow:hidden 保圆角，滚动条内凹不贴角 */
  box.innerHTML = '<div class="m-scroll">' + html + '</div>';
  mask.appendChild(box);
  document.body.appendChild(mask);
  requestAnimationFrame(function () { mask.classList.add('open'); });
  var inst = {
    mask: mask, box: box, closed: false,
    close: function () {
      if (inst.closed) return;
      inst.closed = true;
      var i = modalStack.indexOf(inst);
      if (i >= 0) modalStack.splice(i, 1);
      mask.classList.remove('open');
      setTimeout(function () { mask.remove(); }, 300);
      if (opts.onClose) opts.onClose();
    }
  };
  mask.addEventListener('mousedown', function (e) { if (e.target === mask) inst.close(); });
  modalStack.push(inst);
  $$('.m-x', box).forEach(function (b) { b.addEventListener('click', inst.close); });
  return inst;
}

  state.entries.forEach(function (e) { if (e.id === eid) r = e; });

}

/* 加载当日日志；quiet=true 时保留现有内容（轮询静默刷新）。
   仅首次进页用骨架占位；之后切日/切范围保留旧内容加 .switching 微透明过渡、禁点，
   数据到位直接落位（不重播入场动画），避免骨架/卡片闪烁 */
async function loadLogs(opts) {
  opts = opts || {};
  clearPending();
  var flow = $('#cardFlow');
  var booted = flow.getAttribute('data-boot') === '1';
  if (!opts.quiet) {
    if (booted) flow.classList.add('switching');
    else renderSkeleton();
  }
  try {
    var r = await Shade.api('/api/v1/worklog/logs?date=' + state.date + '&scope=' + state.scope);
    state.entries = (r.data && r.data.list) || [];
    renderCards(!!opts.quiet || booted); // 静默刷新 / 切日切换不重播入场动画
    flow.setAttribute('data-boot', '1');
    flow.classList.remove('switching');
    if (!opts.quiet) flow.scrollTop = 0;
    if (!opts.poll) loadCalMonth(true); // 非轮询刷新时强刷月历着色
    schedulePending();
  } catch (e) {
    Shade.toast(e.message, 'error');
    flow.classList.remove('switching');
    if (!opts.quiet && !booted) { // 首次加载失败才清空为占位；切日失败保留旧内容
      state.entries = [];
      renderCards();
      flow.setAttribute('data-boot', '1');
    }
  }
}

/* 照片验证状态角标（与后端 verify_status 口径一致；旧值 date_mismatch/dest_mismatch 归入失败） */
function photoStatus(p) {
  if (p.verify_status === 'pending') return { cls: 'ing', txt: '验证中' };
  if (p.verify_status === 'passed') return { cls: 'pass', txt: '核验通过' };
  return { cls: 'fail', txt: '验证失败' };
}
/* 完成态逐项列「日期不符」「地点不符」 */
function photoMismatch(p) {
  var arr = [];
  if (p.date_ok === 0 || (p.date_ok == null && p.verify_status === 'date_mismatch')) arr.push('日期不符');
  if (p.dest_ok === 0 || (p.dest_ok == null && p.verify_status === 'dest_mismatch')) arr.push('地点不符');
  return arr;
}
function verifyText(p) {
  if (p.verify_status === 'pending') return '验证中';
  if (p.verify_status === 'passed') return '核验通过';
  var mis = photoMismatch(p);
  return '验证失败' + (mis.length ? '（' + mis.join('、') + '）' : '');
}

function photoHTML(p) {
  var st = photoStatus(p);
  var mis = photoMismatch(p);
  var html = '<figure class="ph" data-pid="' + p.id + '">'
    + '<img src="' + esc(p.url) + '" loading="lazy" alt="水印照片">'
    + '<span class="ph-st ' + st.cls + '">' + st.txt + '</span>';
  if (mis.length) {
    html += '<span class="ph-miss">' + mis.map(function (m) { return '<span class="ph-mis">' + m + '</span>'; }).join('') + '</span>';
  }
  html += '<figcaption class="ph-info"><span>' + esc((p.members || []).join('、')) + '</span>'
    + '<span>' + esc(String(p.shot_time || '').slice(0, 16)) + '</span></figcaption></figure>';
  return html;
}

/* 卡片验证状态 tag：验证通过=橙 / 未通过=红 / 免验证=藏青 */

  if (e.verify_passed === 'failed') return '<span class="tag tag-red">未通过</span>';

}

function renderCards(noAnim) {
  var flow = $('#cardFlow');
  var es = state.entries;
  /* 照片计数提示；批量下载走日期范围弹层（可选任意日期），不再与当日照片联动禁用 */
  var photoN = 0;
  es.forEach(function (e) { photoN += (e.photos || []).length; });
  $('#photoCnt').textContent = es.length ? ('共 ' + es.length + ' 条日志 · ' + photoN + ' 张照片') : '';

  /* 空态与有记录态同构：同一 #cardFlow 渲染，容器结构不变、入场动效一致，切换范围/日期不跳动 */
  if (!es.length) {
    flow.innerHTML = emptyHTML('当日暂无出工日志', state.scope === 'mine' ? '可切换「全部」查看班组当日记录' : '切换月历日期查看历史记录');
  } else {
    flow.innerHTML = es.map(function (e, i) { return cardHTML(e, i, es.length); }).join('');
  }
  /* 卡片入场：短距上浮错峰（静默刷新时直接落位；空态占位同口径） */
  $$('#cardFlow .anim-in').forEach(function (el, i) {
    if (noAnim) { el.classList.add('in'); return; }
    setTimeout(function () { el.classList.add('in'); }, RM ? 0 : 40 + i * 70);
  });
}

/* 验证中照片轮询：3s 后静默重拉（poll 标记：不触发月历强刷） */
function clearPending() {
  if (state.timer) { clearTimeout(state.timer); state.timer = 0; }
}
function schedulePending() {
  clearPending();
  var has = state.entries.some(function (e) {
    return (e.photos || []).some(function (p) { return p.verify_status === 'pending'; });
  });
  if (has) {
    state.timer = setTimeout(function () { loadLogs({ quiet: true, poll: true }); }, 3000);
  }
}

/* ================= 月历 ================= */
function syncCalMonth(d) {
  state.calY = d.getFullYear();
  state.calM = d.getMonth();
}
function loadCalMonth(force) {
  var ym = state.calY + '-' + pad(state.calM + 1);
  var key = state.scope + '|' + ym;
  renderCal(); // 先按缓存渲染（无缓存即无着色），数据回来后补着色
  if (!force && state.calCache[key] !== undefined) return;
  Shade.api('/api/v1/worklog/day-status?month=' + ym + '&scope=' + state.scope)
    .then(function (r) {
      state.calCache[key] = (r.data && r.data.map) || {};
      renderCal();
    })
    .catch(function () { /* 着色失败不阻塞选日，静默跳过 */ });
}
function shiftCalMonth(delta) {
  var m = state.calM + delta;
  state.calM = (m + 12) % 12;
  state.calY += (m < 0 ? -1 : (m > 11 ? 1 : 0));
  loadCalMonth();
}
function renderCal() {
  var y = state.calY, m = state.calM;
  var ym = y + '-' + pad(m + 1);
  var map = state.calCache[state.scope + '|' + ym] || {};
  var first = new Date(y, m, 1);
  var off = (first.getDay() + 6) % 7;            // 周一为一周开始
  var days = new Date(y, m + 1, 0).getDate();
  var prevDays = new Date(y, m, 0).getDate();
  var td = todayStr();

  $('#calYm').textContent = y + ' 年 ' + (m + 1) + ' 月';
  var html = '<span class="cal-wd">一</span><span class="cal-wd">二</span><span class="cal-wd">三</span>'
    + '<span class="cal-wd">四</span><span class="cal-wd">五</span><span class="cal-wd">六</span><span class="cal-wd">日</span>';
  var i, ds, st, dot;
  for (i = off - 1; i >= 0; i--) html += '<span class="day dim">' + (prevDays - i) + '</span>';
  for (i = 1; i <= days; i++) {
    ds = ym + '-' + pad(i);
    st = map[ds];
    dot = '';
    if (st === 'passed') dot = '<i class="dt dt-ok"></i>';
    else if (st === 'failed') dot = '<i class="dt dt-bad"></i>';
    else if (st === 'remark') dot = '<i class="dt dt-warn"></i>'; // 通过但有备注 → 黄点
    html += '<span class="day' + (ds === td ? ' today' : '') + (ds === state.date ? ' sel' : '') + '" data-d="' + ds + '">'
      + i + '<span class="ds">' + dot + '</span></span>';
  }
  var tail = (7 - (off + days) % 7) % 7;
  for (i = 1; i <= tail; i++) html += '<span class="day dim">' + i + '</span>';
  $('#calBody').innerHTML = html;
}

/* 切日（含跨月时月历随动） */
function gotoDate(nd) {
  if (nd === state.date) return;
  state.date = nd;
  var d = parseDate(nd);
  var crossMonth = (d.getFullYear() !== state.calY || d.getMonth() !== state.calM);
  syncCalMonth(d);
  renderCal();
  loadLogs();
  if (crossMonth) loadCalMonth();
}

/* ================= 照片大图遮罩层 ================= */
var lbInst = null; // {eid, items:[photo], idx}
function openLightbox(entry, idx) {
  if (!entry || !(entry.photos || []).length) return;
  lbInst = { eid: entry.id, items: entry.photos, idx: idx };
  renderLB();
  $('#lightbox').classList.add('open');
}
function closeLightbox() {
  lbInst = null;
  $('#lightbox').classList.remove('open');
}
/* 编辑/删除后按当前照片 id 在新数据里重定位；照片已删（或卡片已删）则关闭 */
function refreshLightbox() {
  if (!lbInst) return;
  var cur = lbInst.items[lbInst.idx];
  var en = findEntry(lbInst.eid);
  if (cur && en) {
    var idx = -1;
    (en.photos || []).forEach(function (p, i) { if (p.id === cur.id) idx = i; });
    if (idx >= 0) {
      lbInst.items = en.photos;
      lbInst.idx = idx;
      renderLB();

/* ================= 备注附件：下载 / 文档预览 / 上传 ================= */
/* 下载：经服务端回源代理（COS 跨域无 CORS），fetch + blob 落地（同 ZIP 打包下载口径） */
async function dlRemarkFile(entry, f) {
  try {
    var headers = {};
    var token = localStorage.getItem('shade_token');
    if (token) headers['Authorization'] = 'Bearer ' + token;
    var res = await fetch('/api/v1/worklog/logs/' + entry.id + '/remark-download?key=' + encodeURIComponent(f.cos_key), { headers: headers });
    if (res.status === 401) {
      localStorage.removeItem('shade_token');
      localStorage.removeItem('shade_user');
      location.href = '/login.html';
      return;
    }
    if (!res.ok) {
      var ej = null;
      try { ej = await res.json(); } catch (e) { }
      throw new Error((ej && ej.message) || ('下载失败（' + res.status + '）'));
    }
    var blob = await res.blob();
    var a = document.createElement('a');
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = f.name || '附件';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  } catch (e) {
    Shade.toast(e.message, 'error');
  }
}

/* Office 文档预览：调 remark-preview 取 basemetas 地址新标签打开（同安全日记录）；未配置预览服务时回退直接下载 */
async function openRemarkDoc(entry, f) {
  try {
    var r = await Shade.api('/api/v1/worklog/logs/' + entry.id + '/remark-preview?key=' + encodeURIComponent(f.cos_key));
    if (r.data && r.data.url) {
      window.open(r.data.url, '_blank');
      return;
    }
    throw new Error('预览地址为空');
  } catch (e) {
    Shade.toast((e.message || '预览失败') + '，已改为直接下载', 'info');
    dlRemarkFile(entry, f);
  }
}

/* 上传单个备注附件（multipart；返回入库用文件元数据） */
async function uploadRemarkFile(entryId, f) {
  var fd = new FormData();
  fd.append('name', f.name);
  fd.append('file', f.file, f.name);
  var headers = {};
  var token = localStorage.getItem('shade_token');
  if (token) headers['Authorization'] = 'Bearer ' + token;
  var res = await fetch('/api/v1/worklog/logs/' + entryId + '/remark-files', { method: 'POST', headers: headers, body: fd });
  if (res.status === 401) {
    localStorage.removeItem('shade_token');
    localStorage.removeItem('shade_user');
    location.href = '/login.html';
    throw new Error('登录已过期');
  }
  var j = null;
  try { j = await res.json(); } catch (e) { }
  if (res.ok && j && j.code === 0) return j.data;
  throw new Error((j && j.message) || ('附件上传失败（' + res.status + '）'));
}

/* ================= 备注编辑弹层（文字 + 附件；「保 存」时新附件先传 COS 再 PUT 全量字段） ================= */
var RMK_DOC_EXTS = ['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'pdf'];
var RMK_IMG_EXTS = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'];
var RMK_VIDEO_EXTS = ['mp4', 'mov', 'm4v'];
function fileExt(name) {
  var i = String(name || '').lastIndexOf('.');
  return i === -1 ? '' : String(name).slice(i + 1).toLowerCase();
}
function openRemarkModal(entry) {
  /* files：已传附件带 cos_key（isNew=false 原样回传）；新选文件带 File 对象（isNew=true 保存时上传）；
     k 为本地唯一键（已传附件用 cos_key，新选文件用随机键），供移除定位 */
  var files = (entry.remark_files || []).map(function (f) {
    return { k: f.cos_key, name: f.name, url: f.url, cos_key: f.cos_key, type: f.type, size: f.size, isNew: false };
  });
  var html = mHead('编辑备注')
    + '<div class="f-hint" style="margin:0 0 2px">' + esc(fmtDateCN(entry.log_date)) + ' · ' + esc(entry.vehicle_id == null ? '未出车' : entry.plate_no) + '</div>'
    + '<label class="f-lab">备注内容</label>'
    + '<textarea class="f-ta" id="rkTa" placeholder="请输入备注（可空）" maxlength="500">' + esc(entry.remark || '') + '</textarea>'
    + '<label class="f-lab">附件（图片 / 视频 / Office 文档，最多 9 个）</label>'
    + '<div class="att-grid" id="rkGrid"></div>'
    + '<div class="att-docs" id="rkDocs"></div>'
    + '<div class="f-hint">Office 文档支持 doc / docx / xls / xlsx / ppt / pptx / pdf；单个附件不超过 50MB，保存时上传</div>'
    + '<input type="file" id="rkFileMedia" hidden multiple accept="image/*,video/*">'
    + '<input type="file" id="rkFileDoc" hidden multiple accept=".doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf">'
    + '<div class="m-foot"><button class="btn btn-sm" data-a="no">取消</button>'
    + '<button class="btn btn-sm btn-accent" data-a="yes">保 存</button></div>';
  var inst = createModal(html, { width: 560 });
  var saving = false;

  function renderAtt() {
    var media = files.filter(function (f) { return f.type !== 'doc'; });
    var docs = files.filter(function (f) { return f.type === 'doc'; });
    $('#rkGrid', inst.box).innerHTML = media.map(function (f) {
      var inner = f.type === 'video'
        ? '<span class="att-play">' + SVG_PLAY + '</span>'
        : '<img src="' + esc(f.url) + '" alt="备注附件">';
      return '<span class="att-cell"><span class="att-thumb">' + inner + '</span>'
        + '<button class="att-x" data-k="' + esc(f.k) + '" title="移除">' + Shade.icon('close', 10) + '</button></span>';
    }).join('') + (files.length < 9
      ? '<button class="att-add" data-t="media">' + Shade.icon('add', 16) + '图片/视频</button>'
        + '<button class="att-add" data-t="doc">' + SVG_DOC + 'Office 文档</button>'
      : '');
    $('#rkDocs', inst.box).innerHTML = docs.map(function (f) {
      return '<span class="att-docrow">' + SVG_DOC + '<span class="nm" title="' + esc(f.name) + '">' + esc(f.name) + '</span>'
        + '<button class="att-x" data-k="' + esc(f.k) + '" title="移除">' + Shade.icon('close', 11) + '</button></span>';
    }).join('');
    $$('.att-x', inst.box).forEach(function (b) {
      b.addEventListener('click', function () {
        files = files.filter(function (f) { return f.k !== b.dataset.k; });
        renderAtt();
      });
    });
    $$('.att-add', inst.box).forEach(function (b) {
      b.addEventListener('click', function () {
        $(b.dataset.t === 'doc' ? '#rkFileDoc' : '#rkFileMedia', inst.box).click();
      });
    });
  }

  function pickFiles(list, kind) {
    Array.prototype.slice.call(list).forEach(function (file) {
      if (files.length >= 9) { Shade.toast('附件最多 9 个', 'info'); return; }
      if (file.size > 50 * 1024 * 1024) { Shade.toast('单个附件不超过 50MB', 'info'); return; }
      var ext = fileExt(file.name);
      var type = RMK_IMG_EXTS.indexOf(ext) >= 0 ? 'image' : (RMK_VIDEO_EXTS.indexOf(ext) >= 0 ? 'video' : (RMK_DOC_EXTS.indexOf(ext) >= 0 ? 'doc' : ''));
      if (!type || (kind === 'doc') !== (type === 'doc')) {
        Shade.toast('不支持的文件类型：' + file.name, 'info');
        return;
      }
      files.push({
        k: 'new-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        name: file.name, type: type, size: file.size, file: file, isNew: true,
        url: type === 'image' ? URL.createObjectURL(file) : '',
      });
    });
    renderAtt();
  }
  $('#rkFileMedia', inst.box).addEventListener('change', function () { pickFiles(this.files, 'media'); this.value = ''; });
  $('#rkFileDoc', inst.box).addEventListener('change', function () { pickFiles(this.files, 'doc'); this.value = ''; });

  renderAtt();
  $('[data-a="no"]', inst.box).addEventListener('click', inst.close);
  $('[data-a="yes"]', inst.box).addEventListener('click', async function () {
    if (saving) return;
    saving = true;
    try {
      /* 新附件逐个上传（失败整体中止留弹层可重试）；已传附件原样回传 */
      var metas = [];
      for (var i = 0; i < files.length; i++) {
        var f = files[i];
        if (f.isNew) metas.push(await uploadRemarkFile(entry.id, f));
        else metas.push({ name: f.name, url: f.url, cos_key: f.cos_key, type: f.type, size: f.size });
      }
      /* PUT 全量字段：车牌/目的地/用车人取卡片最新值，仅替换备注（同小程序） */
      var payload = payloadOf(entry, entry.patrol_content, entry.vehicle_id > 0 ? entry.vehicle_id : -1,
        entry.destination_id || 0, (entry.members || []).map(function (m) { return m.member_id; }));
      payload.remark = $('#rkTa', inst.box).value.trim();
      payload.remark_files = metas;
      await Shade.api('/api/v1/worklog/logs/' + entry.id, { method: 'PUT', body: payload });
      inst.close();
      Shade.toast('备注已保存', 'success');
      refreshAfterEdit();
    } catch (e2) {
      saving = false;
      Shade.toast(e2.message, 'error');
    }
  });
}

/* 通用确认弹层（叠层）：返回 Promise<boolean>，遮罩/Esc/取消均视为否 */
function confirmAction(opts) {
  return new Promise(function (resolve) {
    var done = false;
    function finish(v) { if (!done) { done = true; resolve(v); } }
    var html = mHead(opts.title)
      + '<div style="font-size:13px;line-height:1.8">' + esc(opts.content) + '</div>'
      + '<div class="m-foot"><button class="btn btn-sm" data-a="no">取消</button>'
      + '<button class="btn btn-sm ' + (opts.danger ? 'btn-danger' : 'btn-accent') + '" data-a="yes">' + esc(opts.confirmText || '确定') + '</button></div>';
    var inst = createModal(html, { width: 420, onClose: function () { finish(false); } });
    $('[data-a="no"]', inst.box).addEventListener('click', inst.close);
    $('[data-a="yes"]', inst.box).addEventListener('click', function () { finish(true); inst.close(); });
  });
}

/* 编辑表单字典（车牌/目的地/成员），首次编辑时拉取并缓存 */
async function ensureMeta() {
  if (state.meta) return state.meta;
  var r = await Shade.api('/api/v1/worklog/meta');
  state.meta = r.data || { vehicles: [], destinations: [], members: [] };
  return state.meta;
}

/* 点亮 chips（sel 为 id 数组，dis 为禁用 id 数组；cid 为 string 比对） */
function chipsHTML(list, sel, dis) {
  return '<div class="chips">' + list.map(function (m) {
    var on = sel.indexOf(m.id) >= 0;
    var disabled = dis && dis.indexOf(m.id) >= 0;
    return '<button type="button" class="chip' + (on ? ' on' : '') + '" data-cid="' + m.id + '"'
      + (disabled ? ' disabled' : '') + '>' + esc(m.name) + '</button>';
  }).join('') + '</div>';
}
function bindChips(box) {
  $$('.chip[data-cid]', box).forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.disabled) return;
      b.classList.toggle('on');
    });
  });
}
function chipSelIds(box) {
  return $$('.chip.on[data-cid]', box).map(function (b) { return +b.dataset.cid; });
}

/* PUT 全量替换口径（同小程序）：未出车时目的地/用车人强制置空 */
function payloadOf(entry, patrol, vehicleId, destId, memberIds) {
  return {
    log_date: entry ? entry.log_date : state.date,
    patrol_content: patrol || '',
    vehicle_id: vehicleId > 0 ? vehicleId : null,
    destination_id: vehicleId > 0 && destId > 0 ? destId : null,
    member_ids: vehicleId > 0 ? memberIds : []
  };
}

/* ================= 下载页签（日期范围可选，口径同小程序下载面板） ================= */
/* Content-Disposition 文件名解析（RFC5987 优先） */
function cdFilename(cd) {
  var m = /filename\*=UTF-8''([^;]+)/i.exec(cd);
  if (m) { try { return decodeURIComponent(m[1].replace(/"/g, '')); } catch (e) { } }
  m = /filename="?([^";]+)"?/i.exec(cd);
  return m ? m[1] : '';
}
/* POST /api/v1/worklog/zip：打包选中照片（二进制响应 fetch + blob 下载），btn 为触发按钮（加载态） */
async function postZip(photos, btn) {
  btn.disabled = true;
  var old = btn.innerHTML;
  btn.innerHTML = Shade.icon('download', 15) + '打包下载中…';
  try {
    var headers = { 'Content-Type': 'application/json' };
    var token = localStorage.getItem('shade_token');
    if (token) headers['Authorization'] = 'Bearer ' + token;
    var res = await fetch('/api/v1/worklog/zip', {
      method: 'POST', headers: headers, body: JSON.stringify({ photos: photos })
    });
    if (res.status === 401) {
      localStorage.removeItem('shade_token');
      localStorage.removeItem('shade_user');
      location.href = '/login.html';
      return;
    }
    if (!res.ok) {
      var ej = null;
      try { ej = await res.json(); } catch (e) { }
      throw new Error((ej && (ej.message || ej.error)) || ('打包下载失败（' + res.status + '）'));
    }
    var name = cdFilename(res.headers.get('Content-Disposition') || '') || '水印照片.zip';
    var blob = await res.blob();
    var a = document.createElement('a');
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    Shade.toast('已开始下载 ' + photos.length + ' 张照片', 'success');
  } catch (e) {
    Shade.toast(e.message, 'error');
  }
  btn.disabled = false;
  btn.innerHTML = old;
}

/* 下载页签：起止日期默认值在 init 注入（与报告同口径）；查询/仅今天/仅看我/全选事件在 initEvents 绑定 */
async function loadDlPhotos() {
  if (!state.dl.from || !state.dl.to) { Shade.toast('请选择起止日期', 'info'); return; }
  if (state.dl.from > state.dl.to) { Shade.toast('开始日期不能晚于结束日期', 'info'); return; }
  var body = $('#dlBody');
  body.innerHTML = '<div class="loading"><span class="spin"></span>加载中…</div>';
  $('#dlGo').disabled = true;
  try {
    var r = await Shade.api('/api/v1/worklog/photos?from=' + state.dl.from + '&to=' + state.dl.to);
    state.dl.list = ((r.data && r.data.list) || []).map(function (p) {
      p.selected = true; // 默认全选，点缩略图反选（同小程序）
      return p;
    });
    renderDlPhotos();
  } catch (e) {
    state.dl.list = null;
    body.innerHTML = '<div class="empty">' + Shade.icon('error-circle', 44) + '<p>' + esc(e.message) + '</p></div>';
    $('#dlMeta').textContent = '';
  }
}
/* 「仅看我」为页头全局开关（state.scope）：记录与月历直接传 scope 接口筛选；
   下载页签沿用前端筛选（按昵称匹配照片人名，同小程序，photos 接口无 scope 参数） */
function dlVisibleList() {
  var mine = (Shade.user() && Shade.user().nickname) || '';
  return (state.dl.list || []).filter(function (p) {
    return state.scope !== 'mine' || (mine && (p.members || []).indexOf(mine) >= 0);
  });
}
/* 勾选态就地同步：不重渲染列表（否则全选开关 / 缩略图勾选的过渡动画随 DOM 重建丢失） */
function syncDlSelection() {
  var list = dlVisibleList();
  var selN = 0;
  list.forEach(function (p) { if (p.selected) selN++; });
  $$('#dlBody .dl-ph[data-pid]').forEach(function (fig) {
    var hit = null;
    list.forEach(function (p) { if (p.id === +fig.dataset.pid) hit = p; });
    if (hit) fig.classList.toggle('sel', !!hit.selected);
  });
  $('#dlAll').classList.toggle('on', list.length > 0 && selN === list.length);
  $('#dlSelCnt').textContent = '已选 ' + selN + ' / ' + list.length + ' 张';
  var go = $('#dlGo');
  go.disabled = !selN;
  go.innerHTML = Shade.icon('download', 15) + '打包下载（' + selN + '）';
}
/* 按月分组渲染（后端已按日期+上传序排列）；全选开关与已选计数在底部操作行，由 syncDlSelection 同步 */
function renderDlPhotos() {
  var body = $('#dlBody');
  var list = dlVisibleList();
  if (!list.length) {
    body.innerHTML = '<div class="empty">' + Shade.icon('image', 44) + '<p>该范围内暂无水印照片</p></div>';
    $('#dlMeta').textContent = '';
    $('#dlSelCnt').textContent = '';
    $('#dlAll').classList.remove('on');
    $('#dlGo').disabled = true;
    return;
  }
  var groups = [], cur = null;
  list.forEach(function (p) {
    if (!cur || cur.month !== p.month) { cur = { month: p.month, items: [] }; groups.push(cur); }
    cur.items.push(p);
  });
  body.innerHTML = groups.map(function (g) {
    return '<div class="dl-month">' + esc(fmtMonthCN(g.month)) + '</div>'
      + '<div class="dl-grid">' + g.items.map(function (p) {
        return '<figure class="dl-ph' + (p.selected ? ' sel' : '') + '" data-pid="' + p.id + '" title="点击切换选中">'
          + '<img src="' + esc(p.url) + '" loading="lazy" alt="水印照片">'
          + '<span class="dl-tick">' + Shade.icon('check', 11) + '</span>'
          + '<span class="dl-day">' + esc(p.log_date.slice(5).replace('-', '月')) + '日</span>'
          + '</figure>';
      }).join('') + '</div>';
  }).join('');
  $('#dlMeta').textContent = state.dl.from + ' ~ ' + state.dl.to;
  syncDlSelection();
}

/* ================= 页签切换（记录 / 批量下载 / 验证报告 共用同一列表位） ================= */
/* 页签指示条跟随（instant=true 首帧/窗口缩放直接落位，不滑残影） */
function moveWlTabInd(tab, instant) {
  if (!tab) return;
  var ind = $('#wlTabInd');
  if (instant) {
    ind.style.transition = 'none';
    ind.style.left = tab.offsetLeft + 'px';
    ind.style.width = tab.offsetWidth + 'px';
    void ind.offsetHeight; // 强制回流后恢复过渡
    ind.style.transition = '';
    return;
  }
  ind.style.left = tab.offsetLeft + 'px';
  ind.style.width = tab.offsetWidth + 'px';
}
function switchPane(key) {
  if (state.pane === key) return;
  state.pane = key;
  $$('#wlTabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.p === key); });
  moveWlTabInd($('#wlTabs button.on'));
  $$('.wl-list .pane').forEach(function (p) { p.classList.toggle('on', p.id === 'pane' + key); });
  /* 记录页专属控件（新建 / 计数）仅记录页显示；「全部 / 仅看我」为全局开关，三个页签常驻 */
  var isRec = key === 'Record';
  $('#photoCnt').hidden = !isRec;
  $('#btnCreate').hidden = !isRec;
  /* 下载页签首次进入按默认范围自动加载；验证报告每次切回都重查（卡片可直改备注，避免陈旧数据） */
  if (key === 'Dl' && state.dl.list === null) loadDlPhotos();
  if (key === 'Rep') loadReport();
}

/* ================= 验证报告（页签内嵌：不通过记录 ∪ 有备注记录） ================= */
async function loadReport() {
  if (!state.rep.from || !state.rep.to) { Shade.toast('请选择起止日期', 'info'); return; }
  var body = $('#repBody');
  body.innerHTML = '<div class="loading"><span class="spin"></span>加载中…</div>';
  try {
    var r = await Shade.api('/api/v1/worklog/report?from=' + state.rep.from + '&to=' + state.rep.to
      + '&scope=' + state.scope);
    var list = (r.data && r.data.list) || [];
    state.rep.loaded = true;
    var failedTotal = list.filter(function (x) { return (x.reasons || []).length; }).length;
    var rmkTotal = list.filter(function (x) { return x.remark || x.remark_has_files; }).length;
    $('#repTotal').textContent = '合计 ' + list.length + ' 条（未通过 ' + failedTotal + ' · 备注 ' + rmkTotal + '）';
    if (!list.length) {
      body.innerHTML = '<div class="empty">' + Shade.icon('check-circle', 44) + '<p>该范围内全部通过，亦无备注记录</p></div>';
      return;
    }
    /* 按 log_date 分组（保持接口顺序） */
    var groups = [], cur = null;
    list.forEach(function (it) {
      if (!cur || cur.date !== it.log_date) { cur = { date: it.log_date, items: [] }; groups.push(cur); }
      cur.items.push(it);
    });
    body.innerHTML = groups.map(function (g) {
      var failedN = g.items.filter(function (x) { return (x.reasons || []).length; }).length;
      var rmkN = g.items.filter(function (x) { return x.remark || x.remark_has_files; }).length;
      return '<div class="rep-group"><div class="rep-date">' + esc(fmtDateCN(g.date))
        + (failedN ? '<span class="cnt">' + failedN + ' 条未通过</span>' : '')
        + (rmkN ? '<span class="cnt2">' + rmkN + ' 条备注</span>' : '') + '</div>'
        + g.items.map(function (it) {
          var failed = (it.reasons || []).length > 0;
          /* 不通过原因 chips；无原因（仅备注入列）时以 通过/免验证 签标识 */
          var chips = failed
            ? it.reasons.map(function (x) { return '<em class="reason">' + esc(x) + '</em>'; }).join('')
            : '<em class="reason ' + (it.verify === 'exempt' ? 'exempt' : 'ok') + '">'
              + (it.verify === 'exempt' ? '免验证' : '通过') + '</em>';
          /* 备注行：黄色，不展示文件，有附件时行首曲别针标记 */
          var rmk = (it.remark || it.remark_has_files)
            ? '<div class="rep-rmk">' + (it.remark_has_files ? SVG_CLIP : '')
              + '<span><b>备注：</b>' + esc(it.remark || '（仅附件）') + '</span></div>'
            : '';
          return '<div class="rep-row" data-d="' + it.log_date + '" title="点击查看该日记录">'
            + '<div class="rep-top"><span class="rep-plate">' + esc(it.plate_no || '未出车') + '</span>'
            + '<span class="rep-members">' + esc((it.members || []).join('、')) + '</span>'
            + '<span class="rep-go">' + Shade.icon('chevron-right', 14) + '</span></div>'
            + '<div class="rep-chips">' + chips + '</div>' + rmk + '</div>';
        }).join('') + '</div>';
    }).join('');
  } catch (e) {
    body.innerHTML = '<div class="empty">' + Shade.icon('error-circle', 44) + '<p>' + esc(e.message) + '</p></div>';
    $('#repTotal').textContent = '';
  }
}

/* ================= 事件绑定 ================= */
function initEvents() {
  /* 月历 */
  $('#calPrev').addEventListener('click', function () { shiftCalMonth(-1); });
  $('#calNext').addEventListener('click', function () { shiftCalMonth(1); });
  $('#calBody').addEventListener('click', function (e) {
    var day = e.target.closest('.day[data-d]');
    if (day) gotoDate(day.dataset.d);
  });
  $('#calToday').addEventListener('click', function () {
    var t = todayStr();
    syncCalMonth(parseDate(t));
    loadCalMonth(true);
    gotoDate(t);
  });
  /* 全部 / 仅看我（全局开关，三页签共用）：切换后重拉记录并清空月历缓存；
     下载页签已加载则前端重筛，报告页签已加载则按新 scope 重查 */
  $$('#segScope button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.classList.contains('on')) return;
      $$('#segScope button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      state.scope = b.dataset.v;
      state.calCache = {};
      loadLogs();
      if (state.dl.list !== null) renderDlPhotos();
      if (state.rep.loaded) loadReport();
    });
  });
  /* 记录 / 批量下载 / 验证报告 页签切换；新建日志 */
  $$('#wlTabs button').forEach(function (b) {
    b.addEventListener('click', function () { switchPane(b.dataset.p); });
  });
  window.addEventListener('resize', function () { moveWlTabInd($('#wlTabs button.on'), true); });
  $('#btnCreate').addEventListener('click', function () { openEntryForm(null); });
  /* 下载页签：查询 / 仅今天 / 全选 / 缩略图勾选 / 打包下载（仅看我走页头全局开关） */
  $('#dlQuery').addEventListener('click', function () {
    state.dl.from = $('#dlFrom').value;
    state.dl.to = $('#dlTo').value;
    loadDlPhotos();
  });
  $('#dlToday').addEventListener('click', function () {
    state.dl.from = state.dl.to = todayStr();
    $('#dlFrom').value = state.dl.from;
    $('#dlTo').value = state.dl.to;
    loadDlPhotos();
  });
  $('#dlAll').addEventListener('click', function () {
    var target = !this.classList.contains('on');
    (state.dl.list || []).forEach(function (p) { p.selected = target; });
    syncDlSelection();
  });
  $('#dlBody').addEventListener('click', function (e) {
    var fig = e.target.closest('.dl-ph[data-pid]');
    if (!fig) return;
    (state.dl.list || []).forEach(function (p) { if (p.id === +fig.dataset.pid) p.selected = !p.selected; });
    syncDlSelection();
  });
  $('#dlGo').addEventListener('click', function () {
    var picked = (state.dl.list || []).filter(function (p) { return p.selected; });
    if (!picked.length) { Shade.toast('请先勾选要下载的照片', 'info'); return; }
    /* 按 (log_date, id) 排序，文件名沿用旧网页端规则：日期-照片id.jpg */
    picked.sort(function (a, b) { return a.log_date < b.log_date ? -1 : a.log_date > b.log_date ? 1 : a.id - b.id; });
    var photos = picked.map(function (p) { return { url: p.url, name: p.log_date + '-' + p.id + '.jpg' }; });
    postZip(photos, this);
  });
  /* 报告页签：查询（仅看我走页头全局开关，scope 为接口传参）/ 点击报告行切回记录页签并跳到该日 */
  $('#repQuery').addEventListener('click', function () {
    state.rep.from = $('#repFrom').value;
    state.rep.to = $('#repTo').value;
    loadReport();
  });
  $('#repBody').addEventListener('click', function (e) {
    var row = e.target.closest('.rep-row[data-d]');
    if (!row) return;
    switchPane('Record');
    gotoDate(row.dataset.d);
  });
  /* 卡片流点击委派：改派车 / 打卡切换 / 删除日志 / 巡视内容·备注编辑 / 备注附件预览·下载 / 照片大图 */
  $('#cardFlow').addEventListener('click', function (e) {
    /* 备注附件：优先于备注块编辑（不冒泡到 data-act） */
    var ractEl = e.target.closest('[data-ract]');
    if (ractEl) {
      var rCard = ractEl.closest('.log-card');
      var rEntry = rCard && findEntry(+rCard.dataset.eid);
      if (!rEntry) return;
      var files = rEntry.remark_files || [];
      var ract = ractEl.dataset.ract;
      if (ract === 'media') {
        var media = files.filter(function (f) { return f.type === 'image' || f.type === 'video'; });
        openMediaLb(rEntry, media, +ractEl.dataset.idx || 0);
        return;
      }
      var hit = null;
      files.forEach(function (f) { if (f.cos_key === ractEl.dataset.key) hit = f; });
      if (!hit) return;
      if (ract === 'doc') openRemarkDoc(rEntry, hit);
      else if (ract === 'dl') dlRemarkFile(rEntry, hit);
      return;
    }
    var actEl = e.target.closest('[data-act]');
    if (actEl) {
      var card = actEl.closest('.log-card');
      var entry = card && findEntry(+card.dataset.eid);
      if (!entry) return;
      var act = actEl.dataset.act;
      if (act === 'edit') { openEntryForm(entry); return; }
      if (act === 'patrol') { openPatrolModal(entry); return; }
      if (act === 'remark') { openRemarkModal(entry); return; }
      if (act === 'del') { deleteEntry(entry); return; }
      if (act === 'check') { toggleCheck(entry, +actEl.dataset.mid, actEl); return; }
      return;
    }
    var fig = e.target.closest('.ph[data-pid]');
    if (fig) {
      var cd = fig.closest('.log-card');
      var en = findEntry(+cd.dataset.eid);
      if (!en) return;
      var idx = 0;
      (en.photos || []).forEach(function (p, i) { if (p.id === +fig.dataset.pid) idx = i; });
      openLightbox(en, idx);
    }
  });
  /* 大图遮罩层：点空白关闭（照片大图 / 备注媒体层）；Esc 关闭弹层/大图；左右箭头切换 */
  $('#lightbox').addEventListener('click', function (e) {
    if (e.target === this) {
      if (lbInst) closeLightbox();
      if (mlbInst) closeMediaLb();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (lbInst) { closeLightbox(); return; }
      if (mlbInst) { closeMediaLb(); return; }
      var top = modalStack[modalStack.length - 1];
      if (top) top.close();
      return;
    }
    if (lbInst && e.key === 'ArrowLeft') shiftLB(-1);
    else if (lbInst && e.key === 'ArrowRight') shiftLB(1);
    else if (mlbInst && e.key === 'ArrowLeft') shiftMediaLb(-1);
    else if (mlbInst && e.key === 'ArrowRight') shiftMediaLb(1);
  });
}

/* ================= 启动 ================= */
function init() {
  /* 静态图标注入 */
  $$('#wlTabs button').forEach(function (b) {
    b.insertAdjacentHTML('afterbegin', Shade.icon({ Record: 'task', Dl: 'download', Rep: 'file-safety' }[b.dataset.p], 14));
  });
  moveWlTabInd($('#wlTabs button.on'), true); // 页签指示条首帧落位
  $('#btnCreate').innerHTML = Shade.icon('add', 15) + '新建日志';
  $('#dlGo').innerHTML = Shade.icon('download', 15) + '打包下载';
  $('#calPrev').innerHTML = SVG_CHEV_L;
  $('#calNext').innerHTML = SVG_CHEV_R;

  /* 下载 / 报告页签默认日期范围（同口径：当天 ≤10 号上月整月，否则本月 1 号~今天） */
  var dr = defaultRange();
  state.dl.from = dr.from; state.dl.to = dr.to;
  state.rep.from = dr.from; state.rep.to = dr.to;
  $('#dlFrom').value = dr.from; $('#dlTo').value = dr.to;
  $('#repFrom').value = dr.from; $('#repTo').value = dr.to;

  /* 顶栏用户：接口失败回退本地缓存 */
  Shade.api('/api/v1/user/profile').then(function (r) {
    renderTopUser(r.data);
  }).catch(function () {
    renderTopUser(Shade.user());
  });

  initEvents();
  syncCalMonth(parseDate(state.date));
  loadCalMonth(true); // 月历先渲染（API 失败也保证网格展示），着色数据回来后补色
  loadLogs();
  Shade.reveal();
}
init();

})();
</script>
</body>
</html>
