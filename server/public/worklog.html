/* ---------- 人名点亮层（候选 = 本卡用车人；确认后按方式选片） ----------
   置灰规则：水印两种方式沿用「每人限一张，已上传者不可选」；非水印不占名额、不按已上传置灰。
   商旅打卡开启时（成员带 sgccBound 字段）：登录过期（sgccTokenStatus===0，红字「登录过期」红框）、
   未绑定（灰字「未绑定」）均置灰不可选——三类照片都会同步进被选中人的当日商旅费用照片 */
function openPhotoPickModal(entry, action) {
  var isPlain = action === 'plain';
  var used = isPlain ? {} : usedPhotoNames(entry);
  var members = (entry.members || []).slice().sort(function (a, b) { return (a.sort || 0) - (b.sort || 0); });
  var hint = isPlain
    ? '候选为本卡用车人；非水印照片不占每人限一张，上传后同步进被选中人的当日商旅费用照片'
    : '候选为本卡用车人；每人限一张，已上传者不可选';
  var html = mHead('选择照片所属人名')
    + '<div class="f-hint" style="margin:0 0 2px">' + hint + '</div>'
    + '<div class="chips" style="margin-top:10px">' + members.map(function (m) {
      var expired = m.sgccTokenStatus === 0;           // 商旅登录过期（红框红字，恢复前不可选）
      var unbound = !expired && m.sgccBound === false; // 未绑定商旅（灰字）
      var off = !!used[m.name] || expired || unbound;
      return '<button type="button" class="chip' + (expired ? ' exp' : '') + '" data-name="' + esc(m.name) + '"'
        + (off ? ' disabled' : '') + '>' + esc(m.name)
        + (expired ? '<small class="ck-exp">登录过期</small>' : (unbound ? '<small class="ck-unb">未绑定</small>' : ''))
        + '</button>';
    }).join('') + '</div>'
    + '<div class="m-foot"><button class="btn btn-sm" data-a="no">取消</button>'
    + '<button class="btn btn-sm btn-accent" data-a="yes">选择照片</button></div>';
  var inst = createModal(html, { width: 460 });
  bindChips(inst.box);
  $('[data-a="no"]', inst.box).addEventListener('click', inst.close);
  $('[data-a="yes"]', inst.box).addEventListener('click', function () {
    var names = $$('.chip.on[data-name]', inst.box).map(function (b) { return b.dataset.name; });
    if (!names.length) { Shade.toast('请选择照片所属人名', 'info'); return; }
    inst.close();
    if (action === 'wm') pickForWm(entry, names);
    else if (action === 'plain') pickPlain(entry, names);
    else pickRaw(entry, names);
  });
}

/* ---------- ① 选择水印照片上传：jpeg/png ≤15MB 原图 base64 直传（同小程序原链路） ---------- */
function pickRaw(entry, names) {
  pickImage('image/jpeg,image/png', function (file) {
    if (!/^image\/(jpeg|jpg|png)$/.test(file.type || '')) { Shade.toast('照片格式应为 jpeg/png', 'info'); return; }
    if (file.size > 15 * 1024 * 1024) { Shade.toast('照片大小应在 15MB 以内', 'info'); return; }
    var rd = new FileReader();
    rd.onload = function () { uploadPhoto(entry, String(rd.result || ''), names, null); };
    rd.onerror = function () { Shade.toast('图片读取失败', 'error'); };
    rd.readAsDataURL(file);
  });
}

/* ---------- ③ 非水印照片：jpeg/png ≤15MB 原图 base64 直传（plain:true；不渲染不验证不占每人限一张） ---------- */
function pickPlain(entry, names) {
  pickImage('image/jpeg,image/png', function (file) {
    if (!/^image\/(jpeg|jpg|png)$/.test(file.type || '')) { Shade.toast('照片格式应为 jpeg/png', 'info'); return; }
    if (file.size > 15 * 1024 * 1024) { Shade.toast('照片大小应在 15MB 以内', 'info'); return; }
    var rd = new FileReader();
    rd.onload = function () { uploadPhoto(entry, String(rd.result || ''), names, null, null, true); };
    rd.onerror = function () { Shade.toast('图片读取失败', 'error'); };
    rd.readAsDataURL(file);
  });
}

/* ---------- ② 选择照片并添加水印：选片 → 4:3 判定（按需裁剪）→ 水印字段编辑 → 上传 ---------- */
/* createImageBitmap 默认按 EXIF 方向解码（imageOrientation:from-image），宽高即显示宽高，
   后续 canvas 重绘导出 JPEG，方向已归一（上送 orientation 恒为 up） */
function pickForWm(entry, names) {
  pickImage('image/*', function (file) {
    if (!/^image\//.test(file.type || '')) { Shade.toast('请选择图片文件', 'info'); return; }
    createImageBitmap(file).then(function (bmp) {
      var ratio = bmp.width / bmp.height;
      /* 已是 4:3/3:4（±0.02 容差）免裁直进表单（同小程序相册口径），否则进裁剪层 */
      var is43 = Math.abs(ratio - 4 / 3) <= 0.02 || Math.abs(ratio - 3 / 4) <= 0.02;
      if (is43) {
        var image = bitmapToJpeg(bmp, 4096);
        if (bmp.close) bmp.close();
        openWmFormModal(entry, names, image);
        return;
      }
      openCropModal(file, bmp, function (image2) {
        openWmFormModal(entry, names, image2);
      });
    }).catch(function () { Shade.toast('图片读取失败', 'error'); });
  });
}
/* 位图 → JPEG dataURL：长边压到 maxEdge 内，黑底兜透明通道（同小程序裁剪导出口径） */
function bitmapToJpeg(bmp, maxEdge) {
  var k = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
  var w = Math.max(1, Math.round(bmp.width * k));
  var h = Math.max(1, Math.round(bmp.height * k));
  var cv = document.createElement('canvas');
  cv.width = w;
  cv.height = h;
  var cx = cv.getContext('2d');
  cx.fillStyle = '#000000';
  cx.fillRect(0, 0, w, h);
  cx.drawImage(bmp, 0, 0, w, h);
  return cv.toDataURL('image/jpeg', 0.92);
}

/* ---------- 4:3 裁剪层（横拍锁 4:3 / 纵拍锁 3:4；拖拽平移 + 滑块/滚轮缩放，cover 适配） ---------- */
function openCropModal(file, bmp, onDone) {
  var landscape = bmp.width >= bmp.height;
  var maxW = Math.max(200, Math.min(500, window.innerWidth * 0.94 - 60)); // 弹层宽度 560（窄屏 94vw）扣除内边距
  var maxH = Math.max(window.innerHeight - 360, 220); // 标题/提示/缩放条/按钮预留
  var fw, fh;
  if (landscape) { fw = maxW; fh = (fw * 3) / 4; }
  else { fh = Math.min((maxW * 4) / 3, maxH); fw = (fh * 3) / 4; }
  var imgUrl = URL.createObjectURL(file);
  var html = mHead('裁剪照片（' + (landscape ? '4:3' : '3:4') + '）')
    + '<div class="f-hint" style="margin:0 0 10px">拖动调整位置，滑块或滚轮缩放；水印按取景框范围渲染</div>'
    + '<div class="crop-frame" style="width:' + fw + 'px;height:' + fh + 'px"><img class="crop-img" src="' + imgUrl + '" draggable="false" alt="待裁剪照片"></div>'
    + '<div class="crop-bar"><span class="crop-z-lab">缩放</span><input type="range" class="crop-z" min="1" max="6" step="0.01" value="1"><span class="crop-pct">100%</span></div>'
    + '<div class="m-foot"><button class="btn btn-sm" data-a="no">取消</button>'
    + '<button class="btn btn-sm btn-accent" data-a="yes">确认裁剪</button></div>';
  var inst = createModal(html, {
    width: 560,
    onClose: function () { URL.revokeObjectURL(imgUrl); if (bmp.close) bmp.close(); }
  });
  var frame = $('.crop-frame', inst.box);
  var img = $('.crop-img', inst.box);
  var slider = $('.crop-z', inst.box);
  var pct = $('.crop-pct', inst.box);
  var bw = bmp.width, bh = bmp.height;
  var k = Math.max(fw / bw, fh / bh); // cover 适配基准倍率
  var z = 1;
  var x = (fw - bw * k) / 2;
  var y = (fh - bh * k) / 2;
  function clampPos() {
    var rw = bw * k * z, rh = bh * k * z;
    x = Math.min(0, Math.max(fw - rw, x));
    y = Math.min(0, Math.max(fh - rh, y));
  }
  function draw() {
    img.style.width = (bw * k * z) + 'px';
    img.style.left = x + 'px';
    img.style.top = y + 'px';
    slider.value = z;
    pct.textContent = Math.round(z * 100) + '%';
  }
  /* 缩放保持锚点（缺省取景框中心）下的图片点不动 */
  function setZoom(nz, ax, ay) {
    nz = Math.min(6, Math.max(1, nz));
    if (ax == null) { ax = fw / 2; ay = fh / 2; }
    var s0 = k * z, s1 = k * nz;
    x = ax - ((ax - x) / s0) * s1;
    y = ay - ((ay - y) / s0) * s1;
    z = nz;
    clampPos();
    draw();
  }
  var drag = null;
  frame.addEventListener('pointerdown', function (e) {
    drag = { px: e.clientX, py: e.clientY, x: x, y: y };
    frame.setPointerCapture(e.pointerId);
    frame.classList.add('dragging');
  });
  frame.addEventListener('pointermove', function (e) {
    if (!drag) return;
    x = drag.x + e.clientX - drag.px;
    y = drag.y + e.clientY - drag.py;
    clampPos();
    draw();
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) {
    frame.addEventListener(ev, function () { drag = null; frame.classList.remove('dragging'); });
  });
  frame.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = frame.getBoundingClientRect();
    setZoom(z * (e.deltaY < 0 ? 1.09 : 1 / 1.09), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  slider.addEventListener('input', function () { setZoom(parseFloat(slider.value)); });
  draw();
  $('[data-a="no"]', inst.box).addEventListener('click', inst.close);
  $('[data-a="yes"]', inst.box).addEventListener('click', function () {
    /* 可视区换算到图片像素 → 离屏 canvas 重绘裁出（长边 ≤2560，JPEG q0.92，同小程序口径） */
    var s = k * z;
    var sx = Math.max(0, -x / s);
    var sy = Math.max(0, -y / s);
    var sw = Math.min(bw - sx, fw / s);
    var sh = Math.min(bh - sy, fh / s);
    var ok = Math.min(1, 2560 / Math.max(sw, sh));
    var ow = Math.max(1, Math.round(sw * ok));
    var oh = Math.max(1, Math.round(sh * ok));
    var cv = document.createElement('canvas');
    cv.width = ow;
    cv.height = oh;
    var cx = cv.getContext('2d');
    cx.fillStyle = '#000000';
    cx.fillRect(0, 0, ow, oh);
    cx.drawImage(bmp, sx, sy, sw, sh, 0, 0, ow, oh);
    var out = cv.toDataURL('image/jpeg', 0.92);
    inst.close();
    onDone(out);
  });
}

/* ---------- 水印字段编辑弹层（预填规则同小程序：历史带入 / 无历史按定位取值 + 杆塔坐标入口） ---------- */
function openWmFormModal(entry, names, image) {
  var photos = entry.photos || [];
  var history = photos.filter(function (p) { return p.shot_time || p.work_content || p.location || p.lng || p.lat; });
  var last = history[history.length - 1];
  var noHistory = !last; // 无历史照片预填场景（决定是否按定位预填；「选择杆塔坐标」入口两种场景均显示，同小程序）
  var form = { content: '', time: '', weather: '', location: '', lng: '', lat: '' };
  if (last) {
    var l0 = parseFloat(last.lng), a0 = parseFloat(last.lat);
    var jd = Number.isFinite(l0) && Number.isFinite(a0) ? jitterCoord(l0, a0, 400) : { lng: '', lat: '' };
    form = {
      content: last.work_content || '',
      time: randomWmTime(last.shot_time),
      weather: last.weather || '',
      location: last.location || '',
      lng: jd.lng,
      lat: jd.lat
    };
  } else {
    /* 无历史：拍摄时间当日取当前时间，非当日仅能确定日期 → 取记录日期 10:00-12:00 内随机时间（同小程序） */
    form.time = state.date === todayStr() ? fmtWmTime(new Date()) : state.date.replace(/-/g, '.') + ' ' + randWmHm();
  }
  var html = mHead('编辑水印信息')
    + '<div class="wm-head"><img class="wm-thumb" src="' + image + '" alt="待加水印照片">'
    + '<div><div class="wm-names">' + esc(names.join('、')) + '</div><div class="wm-names-tip">照片所属人名</div></div></div>'
    + '<label class="f-lab">施工内容</label>'
    + '<div class="chips" style="margin:0 0 8px">' + QUICK_INPUTS.map(function (t) {
      return '<button type="button" class="chip sm" data-q="' + esc(t) + '">' + esc(t) + '</button>';
    }).join('') + '</div>'
    + '<textarea class="f-ta" id="wmContent" style="min-height:76px" maxlength="500" placeholder="请输入施工内容">' + esc(form.content) + '</textarea>'
    + '<label class="f-lab">拍摄时间</label><input class="f-sel" id="wmTime" maxlength="16" placeholder="YYYY.MM.DD HH:mm">'
    + '<label class="f-lab">天气<span class="wm-upd" id="wmUpdW" hidden>已更新</span></label><input class="f-sel" id="wmWeather" maxlength="64" placeholder="请输入天气">'
    + '<label class="f-lab">地点<span class="wm-upd" id="wmUpdL" hidden>已更新</span></label><input class="f-sel" id="wmLoc" maxlength="250" placeholder="请输入地点">'
    + '<label class="f-lab">经纬度</label><div class="wm-co">'
    + '<input class="f-sel" id="wmLng" placeholder="经度" maxlength="16"><input class="f-sel" id="wmLat" placeholder="纬度" maxlength="16">'
    + '<button class="btn btn-sm" id="wmTowerBtn" type="button">' + Shade.icon('location', 14) + '选择杆塔坐标</button>'
    + '</div>'
    + '<label class="f-lab">防伪码</label><div class="wm-code-row"><span class="wm-code" id="wmCode"></span>'
    + '<button class="linkbtn" id="wmCodeNew" type="button">换一换</button></div>'
    + '<div class="f-hint">确认后由服务端渲染水印并上传，随后自动进入验证</div>'
    + '<div class="m-foot"><button class="btn btn-sm" data-a="no">取消</button>'
    + '<button class="btn btn-sm btn-accent" data-a="yes">加水印并上传</button></div>';
  var inst = createModal(html, { width: 560 });
  var elContent = $('#wmContent', inst.box), elTime = $('#wmTime', inst.box);
  var elWeather = $('#wmWeather', inst.box), elLoc = $('#wmLoc', inst.box);
  var elLng = $('#wmLng', inst.box), elLat = $('#wmLat', inst.box);
  elTime.value = form.time;
  elWeather.value = form.weather;
  elLoc.value = form.location;
  elLng.value = form.lng;
  elLat.value = form.lat;
  var code = genAntiCode();
  var geoKey = null;      // 「上次取值坐标」记录（手动改经纬度防抖刷新去重用，同小程序 _wmGeoKey）
  var towerPicked = false; // 已选杆塔坐标（定位结果不再覆盖；天气/地点行显「已更新」标）
  var geoTimer = 0;
  var saving = false;
  $('#wmCode', inst.box).textContent = code;
  $('#wmCodeNew', inst.box).addEventListener('click', function () {
    code = genAntiCode();
    $('#wmCode', inst.box).textContent = code;
  });
  /* 快捷输入：点击追加到内容末尾（同小程序） */
  $$('[data-q]', inst.box).forEach(function (b) {
    b.addEventListener('click', function () {
      elContent.value = (elContent.value + b.dataset.q).slice(0, 500);
      elContent.focus();
    });
  });
  /* 经纬度变化统一调 /geo 覆盖刷新地点/天气；响应仅在弹层仍开且经纬度未再改动时应用（同小程序 refreshWmGeo） */
  function refreshGeo(lng, lat, tip) {
    lng = parseFloat(lng);
    lat = parseFloat(lat);
    geoKey = lng + ',' + lat;
    Shade.api(wl('/api/v1/worklog/geo?lng=' + lng + '&lat=' + lat)).then(function (r) {
      if (inst.closed) return;
      if (parseFloat(elLng.value) !== lng || parseFloat(elLat.value) !== lat) return;
      elWeather.value = (r.data && r.data.weather) || '';
      elLoc.value = (r.data && r.data.location) || '';
      if (tip) Shade.toast(tip, 'success');
    }).catch(function () {
      if (inst.closed) return;
      if (parseFloat(elLng.value) !== lng || parseFloat(elLat.value) !== lat) return;
      elWeather.value = ''; // 失败清空留空手填（同小程序口径）
      elLoc.value = '';
    });
  }
  /* 手动改经纬度：停顿 800ms 防抖后按新坐标刷新地点/天气（同小程序 scheduleWmGeoRefresh） */
  function scheduleGeo() {
    clearTimeout(geoTimer);
    geoTimer = setTimeout(function () {
      var lng = parseFloat(elLng.value);
      var lat = parseFloat(elLat.value);
      if (!Number.isFinite(lng) || !Number.isFinite(lat) || Math.abs(lng) > 180 || Math.abs(lat) > 90) return;
      if (lng + ',' + lat === geoKey) return;
      refreshGeo(lng, lat, '已按经纬度更新地点、天气');
    }, 800);
  }
  elLng.addEventListener('input', scheduleGeo);
  elLat.addEventListener('input', scheduleGeo);
  /* 「选择杆塔坐标」（有/无历史场景均显示）：级联选择后 ≤50m 波动带入并刷新地点、天气（同小程序） */
  var towerBtn = $('#wmTowerBtn', inst.box);
  if (towerBtn) {
    towerBtn.addEventListener('click', function () {
      openTowerModal(function (t) {
        var jd = jitterCoord(t.lng, t.lat, 50);
        towerPicked = true;
        elLng.value = jd.lng;
        elLat.value = jd.lat;
        $('#wmUpdW', inst.box).hidden = false;
        $('#wmUpdL', inst.box).hidden = false;
        refreshGeo(jd.lng, jd.lat, '已按杆塔坐标更新地点、天气');
      });
    });
  }
  /* 无历史预填：浏览器定位（WGS84→GCJ02）取经纬度并调 /geo 预填地点/天气；授权被拒或失败均留空手填（同小程序口径） */
  if (noHistory && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (pos) {
      if (inst.closed || towerPicked) return;
      var g = wgs2gcj(pos.coords.longitude, pos.coords.latitude);
      var lng = g[0].toFixed(6), lat = g[1].toFixed(6);
      elLng.value = lng;
      elLat.value = lat;
      geoKey = parseFloat(lng) + ',' + parseFloat(lat);
      Shade.api(wl('/api/v1/worklog/geo?lng=' + lng + '&lat=' + lat)).then(function (r) {
        if (inst.closed || towerPicked) return;
        if (!elWeather.value) elWeather.value = (r.data && r.data.weather) || '';
        if (!elLoc.value) elLoc.value = (r.data && r.data.location) || '';
      }).catch(function () { /* 反查失败留空手填 */ });
    }, function () { /* 授权被拒留空手填 */ }, { timeout: 10000 });
  }
  $('[data-a="no"]', inst.box).addEventListener('click', inst.close);
  $('[data-a="yes"]', inst.box).addEventListener('click', async function () {
    if (saving) return;
    saving = true;
    var wm = {
      content: elContent.value,
      time: elTime.value.trim(),
      weather: elWeather.value.trim(),
      location: elLoc.value.trim(),
      longitude: withDegSuffix(elLng.value, '°E'),
      latitude: withDegSuffix(elLat.value, '°N'),
      antiCode: code,
      orientation: 'up' // 网页端图片已经 canvas 重绘，EXIF 方向归一
    };
    var ok = await uploadPhoto(entry, image, names, wm, this);
    if (ok) inst.close();
    saving = false;
  });
}

/* ---------- 选择杆塔坐标（电压等级 → 线路名称 → 杆塔号 级联，均可输入关键字筛选；数据 GET /towers 内存缓存） ---------- */
function loadTowerRows() {
  if (state.towerRows) return Promise.resolve(state.towerRows);
  return Shade.api(wl('/api/v1/worklog/towers')).then(function (r) {
    var rows = (r.data && r.data.rows) || [];
    if (!rows.length) throw new Error('杆塔坐标数据为空');
    state.towerRows = rows;
    return rows;
  });
}
/* 可筛选下拉：输入关键字实时过滤（子串匹配）；点击输入框/箭头展开，箭头恢复完整列表（同小程序）；
   选中回填并触发 onPick；输入与已选不一致时触发 onEdit（级联清空下级，仅触发一次） */
function comboHTML(id) {
  return '<div class="combo" id="' + id + '">'
    + '<input class="f-sel combo-in" type="text" autocomplete="off" spellcheck="false">'
    + '<span class="combo-chev">' + SVG_CHEV_D + '</span>'
    + '<div class="combo-list"><div class="combo-list-in"></div></div>'
    + '</div>';
}
function makeCombo(box, id, hooks) {
  var root = $('#' + id, box);
  var input = $('.combo-in', root);
  var listEl = $('.combo-list', root);   // 外层：grid 高度过渡容器（.open 展开）
  var listIn = $('.combo-list-in', root); // 内层：边框/滚动/选项内容
  var items = [];   // [{label, ...}]（杆塔项另带 no/lng/lat）
  var cur = null;   // 已选项 label（输入与之不一致即视为改选）
  var isOpen = false;
  function render(kw) {
    var k = String(kw || '').trim();
    var html = '';
    items.forEach(function (it, i) {
      if (k && it.label.indexOf(k) === -1) return;
      html += '<div class="combo-opt" data-i="' + i + '">' + esc(it.label) + '</div>';
    });
    listIn.innerHTML = html || '<div class="combo-none">无匹配项</div>';
    listEl.classList.add('open');
    isOpen = true;
  }
  function close() { listEl.classList.remove('open'); isOpen = false; }
  function pick(i) {
    var it = items[i];
    if (!it) return;
    cur = it.label;
    input.value = it.label;
    close();
    hooks.onPick(it);
  }
  /* 展开：当前值即已选值时恢复完整列表，否则按当前值过滤 */
  input.addEventListener('focus', function () { if (!input.disabled) render(cur !== null && input.value === cur ? '' : input.value); });
  input.addEventListener('input', function () {
    if (input.value === cur) return;
    if (cur !== null) { cur = null; hooks.onEdit(); }
    render(input.value);
  });
  input.addEventListener('blur', function () { setTimeout(close, 120); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { close(); input.blur(); return; }
    if (e.key === 'Enter' && isOpen) {
      var first = $('.combo-opt', listEl);
      if (first) pick(+first.dataset.i); // 回车快捷选中首个匹配项
    }
  });
  $('.combo-chev', root).addEventListener('mousedown', function (e) {
    e.preventDefault(); // 保持输入框焦点
    if (input.disabled) return;
    if (isOpen) { close(); return; }
    render(''); // 箭头点击恢复完整列表（同小程序）
  });
  listEl.addEventListener('mousedown', function (e) {
    var opt = e.target.closest('.combo-opt');
    if (!opt) return;
    e.preventDefault(); // 先于 blur 选中，避免列表被提前关闭
    pick(+opt.dataset.i);
  });
  return {
    setItems: function (list, ph) {
      items = list || [];
      cur = null;
      input.value = '';
      input.placeholder = ph || '';
      input.disabled = false;
      close();
    },
    setDisabled: function (ph) {
      items = [];
      cur = null;
      input.value = '';
      input.placeholder = ph || '';
      input.disabled = true;
      close();
    },
    value: function () { return cur; }
  };
}

/* ================= 下载页签（日期范围可选，口径同小程序下载面板） ================= */
/* Content-Disposition 文件名解析（RFC5987 优先） */
function cdFilename(cd) {
  var m = /filename\*=UTF-8''([^;]+)/i.exec(cd);
  if (m) { try { return decodeURIComponent(m[1].replace(/"/g, '')); } catch (e) { } }
  m = /filename="?([^";]+)"?/i.exec(cd);
  return m ? m[1] : '';
}
/* POST /api/v1/worklog/zip：打包选中照片（二进制响应 fetch + blob 下载），btn 为触发按钮（加载态） */
async function postZip(photos, btn) {
  btn.disabled = true;
  var old = btn.innerHTML;
  btn.innerHTML = Shade.icon('download', 15) + '打包下载中…';
  try {
    var headers = { 'Content-Type': 'application/json' };
    var token = localStorage.getItem('shade_token');
    if (token) headers['Authorization'] = 'Bearer ' + token;
    var res = await fetch(wl('/api/v1/worklog/zip'), {
      method: 'POST', headers: headers, body: JSON.stringify({ photos: photos })
    });
    if (res.status === 401) {
      localStorage.removeItem('shade_token');
      localStorage.removeItem('shade_user');
      location.href = '/login.html';
      return;
    }
    if (!res.ok) {
      var ej = null;
      try { ej = await res.json(); } catch (e) { }
      throw new Error((ej && (ej.message || ej.error)) || ('打包下载失败（' + res.status + '）'));
    }
    var name = cdFilename(res.headers.get('Content-Disposition') || '') || '水印照片.zip';
    var blob = await res.blob();
    var a = document.createElement('a');
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    Shade.toast('已开始下载 ' + photos.length + ' 张照片', 'success');
  } catch (e) {
    Shade.toast(e.message, 'error');
  }
  btn.disabled = false;
  btn.innerHTML = old;
}

async function loadDlPhotos() {
  if (!state.dl.from || !state.dl.to) { Shade.toast('请选择起止日期', 'info'); return; }
  if (state.dl.from > state.dl.to) { Shade.toast('开始日期不能晚于结束日期', 'info'); return; }
  var body = $('#dlBody');
  body.innerHTML = '<div class="loading"><span class="spin"></span>加载中…</div>';

    var r = await Shade.api(wl('/api/v1/worklog/photos?from=' + state.dl.from + '&to=' + state.dl.to));
    state.dl.list = ((r.data && r.data.list) || []).map(function (p) {
      p.selected = true; // 默认全选，点缩略图反选（同小程序）
      return p;

/* 「仅看我」为页头全局开关（state.scope）：记录与月历直接传 scope 接口筛选；
   下载页签沿用前端筛选（按昵称匹配照片人名，同小程序，photos 接口无 scope 参数） */
function dlVisibleList() {
  var mine = (Shade.user() && Shade.user().nickname) || '';
  return (state.dl.list || []).filter(function (p) {

/* 勾选态就地同步：不重渲染列表（否则全选开关 / 缩略图勾选的过渡动画随 DOM 重建丢失） */
function syncDlSelection() {
  var list = dlVisibleList();
  var selN = 0;
  list.forEach(function (p) { if (p.selected) selN++; });
  $$('#dlBody .dl-ph[data-pid]').forEach(function (fig) {
    var hit = null;
    list.forEach(function (p) { if (p.id === +fig.dataset.pid) hit = p; });
    if (hit) fig.classList.toggle('sel', !!hit.selected);
  });
  $('#dlAll').classList.toggle('on', list.length > 0 && selN === list.length);
  $('#dlSelCnt').textContent = '已选 ' + selN + ' / ' + list.length + ' 张';
  var go = $('#dlGo');
  go.disabled = !selN;
  go.innerHTML = Shade.icon('download', 15) + '打包下载（' + selN + '）';
}
/* 按月分组渲染（后端已按日期+上传序排列）；全选开关与已选计数在底部操作行，由 syncDlSelection 同步 */
function renderDlPhotos() {
  var body = $('#dlBody');
  var list = dlVisibleList();
  if (!list.length) {
    body.innerHTML = '<div class="empty">' + Shade.icon('image', 44) + '<p>该范围内暂无水印照片</p></div>';
    $('#dlMeta').textContent = '';
    $('#dlSelCnt').textContent = '';
    $('#dlAll').classList.remove('on');
    $('#dlGo').disabled = true;
    return;
  }
  var groups = [], cur = null;
  list.forEach(function (p) {
    if (!cur || cur.month !== p.month) { cur = { month: p.month, items: [] }; groups.push(cur); }
    cur.items.push(p);
  });
  body.innerHTML = groups.map(function (g) {
    return '<div class="dl-month">' + esc(fmtMonthCN(g.month)) + '</div>'
      + '<div class="dl-grid">' + g.items.map(function (p) {
        return '<figure class="dl-ph' + (p.selected ? ' sel' : '') + '" data-pid="' + p.id + '" title="点击切换选中">'
          + '<img src="' + esc(p.url) + '" loading="lazy" alt="水印照片">'
          + '<span class="dl-tick">' + Shade.icon('check', 11) + '</span>'
          + '<span class="dl-day">' + esc(p.log_date.slice(5).replace('-', '月')) + '日</span>'
          + '</figure>';
      }).join('') + '</div>';
  }).join('');
  $('#dlMeta').textContent = state.dl.from + ' ~ ' + state.dl.to;
  syncDlSelection();
}

/* 改名（弹小层，回车 / 保存提交；名称不变直接关闭） */
function dictRename(seg, item) {
  var html = mHead('编辑' + seg.label)
    + '<input class="f-sel" id="drInput" style="height:40px" maxlength="64" autocomplete="off">'
    + '<div class="m-foot"><button class="btn btn-sm" data-a="no">取消</button>'
    + '<button class="btn btn-sm btn-accent" data-a="yes">保 存</button></div>';
  var inst = createModal(html, { width: 420 });
  var input = $('#drInput', inst.box);
  input.value = item.name;
  input.focus();
  input.select();
  var saving = false;
  async function submit() {
    var name = input.value.trim();
    if (!name) { Shade.toast('名称不能为空', 'info'); return; }
    if (name === item.name) { inst.close(); return; }
    if (saving) return;
    saving = true;
    try {
      await Shade.api(wl('/api/v1/worklog/admin/' + seg.key + '/' + item.id), { method: 'PUT', body: { name: name } });
      inst.close();
      Shade.toast('已保存', 'success');

      renderDict();
    } catch (e) {
      saving = false;
      Shade.toast(e.message, 'error');
    }
  }
  $('[data-a="no"]', inst.box).addEventListener('click', inst.close);
  $('[data-a="yes"]', inst.box).addEventListener('click', submit);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });

/* 杆塔导入：FormData 上传（字段 file；team_id 经 wl() 走 query，后端同口径解析）→ toast 后端 message → 刷新条数 */
async function importTowers(f) {

    if (token) headers['Authorization'] = 'Bearer ' + token;
    var res = await fetch(wl('/api/v1/worklog/towers/import'), { method: 'POST', headers: headers, body: fd });
    if (res.status === 401) {
      localStorage.removeItem('shade_token');
      localStorage.removeItem('shade_user');
      location.href = '/login.html';
      throw new Error('登录已过期');
    }
    var j = null;
    try { j = await res.json(); } catch (e) { }
    if (!res.ok || !j || j.code !== 0) throw new Error((j && j.message) || ('导入失败（' + res.status + '）'));
    wait.close();
    var skipped = j.data && j.data.skipped;
    Shade.toast((j.message || '导入完成') + (skipped ? '（跳过 ' + skipped + ' 行）' : ''), 'success');
    state.towerRows = null; // 加水印「选择杆塔坐标」缓存同步失效
    await loadTowerCount();
    renderDict();
  } catch (e) {
    wait.close();
    Shade.toast(e.message, 'error');
  }
}

/* ================= 页签切换（记录 / 批量下载 / 汇总前核验 共用同一列表位） ================= */
/* 页签指示条跟随（instant=true 首帧/窗口缩放直接落位，不滑残影） */
function moveWlTabInd(tab, instant) {
  if (!tab) return;
  var ind = $('#wlTabInd');
  if (instant) {
    ind.style.transition = 'none';
    ind.style.left = tab.offsetLeft + 'px';
    ind.style.width = tab.offsetWidth + 'px';
    void ind.offsetHeight; // 强制回流后恢复过渡
    ind.style.transition = '';
    return;
  }
  ind.style.left = tab.offsetLeft + 'px';
  ind.style.width = tab.offsetWidth + 'px';
}
function switchPane(key) {
  if (state.pane === key) return;
  state.pane = key;
  $$('#wlTabs button').forEach(function (b) { b.classList.toggle('on', b.dataset.p === key); });
  moveWlTabInd($('#wlTabs button.on'));
  $$('.wl-list .pane').forEach(function (p) { p.classList.toggle('on', p.id === 'pane' + key); });
  /* 记录页专属控件（新建 / 计数 / 从商旅拉取）仅记录页显示；「全部 / 仅看我」为全局开关，四个页签常驻 */
  var isRec = key === 'Record';
  $('#photoCnt').hidden = !isRec;
  $('#btnCreate').hidden = !isRec;
  $('#btnSyncCheck').hidden = !isRec;
  /* 下载页签首次进入按默认范围自动加载；汇总前核验每次切回都重查（卡片可直改备注，避免陈旧数据）；
     数据管理每次切回都重拉（字典可能被其他管理员改动） */
  if (key === 'Dl' && state.dl.list === null) loadDlPhotos();
  if (key === 'Rep') loadReport();
  if (key === 'Dict') loadDict();
  syncSideReport();
}

/* 宽屏（≥1600px）且处于记录页签时，汇总前核验常驻卡片流右侧（窄屏或其他页签仍为页签切换；
   首次进入按需加载，loaded 复位后（切班组等）自动重查） */
function syncSideReport() {
  var on = window.innerWidth >= 1600 && state.pane === 'Record';
  $('.wl-list').classList.toggle('rep-side', on);
  if (on && !state.rep.loaded) loadReport();
}

/* ================= 商旅打卡：从商旅拉取（按区段手动拉取） ================= */
/* 页头「从商旅拉取」弹层：说明 + 选区段发起拉取（POST /sync/pull {from,to}，以商旅平台为准覆盖本地）。
   权限归属出工日志（无独立 sgcc 权限）；超管可选班组（选项复用页头 #teamSel 数据源），其余角色不显示（服务端收敛本班） */
function openSyncCheck() {
  var isAdmin = (Shade.user() || {}).role === 'admin';
  var teamOpts = isAdmin ? $('#teamSel').innerHTML : '';
  var html = mHead('从商旅拉取')
    + '<div class="f-hint" style="margin:0">选择区段后，拉取班组内全部已绑定成员的打卡/费用/照片，以商旅平台为准覆盖本地。</div>'
    + '<label class="f-lab">拉取区段</label>'
    + '<div class="sg-range"><input type="date" class="f-sel" id="sgPullFrom" value="' + state.date + '">'
    + '<span>~</span><input type="date" class="f-sel" id="sgPullTo" value="' + state.date + '"></div>'
    + (teamOpts ? '<label class="f-lab">班组</label><select class="f-sel" id="sgPullTeam">' + teamOpts + '</select>' : '')
    + '<div class="m-foot" style="justify-content:flex-start;margin-top:12px">'
    + '<button class="btn btn-sm btn-accent" data-a="pull">' + Shade.icon('refresh', 14) + '发起拉取</button></div>';
  var inst = createModal(html, { width: 520 });
  var teamEl = $('#sgPullTeam', inst.box);
  if (teamEl && state.teamId) teamEl.value = String(state.teamId); // 默认当前生效班组
  var saving = false;
  $('[data-a="pull"]', inst.box).addEventListener('click', async function () {
    if (saving) return;
    var from = $('#sgPullFrom', inst.box).value;
    var to = $('#sgPullTo', inst.box).value;
    if (!from || !to) { Shade.toast('请选择拉取区段', 'info'); return; }
    if (from > to) { Shade.toast('开始日期不能晚于结束日期', 'info'); return; }
    /* team_id 仅超管且所选班组与当前生效班组不同时才带（相同由 wl() 查询串统一携带，其余角色服务端收敛本班） */
    var body = { from: from, to: to };
    if (teamEl) {
      var tid = Number(teamEl.value) || 0;
      if (tid && tid !== state.teamId) body.team_id = tid;
    }
    saving = true;
    try {
      var r = await Shade.api(wl('/api/v1/sgcc/sync/pull'), { method: 'POST', body: body });
      Shade.toast((r && r.message) || '拉取完成', 'success');
      if (from <= state.date && state.date <= to) loadLogs(); // 区段覆盖当前选中日期：刷新卡片流以落最新数据
    } catch (e) {
      Shade.toast(e.message, 'error');
    }
    saving = false;
  });
}

/* ================= 汇总前核验（页签内嵌：整月切换，仅未通过记录） ================= */
function syncRepMonthText() { $('#repMonth').textContent = fmtMonthCN(state.rep.month); }
/* 翻月（不看未来月） */
function shiftRepMonth(d) {
  var a = state.rep.month.split('-');
  var nm = fmtDate(new Date(+a[0], +a[1] - 1 + d, 1)).slice(0, 7);
  if (nm > todayStr().slice(0, 7)) return;
  state.rep.month = nm;
  syncRepMonthText();
  loadReport();
}
async function loadReport() {
  if (!state.rep.month) return;
  var y = +state.rep.month.slice(0, 4), m = +state.rep.month.slice(5, 7);
  var from = state.rep.month + '-01';
  var to = fmtDate(new Date(y, m, 0)); // 当月最后一天
  var body = $('#repBody');
  body.innerHTML = '<div class="loading"><span class="spin"></span>加载中…</div>';
  try {
    var r = await Shade.api(wl('/api/v1/worklog/report?from=' + from + '&to=' + to
      + '&scope=' + state.scope));
    /* 汇总前核验：范围收窄为仅未通过记录（verify==='failed'，前端筛即可），有备注的记录不再在此列出。
       「其余 N 条」口径：接口返回（未通过 ∪ 有备注）中核查通过（含免验证）的条数——
       通过且无备注的记录不在接口返回内，不计入 N */
    var all = (r.data && r.data.list) || [];
    var okN = all.filter(function (x) { return x.verify !== 'failed'; }).length;
    var list = all.filter(function (x) { return x.verify === 'failed'; });
    state.rep.loaded = true;
    $('#repTotal').textContent = '合计 ' + list.length + ' 条未通过';
    if (!list.length) {
      body.innerHTML = '<div class="empty">' + Shade.icon('check-circle', 44)
        + '<p>当月记录全部通过</p>'
        + '<p style="font-size:11.5px">规则 a~f；未出车免验证；非水印照片不参与</p></div>';
      return;
    }
    /* 按 log_date 分组（保持接口顺序） */
    var groups = [], cur = null;
    list.forEach(function (it) {
      if (!cur || cur.date !== it.log_date) { cur = { date: it.log_date, items: [] }; groups.push(cur); }
      cur.items.push(it);
    });
    body.innerHTML = groups.map(function (g) {
      return '<div class="rep-group"><div class="rep-date">' + esc(fmtDateCN(g.date))
        + '<span class="cnt">' + g.items.length + ' 条未通过</span></div>'
        + g.items.map(function (it) {
          var chips = (it.reasons || []).map(function (x) { return '<em class="reason">' + esc(x) + '</em>'; }).join('')
            || '<em class="reason">未通过</em>';
          return '<div class="rep-row" data-d="' + it.log_date + '" title="点击查看该日记录">'
            + '<div class="rep-top"><span class="rep-plate">' + esc(it.plate_no || '未出车') + '</span>'
            + '<span class="rep-members">' + esc((it.members || []).join('、')) + '</span>'
            + '<span class="rep-go">' + Shade.icon('chevron-right', 14) + '</span></div>'
            + '<div class="rep-chips">' + chips + '</div></div>';
        }).join('') + '</div>';
    }).join('')
      /* 底部绿色通过条：范围内其余记录全部通过，未在此列出 */
      + '<div class="rep-okbar">' + Shade.icon('check-circle', 15)
      + '<span>其余 ' + okN + ' 条记录全部通过，未在此列出（规则 a~f；未出车免验证；非水印照片不参与）</span></div>';
  } catch (e) {
    body.innerHTML = '<div class="empty">' + Shade.icon('error-circle', 44) + '<p>' + esc(e.message) + '</p></div>';
    $('#repTotal').textContent = '';
  }
}

/* ================= 事件绑定 ================= */
function initEvents() {
  /* 月历 */
  $('#calPrev').addEventListener('click', function () { shiftCalMonth(-1); });
  $('#calNext').addEventListener('click', function () { shiftCalMonth(1); });
  $('#calBody').addEventListener('click', function (e) {
    var day = e.target.closest('.day[data-d]');
    if (day) gotoDate(day.dataset.d);
  });
  $('#calToday').addEventListener('click', function () {
    var t = todayStr();
    syncCalMonth(parseDate(t));
    loadCalMonth(true);
    gotoDate(t);
  });
  /* 全部 / 仅看我（全局开关，四页签共用）：切换后重拉记录并清空月历缓存；
     下载页签已加载则前端重筛，核验页签已加载则按新 scope 重查 */
  $$('#segScope button').forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.classList.contains('on')) return;
      $$('#segScope button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      state.scope = b.dataset.v;
      state.calCache = {};
      loadLogs();
      if (state.dl.list !== null) renderDlPhotos();
      if (state.rep.loaded) loadReport();
    });
  });
  /* 记录 / 批量下载 / 汇总前核验 / 数据管理 页签切换；新建日志；从商旅拉取 */
  $$('#wlTabs button').forEach(function (b) {
    b.addEventListener('click', function () { switchPane(b.dataset.p); });
  });
  window.addEventListener('resize', function () { moveWlTabInd($('#wlTabs button.on'), true); syncSideReport(); });
  $('#btnCreate').addEventListener('click', function () { openEntryForm(null); });
  $('#btnSyncCheck').addEventListener('click', function () { openSyncCheck(); });
  /* 下载页签：查询 / 仅今天 / 全选 / 缩略图勾选 / 打包下载（仅看我走页头全局开关） */
  $('#dlQuery').addEventListener('click', function () {
    state.dl.from = $('#dlFrom').value;
    state.dl.to = $('#dlTo').value;
    loadDlPhotos();
  });
  $('#dlToday').addEventListener('click', function () {
    state.dl.from = state.dl.to = todayStr();
    $('#dlFrom').value = state.dl.from;
    $('#dlTo').value = state.dl.to;
    loadDlPhotos();
  });
  $('#dlAll').addEventListener('click', function () {
    var target = !this.classList.contains('on');
    (state.dl.list || []).forEach(function (p) { p.selected = target; });
    syncDlSelection();
  });
  $('#dlBody').addEventListener('click', function (e) {
    var fig = e.target.closest('.dl-ph[data-pid]');
    if (!fig) return;
    (state.dl.list || []).forEach(function (p) { if (p.id === +fig.dataset.pid) p.selected = !p.selected; });
    syncDlSelection();
  });
  $('#dlGo').addEventListener('click', function () {
    var picked = (state.dl.list || []).filter(function (p) { return p.selected; });
    if (!picked.length) { Shade.toast('请先勾选要下载的照片', 'info'); return; }
    /* 按 (log_date, id) 排序，文件名沿用旧网页端规则：日期-照片id.jpg */
    picked.sort(function (a, b) { return a.log_date < b.log_date ? -1 : a.log_date > b.log_date ? 1 : a.id - b.id; });
    var photos = picked.map(function (p) { return { url: p.url, name: p.log_date + '-' + p.id + '.jpg' }; });
    postZip(photos, this);
  });
  /* 报告页签：翻月（仅看我走页头全局开关，scope 为接口传参）/ 点击核验行切回记录页签并跳到该日 */
  $('#repPrev').addEventListener('click', function () { shiftRepMonth(-1); });
  $('#repNext').addEventListener('click', function () { shiftRepMonth(1); });
  $('#repBody').addEventListener('click', function (e) {
    var row = e.target.closest('.rep-row[data-d]');
    if (!row) return;
    switchPane('Record');
    gotoDate(row.dataset.d);
  });
  /* 数据管理页签：行内操作（改名 / 停启用 / 删除）/ 虚线行添加（按钮 + 输入框回车）/ 杆塔模板·导入（事件委托） */
  $('#dictBody').addEventListener('click', function (e) {
    var addBtn = e.target.closest('[data-dadd]');
    if (addBtn) { dictAdd(addBtn.dataset.dadd, addBtn); return; }
    var tBtn = e.target.closest('[data-tact]');
    if (tBtn) {
      if (tBtn.dataset.tact === 'tpl') downloadTowerTpl(tBtn);
      else $('#impFileInput').click();
      return;
    }
    var actBtn = e.target.closest('[data-dact]');
    if (!actBtn) return;
    var row = actBtn.closest('.drow');
    if (!row) return;
    var seg = dictSeg(row.dataset.seg);
    var item = { id: Number(row.dataset.id), name: row.dataset.name, status: Number(row.dataset.status) };
    if (!seg) return;
    if (actBtn.dataset.dact === 'edit') dictRename(seg, item);
    else if (actBtn.dataset.dact === 'toggle') dictToggle(seg, item);
    else if (actBtn.dataset.dact === 'del') dictDelete(seg, item);
  });
  $('#dictBody').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var input = e.target.closest ? e.target.closest('.dadd-in') : null;
    if (!input) return;
    var wrap = input.closest('.dadd');
    if (wrap) dictAdd(wrap.dataset.seg, $('button[data-dadd]', wrap));
  });
  /* 杆塔导入文件选择（前端先校验扩展名与大小） */
  $('#impFileInput').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    if (!/\.xlsx$/i.test(f.name)) { Shade.toast('仅支持 .xlsx 文件，请使用模板填写', 'info'); return; }
    if (f.size > 10 * 1024 * 1024) { Shade.toast('文件大小应在 10MB 以内', 'info'); return; }
    importTowers(f);
  });
  /* 卡片流点击委派：改派车 / 打卡切换 / 商旅打卡 slot（仅展示，提示去小程序打卡）/ 删除日志 /
     巡视内容·备注编辑 / 添加照片 / 备注附件预览·下载 / 照片大图 */
  $('#cardFlow').addEventListener('click', function (e) {
    /* 备注附件：优先于备注块编辑（不冒泡到 data-act） */
    var ractEl = e.target.closest('[data-ract]');
    if (ractEl) {
      var rCard = ractEl.closest('.log-card');
      var rEntry = rCard && findEntry(+rCard.dataset.eid);
      if (!rEntry) return;
      var files = rEntry.remark_files || [];
      var ract = ractEl.dataset.ract;
      if (ract === 'media') {
        var media = files.filter(function (f) { return f.type === 'image' || f.type === 'video'; });
        openMediaLb(rEntry, media, +ractEl.dataset.idx || 0);
        return;
      }
      var hit = null;
      files.forEach(function (f) { if (f.cos_key === ractEl.dataset.key) hit = f; });
      if (!hit) return;
      if (ract === 'doc') openRemarkDoc(rEntry, hit);
      else if (ract === 'dl') dlRemarkFile(rEntry, hit);
      return;
    }
    var actEl = e.target.closest('[data-act]');
    if (actEl) {
      var card = actEl.closest('.log-card');
      var entry = card && findEntry(+card.dataset.eid);
      if (!entry) return;
      var act = actEl.dataset.act;
      if (act === 'edit') { openEntryForm(entry); return; }
      if (act === 'patrol') { openPatrolModal(entry); return; }
      if (act === 'remark') { openRemarkModal(entry); return; }
      if (act === 'del') { deleteEntry(entry); return; }
      if (act === 'check') { toggleCheck(entry, +actEl.dataset.mid, actEl); return; }
      /* 商旅打卡 slot：Web 端仅展示不发起打卡（打卡需真实定位，在小程序完成） */
      if (act === 'sgccck') { Shade.toast('请在小程序端打卡', 'info'); return; }
      if (act === 'addphoto') { openAddSheet(entry); return; }
      return;
    }
    var fig = e.target.closest('.ph[data-pid]');
    if (fig) {
      var cd = fig.closest('.log-card');
      var en = findEntry(+cd.dataset.eid);
      if (!en) return;
      var idx = 0;
      (en.photos || []).forEach(function (p, i) { if (p.id === +fig.dataset.pid) idx = i; });
      openLightbox(en, idx);
    }
  });
  /* 大图遮罩层：点空白关闭（照片大图 / 备注媒体层）；Esc 关闭弹层/大图；左右箭头切换 */
  $('#lightbox').addEventListener('click', function (e) {
    if (e.target === this) {
      if (lbInst) closeLightbox();
      if (mlbInst) closeMediaLb();
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (lbInst) { closeLightbox(); return; }
      if (mlbInst) { closeMediaLb(); return; }
      var top = modalStack[modalStack.length - 1];
      if (top) top.close();
      return;
    }
    if (lbInst && e.key === 'ArrowLeft') shiftLB(-1);
    else if (lbInst && e.key === 'ArrowRight') shiftLB(1);
    else if (mlbInst && e.key === 'ArrowLeft') shiftMediaLb(-1);
    else if (mlbInst && e.key === 'ArrowRight') shiftMediaLb(1);
  });
}

/* ================= 超管班组切换器 ================= */
/* 自绘下拉（原 select 隐藏保留为数据源），初始隐藏，超管加载班组列表后显示 */
var teamDd = Shade.dropdown($('#teamSel'), { width: 'auto', minWidth: '132px', height: 36 });
teamDd.el.style.display = 'none';

/* 数据源 GET /admin/teams（仅启用班组）；选择持久化 localStorage.worklog_team_id，切换后整页数据重载 */
async function setupTeamSel() {
  var me = Shade.user() || {};
  if (me.role !== 'admin') return;
  try {
    var r = await Shade.api('/api/v1/admin/teams');
    var list = ((r.data && r.data.list) || []).filter(function (t) { return t.status === 1; });
    if (!list.length) return;
    var sel = $('#teamSel');
    sel.innerHTML = list.map(function (t) { return '<option value="' + t.id + '">' + esc(t.name) + '</option>'; }).join('');
    var saved = Number(localStorage.getItem('worklog_team_id')) || 0;
    state.teamId = list.some(function (t) { return t.id === saved; }) ? saved : list[0].id;
    sel.value = String(state.teamId);
    localStorage.setItem('worklog_team_id', String(state.teamId));
    teamDd.sync();
    teamDd.el.style.display = '';
    sel.addEventListener('change', function () {
      state.teamId = Number(this.value) || 0;
      localStorage.setItem('worklog_team_id', String(state.teamId));
      reloadTeamData();
    });
  } catch (e) { /* 班组列表拉取失败：不显示切换器，由后端落默认班组出数 */ }
}

/* 切换班组后整页重载：清空全部按班组缓存（月历着色 / 编辑字典 / 杆塔坐标 / 下载与报告列表） */
function reloadTeamData() {
  state.calCache = {};
  state.meta = null;
  state.towerRows = null;
  state.dl.list = null;
  state.rep.loaded = false;
  loadCalMonth(true);
  loadLogs();
  if (state.pane === 'Dl') loadDlPhotos();
  if (state.pane === 'Rep') loadReport();
  if (state.pane === 'Dict') loadDict(); // 数据管理页签随动刷新
  syncSideReport(); // 宽屏常驻核验栏随班组切换重查
}

  $('#wlTabs').style.display = 'none';
  $('.wl-body').style.display = 'none';
  var box = $('#noTeam');
  box.hidden = false;
  box.innerHTML = '<div class="empty">' + Shade.icon('usergroup', 44) +
    '<p><b>未分配班组</b></p>' +
    '<p style="font-size:12px">你的账号尚未加入任何班组，暂无可查看的数据。<br>请联系超级管理员分配班组后再使用。</p></div>';
}

/* ================= 启动 ================= */
async function init() {
  /* 静态图标注入 */
  $$('#wlTabs button').forEach(function (b) {
    b.insertAdjacentHTML('afterbegin', Shade.icon({ Record: 'task', Dl: 'download', Rep: 'file-safety', Dict: 'tools' }[b.dataset.p], 14));
  });
  moveWlTabInd($('#wlTabs button.on'), true); // 页签指示条首帧落位
  $('#btnCreate').innerHTML = Shade.icon('add', 15) + '新建日志';
  $('#btnSyncCheck').innerHTML = Shade.icon('refresh', 15) + '从商旅拉取';
  $('#dlGo').innerHTML = Shade.icon('download', 15) + '打包下载';
  $('#calPrev').innerHTML = SVG_CHEV_L;
  $('#calNext').innerHTML = SVG_CHEV_R;

  /* 下载页签默认日期范围（当天 ≤10 号上月整月，否则本月 1 号~今天）；核验页签默认当月 */
  var dr = defaultRange();
  state.dl.from = dr.from; state.dl.to = dr.to;
  $('#dlFrom').value = dr.from; $('#dlTo').value = dr.to;
  state.rep.month = todayStr().slice(0, 7);
  syncRepMonthText();
  $('#repPrev').innerHTML = SVG_CHEV_L; $('#repNext').innerHTML = SVG_CHEV_R;

  /* 顶栏用户：接口失败回退本地缓存 */
  Shade.api('/api/v1/user/profile').then(function (r) {
    renderTopUser(r.data);
  }).catch(function () {
    renderTopUser(Shade.user());
  });

  /* 班组隔离门控：非超管未分配班组 → 整页空态（屏十口径）；超管先选定切换班组再出数 */
  var me = Shade.user() || {};
  /* 数据管理页签仅超管 / 班组管理员可见 */
  if (me.role === 'admin' || me.role === 'team_admin') $('#tabDict').style.display = '';
  if (me.role !== 'admin' && !me.team_id) {
    renderNoTeam();
    Shade.reveal();
    return;
  }
  if (me.role === 'admin') await setupTeamSel();

  initEvents();
  syncCalMonth(parseDate(state.date));
  loadCalMonth(true); // 月历先渲染（API 失败也保证网格展示），着色数据回来后补色
  loadLogs();
  syncSideReport(); // 宽屏（≥1600px）记录页签下汇总前核验常驻右侧
  Shade.reveal();
}
init();

})();
</script>
</body>
</html>
