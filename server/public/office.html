<!doctype html>
<!-- Shade 壹匣 · 在线编辑/预览（ONLYOFFICE Docs 社区版承载页；多源承载：网盘文档双击/右键当前窗口打开
       （query space/path/mode），其余来源按 src 形态进入（如安全日记录 src=safeday&id=..、出工日志产物
       src=worklog-sheet&sheet=..&from=..&to=..）；query 除页面导航参数 back 外全部 decode 透传 /office/config，
       mode=view 为仅预览，后端对仅预览格式与非网盘来源强制 view + 只读权限）
     链路：Shade.api('/api/v1/office/config') 取签发配置（含 JWT）→ 动态加载 OO_PUBLIC_URL 的 api.js →
       DocsAPI.DocEditor 渲染；OnlyOffice 容器回源/回调 Shade 容器内网直走（j1toolkit 网络按容器名互通）；
       保存经回调写回网盘（customization.forcesave 即时落盘，仅编辑模式）
     外壳（v2 定稿 design/Web-在线编辑.html）：纯 OO 满铺——无 Shade 导航栏/备案条
       （body data-beian="off" 跳过 common.js 备案页脚注入）；返回 = OO 右上角「关闭文件」✕
       （customization.close + events.onRequestClose → query.back 指定来源页，仅放行 '/' 开头站内路径，
       缺省回 /netdisk.html），浏览器后退兜底；
       OO 侧 customization 紧凑单行工具栏（compactHeader/compactToolbar，tabStyle line）；
       打开动效：品牌加载层（单次上浮入场 + 细进度条）→ onDocumentReady 后交叉淡出/上浮揭示，
       一次编排落位即静止，prefers-reduced-motion 全关
     品牌标识（编辑器 header/加载页/About 的 Shade 壹匣 素材）经容器卷挂载替换，素材与清单见 docker/onlyoffice/ -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>在线编辑 · Shade 壹匣</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/theme.css" />
    <style>
      /* 在线编辑页内样式 · 政企蓝白 token 同 theme.css；纯 OO 满铺，无 Shade 外壳 */
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background: var(--card);
      }
      [hidden] {
        display: none !important;
      }

      /* 编辑器：铺满全窗；就绪后单次上浮揭示（transform 初始 translateY(10px) 透明） */
      #ooHolder {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: translateY(10px);
        transition:
          opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #ooHolder.on {
        opacity: 1;
        transform: none;
      }

      /* 加载/错误态：全窗遮层（白底），就绪后淡出 */
      .oo-state {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: var(--card);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ph);
        font-size: 13px;
        transition: opacity 0.3s ease;
      }
      .oo-state.out {
        opacity: 0;
        pointer-events: none;
      }
      .ld {
        text-align: center;
        animation: ldIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .ld-mk {
        width: 46px;
        height: 46px;
        margin: 0 auto 14px;
        display: block;
        box-shadow: 0 8px 20px rgba(14, 61, 168, 0.22);
      }
      .ld-name {
        max-width: min(420px, 80vw);
        margin: 0 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 600;
        color: var(--navy, #1d2129);
      }
      .ld-bar {
        width: 168px;
        height: 3px;
        margin: 14px auto 10px;
        border-radius: 2px;
        background: var(--line, #e5e6eb);
        overflow: hidden;
        position: relative;
      }
      .ld-bar i {
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: var(--orange);
        animation: ldSweep 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .ld-t {
        font-size: 12px;
        color: var(--ph, #86909c);
        letter-spacing: 1px;
      }
      @keyframes ldIn {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes ldSweep {
        to {
          left: 100%;
        }
      }
      .oo-err {
        text-align: center;
        max-width: 420px;
        line-height: 1.9;
      }
      .oo-err .btn {
        margin-top: 10px;
      }
      @media (prefers-reduced-motion: reduce) {
        #ooHolder {
          opacity: 1 !important;
          transform: none !important;
          transition: none;
        }
        .ld {
          animation: none;
        }
        .ld-bar i {
          animation: none;
        }
        .oo-state {
          transition: none;
        }
      }
    </style>
  </head>
  <body data-beian="off">
    <div id="ooHolder"></div>
    <div class="oo-state" id="ooState">
      <div class="ld">
        <img class="ld-mk" src="/favicon.svg" alt="Shade 壹匣" />
        <div class="ld-name" id="ldName"></div>
        <div class="ld-bar"><i></i></div>
        <div class="ld-t">正在加载编辑器…</div>
      </div>
    </div>

    <script src="/assets/icons.js"></script>
    <script src="/assets/common.js"></script>
    <script>
      Shade.requireAuth();

      (function () {
        var $ = Shade.$;
        var qs = new URLSearchParams(location.search);
        // 多源承载：query 除页面导航参数 back 外全部作 body 下发 /office/config（URLSearchParams 读取已 decode）——
        // 网盘形态 space/path/mode 行为不变；新形态（src=safeday&id=.. / src=worklog-sheet&sheet=..&from=..&to=.. 等）自然透传
        var body = {};
        // back/name 为页面导航与展示参数，不透传后端；name 供加载层与标题显示（新来源无 path 可取）
        qs.forEach(function (v, k) {
          if (k !== 'back' && k !== 'name') body[k] = v;
        });
        var mode = body.mode === 'view' ? 'view' : 'edit'; // 仅预览 / 协同编辑（后端对仅预览格式与新来源仍强制 view，前端不特判）
        body.mode = mode;
        var name = qs.get('name') || (body.path || '').split('/').filter(Boolean).pop() || '文档';

        document.title = name + (mode === 'view' ? ' · 在线预览' : ' · 在线编辑') + ' · Shade 壹匣';
        $('#ldName').textContent = name;

        // 当前窗口打开口径：返回 = 回来源页（query.back，仅放行 '/' 开头站内路径防 open redirect——
        // 次字符 '/'（//host）与 '\'（/\host，WHATWG 对 http(s) 特殊协议视同 '/'）都拦截，缺省回网盘页；
        // OO 右上角「关闭文件」同口径；浏览器后退亦可用）
        function back() {
          var target = qs.get('back') || '';
          location.href =
            target.charAt(0) === '/' && target.charAt(1) !== '/' && target.charAt(1) !== '\\'
              ? target
              : '/netdisk.html';
        }

        var stateEl = $('#ooState');
        function failState(msg) {
          stateEl.className = 'oo-state';
          stateEl.innerHTML =
            '<div class="oo-err">' +
            Shade.icon('warn', 40) +
            '<p>' +
            Shade.esc(msg) +
            '</p>' +
            '<button type="button" class="btn btn-primary" id="btnRetry">重新加载</button></div>';
          $('#btnRetry').addEventListener('click', function () {
            location.reload();
          });
        }

        Shade.api('/api/v1/office/config', { method: 'POST', body: body })
          .then(function (r) {
            var d = r.data || {};
            if (!d.public_url || !d.config) throw new Error('编辑器配置下发异常');
            var s = document.createElement('script');
            s.src = d.public_url.replace(/\/+$/, '') + '/web-apps/apps/api/documents/api.js';
            s.onload = function () {
              if (!window.DocsAPI || !window.DocsAPI.DocEditor) {
                failState('编辑器组件加载异常，请刷新重试');
                return;
              }
              var cfg = d.config;
              cfg.width = '100%';
              cfg.height = '100%';
              cfg.events = {
                // 文档渲染就绪：加载层淡出 + 编辑器上浮揭示（一次编排，落位即静止）
                onDocumentReady: function () {
                  stateEl.classList.add('out');
                  $('#ooHolder').classList.add('on');
                  setTimeout(function () {
                    stateEl.hidden = true;
                  }, 320);
                },
                onRequestClose: back, // 编辑器关闭按钮（customization.close）
                onError: function (e) {
                  console.error('[OO] 编辑器错误：', e);
                  failState(
                    '编辑器错误：' + ((e && e.data && e.data.errorDescription) || '未知错误')
                  );
                },
              };
              new window.DocsAPI.DocEditor('ooHolder', cfg);
            };
            s.onerror = function () {
              failState(
                '编辑器资源加载失败：无法访问 ONLYOFFICE 服务（' +
                  d.public_url +
                  '），请检查网络与反代配置'
              );
            };
            document.head.appendChild(s);
          })
          .catch(function (e) {
            failState(e.message || '加载失败，请稍后重试');
          });
      })();
    </script>
  </body>
</html>
