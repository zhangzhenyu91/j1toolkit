<!doctype html>
<!-- Shade 壹匣 · 交跨记录网页版（「政企蓝白」token；骨架同 treehazard.html：100vh 锁高 + 悬浮卡片 + 页签内部滚动）
     功能：看板四格（记录总数 / 本周新增 / 存在隐患 / 待确认线路，仅记录页签一级「线路视图」顶部展示）
     + 记录页签两级导航——一级线路视图（顶部搜索框输入即过滤线路名/电压等级 + 线路大卡片网格：标题「110kV 孝西线」
     + 存在隐患 n（>0 红字、=0 灰字）+ 总数灰字；排序 隐患数降 > 电压等级数值降 > 线路名 zh-CN 升序，
     「未匹配线路」伪组卡恒排尾；线路卡 stagger 上浮入场，点卡进二级）
     / 二级台账视图（← 返回线路 + 线路标题计数 + 扁平完整记录卡片流，视图切换 fade+slide）；
     导出走右下角全局悬浮按钮（FAB 弹层：范围 全部线路 / 当前线路（一级视图为「选择线路」下拉）+ 按线路分表 split=1 勾选，
     预览 /export/preview 经 Shade.openPreviewUrl 打开、下载 apiRaw + saveBlob，分线路带 ?line=）+ 记录 / 暂存区 / 冲突三页签；
     台账记录卡片扁平展示（无详情弹层分级；交跨无处理流程/状态、无辅证照片、无阈值设置）：默认折叠态一卡两行——
     标题行 区段 + 垂直距离双大字同级 + 有隐患橙点标 + 卡内折叠/展开开关（点卡非交互区同效），次级行 跨越类型 / 交叉角；
     展开态另出全字段网格（电压等级/线路名称/跨越区段/跨越类型/距小号/距大号/边线水平/垂直距离/交叉角/是否存在隐患/
     发现人/巡视时间/备注，空值跳过）+ 来源与推送信息行（来源/排查会话/排查记录/推送时间/创建/更新时间）
     + 卡内 删除（班管·超管）按钮，操作后随 loadRecords 同步重绘（折叠只藏展开区块，摘要常驻）；
     暂存区（批次 inline 编辑表格 13 业务列 + 转入/废弃）与冲突（系统值｜内网值对照、差异标红、二选一解决）页签、
     同步至内网 / 同步知识库仅超管·班组管理员可见（服务端 requireDictAdmin 同拦）；无人工新增/编辑入口（数据全部来自
     群捕获直推 / 暂存导入 / 内网回写）；
     班组隔离：超管页头班组切换下拉（localStorage.crossing_team_id，全部 /crossing/* 请求统一带 team_id，见 cx()），
     非超管固定本班、未分配班组整页空态（屏十口径）；API 直连主平台 /api/v1/crossing/*（Bearer token 经 Shade.api） -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>交跨记录 · Shade 壹匣</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/theme.css" />
    <style>
      /* ============================================================
     交跨记录页内样式 ·「政企蓝白」（色板全部走 theme.css 变量，骨架口径同 treehazard）
     ============================================================ */
      /* ===== 整页不滚动：仅页签内容区内部滚动（body 锁定 100vh，主内容 flex 撑满剩余视口） ===== */
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* theme.css 的 .page 带 margin:0 auto，flex 容器内显式 width:100% 恢复满宽（同 treehazard 口径） */
      .page {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        width: 100%;
        padding-bottom: 24px;
      }
      .cx-wrap {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .cx-wrap [hidden] {
        display: none !important;
      } /* author display 规则优先于 UA [hidden]，显式兜底 */

      /* ===== 入场关键帧：k-fade / k-rise 共享自 theme.css（一次上浮/淡入后静止） ===== */
      /* 线路 ↔ 台账视图切换：内容整体 fade + slide（renderRecords 重渲染时由 JS 挂 .view-in 触发） */
      .view-in {
        animation: k-rise 0.34s var(--ease);
      }

      /* ===== 页头：标题 + 副标；右侧操作区（班组切换） ===== */
      .cx-head {
        flex: none;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 14px 24px;
        flex-wrap: wrap;
      }
      .cx-head .section-title {
        display: block;
        margin: 0;
      }
      .cx-kick {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2px;
        color: var(--orange);
        animation: k-fade 0.5s var(--ease) 0.06s both;
      }
      .cx-head .section-title h3 {
        margin-top: 6px;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 1px;
        animation: k-fade 0.55s var(--ease) 0.12s both;
      }
      .cx-head .section-title .more {
        display: block;
        margin: 8px 0 0;
        font-size: 13px;
        color: var(--sub);
        letter-spacing: 0.5px;
        animation: k-fade 0.55s var(--ease) 0.2s both;
      }
      .cx-head .acts {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        animation: k-fade 0.55s var(--ease) 0.28s both;
      }

      /* ===== 看板四格卡（白卡 + tabular-nums） ===== */
      .cx-dash {
        flex: none;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-top: 16px;
        animation: k-fade 0.55s var(--ease) 0.3s both;
      }
      @media (max-width: 900px) {
        .cx-dash {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .dc {
        padding: 16px 20px 14px;
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .dc-n {
        font-size: 26px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .dc-n.blue {
        color: var(--orange);
      }
      .dc-n.red {
        color: var(--red);
      }
      .dc-n.zero {
        color: var(--ph);
      } /* 隐患类计数为 0：不标红，弱化为辅助灰（仅 >0 才红显） */
      .dc-t {
        font-size: 12px;
        color: var(--sub);
        letter-spacing: 0.5px;
      }
      /* 班管/超管待办小字入口（暂存 / 冲突角标同源 dashboard 计数） */
      .dash-todo {
        grid-column: 1 / -1;
        margin-top: -4px;
        font-size: 12px;
        color: var(--sub);
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dash-todo > svg {
        width: 14px;
        height: 14px;
        color: var(--yellow);
        flex: none;
      }
      .dash-todo a {
        font-weight: 700;
        cursor: pointer;
      }

      /* ===== 工具行：同步至内网 / 同步知识库（仅管理角色可见，非管理角色整行隐藏；无阈值设置） ===== */
      .cx-tools {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 16px;
        animation: k-fade 0.55s var(--ease) 0.36s both;
      }
      .sync-hint {
        font-size: 11.5px;
        color: var(--ph);
        letter-spacing: 0.5px;
      }

      /* ===== 记录页签一级「线路视图」：搜索框 + 线路大卡片网格 ===== */
      .rec-bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .rec-bar .spring {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .rec-search {
        flex: 1;
        min-width: 220px;
        max-width: 420px;
        height: 36px;
        padding: 0 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--fill);
        border-radius: 8px;
      }
      .rec-search svg {
        flex: none;
        width: 15px;
        height: 15px;
        color: var(--ph);
      }
      .rec-search input {
        flex: 1;
        min-width: 0;
        border: none;
        background: transparent;
        outline: none;
        font-size: 13px;
        color: var(--navy);
        font-family: inherit;
        letter-spacing: 0.5px;
      }
      .lc-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
        padding-bottom: 64px;
      }
      .lc {
        padding: 18px 20px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        transition:
          transform 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
        animation: k-rise 0.5s var(--ease) both; /* 编排式上浮入场，逐卡时延链由行内 animation-delay 给出（≤0.9s） */
      }
      .lc:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }
      .lc-main {
        flex: 1;
        min-width: 0;
      }
      .lc-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .lc-stats {
        margin-top: 10px;
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        letter-spacing: 0.5px;
      }
      .lc-stats b {
        margin-left: 3px;
        font-size: 17px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .lc-haz,
      .lc-haz b {
        color: var(--red);
      } /* 存在隐患（has_hazard 非空且非「否」「无」，口径以后端 dashboard 为准；卡内本地同口径推导） */
      .lc-total {
        color: var(--ph);
      }
      .lc-clear .lc-haz,
      .lc-clear .lc-haz b {
        color: var(--ph);
      } /* 隐患为 0：计数整体置灰 */
      .lc-go {
        flex: none;
        display: flex;
        color: var(--ph);
      }
      .lc-go svg {
        width: 16px;
        height: 16px;
      }

      /* ===== 记录页签二级「台账视图」顶栏：返回 + 线路标题 + 计数小字 ===== */
      .ledger-title {
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .ledger-sub {
        font-size: 12px;
        color: var(--ph);
        letter-spacing: 0.5px;
        font-variant-numeric: tabular-nums;
      }
      .ledger-sub .ls-key {
        color: var(--red);
      } /* 隐患>0：危险红 */
      #recBody {
        padding-bottom: 64px;
      } /* 底部内容给右下角 FAB 留位 */

      /* ===== 导出 FAB（右下角悬浮圆形品牌蓝，点击弹层选范围/分表） ===== */
      .fab {
        position: fixed;
        right: 28px;
        bottom: 28px;
        z-index: 110;
        width: 52px;
        height: 52px;
        border: none;
        border-radius: 50%;
        background: var(--orange);
        color: var(--on-brand);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(14, 61, 168, 0.32);
        transition:
          transform 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      .fab:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 26px rgba(14, 61, 168, 0.4);
      }
      .fab svg {
        width: 22px;
        height: 22px;
      }
      .fab[hidden] {
        display: none !important;
      } /* author display:flex 优先于 UA [hidden]，显式兜底（同 .cx-wrap 口径） */

      /* ===== 导出弹层：范围单选 / 分表勾选 ===== */
      .ex-opt {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        font-size: 13px;
        color: var(--navy);
        letter-spacing: 0.5px;
        cursor: pointer;
      }
      .ex-opt input {
        width: 15px;
        height: 15px;
        accent-color: var(--orange);
        cursor: pointer;
        flex: none;
      }
      .ex-opt.dis {
        color: var(--ph);
        cursor: not-allowed;
      }
      .ex-opt.dis input {
        cursor: not-allowed;
      }

      /* ===== 三页签：下划线式页签，激活蓝字 + 2px 蓝条（同 worklog wl-tabs 口径；角标红胶囊） ===== */
      .cx-tabs {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 14px;
        border-bottom: 1px solid var(--line);
        animation: k-fade 0.55s var(--ease) 0.4s both;
      }
      .cx-tabs button {
        position: relative;
        padding: 9px 14px;
        border: none;
        background: transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 13px;
        font-weight: 600;
        color: var(--sub);
        letter-spacing: 0.5px;
        transition: color 0.15s;
      }
      .cx-tabs button:hover {
        color: var(--navy);
      }
      .cx-tabs button.on {
        color: var(--orange);
      }
      .cx-tabs button.on::after {
        content: '';
        position: absolute;
        left: 14px;
        right: 14px;
        bottom: -1px;
        height: 2px;
        background: var(--orange);
        border-radius: 2px;
      }
      .cx-tabs button svg {
        width: 15px;
        height: 15px;
      }
      .cx-tabs button[hidden] {
        display: none !important;
      }
      .bdg {
        min-width: 17px;
        height: 17px;
        padding: 0 5px;
        border-radius: 999px;
        background: var(--red);
        color: var(--on-brand);
        font-size: 10.5px;
        font-weight: 700;
        line-height: 17px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .cx-tab-ind {
        display: none;
      } /* 滑动指示条按稿弃用（激活态已由蓝字 + 蓝条表达）；节点保留供 Shade.moveTabInd 写值 */

      /* ===== 主体：三页签共用列表位，内容各自内部滚动 ===== */
      .cx-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        margin-top: 14px;
      }
      .cx-body .pane {
        display: none;
        flex: 1;
        min-height: 0;
      }
      .cx-body .pane.on {
        display: flex;
        flex-direction: column;
        animation: paneIn 0.34s var(--ease);
      }
      .pane-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-right: 10px;
        scrollbar-gutter: stable;
        scrollbar-width: thin;
        scrollbar-color: rgba(29, 33, 41, 0.2) transparent;
      }
      .pane-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .pane-scroll::-webkit-scrollbar-thumb {
        background: rgba(29, 33, 41, 0.16);
        border-radius: 8px;
      }
      .pane-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(29, 33, 41, 0.34);
      }
      .pane-scroll::-webkit-scrollbar-track {
        background: transparent;
      }

      .linkbtn {
        border: none;
        background: transparent;
        color: var(--orange);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 8px;
        transition: background 0.2s;
      }
      .linkbtn:hover {
        background: var(--orange-soft);
      }
      .linkbtn.dgr {
        color: var(--red);
      }
      .linkbtn.dgr:hover {
        background: var(--danger-soft);
      }

      /* ===== 记录页签二级「台账视图」：扁平完整交跨卡片（全字段 + 来源信息 + 卡内操作，无详情弹层分级） ===== */
      .rec {
        margin-bottom: 14px;
        padding: 15px 22px;
        position: relative;
        cursor: pointer; /* 点卡（非交互区）= 折叠/展开（与卡内开关同效） */
        transition:
          transform 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      .rec:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }
      .rec-top {
        display: flex;
        align-items: baseline;
        gap: 12px 16px;
        flex-wrap: wrap;
      }
      .rec-sec {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      /* 垂直距离与区段同级双大字（浏览主看这两项） */
      .rec-vert {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--navy);
        font-variant-numeric: tabular-nums;
      }
      /* 次级字段行：跨越类型 / 交叉角 */
      .rec-subline {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .rec-sub {
        font-size: 13px;
        font-weight: 600;
        color: var(--navy);
        letter-spacing: 0.5px;
      }
      .rec-dist {
        font-size: 13px;
        color: var(--sub);
        letter-spacing: 0.5px;
        font-variant-numeric: tabular-nums;
      }
      /* 状态点标：圆点 + 文字（有隐患橙，同树障「待核验」一族口径） */
      .rec-tag {
        margin-left: auto;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .rec-tag::before {
        content: '';
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      .rec-tag.hz {
        background: var(--warn-soft);
        color: var(--warn-text);
      }
      .rec-tag.hz::before {
        background: var(--yellow);
      }
      /* 折叠/展开开关（标题行右端，每卡一枚）：折叠态整卡只留 区段/垂距/跨越类型/交叉角 两行摘要，其余整块隐藏 */
      .rec-fold {
        flex: none;
        width: 26px;
        height: 26px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--ph);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .rec-fold:hover {
        color: var(--orange);
        border-color: var(--orange);
      }
      .rec-fold svg {
        width: 13px;
        height: 13px;
        transition: transform 0.2s var(--ease);
      }
      .rec:not(.fold) .rec-fold svg {
        transform: rotate(180deg);
      } /* 展开态旋 180°，图标固定 chevron-down 不换名 */
      /* 折叠：隐藏其他信息 / 来源信息 / 操作按钮（grid 0fr→1fr 高度过渡 + 淡入，同 worklog combo-list 口径；.rec-more-in 为折叠必需内层） */
      .rec-more {
        display: grid;
        grid-template-rows: 1fr;
        opacity: 1;
        transition:
          grid-template-rows 0.28s var(--ease),
          opacity 0.22s ease,
          margin-top 0.28s var(--ease);
      }
      .rec.fold .rec-more {
        grid-template-rows: 0fr;
        opacity: 0;
      }
      .rec-more-in {
        min-height: 0;
        overflow: hidden;
      }
      /* 卡片内信息行：紧凑行式字段流（标签小灰字 + 值同行内联），宽屏一行、窄屏两行自适应 */
      .rf-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        margin-top: 8px;
      }
      .rf {
        font-size: 12.5px;
        color: var(--navy);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .rf i {
        font-style: normal;
        color: var(--ph);
        margin-right: 4px;
      }
      /* 卡片内来源与推送信息行（浅灰块，与业务字段分隔） */
      .rec-src {
        margin-top: 12px;
        padding: 9px 12px;
        border-radius: 8px;
        background: var(--fill);
        display: flex;
        align-items: baseline;
        gap: 8px 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--sub);
        letter-spacing: 0.5px;
      }
      .rec-src b {
        font-weight: 600;
        color: var(--navy);
      }
      /* 卡片内操作行：删除（班管/超管）居右 */
      .rec-acts {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
      }

      /* ===== 暂存区页签：批次卡 + 批次详情（inline 编辑表格） ===== */
      .stg-card {
        margin-bottom: 14px;
        padding: 16px 22px;
        cursor: pointer;
        transition:
          transform 0.18s var(--ease),
          box-shadow 0.18s var(--ease);
      }
      .stg-card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-hover);
      }
      .stg-top {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .stg-top b {
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .stg-meta {
        font-size: 12px;
        color: var(--ph);
        letter-spacing: 0.5px;
        font-variant-numeric: tabular-nums;
      }
      .stg-go {
        margin-left: auto;
        font-size: 12px;
        font-weight: 700;
        color: var(--orange);
      }
      /* 审核备注：浅底 + 左色条警示块（直角，同「政企蓝白」警示信息块族） */
      .stg-note {
        margin-top: 10px;
        padding: 9px 12px;
        background: var(--warn-soft);
        border-left: 4px solid var(--yellow);
        font-size: 12.5px;
        color: var(--sub);
        line-height: 1.7;
        letter-spacing: 0.5px;
      }
      .stg-note b {
        color: var(--navy);
      }
      .stg-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .stg-bar .back {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .stg-bar .spring {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .stg-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .stg-title small {
        margin-left: 8px;
        font-size: 11.5px;
        color: var(--ph);
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }
      /* 批次详情表格：13 业务列 inline 输入，横向滚动 */
      .stg-table {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        scrollbar-width: thin;
      }
      .stg-tb {
        border-collapse: collapse;
        min-width: 1560px;
        width: 100%;
      }
      .stg-tb th,
      .stg-tb td {
        padding: 7px 8px;
        border-bottom: 1px solid var(--hair);
        font-size: 12px;
        text-align: left;
        white-space: nowrap;
      }
      .stg-tb th {
        position: sticky;
        top: 0;
        background: var(--fill);
        font-size: 11px;
        font-weight: 700;
        color: var(--sub);
        letter-spacing: 0.5px;
        z-index: 1;
      }
      .stg-tb tr:last-child td {
        border-bottom: none;
      }
      .stg-in {
        width: 92px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 8px;
        font-size: 12px;
        color: var(--navy);
        font-family: inherit;
        outline: none;
        background: var(--card);
        transition: border-color 0.15s;
      }
      .stg-in:focus {
        border-color: var(--orange);
      }
      .stg-in.w-line {
        width: 130px;
      }
      .stg-in.w-note {
        width: 140px;
      }
      .stg-in[type='date'] {
        width: 128px;
      }
      .stg-ck {
        width: 16px;
        height: 16px;
        accent-color: var(--orange);
        cursor: pointer;
      }

      /* ===== 冲突页签：对照卡（系统值 | 内网值，差异字段标红） ===== */
      .cft {
        margin-bottom: 16px;
        padding: 16px 22px;
      }
      .cft-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .cft-head b {
        font-size: 15.5px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .cft-head .cft-time {
        margin-left: auto;
        font-size: 11.5px;
        color: var(--ph);
        letter-spacing: 0.5px;
        font-variant-numeric: tabular-nums;
      }
      .cft-cmp {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-top: 12px;
      }
      @media (max-width: 1000px) {
        .cft-cmp {
          grid-template-columns: 1fr;
        }
      }
      .cft-col {
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .cft-col-h {
        padding: 9px 14px;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 1px;
        background: var(--fill);
        border-bottom: 1px solid var(--line);
      }
      .cft-rows {
        padding: 4px 14px 10px;
      }
      .cft-r {
        display: flex;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px dashed var(--hair);
        font-size: 12.5px;
      }
      .cft-r:last-child {
        border-bottom: none;
      }
      .cft-r .k {
        flex: none;
        width: 84px;
        color: var(--ph);
        letter-spacing: 1px;
      }
      .cft-r .v {
        flex: 1;
        min-width: 0;
        font-weight: 600;
        word-break: break-all;
        font-variant-numeric: tabular-nums;
      }
      .cft-r .v.df {
        color: var(--red);
        font-weight: 700;
      }
      .cft-acts {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 14px;
      }

      /* ===== 通用弹层（导出；结构 .mask>.modal>.m-scroll，Shade.modal 注入） ===== */
      .mask {
        position: fixed;
        inset: 0;
        z-index: 320;
        padding: 24px;
        background: var(--overlay);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .mask.open {
        opacity: 1;
      }
      .modal {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        width: 560px;
        max-width: 94vw;
        max-height: 86vh;
        overflow: hidden;
        padding: 6px;
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-card);
        transform: translateY(16px) scale(0.98);
        transition: transform 0.35s var(--ease);
      }
      .m-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        border-radius: 8px;
        padding: 14px 18px 16px;
        scrollbar-gutter: stable both-edges;
        scrollbar-width: thin;
        scrollbar-color: rgba(29, 33, 41, 0.2) transparent;
      }
      .m-scroll::-webkit-scrollbar {
        width: 5px;
      }
      .m-scroll::-webkit-scrollbar-thumb {
        background: rgba(29, 33, 41, 0.16);
        border-radius: 8px;
      }
      .m-scroll::-webkit-scrollbar-thumb:hover {
        background: rgba(29, 33, 41, 0.34);
      }
      .m-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .mask.open .modal {
        transform: none;
      }
      .m-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .m-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .m-x {
        margin-left: auto;
        width: 30px;
        height: 30px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--navy);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-card);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .m-x:hover {
        background: var(--navy);
        color: var(--inverse-text);
      }
      .m-x svg {
        width: 14px;
        height: 14px;
      }
      .m-foot {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }

      /* ===== 弹层表单（f-lab / f-sel / f-ta，口径同 worklog 编辑弹层） ===== */
      .f-lab {
        display: block;
        font-size: 12px;
        color: var(--ph);
        letter-spacing: 1px;
        margin: 14px 0 7px;
      }
      .f-lab:first-of-type {
        margin-top: 2px;
      }
      .f-sel,
      .f-ta {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        outline: none;
        font-size: 13px;
        color: var(--navy);
        font-family: inherit;
        transition:
          border-color 0.15s var(--ease),
          box-shadow 0.15s var(--ease);
      }
      .f-sel {
        height: 40px;
        padding: 0 10px;
      }
      .f-sel:focus,
      .f-ta:focus {
        border-color: var(--orange);
        box-shadow: var(--hard-s);
      }
      .f-ta {
        min-height: 96px;
        padding: 10px 12px;
        line-height: 1.7;
        resize: vertical;
      }
      .f-hint {
        margin-top: 6px;
        font-size: 11px;
        color: var(--ph);
        letter-spacing: 0.5px;
      }

      /* ===== 动效降级 ===== */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001s !important;
        }
        .rec-more {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="cx-wrap">
        <!-- 页头：标题 + 副标；右侧班组切换（仅超管可见，Shade.setupTeamSel 装配） -->
        <div class="cx-head">
          <div class="section-title">
            <span class="cx-kick">LINE CROSSING</span>
            <h3>交跨记录</h3>
            <span class="more">输电线路交叉跨越台账的归档、核对与统计</span>
          </div>
          <div class="acts">
            <select id="teamSel"></select>
          </div>
        </div>

        <!-- 看板四格卡 + 管理待办入口（存在隐患 / 待确认线路口径以后端 dashboard 返回为准，前端直接用数） -->
        <div class="cx-dash" id="dash">
          <div class="card dc">
            <span class="dc-n blue" id="dTotal">—</span><span class="dc-t">记录总数</span>
          </div>
          <div class="card dc">
            <span class="dc-n" id="dWeek">—</span><span class="dc-t">本周新增</span>
          </div>
          <div class="card dc">
            <span class="dc-n" id="dHaz">—</span><span class="dc-t">存在隐患</span>
          </div>
          <div class="card dc">
            <span class="dc-n" id="dLines">—</span><span class="dc-t">待确认线路</span>
          </div>
          <div class="dash-todo" id="dashTodo" hidden></div>
        </div>

        <!-- 工具行：同步至内网 / 同步知识库（仅管理角色可见，非管理角色整行隐藏；导出统一走右下角 FAB） -->
        <div class="cx-tools" hidden>
          <button class="btn btn-sm" id="btnSync" hidden>同步至内网</button>
          <button class="btn btn-sm" id="btnWxSync" hidden>同步知识库</button>
          <span class="sync-hint" id="syncHint" hidden></span>
        </div>

        <!-- 页签：记录 / 暂存区（管理）/ 冲突（管理） -->
        <div class="cx-tabs" id="cxTabs">
          <button data-p="records" class="on">记录</button>
          <button data-p="staging" id="tabStaging" hidden>
            暂存区 <span class="bdg" id="bdgStaging" hidden></span>
          </button>
          <button data-p="conflicts" id="tabConflicts" hidden>
            冲突 <span class="bdg" id="bdgConflicts" hidden></span>
          </button>
          <span class="cx-tab-ind" id="cxTabInd"></span>
        </div>

        <!-- 页签主体 -->
        <div class="cx-body">
          <div class="pane on" id="paneRecords">
            <!-- 一级「线路视图」顶栏：搜索框（输入即过滤线路名/电压等级） -->
            <div class="rec-bar" id="recBarLines">
              <label class="rec-search" id="recSearchBox">
                <input
                  id="recSearch"
                  maxlength="32"
                  autocomplete="off"
                  placeholder="搜索线路名称 / 电压等级"
                />
              </label>
            </div>
            <!-- 二级「台账视图」顶栏：返回 + 线路标题与计数 -->
            <div class="rec-bar" id="recBarLedger" hidden>
              <button class="btn btn-sm" id="btnBackLines">返回线路</button>
              <span class="ledger-title" id="ledgerTitle"></span>
              <span class="ledger-sub" id="ledgerSub"></span>
            </div>
            <div class="pane-scroll" id="recBody"></div>
          </div>
          <div class="pane" id="paneStaging"><div class="pane-scroll" id="stgBody"></div></div>
          <div class="pane" id="paneConflicts"><div class="pane-scroll" id="cftBody"></div></div>
        </div>
      </div>
    </main>

    <!-- 未分配班组整页空态（Shade.renderNoTeam 填充） -->
    <div id="noTeam" hidden></div>

    <!-- 导出 FAB（右下角悬浮圆形品牌蓝；点击弹层选导出范围 / 按线路分表，再预览或下载） -->
    <button class="fab" id="fabExport" title="导出统计表"></button>

    <script src="/assets/icons.js"></script>
    <script src="/assets/common.js"></script>
    <script>
      /* ============================================================
     交跨记录网页版：看板 / 记录两级导航（线路大卡 → 线路台账）/ 导出 FAB（范围 + 按线路分表）/ 记录·暂存区·冲突三页签
     （暂存区·冲突·同步至内网·同步知识库仅超管 / 班组管理员可见可用，服务端 requireDictAdmin 同拦；
     交跨无处理流程（无状态/处理人）、无辅证照片、无阈值设置、无人工新增编辑；
     记录删除限班管/超管；接口 /api/v1/crossing/* 按生效班组隔离）
     ============================================================ */
      (function () {
        'use strict';
        Shade.requireAuth();
        /* 统一左侧图标导航栏（当前应用：交跨记录） */
        Shade.topbar({ active: 'crossing' });

        /* ================= 工具 ================= */
        var $ = Shade.$,
          $$ = Shade.$$;
        var esc = Shade.esc;
        var me = Shade.user() || {};
        /* 超管 / 班组管理员（暂存区·冲突·同步·删记录等管理类入口的可见性口径） */
        var isManager = me.role === 'admin' || me.role === 'team_admin';

        /* 展开态紧凑信息行字段（13 业务列，区段/垂距在标题行、类型/交叉角在次级行，不重复占位；空值字段跳过） */
        var COMPACT_FIELDS = [
          ['voltage_level', '电压等级'],
          ['line_name', '线路名称'],
          ['section', '跨越区段'],
          ['crossing_type', '跨越类型'],
          ['dist_small', '距小号(m)'],
          ['dist_big', '距大号(m)'],
          ['cross_horizontal', '边线水平(m)'],
          ['cross_vertical', '垂直距离(m)'],
          ['cross_angle', '交叉角(°)'],
          ['has_hazard', '是否存在隐患'],
          ['finder_name', '发现人'],
          ['inspect_at', '巡视时间'],
          ['remark', '备注'],
        ];
        /* 13 业务列（交跨无处理 3 列）：暂存区编辑与冲突对照共用（key 与后端列名一致） */
        var BIZ_FIELDS = [
          ['voltage_level', '电压等级'],
          ['line_name', '线路名称'],
          ['section', '跨越区段'],
          ['crossing_type', '跨越类型'],
          ['dist_small', '距小号'],
          ['dist_big', '距大号'],
          ['cross_horizontal', '边线水平'],
          ['cross_vertical', '垂直距离'],
          ['cross_angle', '交叉角'],
          ['has_hazard', '是否存在隐患'],
          ['finder_name', '发现人'],
          ['inspect_at', '巡视时间'],
          ['remark', '备注'],
        ];

        /* ================= 全局状态 ================= */
        var state = {
          teamId: 0, // 超管当前切换的班组 id（0=未指定，由后端落默认班组；非超管恒 0）
          tab: 'records', // 当前页签：records 记录 | staging 暂存区 | conflicts 冲突
          dash: null, // 看板数据 {total, week_new, hazard, pending_lines, pending_conflicts, staging_batches}
          rec: null, // 记录响应 {lines:[{voltage_level,line_name,records}], unmatched:[...]}（photos 恒空数组，忽略）
          view: 'lines', // 记录页签视图：lines 线路大卡（一级） | ledger 线路台账（二级）
          curLine: '', // 台账视图当前线路名（'__unmatched__' = 未匹配线路伪组）
          lineSearch: '', // 线路视图搜索串（输入即过滤线路名/电压等级）
          exp: {}, // 台账卡折叠/展开状态（记录id→true=展开；默认折叠，仅两行摘要）
          stg: { list: null, detail: null, err: '' }, // 暂存区：批次列表 / 批次详情 {batch, records}
          stgSel: {}, // 批次详情逐行勾选（暂存记录 id→true）
          cft: { list: null, err: '' }, // 冲突列表
          sync: null, // 同步状态 {enabled, running, last, nextNight}（后端未启用时仅 {enabled:false,last:null}）
        };

        /* 班组隔离：超管所有 /crossing/* 请求统一带 team_id（query 优先于 body，后端 resolveReqTeam 同口径） */
        function cx(path) {
          return Shade.withTeam(path, state.teamId);
        }
        /* POST/PUT 的 body 注入 team_id（manage.js teamBody 口径；query 已带时冗余无害） */
        function teamBody(o) {
          return state.teamId ? Object.assign({ team_id: state.teamId }, o) : o;
        }

        /* 空值展示占位 */
        function dash(v) {
          var s = String(v == null ? '' : v).trim();
          return s || '—';
        }
        /* 距离展示幂等：纯数字拼 m 后缀；已带单位或其他文本原样（空 → —） */
        function fmtM(v) {
          var s = String(v == null ? '' : v).trim();
          if (!s) return '—';
          return /^\d+(\.\d+)?$/.test(s) ? s + 'm' : s;
        }
        /* 交叉角展示幂等：纯数字拼 ° 后缀；其余原样（空 → —） */
        function fmtDeg(v) {
          var s = String(v == null ? '' : v).trim();
          if (!s) return '—';
          return /^\d+(\.\d+)?$/.test(s) ? s + '°' : s;
        }
        /* 是否存在隐患（卡内/线路卡本地口径：非空且非「否」「无」；看板与角标直接用后端 dashboard 数字） */
        function hasHazard(r) {
          var s = String(r.has_hazard == null ? '' : r.has_hazard).trim();
          return !!s && s !== '否' && s !== '无';
        }
        /* 字段展示格式化（紧凑信息行用；电压等级幂等补 kV，距离/角度补单位） */
        function fmtField(key, v) {
          if (key === 'voltage_level') return Shade.fmtKv(v);
          if (key === 'dist_small' || key === 'dist_big' || key === 'cross_horizontal')
            return fmtM(v);
          if (key === 'cross_vertical') return fmtM(v);
          if (key === 'cross_angle') return fmtDeg(v);
          return dash(v);
        }
        /* 全部记录拍平（lines + unmatched，保持分组顺序） */
        function allRecords() {
          var out = [];
          if (!state.rec) return out;
          (state.rec.lines || []).forEach(function (g) {
            out = out.concat(g.records || []);
          });
          return out.concat(state.rec.unmatched || []);
        }

        /* ================= 看板 ================= */
        async function loadDashboard() {
          try {
            var r = await Shade.api(cx('/api/v1/crossing/dashboard'));
            state.dash = r.data || {};
          } catch (e) {
            state.dash = null;
            Shade.toast(e.message, 'error');
          }
          renderDashboard();
        }
        function renderDashboard() {
          var d = state.dash || {};
          $('#dTotal').textContent = d.total == null ? '—' : d.total;
          $('#dWeek').textContent = d.week_new == null ? '—' : d.week_new;
          $('#dLines').textContent = d.pending_lines == null ? '—' : d.pending_lines;
          var haz = $('#dHaz');
          haz.textContent = d.hazard == null ? '—' : d.hazard;
          /* 隐患类计数仅 >0 才红显，=0 弱化为辅助灰 */
          haz.className = 'dc-n ' + (d.hazard > 0 ? 'red' : 'zero');
          /* 页签角标（仅管理角色有对应页签） */
          var stgN = d.staging_batches || 0,
            cftN = d.pending_conflicts || 0;
          $('#bdgStaging').hidden = !stgN;
          $('#bdgStaging').textContent = stgN;
          $('#bdgConflicts').hidden = !cftN;
          $('#bdgConflicts').textContent = cftN;
          /* 管理待办小字入口：暂存 n 批 · 冲突 n 条（点击切对应页签） */
          var todo = $('#dashTodo');
          if (isManager && (stgN || cftN)) {
            var parts = [];
            if (stgN) parts.push('<a data-go="staging">暂存 ' + stgN + ' 批</a>');
            if (cftN) parts.push('<a data-go="conflicts">冲突 ' + cftN + ' 条</a>');
            todo.innerHTML =
              Shade.icon('warn', 14) + '<span>待办：</span>' + parts.join('<span>·</span>');
            todo.hidden = false;
          } else {
            todo.hidden = true;
            todo.innerHTML = '';
          }
        }

        /* ================= 记录页签 ================= */
        /* 记录加载：quiet=true 时不显加载块（删除等操作后静默刷新，滚动位保持） */
        async function loadRecords(quiet) {
          var body = $('#recBody');
          if (!quiet)
            body.innerHTML = '<div class="loading"><span class="spin"></span>加载中…</div>';
          var st = body.scrollTop;
          try {
            var r = await Shade.api(cx('/api/v1/crossing/records'));
            state.rec = r.data || { lines: [], unmatched: [] };
            renderRecords();
            if (quiet) body.scrollTop = st;
          } catch (e) {
            state.rec = null;
            body.innerHTML =
              '<div class="empty">' +
              Shade.icon('warn', 44) +
              '<p>' +
              esc(e.message) +
              '</p>' +
              '<p><button class="btn btn-sm" id="recRetry">重试</button></p></div>';
          }
        }

        /* 视图切换同步：看板仅「记录」页签展示（线路视图与台账视图均保留），暂存区/冲突页签不显示；搜索栏 / 台账栏随视图显隐 */
        function syncView() {
          var inRec = state.tab === 'records';
          $('#dash').style.display = inRec ? '' : 'none';
          $('#recBarLines').hidden = !(inRec && state.view === 'lines');
          $('#recBarLedger').hidden = !(inRec && state.view === 'ledger');
        }
        /* 视图内容重渲染时触发 fade+slide 入场（重挂 .view-in 强制重放） */
        function playViewIn() {
          var body = $('#recBody');
          body.classList.remove('view-in');
          void body.offsetWidth;
          body.classList.add('view-in');
        }
        /* 进入二级台账视图（line 为线路名；'__unmatched__' = 未匹配线路伪组） */
        function openLedger(line) {
          state.view = 'ledger';
          state.curLine = line;
          syncView();
          renderRecords();
          playViewIn();
          $('#recBody').scrollTop = 0;
        }
        /* 返回一级线路视图 */
        function backToLines() {
          state.view = 'lines';
          state.curLine = '';
          syncView();
          renderRecords();
          playViewIn();
        }

        /* 记录卡片 HTML（扁平完整卡，无详情弹层分级；默认折叠态一卡两行）：
     标题行 = 区段 + 垂直距离双大字同级、左对齐 + 有隐患橙点标 + 折叠/展开开关；
     次级行 = 跨越类型 / 交叉角；展开态（.rec-more）另出紧凑信息行（13 业务列，空值跳过，宽屏一行窄屏两行）
     + 来源与推送信息行（来源/排查会话/排查记录/推送时间/创建/更新时间）+ 卡内操作（删除：班管/超管）。
     点卡（非交互区）折叠/展开同开关；卡内交互走 #recBody 事件委派（见 initEvents），重绘无需重绑 */
        function recCardHtml(r) {
          var expanded = !!state.exp[r.id];
          var head = [];
          head.push('<b class="rec-sec">' + esc(dash(r.section)) + '</b>');
          head.push(
            '<span class="rec-vert" title="交叉垂直距离">垂距 ' +
              esc(fmtM(r.cross_vertical)) +
              '</span>'
          );
          if (hasHazard(r))
            head.push('<span class="rec-tag hz" title="是否存在隐患">有隐患</span>');
          head.push(
            '<button class="rec-fold" data-fold="' +
              r.id +
              '" title="' +
              (expanded ? '折叠' : '展开') +
              '">' +
              Shade.icon('chevron-down', 13) +
              '</button>'
          );
          /* 次级字段行：跨越类型 / 交叉角 */
          var sub = [];
          var ctype = String(r.crossing_type || '').trim();
          if (ctype) sub.push('<span class="rec-sub">跨越 ' + esc(ctype) + '</span>');
          sub.push('<span class="rec-dist">交叉角 ' + esc(fmtDeg(r.cross_angle)) + '</span>');
          /* 紧凑信息行：13 业务列标签+值同行内联（区段/垂距/类型/交叉角已在摘要行，跳过不重复占位），空值字段不渲染 */
          var infoItems = COMPACT_FIELDS.filter(function (f) {
            return (
              f[0] !== 'section' &&
              f[0] !== 'cross_vertical' &&
              f[0] !== 'crossing_type' &&
              f[0] !== 'cross_angle'
            );
          })
            .map(function (f) {
              var raw = r[f[0]];
              var v = String(raw == null ? '' : raw).trim();
              return v
                ? '<span class="rf"><i>' + f[1] + '</i>' + esc(fmtField(f[0], raw)) + '</span>'
                : '';
            })
            .filter(Boolean);
          var grid = infoItems.length ? '<div class="rf-row">' + infoItems.join('') + '</div>' : '';
          /* 来源与推送信息行：来源 / 排查会话 / 排查记录 / 推送时间 / 创建 / 更新时间（空值跳过） */
          var SRC_TEXT = { crane: '群捕获直推', staging: '暂存导入', intranet: '内网回写' };
          var src = String(r.source || '').trim();
          var srcItems = [];
          if (src) {
            srcItems.push('<span>来源 <b>' + esc(SRC_TEXT[src] || src) + '</b></span>');
          }
          if (String(r.crane_session_id || '').trim())
            srcItems.push('<span>排查会话 <b>' + esc(r.crane_session_id) + '</b></span>');
          if (String(r.crane_record_id || '').trim())
            srcItems.push('<span>排查记录 <b>' + esc(r.crane_record_id) + '</b></span>');
          if (String(r.synced_at || '').trim())
            srcItems.push(
              '<span>推送时间 <b>' + esc(Shade.fmtDate(r.synced_at, true)) + '</b></span>'
            );
          if (String(r.created_at || '').trim())
            srcItems.push(
              '<span>创建 <b>' + esc(Shade.fmtDate(r.created_at, true)) + '</b></span>'
            );
          if (String(r.updated_at || '').trim())
            srcItems.push(
              '<span>更新 <b>' + esc(Shade.fmtDate(r.updated_at, true)) + '</b></span>'
            );
          var srcRow = srcItems.length
            ? '<div class="rec-src">' + srcItems.join('') + '</div>'
            : '';
          /* 卡内操作：删除（班管/超管） */
          var acts = [];
          if (isManager)
            acts.push(
              '<button class="btn btn-sm btn-danger" data-ddel="' + r.id + '">删除</button>'
            );
          return (
            '<div class="card rec' +
            (expanded ? '' : ' fold') +
            '" data-id="' +
            r.id +
            '">' +
            '<div class="rec-top">' +
            head.join('') +
            '</div>' +
            '<div class="rec-subline">' +
            sub.join('') +
            '</div>' +
            '<div class="rec-more"><div class="rec-more-in">' +
            grid +
            srcRow +
            (acts.length ? '<div class="rec-acts">' + acts.join('') + '</div>' : '') +
            '</div></div>' +
            '</div>'
          );
        }

        /* 渲染分派：按当前视图渲染一级线路大卡 / 二级线路台账 */
        function renderRecords() {
          if (!state.rec) return;
          if (state.view === 'ledger') renderLedger();
          else renderLineCards();
        }

        /* ================= 一级「线路视图」：线路大卡片网格 ================= */
        /* 单线路计数：存在隐患数（has_hazard 非空且非「否」「无」，与看板口径一致）/ 总数 */
        function lineStats(recs) {
          var haz = 0;
          recs.forEach(function (r) {
            if (hasHazard(r)) haz++;
          });
          return { haz: haz, total: recs.length };
        }
        /* 线路大卡：标题（电压等级+线路名，Shade.fmtKv 幂等）+ 存在隐患（>0 红字、=0 灰字）+ 总数（灰）；
     隐患为 0 时计数整体置灰（lc-clear）；idx 用于 stagger 入场时延链（≤0.9s 封顶） */
        function lineCardHtml(title, st, lineKey, idx) {
          var clear = st.haz === 0;
          var delay = Math.min(idx * 0.05, 0.4).toFixed(2); // 逐卡 50ms 递增，0.4s 封顶（+0.5s 时长 ≤0.9s）
          return (
            '<div class="card lc' +
            (clear ? ' lc-clear' : '') +
            '" data-line="' +
            esc(lineKey) +
            '" title="点击进入线路台账"' +
            ' style="animation-delay:' +
            delay +
            's">' +
            '<div class="lc-main"><div class="lc-title">' +
            esc(title) +
            '</div>' +
            '<div class="lc-stats">' +
            '<span class="lc-haz">存在隐患<b>' +
            st.haz +
            '</b></span>' +
            '<span class="lc-total">共 ' +
            st.total +
            ' 条</span>' +
            '</div></div>' +
            '<span class="lc-go">' +
            Shade.icon('chevron-right', 16) +
            '</span>' +
            '</div>'
          );
        }
        /* 电压等级数值提取（排序用；非数字回退 0） */
        function voltageNum(v) {
          var n = parseFloat(String(v == null ? '' : v).replace(/[^\d.]/g, ''));
          return isNaN(n) ? 0 : n;
        }
        /* 线路卡排序：存在隐患数降序 > 电压等级数值降序 > 线路名称升序（zh-CN） */
        function sortLineGroups(list) {
          var stats = {};
          list.forEach(function (g) {
            stats[g.line_name] = lineStats(g.records || []);
          });
          return list.slice().sort(function (a, b) {
            var sa = stats[a.line_name],
              sb = stats[b.line_name];
            if (sb.haz !== sa.haz) return sb.haz - sa.haz;
            var dv = voltageNum(b.voltage_level) - voltageNum(a.voltage_level);
            if (dv) return dv;
            return String(a.line_name || '').localeCompare(String(b.line_name || ''), 'zh-CN');
          });
        }
        function renderLineCards() {
          var body = $('#recBody');
          var raw = (state.lineSearch || '').trim();
          var kw = raw.toLowerCase();
          var html = [];
          var idx = 0;
          sortLineGroups(state.rec.lines || []).forEach(function (g) {
            var title = Shade.fmtKv(g.voltage_level) + ' ' + g.line_name;
            /* 输入即过滤：标题（含电压等级幂等格式）与原始线路名双通道匹配 */
            if (
              kw &&
              title.toLowerCase().indexOf(kw) < 0 &&
              String(g.line_name || '')
                .toLowerCase()
                .indexOf(kw) < 0
            )
              return;
            html.push(lineCardHtml(title, lineStats(g.records || []), g.line_name, idx++));
          });
          /* 「未匹配线路」伪组作为一张卡参与（恒排尾，不参与排序） */
          var un = state.rec.unmatched || [];
          if (un.length && (!kw || '未匹配线路'.indexOf(raw) >= 0)) {
            html.push(lineCardHtml('未匹配线路', lineStats(un), '__unmatched__', idx++));
          }
          body.innerHTML = html.length
            ? '<div class="lc-grid">' + html.join('') + '</div>'
            : '<div class="empty">' +
              Shade.icon(kw ? 'search' : 'task', 44) +
              '<p>' +
              (kw
                ? '未找到匹配「' + esc(raw) + '」的线路'
                : '暂无交跨记录，可先在群里报送或经暂存区导入') +
              '</p></div>';
        }

        /* ================= 二级「台账视图」：单线路记录卡片流 ================= */
        /* 当前台账线路组（线路已不存在时返回 null，由 renderLedger 回退线路视图） */
        function currentLedgerGroup() {
          if (!state.rec) return null;
          if (state.curLine === '__unmatched__') {
            var un = state.rec.unmatched || [];
            return un.length ? { title: '未匹配线路', records: un, lineName: '' } : null;
          }
          var g = null;
          (state.rec.lines || []).forEach(function (x) {
            if (x.line_name === state.curLine) g = x;
          });
          return g
            ? {
                title: Shade.fmtKv(g.voltage_level) + ' ' + g.line_name,
                records: g.records || [],
                lineName: g.line_name,
              }
            : null;
        }
        function renderLedger() {
          var body = $('#recBody');
          var g = currentLedgerGroup();
          if (!g) {
            backToLines();
            return;
          } // 数据刷新后线路已消失（如班组切换/删除），回退线路视图
          var st = lineStats(g.records);
          $('#ledgerTitle').textContent = g.title;
          $('#ledgerSub').innerHTML =
            '<span class="' +
            (st.haz > 0 ? 'ls-key' : '') +
            '">存在隐患 ' +
            st.haz +
            '</span>' +
            ' · 共 ' +
            st.total +
            ' 条';
          body.innerHTML =
            g.records
              .map(function (r) {
                return recCardHtml(r);
              })
              .join('') ||
            '<div class="empty">' + Shade.icon('task', 44) + '<p>该线路下暂无记录</p></div>';
        }

        /* ================= 记录操作：删除（班管/超管） ================= */
        async function deleteRecord(id) {
          var yes = await Shade.confirm({
            title: '删除记录',
            content: '删除后不可恢复，确定删除吗？',
            confirmText: '删除',
            danger: true,
          });
          if (!yes) return;
          try {
            await Shade.api(cx('/api/v1/crossing/records/' + id), { method: 'DELETE' });
            Shade.toast('已删除', 'success');
            loadDashboard();
            loadRecords(true);
          } catch (e) {
            Shade.toast(e.message, 'error');
          }
        }

        /* ================= 导出：FAB 弹层（范围单选 + 按线路分表）→ 预览（Shade.openPreviewUrl 打开）/ 下载（apiRaw + saveBlob） ================= */
        /* query 由导出弹层拼好传入：分线路带 line=，勾选分表且范围为全部线路时带 split=1 */
        async function exportPreview(btn, query) {
          btn.disabled = true;
          try {
            var r = await Shade.api(cx('/api/v1/crossing/export/preview' + (query || '')));
            if (r.data && r.data.url) {
              Shade.openPreviewUrl(r.data.url);
              return;
            }
            throw new Error('预览地址为空');
          } catch (e) {
            Shade.toast(e.message, 'error');
          } finally {
            btn.disabled = false;
          }
        }
        async function exportDownload(btn, query) {
          btn.disabled = true;
          try {
            /* 走 :name.xlsx 文件名变体路径，供查看器按扩展名识别格式；文件名以 Content-Disposition 为准 */
            var res = await Shade.apiRaw(
              cx('/api/v1/crossing/export/交跨统计表.xlsx' + (query || ''))
            );
            if (!res.ok) {
              var ej = null;
              try {
                ej = await res.json();
              } catch (e) {}
              throw new Error((ej && ej.message) || '导出失败（' + res.status + '）');
            }
            await Shade.saveBlob(res, '交跨统计表.xlsx');
          } catch (e) {
            Shade.toast(e.message, 'error');
          } finally {
            btn.disabled = false;
          }
        }

        /* 导出弹层（FAB 点击）：
     台账视图范围两项（默认「当前线路」；未匹配线路伪组不支持单线路导出，该项禁用）；线路视图默认「全部线路」，
     第二项为「选择线路」下拉（下拉即选中该单选）；「按线路分表」仅全部线路范围可勾（其余禁用并灰显说明） */
        function openExportModal() {
          if (!state.rec) {
            Shade.toast('记录加载中，请稍候', 'info');
            return;
          }
          var inLedger = state.tab === 'records' && state.view === 'ledger';
          var g = inLedger ? currentLedgerGroup() : null;
          var canCur = !!(g && g.lineName); // 未匹配线路伪组聚合多条线路名，无法映射单一线路参数
          var lines = state.rec.lines || [];
          var html =
            Shade.mHead('导出统计表') +
            '<label class="f-lab">导出范围</label>' +
            (inLedger
              ? '<label class="ex-opt' +
                (canCur ? '' : ' dis') +
                '"><input type="radio" name="exRange" value="line"' +
                (canCur ? ' checked' : ' disabled') +
                '> 当前线路（' +
                esc(g ? g.title : '') +
                '）</label>' +
                '<label class="ex-opt"><input type="radio" name="exRange" value="all"' +
                (canCur ? '' : ' checked') +
                '> 全部线路</label>'
              : '<label class="ex-opt"><input type="radio" name="exRange" value="all" checked> 全部线路</label>' +
                '<label class="ex-opt' +
                (lines.length ? '' : ' dis') +
                '"><input type="radio" name="exRange" value="line"' +
                (lines.length ? '' : ' disabled') +
                '> 选择线路</label>' +
                '<select class="f-sel" id="exLine" style="margin-top:2px" disabled>' +
                lines
                  .map(function (x) {
                    return (
                      '<option value="' +
                      esc(x.line_name) +
                      '">' +
                      esc(Shade.fmtKv(x.voltage_level) + ' ' + x.line_name) +
                      '</option>'
                    );
                  })
                  .join('') +
                '</select>') +
            '<label class="f-lab">分表</label>' +
            '<label class="ex-opt" id="exSplitOpt"><input type="checkbox" id="exSplit"> 按线路分表（每条线路一个工作表，表名 = 电压等级 + 线路名称）</label>' +
            '<div class="f-hint" id="exSplitHint">仅「全部线路」范围可分表；导出范围非全部线路时此项不可用。</div>' +
            '<div class="m-foot"><button class="btn btn-sm" data-ex="preview">' +
            Shade.icon('file', 15) +
            '预览</button>' +
            '<button class="btn btn-sm btn-primary" data-ex="download">' +
            Shade.icon('download', 15) +
            '下载</button></div>';
          var inst = Shade.modal(html, { width: 460 });
          var splitCk = $('#exSplit', inst.box);
          var splitOpt = $('#exSplitOpt', inst.box);
          var splitHint = $('#exSplitHint', inst.box);
          var lineSel = $('#exLine', inst.box);
          function curRange() {
            var v = 'all';
            $$('input[name="exRange"]', inst.box).forEach(function (r) {
              if (r.checked) v = r.value;
            });
            return v;
          }
          /* 分表勾选随范围联动：非全部线路 → 禁用 + 摘勾 + 灰显说明 */
          function syncSplit() {
            var off = curRange() !== 'all';
            splitCk.disabled = off;
            if (off) splitCk.checked = false;
            splitOpt.classList.toggle('dis', off);
            splitHint.style.opacity = off ? '.55' : '';
            if (lineSel) lineSel.disabled = curRange() !== 'line';
          }
          $$('input[name="exRange"]', inst.box).forEach(function (r) {
            r.addEventListener('change', syncSplit);
          });
          if (lineSel) {
            /* 下拉选线即视为选中「选择线路」 */
            lineSel.addEventListener('change', function () {
              var radio = $('input[name="exRange"][value="line"]', inst.box);
              if (radio && !radio.checked) {
                radio.checked = true;
                syncSplit();
              }
            });
          }
          syncSplit();
          /* 拼导出 query：分线路 line=（未匹配伪组无 lineName，已被 canCur 拦截）；全部线路 + 勾选分表 → split=1 */
          function buildQuery() {
            var range = curRange();
            var lineName = '';
            if (range === 'line')
              lineName = inLedger ? (g ? g.lineName : '') : lineSel ? lineSel.value : '';
            if (range === 'line' && !lineName) {
              Shade.toast('请选择线路', 'info');
              return null;
            }
            var q = [];
            if (lineName) q.push('line=' + encodeURIComponent(lineName));
            if (range === 'all' && splitCk.checked && !splitCk.disabled) q.push('split=1');
            return q.length ? '?' + q.join('&') : '';
          }
          $('[data-ex="preview"]', inst.box).addEventListener('click', function () {
            var q = buildQuery();
            if (q === null) return;
            inst.close();
            exportPreview(this, q);
          });
          $('[data-ex="download"]', inst.box).addEventListener('click', function () {
            var q = buildQuery();
            if (q === null) return;
            inst.close();
            exportDownload(this, q);
          });
        }

        /* ================= 同步至内网（班管/超管） ================= */
        /* 状态小字：running → 同步中…；否则「每日 24:00 自动同步」+ 下次自动同步时间（nextNight）+ 最近同步摘要；后端未启用时如实显示 */
        function renderSyncHint() {
          var el = $('#syncHint');
          if (!isManager) {
            el.hidden = true;
            return;
          }
          var st = state.sync;
          var text = '';
          if (st) {
            if (st.running) text = '同步中…';
            else if (st.enabled === false) text = '同步未启用';
            else {
              text = '每日 24:00 自动同步';
              if (st.nextNight) text += ' · 下次 ' + Shade.fmtDate(st.nextNight, true);
              if (st.last)
                text +=
                  ' · 最近 ' +
                  Shade.fmtDate(st.last.created_at, true) +
                  (st.last.result ? ' · ' + st.last.result : '');
            }
          }
          el.textContent = text;
          el.hidden = !text;
        }
        async function loadSyncStatus() {

        /* ================= 同步知识库（班管/超管；台账 xlsx 快照推 WeKnora，服务端 weknorasync.js） ================= */
        async function pushWxSync(btn) {

        /* 批次卡列表：群名 / 推送人 / 时间 / 条数 / 审核备注（浅底 + 左色条警示块） */

        /* 批次详情：进入即拉取（表格 13 业务列 inline 编辑）；silent=true 时 404（批次已转空）静默回列表 */
        async function openBatch(id, silent) {

        /* 详情行内输入单元格（长字段加宽；巡视时间为日期列） */
        function stgCell(r, key) {
          var cls = key === 'line_name' ? ' w-line' : key === 'remark' ? ' w-note' : '';
          var v = r[key] == null ? '' : String(r[key]);

        function renderBatchDetail() {
          var body = $('#stgBody');

          if (!d) {

            esc(dash(b.group_name)) +
            '<small>推送人 ' +

            ' · ' +
            esc(Shade.fmtDate(b.created_at, true)) +

            records.length +
            ' 条</small></span>' +
            '<span class="spring">' +
            '<button class="btn btn-sm" data-stg="import-sel"' +
            (selN ? '' : ' disabled') +
            '>转入选中（' +
            selN +
            '）</button>' +
            '<button class="btn btn-sm btn-primary" data-stg="import-all"' +
            (records.length ? '' : ' disabled') +
            '>全部转入</button>' +
            '<button class="btn btn-sm btn-danger" data-stg="discard">废弃批次</button>' +
            '</span></div>' +
            (String(b.review_note || '').trim()
              ? '<div class="stg-note" style="margin:0 0 12px"><b>审核备注：</b>' +

          if (!records.length) {

          html +=

            }).join('') +
            '<th>操作</th></tr></thead><tbody>' +
            records
              .map(function (r) {
                return (
                  '<tr data-sid="' +
                  r.id +
                  '">' +
                  '<td><input type="checkbox" class="stg-ck" data-stg="ck"' +
                  (state.stgSel[r.id] ? ' checked' : '') +

                    return stgCell(r, f[0]);
                  }).join('') +

        /* 逐行保存：收集该行 13 列输入调 PUT（白名单字段，日期列后端归一） */

        /* 转入：recordIds 缺省（null）= 全部转入；成功后刷新看板角标并就地刷新详情/列表 */
        async function importBatch(recordIds) {
          var d = state.stg.detail;
          if (!d || !d.batch) return;
          var batchId = d.batch.id;
          try {
            var r = await Shade.api(cx('/api/v1/crossing/staging/batches/' + batchId + '/import'), {
              method: 'POST',
              body: teamBody(recordIds ? { record_ids: recordIds } : {}),

            loadDashboard();
            loadRecords(true);

          } catch (e) {

        async function discardBatch() {
          var d = state.stg.detail;
          if (!d || !d.batch) return;
          var yes = await Shade.confirm({
            title: '废弃批次',

            state.stg.detail = null;
            loadDashboard();
            loadStaging();

        /* ================= 冲突页签（班管/超管） ================= */
        async function loadConflicts() {
          var body = $('#cftBody');
          body.innerHTML = '<div class="loading"><span class="spin"></span>加载中…</div>';
          try {
            var r = await Shade.api(cx('/api/v1/crossing/conflicts'));
            state.cft.list = r.data || [];
            state.cft.err = '';
          } catch (e) {
            state.cft.list = [];
            state.cft.err = e.message || '加载失败';
          }
          renderConflicts();
        }
        /* 系统当前值：冲突行平铺字段（LEFT JOIN 当前记录；记录已删时回退服务端快照） */
        function cftServerVal(c, key) {
          var v = c[key];
          if ((v === null || v === undefined) && c.server_snapshot) v = c.server_snapshot[key];
          return v;
        }
        /* 两列对照（系统值 | 内网值）：13 业务列，差异字段标红（交跨无处理状态行） */
        function cftCardHtml(c) {
          var snap = c.intranet_snapshot || {};
          var lineName = cftServerVal(c, 'line_name');
          var section = cftServerVal(c, 'section');
          /* 单元格等值判定（日期已归一 yyyy-MM-dd；数字类「3」与「3.0」视为相同，与后端 diff 口径一致） */
          function sameVal(key, a, b) {
            var sa = String(a == null ? '' : a).trim();
            var sb = String(b == null ? '' : b).trim();
            if (sa === sb) return true;
            if (
              [
                'dist_small',
                'dist_big',
                'cross_horizontal',
                'cross_vertical',
                'cross_angle',
              ].indexOf(key) >= 0 &&
              sa &&
              sb
            ) {
              var na = Number(sa),
                nb = Number(sb);
              if (!isNaN(na) && !isNaN(nb)) return na === nb;
            }
            return false;
          }
          function cellVal(key, raw) {
            if (key === 'voltage_level') return Shade.fmtKv(raw);
            return dash(raw);
          }
          var rowsServer = '',
            rowsIntranet = '';
          BIZ_FIELDS.forEach(function (f) {
            var key = f[0],
              label = f[1];
            var sv = cftServerVal(c, key);
            var iv = snap[key];
            var diff = !sameVal(key, sv, iv);
            rowsServer +=
              '<div class="cft-r"><span class="k">' +
              label +
              '</span><span class="v' +
              (diff ? ' df' : '') +
              '">' +
              esc(cellVal(key, sv)) +
              '</span></div>';
            rowsIntranet +=
              '<div class="cft-r"><span class="k">' +
              label +
              '</span><span class="v' +
              (diff ? ' df' : '') +
              '">' +
              esc(cellVal(key, iv)) +
              '</span></div>';
          });

          return (
            '<div class="card cft" data-cid="' +
            c.id +
            '">' +
            '<div class="cft-head"><b>' +
            esc(dash(lineName)) +
            ' · ' +
            esc(dash(section)) +
            '</b>' +
            '<span class="cft-time">' +
            esc(Shade.fmtDate(c.created_at, true)) +
            '</span></div>' +
            '<div class="cft-cmp">' +
            '<div class="cft-col"><div class="cft-col-h">系统值</div><div class="cft-rows">' +
            rowsServer +
            '</div></div>' +
            '<div class="cft-col"><div class="cft-col-h">内网值</div><div class="cft-rows">' +
            rowsIntranet +
            '</div></div>' +
            '</div>' +
            '<div class="cft-acts">' +
            '<button class="btn btn-sm" data-keep="server">以系统为准</button>' +
            '<button class="btn btn-sm btn-primary" data-keep="intranet">以内网为准</button>' +
            '</div></div>'
          );
        }
        function renderConflicts() {
          var body = $('#cftBody');
          if (state.cft.err) {
            body.innerHTML =
              '<div class="empty">' +
              Shade.icon('warn', 44) +
              '<p>' +
              esc(state.cft.err) +
              '</p>' +
              '<p><button class="btn btn-sm" data-cft="reload">重试</button></p></div>';
            return;
          }
          if (!state.cft.list.length) {
            body.innerHTML =
              '<div class="empty">' +
              Shade.icon('check-circle', 44) +
              '<p>暂无待解决冲突</p></div>';
            return;
          }
          body.innerHTML = state.cft.list.map(cftCardHtml).join('');
        }
        /* 解决冲突：keep=server 保留系统值 / intranet 采用内网值；解决后就地移除该卡并刷新角标 */
        async function resolveConflict(card, keep, btn) {
          var id = Number(card.dataset.cid);
          btn.disabled = true;
          try {
            await Shade.api(cx('/api/v1/crossing/conflicts/' + id + '/resolve'), {
              method: 'POST',
              body: teamBody({ keep: keep }),
            });
            state.cft.list = state.cft.list.filter(function (c) {
              return c.id !== id;
            });
            card.remove();
            if (!state.cft.list.length) renderConflicts();
            Shade.toast(keep === 'intranet' ? '已按内网值更新' : '已保留系统值', 'success');
            loadDashboard();
            if (keep === 'intranet') loadRecords(true); // 内网值已覆盖记录，卡片流静默刷新
          } catch (e) {
            btn.disabled = false;
            Shade.toast(e.message, 'error');
          }
        }

        /* ================= 页签切换（记录 / 暂存区 / 冲突） ================= */
        function switchTab(p) {
          if (state.tab === p) return;
          state.tab = p;
          $$('#cxTabs button[data-p]').forEach(function (b) {
            b.classList.toggle('on', b.dataset.p === p);
          });
          Shade.moveTabInd($('#cxTabs button.on'), $('#cxTabInd'));
          $$('.cx-body .pane').forEach(function (el) {
            el.classList.toggle('on', el.id === 'pane' + p.charAt(0).toUpperCase() + p.slice(1));
          });
          syncView(); // 看板显隐随「记录页签 + 台账视图」组合联动
          /* 暂存区 / 冲突每次切回都重拉（可能被其他管理员改动） */
          if (p === 'staging') loadStaging();
          if (p === 'conflicts') loadConflicts();
        }

        /* ================= 事件绑定 ================= */
        function initEvents() {
          /* 页签点击 */
          $('#cxTabs').addEventListener('click', function (e) {
            var b = e.target.closest('button[data-p]');
            if (!b || b.hidden) return;
            switchTab(b.dataset.p);
          });
          /* 看板待办入口：点击切对应页签 */
          $('#dashTodo').addEventListener('click', function (e) {
            var a = e.target.closest('a[data-go]');
            if (a) switchTab(a.dataset.go);
          });
          /* 线路视图搜索：输入即过滤线路名 / 电压等级 */
          $('#recSearch').addEventListener('input', function () {
            state.lineSearch = this.value;
            if (state.rec) renderLineCards();
          });
          /* 台账视图返回线路 + 导出 FAB */
          $('#btnBackLines').addEventListener('click', backToLines);
          $('#fabExport').addEventListener('click', openExportModal);
          /* 同步按钮 */
          $('#btnSync').addEventListener('click', function () {
            pushSync(this);
          });
          $('#btnWxSync').addEventListener('click', function () {
            pushWxSync(this);
          });
          /* 记录重试（空态/错误态内按钮，动态节点用事件委托） */
          $('#recBody').addEventListener('click', function (e) {
            if (e.target.closest('#recRetry')) {
              loadRecords();
            }
          });
          /* 折叠/展开就地切换（开关按钮与点卡共用）：就地切 .fold 类不重绘（滚动位不动） */
          function toggleCardFold(fid, card) {
            if (state.exp[fid]) delete state.exp[fid];
            else state.exp[fid] = true;
            var on = !!state.exp[fid];
            var target = card || $('.rec[data-id="' + fid + '"]', $('#recBody'));
            if (target) target.classList.toggle('fold', !on);
            var btn = target ? target.querySelector('[data-fold]') : null;
            if (btn) {
              btn.title = on ? '折叠' : '展开';
            }
          }
          /* 记录卡片流委派：线路大卡（进台账）/ 卡内交互（删记录）/ 折叠开关 /
     点卡（非交互区）= 折叠/展开（拖拽选中文字时不触发） */
          $('#recBody').addEventListener('click', function (e) {
            var lc = e.target.closest('.lc[data-line]');
            if (lc) {
              openLedger(lc.dataset.line);
              return;
            }
            /* 折叠/展开开关（每卡一枚） */
            var foldBtn = e.target.closest('[data-fold]');
            if (foldBtn) {
              toggleCardFold(Number(foldBtn.dataset.fold), foldBtn.closest('.rec[data-id]'));
              return;
            }
            /* 卡内操作 */
            var dBtn = e.target.closest('[data-ddel]');
            if (dBtn) {
              deleteRecord(Number(dBtn.dataset.ddel));
              return;
            }
            /* 点卡（非交互区；拖拽选中文字时不触发）= 折叠/展开 */
            var recCard = e.target.closest('.rec[data-id]');
            if (recCard && !window.getSelection().toString())
              toggleCardFold(Number(recCard.dataset.id), recCard);
          });
          /* 暂存区委派：批次卡 / 返回 / 勾选 / 保存 / 转入 / 废弃 / 重试 */
          $('#stgBody').addEventListener('click', function (e) {
            var act = e.target.closest('[data-stg]');
            if (act) {
              var a = act.dataset.stg;
              if (a === 'reload') {
                loadStaging();
                return;
              }
              if (a === 'back') {
                state.stg.detail = null;
                renderStagingList();
                return;
              }
              if (a === 'save') {
                var tr = act.closest('tr[data-sid]');
                if (tr) saveStagingRow(tr, act);
                return;
              }
              if (a === 'import-all') {
                importBatch(null);
                return;
              }
              if (a === 'import-sel') {
                var ids = Object.keys(state.stgSel)
                  .filter(function (k) {
                    return state.stgSel[k];
                  })
                  .map(Number);
                if (!ids.length) {
                  Shade.toast('请先勾选要转入的记录', 'info');
                  return;
                }
                importBatch(ids);
                return;
              }
              if (a === 'discard') {
                discardBatch();
                return;
              }
              return; // ck / ck-all 走 change 事件
            }
            /* 批次卡（点击非操作区）→ 进入详情 */
            var card = e.target.closest('.stg-card[data-batch]');
            if (card) openBatch(Number(card.dataset.batch));
          });
          /* 暂存区勾选（change 委托：逐行 / 全选） */
          $('#stgBody').addEventListener('change', function (e) {
            var ck = e.target.closest('[data-stg="ck"]');
            if (ck) {
              var tr = ck.closest('tr[data-sid]');
              if (tr) state.stgSel[Number(tr.dataset.sid)] = ck.checked;
              /* 就地刷新「转入选中」按钮计数与可用态，不重绘表格（避免打断编辑输入） */
              var selN = Object.keys(state.stgSel).filter(function (k) {
                return state.stgSel[k];
              }).length;
              var btn = $('[data-stg="import-sel"]', $('#stgBody'));
              if (btn) {
                btn.disabled = !selN;
                btn.textContent = '转入选中（' + selN + '）';
              }
              return;
            }
            var all = e.target.closest('[data-stg="ck-all"]');
            if (all) {
              $$('#stgBody [data-stg="ck"]').forEach(function (c) {
                c.checked = all.checked;
                var tr = c.closest('tr[data-sid]');
                if (tr) state.stgSel[Number(tr.dataset.sid)] = all.checked;
              });
              var btn2 = $('[data-stg="import-sel"]', $('#stgBody'));
              var n = all.checked
                ? state.stg.detail && state.stg.detail.records
                  ? state.stg.detail.records.length
                  : 0
                : 0;
              if (btn2) {
                btn2.disabled = !n;
                btn2.textContent = '转入选中（' + n + '）';
              }
            }
          });
          /* 冲突委派：重试 / 解决 */
          $('#cftBody').addEventListener('click', function (e) {
            var re = e.target.closest('[data-cft="reload"]');
            if (re) {
              loadConflicts();
              return;
            }
            var btn = e.target.closest('[data-keep]');
            if (btn) {
              var card = btn.closest('.cft[data-cid]');
              if (card) resolveConflict(card, btn.dataset.keep, btn);
            }
          });
        }

        /* ================= 未分配班组空态（屏十口径） ================= */
        function renderNoTeam() {
          $('.cx-head .acts').style.display = 'none';
          $('#dash').style.display = 'none';
          $('.cx-tools').style.display = 'none';
          $('#cxTabs').style.display = 'none';
          $('.cx-body').style.display = 'none';
          $('#fabExport').hidden = true;
          Shade.renderNoTeam($('#noTeam'));
        }

        /* ================= 班组切换后整页重载 ================= */
        function reloadTeamData() {
          state.rec = null;
          state.dash = null;
          /* 视图状态复位：回一级线路视图并清空搜索（线路集合随班组变化） */
          state.view = 'lines';
          state.curLine = '';
          state.lineSearch = '';
          $('#recSearch').value = '';
          state.exp = {}; // 卡片折叠状态随班组切换复位
          state.stg = { list: null, detail: null, err: '' };
          state.stgSel = {};
          state.cft = { list: null, err: '' };
          state.sync = null;
          syncView();
          loadDashboard();
          loadRecords();
          if (isManager) {
            loadSyncStatus();
            if (state.tab === 'staging') loadStaging();
            if (state.tab === 'conflicts') loadConflicts();
          }
        }

        /* ================= 启动 ================= */
        async function init() {
          /* 静态图标注入 */
          $('#fabExport').innerHTML = Shade.icon('download', 22);
          $('#recSearchBox').insertAdjacentHTML('afterbegin', Shade.icon('search', 15));
          $('#btnBackLines').innerHTML = Shade.icon('chevron-left', 14) + '返回线路';
          $('#btnSync').innerHTML = Shade.icon('refresh', 15) + '同步至内网';
          $('#btnWxSync').innerHTML = Shade.icon('book', 15) + '同步知识库';
          $$('#cxTabs button[data-p]').forEach(function (b) {
            b.insertAdjacentHTML(
              'afterbegin',
              Shade.icon({ records: 'task', staging: 'folder', conflicts: 'warn' }[b.dataset.p], 14)
            );
          });
          Shade.moveTabInd($('#cxTabs button.on'), $('#cxTabInd'), true); // 页签指示条首帧落位

          /* 左侧导航栏用户：接口失败回退本地缓存 */
          Shade.refreshUser();

          me = Shade.user() || {};
          isManager = me.role === 'admin' || me.role === 'team_admin';
          /* 管理角色入口显隐：暂存区 / 冲突页签 + 同步至内网 + 同步知识库（工具行整行仅管理角色可见） */
          if (isManager) {
            $('#tabStaging').hidden = false;
            $('#tabConflicts').hidden = false;
            $('.cx-tools').hidden = false;
            $('#btnSync').hidden = false;
            $('#btnWxSync').hidden = false;
          }

          /* 班组隔离门控：非超管未分配班组 → 整页空态（屏十口径）；超管先选定切换班组再出数 */
          if (me.role !== 'admin' && !me.team_id) {
            renderNoTeam();
            return;
          }
          /* 班组切换下拉：全员先换自绘下拉并隐藏（原生 select 保留为数据源），超管由 setupTeamSel 显示 */
          var teamDd = Shade.dropdown($('#teamSel'), {
            width: 'auto',
            minWidth: '132px',
            height: 36,
          });
          teamDd.el.style.display = 'none';
          if (me.role === 'admin') {
            /* 超管班组切换器：数据源 GET /admin/teams（仅启用班组），localStorage.crossing_team_id 持久化，切换后整页数据重载 */
            var teamSel = await Shade.setupTeamSel({
              select: $('#teamSel'),
              dropdown: teamDd,
              storageKey: 'crossing_team_id',
              showEl: teamDd.el,
              onChange: function (v) {
                state.teamId = v;
                reloadTeamData();
              },
            });
            if (teamSel) state.teamId = teamSel.getTeamId();
          }

          initEvents();
          loadDashboard();
          loadRecords();
          if (isManager) loadSyncStatus();
        }
        init();
      })();
    </script>
  </body>
</html>
