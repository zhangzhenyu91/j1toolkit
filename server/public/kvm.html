<!DOCTYPE html>
<!-- Shade 壹匣 · 远程连接计算机（PC 端应用，app_key kvm；设备卡片实时数据代理自 GLKVM Cloud 平台；终端/远程控制经
     /api/v1/kvm/jump 签发带态跳转地址（平台 jump.html 种 sid Cookie），实现仅能通过壹匣登录平台；
     本页不直连设备） 接口走 /api/v1/kvm（{code,message,data} 信封，Shade.api 自动带登录态）；
     班组隔离：本班组未绑定设备组或组内无设备时回退默认班组设备并显示黄色提示横幅（响应 fallback/fallback_team）；
     超管筛选行加班组切换下拉（localStorage.kvm_team_id，devices 与 jump 请求带 team_id） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>远程连接计算机 · Shade 壹匣</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  /* ===== 筛选工具条 ===== */
  .bar { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; flex-wrap: wrap; }
  .bar .input { height: 38px; width: 210px; font-size: 13px; }
  .bar .ops-r { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  /* 班组设备回退提示横幅（黄底黄字圆角条，屏十四口径） */
  .fb-banner {
    display: flex; align-items: center; gap: 8px; margin: 0 0 18px;
    padding: 10px 14px; border-radius: 10px;
    background: #FDF3CF; color: #EAB308;
    font-size: 12.5px; font-weight: 600; letter-spacing: .5px; line-height: 1.7;
  }
  .fb-banner .ic { flex: none; font-size: 14px; }
  .fb-banner[hidden] { display: none; }

  /* 手动刷新期间按钮图标转圈（不重排卡片、不出骨架，避免闪现） */
  .btn.refreshing svg { animation: rot 1s linear infinite; }

  /* ===== 设备卡片宫格（同工作台应用宫格口径）；卡顶警示斜纹条（hazard-top，theme.css） ===== */
  .dev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .dev { display: flex; flex-direction: column; overflow: hidden; }
  .dv-in { flex: 1; display: flex; flex-direction: column; padding: 16px 22px 20px; }
  .dv-top { display: flex; align-items: center; gap: 8px; }
  .dv-top .tag { margin-left: auto; }

  /* 状态点 + 文案 */
  .st { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .st i { width: 8px; height: 8px; border-radius: 50%; }
  .st-online { color: var(--green); } .st-online i { background: var(--green); box-shadow: 0 0 0 3px rgba(63,166,106,.15); }
  .st-offline { color: var(--ph); } .st-offline i { background: var(--dash); }
  .st-disabled { color: var(--red); } .st-disabled i { background: var(--red); }

  .dv-name { margin-top: 12px; font-size: 15.5px; font-weight: 800; letter-spacing: .3px; word-break: break-all; }
  .dv-ddns { margin-top: 4px; font-size: 11.5px; color: var(--ph); word-break: break-all; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }

  /* 信息行：标签左、值右 */
  .dv-info { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .dv-info > div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .dv-info span { flex: none; font-size: 11.5px; color: var(--ph); letter-spacing: 1px; }
  .dv-info b { font-size: 12.5px; font-weight: 600; color: var(--navy); word-break: break-all; text-align: right; }

  /* 卡底操作条（带态跳转平台；离线置灰） */
  .dv-ops { margin-top: 15px; padding-top: 13px; border-top: 1px solid var(--hair); display: flex; align-items: center; gap: 16px; }
  .act { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; white-space: nowrap; cursor: pointer; }
  .act svg { width: 13px; height: 13px; }
  .act.off { color: var(--dash); cursor: not-allowed; }
  .dv-ops .hint { margin-left: auto; font-size: 11px; color: var(--ph); letter-spacing: .5px; }

  /* 宫格内空态/错误态占满整行；骨架卡片 */
  .dev-grid .empty { grid-column: 1 / -1; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow-card); }
  .dev-sk { height: 224px; }

  @media (max-width: 640px) {
    .bar .input { width: 140px; }
  }
</style>
</head>
<body>
<!-- 顶部导航由 Shade.topbar({active:'kvm'}) 统一渲染 -->

<main class="page">
  <div class="section-title rv"><h3>设备列表</h3><span class="more" id="devCnt">数据实时取自 GLKVM 平台</span></div>

  <div class="bar rv">
    <input class="input" id="fltQ" placeholder="搜索名称 / IP / MAC">
    <div class="ops-r">
      <select class="input" id="teamSel" hidden title="仅超级管理员可切换班组；其余角色固定为本班组"></select>
      <button class="btn btn-sm" id="btnRefresh">刷新</button>
    </div>
  </div>

  <!-- 班组设备回退提示（fallback=true 时显示，屏十四口径） -->
  <div class="fb-banner" id="fbBanner" hidden>
    <span class="ic">⚠</span>
    <p id="fbText"></p>
  </div>

  <section class="dev-grid" id="devGrid"></section>
</main>

<script src="/assets/icons.js"></script>
<script src="/assets/common.js"></script>
<script>
  Shade.requireAuth();
  Shade.topbar({ active: 'kvm' });
  Shade.reveal();
  document.getElementById('btnRefresh').insertAdjacentHTML('afterbegin', Shade.icon('refresh', 15));

  var state = { q: '', loaded: false, timer: null, teamId: 0 };

  /* ===== 超管班组切换器（数据源 GET /admin/teams 启用班组；选择持久化 localStorage.kvm_team_id） ===== */
  /* 自绘下拉（原 select 隐藏保留为数据源），初始隐藏，超管加载班组列表后显示 */
  var teamDd = Shade.dropdown(document.getElementById('teamSel'), { width: 'auto', minWidth: '132px', height: 38 });
  teamDd.el.style.display = 'none';

  async function setupTeamSel() {
    var me = Shade.user() || {};
    if (me.role !== 'admin') return;
    try {
      var r = await Shade.api('/api/v1/admin/teams');
      var list = ((r.data && r.data.list) || []).filter(function (t) { return t.status === 1; });
      if (!list.length) return;
      var sel = document.getElementById('teamSel');
      sel.innerHTML = list.map(function (t) { return '<option value="' + t.id + '">' + Shade.esc(t.name) + '</option>'; }).join('');
      var saved = Number(localStorage.getItem('kvm_team_id')) || 0;
      state.teamId = list.some(function (t) { return t.id === saved; }) ? saved : list[0].id;
      sel.value = String(state.teamId);
      localStorage.setItem('kvm_team_id', String(state.teamId));
      teamDd.sync();
      teamDd.el.style.display = '';
      sel.addEventListener('change', function () {
        state.teamId = Number(this.value) || 0;
        localStorage.setItem('kvm_team_id', String(state.teamId));
        loadDevices('filter');
      });
    } catch (e) { /* 班组列表拉取失败：不显示切换器，由后端落默认班组出数 */ }
  }

  /* 班组设备回退提示横幅：fallback=true 时展示来源班组（屏十四文案口径） */
  function renderFallback(data) {
    var banner = document.getElementById('fbBanner');
    if (data && data.fallback) {
      document.getElementById('fbText').textContent =
        '本班组暂未接入设备，当前展示「' + (data.fallback_team || '默认班组') + '」的设备；本班组设备组接入后自动切换、此提示消失。';
      banner.hidden = false;
    } else {
      banner.hidden = true;
    }
  }

  function statusHtml(s) {
    if (s === 'online') return '<span class="st st-online"><i></i>在线</span>';
    if (s === 'disabled') return '<span class="st st-disabled"><i></i>禁用</span>';
    return '<span class="st st-offline"><i></i>离线</span>';
  }

  // 带态跳转平台：后端以当前员工账号取平台会话 sid，返回平台 jump.html 地址（sid 走 hash 不进服务器日志）
  var jumping = false;
  async function jump(to, ddns) {
    if (jumping) return;
    jumping = true;
    try {
      var body = { to: to, ddns: ddns || '' };
      if (state.teamId) body.team_id = state.teamId; // 超管指定班组（仅超管生效）
      var r = await Shade.api('/api/v1/kvm/jump', {
        method: 'POST',
        body: body,
      });
      window.open(r.data.url, '_blank');
    } catch (e) {
      Shade.toast(e.message || '跳转失败', 'error');
    } finally {
      jumping = false;
    }
  }

  // 卡底操作：仅在线设备可跳（与平台设备列表的交互口径一致）
  function actionHtml(d) {
    if (d.status === 'online' && d.ddns) {
      return '<a class="act" data-jump="term" data-ddns="' + Shade.esc(d.ddns) + '">' +
          Shade.icon('terminal', 13) + '终端</a>' +
        '<a class="act" data-jump="desk" data-ddns="' + Shade.esc(d.ddns) + '">' +
          Shade.icon('monitor', 13) + '远程控制</a>';
    }
    return '<span class="act off">' + Shade.icon('terminal', 13) + '终端</span>' +
      '<span class="act off">' + Shade.icon('monitor', 13) + '远程控制</span>' +
      '<span class="hint">离线不可用</span>';
  }

  // 渲染设备卡片；connectedTime 为 unix 秒（平台 last_seen_at）
  // animate=true 时卡片带 fade-up 入场动画（逐项 40ms 阶梯延迟）；手动/定时刷新不重播
  function renderCards(items, animate) {
    var grid = document.getElementById('devGrid');
    document.getElementById('devCnt').textContent = '共 ' + items.length + ' 台设备 · 每 30s 自动刷新';
    if (!items.length) {
      grid.innerHTML = '<div class="empty">' + Shade.icon('monitor', 44) +
        '<p>暂无设备' + (state.q ? '，试试更换搜索关键字' : '，或联系管理员开通平台设备权限') + '</p></div>';
      return;
    }
    grid.innerHTML = items.map(function (d, i) {
      var name = d.description || d.ddns || ('设备 #' + d.id);
      var last = d.status === 'online' ? '当前在线'
        : (d.connectedTime ? Shade.fmtDate(d.connectedTime * 1000, true) : '—');
      var anim = animate
        ? ' fade-up" style="animation-delay:' + Math.min(i * 40, 240) + 'ms'
        : '';
      return '<div class="card card-hover dev' + anim + '">' +
        '<div class="hazard-top"></div>' +
        '<div class="dv-in">' +
          '<div class="dv-top">' + statusHtml(d.status) +
            (d.deviceGroupName ? '<span class="tag tag-navy">' + Shade.esc(d.deviceGroupName) + '</span>' : '') +
          '</div>' +
          '<div class="dv-name">' + Shade.esc(name) + '</div>' +
          '<div class="dv-ddns mono">' + Shade.esc(d.ddns || '') + '</div>' +
          '<div class="dv-info">' +
            '<div><span>IP 地址</span><b class="mono">' + Shade.esc(d.ip || '—') + '</b></div>' +
            '<div><span>MAC</span><b class="mono">' + Shade.esc(d.mac || '—') + '</b></div>' +
            '<div><span>最近在线</span><b>' + last + '</b></div>' +
          '</div>' +
          '<div class="dv-ops">' + actionHtml(d) + '</div>' +
        '</div>' +
        '</div>';
    }).join('');
    grid.querySelectorAll('[data-jump]').forEach(function (el) {
      el.addEventListener('click', function () {
        jump(el.getAttribute('data-jump'), el.getAttribute('data-ddns'));
      });
    });
  }

  function renderError(e) {
    document.getElementById('devCnt').textContent = '加载失败';
    document.getElementById('devGrid').innerHTML = '<div class="empty">' + Shade.icon('error-circle', 44) +
      '<p>' + Shade.esc(e.message || '设备列表加载失败') + '</p>' +
      '<button class="btn btn-sm" id="btnRetry">重新加载</button></div>';
    document.getElementById('btnRetry').addEventListener('click', function () { loadDevices('init'); });
  }

  function renderLoading() {
    document.getElementById('devGrid').innerHTML =
      '<div class="card dev-sk skeleton"></div>'.repeat(3);
  }

  // 加载模式：init 首屏（骨架+入场动画）；filter 筛选（重排+动画）；
  // manual 手动刷新（保留现有卡片，按钮图标转圈，避免骨架闪现）；auto 定时静默
  async function loadDevices(mode) {
    if (mode === 'init') renderLoading();
    var btn = document.getElementById('btnRefresh');
    if (mode === 'manual') btn.classList.add('refreshing');
    try {
      var qs = [];
      if (state.q) qs.push('q=' + encodeURIComponent(state.q));
      if (state.teamId) qs.push('team_id=' + state.teamId); // 超管指定班组（仅超管生效）
      var r = await Shade.api('/api/v1/kvm/devices' + (qs.length ? '?' + qs.join('&') : ''));
      state.loaded = true;
      renderFallback(r.data);
      renderCards(r.data.items || [], mode === 'init' || mode === 'filter');
    } catch (e) {
      if (mode === 'auto') return; // 静默刷新失败不打断页面
      if (state.loaded) Shade.toast(e.message || '刷新失败', 'error'); // 已有内容时仅提示
      else renderError(e);
    } finally {
      if (mode === 'manual') btn.classList.remove('refreshing');
    }
  }

  /* ===== 筛选与刷新 ===== */
  document.getElementById('fltQ').addEventListener('input', function () {
    var v = this.value.trim();
    clearTimeout(state.qTimer);
    state.qTimer = setTimeout(function () { state.q = v; loadDevices('filter'); }, 400);
  });
  document.getElementById('btnRefresh').addEventListener('click', function () { loadDevices('manual'); });

  /* 超管先选定切换班组（非超管内部直接返回），再拉设备列表 */
  (async function () {
    await setupTeamSel();
    loadDevices('init');
    state.timer = setInterval(function () { loadDevices('auto'); }, 30000);
  })();
</script>
</body>
</html>
