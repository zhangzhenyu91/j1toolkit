      // 选择图片（本地读为 base64 dataURL 上送，对齐小程序 chooseImage；扩展名白名单校验）
      btnAttach.addEventListener('click', function () {
        if (state.sending) return;
        fileInput.click();
      });
      fileInput.addEventListener('change', function () {
        var file = fileInput.files && fileInput.files[0];
        if (!file) return;
        if (IMG_EXTS.indexOf(extOf(file.name)) < 0) {
          Shade.toast('仅支持 jpg / jpeg / png / gif / webp 图片', 'error');
          fileInput.value = '';
          return;
        }
        if (file.size > 8 * 1024 * 1024) {
          Shade.toast('图片不能超过 8MB，请压缩后再试', 'error');
          fileInput.value = '';
          return;
        }
        var reader = new FileReader();
        reader.onload = function () {
          state.pendingImage = String(reader.result || '');
          chipImg.src = state.pendingImage;
          updateChipRow();
        };
        reader.onerror = function () {
          Shade.toast('图片读取失败', 'error');
        };
        reader.readAsDataURL(file);
      });
      function clearImage() {
        state.pendingImage = null;
        chipImg.src = '';
        fileInput.value = '';
        updateChipRow();
      }
      chipX.addEventListener('click', clearImage);

      /* ============================================================
     附件（文档/音频，≤50MB，扩展名白名单与后端一致）：
     选择产物 → XHR 上传（upload.onprogress 进度显示在芯片上）
     → 芯片转「解析中」→ 每会话单轮询器 1s 拉一次列表按 id 落位多件状态，全部落定即停
     ============================================================ */
      var IMG_EXTS = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
      var ATT_EXTS = [
        'pdf',
        'docx',
        'doc',
        'pptx',
        'ppt',
        'xlsx',
        'xls',
        'epub',
        'mhtml',
        'csv',
        'md',
        'markdown',
        'txt',
        'json',
        'html',
        'mp3',
        'wav',
        'm4a',
        'flac',
        'ogg',
        'aac',
        'bmp',
        'tiff',
        'tif',
      ];
      var ATT_MAX = 5; // 最多 5 个附件
      var ATT_SIZE = 50 * 1024 * 1024; // 单件 ≤50MB
      var attSeq = 0;

      function extOf(name) {
        var m = /\.([a-z0-9]+)$/i.exec(name || '');
        return m ? m[1].toLowerCase() : '';
      }
      function fmtSize(n) {
        if (!n && n !== 0) return '';
        if (n < 1024) return n + 'B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1).replace(/\.0$/, '') + 'KB';
        return (n / 1024 / 1024).toFixed(1).replace(/\.0$/, '') + 'MB';
      }

      // chips 行显隐：图片或附件任一存在即显示
      function updateChipRow() {
        chipRow.style.display = state.pendingImage || state.attachments.length ? '' : 'none';
      }

      // 附件入口
      btnFile.addEventListener('click', function () {
        if (state.sending) return;
        if (!state.activeId) {
          Shade.toast('会话尚未就绪，请稍候');
          return;
        }
        attInput.click();
      });
      attInput.addEventListener('change', function () {
        var files = Array.prototype.slice.call(attInput.files || []);
        attInput.value = '';
        addAttachmentFiles(files);
      });

      // 入队校验：超量 / 非白名单 / 超 50MB 均 toast 拦截
      function addAttachmentFiles(files) {
        if (!files.length) return;
        if (!state.activeId) {
          Shade.toast('会话尚未就绪，请稍候');
          return;
        }
        files.forEach(function (file) {
          if (state.attachments.length >= ATT_MAX) {
            Shade.toast('最多添加 ' + ATT_MAX + ' 个附件', 'error');
            return;
          }
          if (ATT_EXTS.indexOf(extOf(file.name)) < 0) {
            Shade.toast('不支持的文件格式：' + file.name, 'error');
            return;
          }
          if (file.size > ATT_SIZE) {
            Shade.toast('附件不能超过 50MB：' + file.name, 'error');
            return;
          }
          var att = {
            uid: ++attSeq,
            attId: '',
            sessionId: state.activeId,
            name: file.name,
            size: file.size,
            status: 'uploading',
            progress: 0,
            error: '',
            icon: 'file',
            xhr: null,
            _el: null,
            _sub: null,
          };
          state.attachments.push(att);
          buildAttChip(att);
          updateChipRow();
          updateSendBtn();
          uploadAttachment(att, file);
        });
      }

      // 附件芯片 DOM（图标 + 文件名 + 大小/状态；右上 × 移除）
      function buildAttChip(att) {
        var el = document.createElement('div');
        el.className = 'att-chip';
        el.innerHTML =
          '<span class="a-ic">' +
          Shade.icon(att.icon, 16) +
          '</span>' +
          '<div class="a-main"><div class="a-name"></div><div class="a-sub"></div></div>' +
          '<button class="chip-x" title="移除附件">' +
          Shade.icon('close', 10) +
          '</button>';
        var nameEl = el.querySelector('.a-name');
        nameEl.textContent = att.name;
        nameEl.title = att.name;
        el.querySelector('.chip-x').addEventListener('click', function () {
          removeAttachment(att);
        });
        att._el = el;
        att._sub = el.querySelector('.a-sub');
        chipRow.appendChild(el);
        renderAttChip(att);
      }

      // 芯片状态行：uploading 显示百分比；uploaded/processing 显示解析中；failed 标红
      function renderAttChip(att) {
        if (!att._sub) return;
        var sub;
        if (att.status === 'uploading') sub = fmtSize(att.size) + ' · 上传 ' + att.progress + '%';
        else if (att.status === 'ready') sub = fmtSize(att.size) + ' · 已就绪';
        else if (att.status === 'failed') sub = att.error || '解析失败';
        else sub = fmtSize(att.size) + ' · 解析中…';
        att._sub.textContent = sub;
        att._el.classList.toggle('failed', att.status === 'failed');
      }

      // 移除芯片：中止上传 / 该会话无待解析件时停轮询（发送成功后整批清理、切换会话同走此路径）
      function removeAttachment(att) {
        if (att.xhr) {
          try {
            att.xhr.abort();
          } catch (e) {
            /* 忽略 */
          }
          att.xhr = null;
        }
        var i = state.attachments.indexOf(att);
        if (i >= 0) state.attachments.splice(i, 1);
        if (att._el) att._el.remove();
        stopAttPollIfIdle(att.sessionId);
        updateChipRow();
        updateSendBtn();
      }
      function clearAttachments() {
        state.attachments.slice().forEach(removeAttachment);
      }

      // 上传（XHR 拿 upload.onprogress；响应走统一信封 {code,data:{id,name,size,status}}）
      function uploadAttachment(att, file) {
        var fd = new FormData();
        fd.append('file', file, file.name);
        var xhr = new XMLHttpRequest();
        att.xhr = xhr;
        xhr.open(
          'POST',
          '/api/v1/callme/sessions/' + encodeURIComponent(att.sessionId) + '/attachments'
        );
        var token = localStorage.getItem('shade_token');
        if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        xhr.upload.onprogress = function (e) {
          if (!e.lengthComputable || att.status !== 'uploading') return;
          att.progress = Math.min(99, Math.round((e.loaded / e.total) * 100));
          renderAttChip(att);
        };
        xhr.onload = function () {
          att.xhr = null;
          if (state.attachments.indexOf(att) < 0) return; // 上传期间芯片已被移除
          var json = null;
          try {
            json = JSON.parse(xhr.responseText);
          } catch (e) {
            /* 非 JSON 响应走默认文案 */
          }
          if (json && json.code === 0 && json.data && json.data.id) {
            att.attId = json.data.id;
            att.status = json.data.status || 'uploaded';
            att.progress = 100;
            renderAttChip(att);
            updateSendBtn();
            // 落定态（ready/failed）无需轮询，其余进该会话 1s 轮询
            if (att.status !== 'ready' && att.status !== 'failed') startAttPoll(att.sessionId);
          } else {
            attFail(att, (json && json.message) || '上传失败（HTTP ' + xhr.status + '）');
          }
        };
        xhr.onerror = function () {
          att.xhr = null;
          attFail(att, '网络异常，上传失败');
        };
        xhr.send(fd);
      }

      function attFail(att, msg) {
        att.status = 'failed';
        att.error = msg;
        stopAttPollIfIdle(att.sessionId);
        renderAttChip(att);
        updateSendBtn();
      }

      // 解析状态轮询：每会话单轮询器（sessionId → timer），tick 一次拉列表按 id 为多件落位状态；
      // 芯片移除 / 切换会话后该会话无待解析件即停，避免多件并行各拉一份列表
      var attPolls = {};
      function pendingAtts(sessionId) {
        return state.attachments.filter(function (a) {
          return (
            a.sessionId === sessionId && a.attId && a.status !== 'ready' && a.status !== 'failed'
          );
        });
      }
      function startAttPoll(sessionId) {
        if (attPolls[sessionId]) return;
        attPolls[sessionId] = setInterval(async function () {
          var pending = pendingAtts(sessionId);
          if (!pending.length) {
            stopAttPoll(sessionId);
            return;
          }
          try {
            var r = await Shade.api(
              '/api/v1/callme/sessions/' + encodeURIComponent(sessionId) + '/attachments'
            );
            var list = Array.isArray(r.data) ? r.data : [];
            pending.forEach(function (att) {
              if (state.attachments.indexOf(att) < 0) return; // 轮询期间已被移除
              var found = null;
              for (var i = 0; i < list.length; i++) {
                if (list[i].id === att.attId) {
                  found = list[i];
                  break;
                }
              }
              if (!found) return; // 列表暂未刷新出该件，下轮再查
              att.status = found.status || att.status;
              if (att.status === 'failed') att.error = found.error_message || '解析失败';
              renderAttChip(att);
            });
          } catch (e) {
            /* 轮询失败静默，下轮重试 */
          }
          stopAttPollIfIdle(sessionId);
        }, 1000);
      }
      function stopAttPoll(sessionId) {
        if (attPolls[sessionId]) {
          clearInterval(attPolls[sessionId]);
          delete attPolls[sessionId];
        }
      }
      // 该会话已无待解析附件（全部就绪/失败或被移除）即停轮询
      function stopAttPollIfIdle(sessionId) {
        if (!pendingAtts(sessionId).length) stopAttPoll(sessionId);
      }

      /* ============================================================
     会话能力（GET /capabilities）：模型/思考强度下拉（复用 Shade.dropdown .dd 体系）+ 联网搜索胶囊开关；
     选择记忆于 localStorage（callme_model_id / callme_reasoning_effort / callme_web_search），发送时随 payload 上送
     ============================================================ */
      state.webSearch = localStorage.getItem('callme_web_search') === '1';

      async function loadCapabilities() {
        try {
          var r = await Shade.api('/api/v1/callme/capabilities');
          state.caps = r.data || {};
          setupModelSel(state.caps.models || []);
          refreshEffortSel(); // 档位清单随所选模型
          if (state.caps.web_search) {
            // web_search:false 时开关保持隐藏
            syncWsBtn();
            btnWs.style.display = '';
          }
        } catch (e) {
          /* 能力获取失败保持默认：开关不显示、模型走后端默认（payload 不带这些字段） */
        }
      }

      // 联网搜索胶囊：开=品牌蓝底白字 / 关=灰
      function syncWsBtn() {
        btnWs.classList.toggle('on', !!state.webSearch);
      }
      btnWs.addEventListener('click', function () {
        state.webSearch = !state.webSearch;
        localStorage.setItem('callme_web_search', state.webSearch ? '1' : '0');
        syncWsBtn();
      });

      // 模型下拉：models 为空/仅 1 个时禁用态展示当前模型名；记忆值失效回退首个
      function setupModelSel(models) {
        if (!models.length) {
          modelSel.innerHTML = '<option value="">默认模型</option>';
          modelSel.disabled = true;
        } else {
          modelSel.innerHTML = models
            .map(function (m) {
              return (
                '<option value="' + Shade.esc(m.id) + '">' + Shade.esc(m.name || m.id) + '</option>'
              );
            })
            .join('');
          var saved = localStorage.getItem('callme_model_id');
          var hit =
            saved &&
            models.some(function (m) {
              return m.id === saved;
            });
          modelSel.value = hit ? saved : models[0].id;
          state.modelId = modelSel.value;
          if (models.length <= 1) modelSel.disabled = true;
        }
        var dd = Shade.dropdown(modelSel, { width: 'auto', height: 34 });
        dd.el.classList.add('cm-model');
      }
      modelSel.addEventListener('change', function () {
        state.modelId = modelSel.value;
        localStorage.setItem('callme_model_id', modelSel.value);
        refreshEffortSel(); // 模型切换：重算档位清单，记忆档位不在新清单则回退默认
      });

      /* 思考强度下拉（与 modelSel 同法复用 Shade.dropdown）：「默认」（值 ''，发送不带 reasoning_effort）+
     当前模型 thinking_levels 中文映射档（未知档位原样显示）；模型无档位清单时整控隐藏；
     选择记忆于 localStorage（callme_reasoning_effort），回退默认不写回（切回原模型时可恢复记忆） */
      var EFFORT_LABELS = {
        off: '关闭',
        auto: '自动',
        minimal: '极简',
        low: '较低',
        medium: '中等',
        high: '较高',
        xhigh: '超高',
        max: '最高',
      };
      var effortDd = null;

      function effortLabel(lv) {
        return EFFORT_LABELS[lv] || lv;
      }

      function curModel() {
        var models = (state.caps && state.caps.models) || [];
        for (var i = 0; i < models.length; i++) {
          if (models[i].id === state.modelId) return models[i];
        }
        return null;
      }

      function refreshEffortSel() {
        var m = curModel();
        var levels = (m && m.thinking_levels) || [];
        if (!levels.length) {
          // 无档位清单：整控隐藏，发送回退默认
          if (effortDd) effortDd.el.style.display = 'none';
          state.reasoningEffort = '';
          return;
        }
        effortSel.innerHTML =
          '<option value="">默认</option>' +
          levels
            .map(function (lv) {
              return (
                '<option value="' + Shade.esc(lv) + '">' + Shade.esc(effortLabel(lv)) + '</option>'
              );
            })
            .join('');
        var saved = localStorage.getItem('callme_reasoning_effort') || '';
        effortSel.value = saved && levels.indexOf(saved) >= 0 ? saved : '';
        state.reasoningEffort = effortSel.value;
        if (!effortDd) {
          effortDd = Shade.dropdown(effortSel, { width: 'auto', height: 34 });
          effortDd.el.classList.add('cm-effort');
          // 打开弹层时 dropdown 内部 sync 会把按钮文案重置为档名，点击后补写短标签
          effortDd.el.querySelector('.dd-btn').addEventListener('click', syncEffortLabel);
        } else {
          effortDd.el.style.display = '';
          effortDd.sync();
        }
        syncEffortLabel();
      }

      // 按钮位标签直接显示档名（下拉列表项同为中文档名）
      function syncEffortLabel() {
        if (!effortDd) return;
        var cur = effortSel.options[effortSel.selectedIndex];
        effortDd.el.querySelector('.dd-label').textContent = cur ? cur.text : '默认';
      }
      effortSel.addEventListener('change', function () {
        state.reasoningEffort = effortSel.value;
        localStorage.setItem('callme_reasoning_effort', effortSel.value);
        syncEffortLabel();
      });

      /* ============================================================
     侧栏静态注入与用户信息
     ============================================================ */
      document.getElementById('sideLogo').innerHTML = Shade.icon('robot', 20);
      document.getElementById('btnNew').innerHTML = Shade.icon('add', 15) + '<span>新建会话</span>';
      document.getElementById('welcomeIcon').innerHTML = Shade.icon('robot', 36);
      document.getElementById('cmToggle').innerHTML = Shade.icon('chat', 16);
      btnAttach.innerHTML = Shade.icon('image', 19);
      btnFile.innerHTML = Shade.icon('attach', 19);
      btnWs.innerHTML = Shade.icon('globe', 14) + '<span class="ws-t">联网搜索</span>';
      btnSend.innerHTML = Shade.icon('send', 17);
      chipX.innerHTML = Shade.icon('close', 10);

      document.getElementById('btnNew').addEventListener('click', onNewSession);
      document.getElementById('cmToggle').addEventListener('click', function () {
        document.body.classList.add('side-open');
      });
      document.getElementById('cmMask').addEventListener('click', function () {
        document.body.classList.remove('side-open');
      });

      // 渲染用户资料（左侧导航栏 + 侧栏底部用户条；接口失败时回退本地缓存）
      function renderUser(u) {
        var name = u.nickname || u.username || '班组成员';
        var ch = name.charAt(0);
        document.getElementById('miniAvatar').textContent = ch;
        document.getElementById('topName').textContent = name;
        document.getElementById('footAvatar').textContent = ch;
        document.getElementById('footName').textContent = name;
        // 角色文案统一走 Shade.roleText（与 index.html 用户卡同口径，不拼 team）
        document.getElementById('footRole').textContent = Shade.roleText(u.role);
      }
      var cachedUser = Shade.user();
      if (cachedUser) renderUser(cachedUser);
      /* 接口最新资料刷新（失败回退本地缓存；左侧导航栏头像/昵称由 refreshUser 统一更新，回调渲染侧栏用户条） */
      Shade.refreshUser(function (u) {
        if (u) renderUser(u);
      });

      // 首次进入：加载会话列表并自动进入最近一次对话；会话就绪后再拉取模型/联网搜索能力
      loadSessions(true).then(function () {
        loadCapabilities();
      });
      autoGrow();
    </script>
  </body>
</html>
