[gateway]
; 业务网关地址（一般无需修改）
base = http://20.1.59.23:18080/

[auth]
; sso   = 账号密码自动登录（推荐，需 gmssl）
; token = 浏览器里手动复制凭证（备用，每天首次约19小时有效）
mode = sso
; sso 模式使用。密钥不入仓：密码请在工具箱 GUI 设置页填写（存 toolkit/config.json），
; 或在内网机部署时填写本文件。旧的内网机副本上已有真实值。
username =
password =
; token 模式使用（在浏览器 F12 Console 执行 copy(cube.token+'\n'+cube.refreshToken+'\n'+cube.mtk) 后粘贴）
token =
refresh_token =
mtk =

[export]
outdir = ./output
page_size = 50
run_state = 2
vehicle_state = 04
keep_tag = 00,01
ids_per_request = 20
; 是否额外生成一个合并 PDF
merge_pcd = false
; 轨迹 PDF 是否附带轨迹点明细表
points_table = true
; 轨迹渲染方式：official=官方页面直出（推荐，需 websocket-client）；template=内置地图模板；svg=离线示意图
track_render = official
; 官方页面直出时地图瓦片等待的【兜底上限】（毫秒）：v2.2.0 起以地图域名网络静默为完成信号，
; 瓦片加载完即走，快则几秒；仅当静默检测一直不触发（如长连接占住）才等到此上限
map_tiles_wait = 12000
; 地图"网络静默"判定时长（毫秒）：地图域名在途请求归零并持续该时长才判渲染完成。
; 有几条轨迹没渲全就截图时调大（如 8000）；须先见到瓦片请求才开始计静默
map_idle_quiet = 5000
; 轨迹弹窗出现后的【固定等待下限】（毫秒）：下限之内不启动静默检测（实测多数轨迹
; 完整渲染需 30s+，裸静默检测曾把个别没渲完的截早）；调大可更稳，置 0 则纯检测
map_min_wait = 30000
; 派车单打印弹窗 Section0 出现后的【固定等待】（毫秒）：等打印区数据填充/样式就位，
; 实测 6s 足够（轨迹弹窗仍需 30s，见上 map_min_wait）；置 0 关闭
pcd_render_wait = 6000
; （template 模式用）是否使用真实思极地图底图；地图页加载等待时间（毫秒）
real_map = true
map_budget = 60000

[map]
; 思极地图 appKey/appSecret（车辆平台前端内置，一般无需修改）
key = 293168d750a936879db0b73ce94c43a7
sn = e718fc1d189b344fb8b9ecda66e37ed6

[render]
; Chrome/Chromium 路径，留空自动探测
chrome =

[sso]
; 密码 SM2 公钥：留空则运行时自动从登录页提取（一般无需填写）；仅在自动提取失败时手动配置
sm2_pubkey =
; 单位参数（山西默认 sx，一般不改）
province_id = sx
wangsheng = sx
