<!doctype html>
<html lang="zh-CN">
  <head>

    <style>
      :root {
        --bg: #0a3592;
        --card: #ffffff;
        --ink: #1d2129;
        --muted: #4e5969;
        --line: #e5e6eb;
        --brand: #0e3da8;
        --track: #e8f0ff;
        --success: #00b42a;
        --danger: #f53f3f;
        --warning: #ff7d00;
        --radius: 12px;
        font-family:
          system-ui,
          -apple-system,
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: #fff;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        padding: 26px 32px 24px;
        position: relative;
      }
      body::before {
        content: '';
        position: fixed;
        inset: -30%;
        pointer-events: none;
        background-image: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.075) 1px,
          transparent 1.4px
        );
        background-size: 28px 28px;
        animation: bg-drift 32s linear infinite;
      }
      body > * {
        position: relative;
      }
      @keyframes bg-drift {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(28px, 28px, 0);
        }
      }
      .head {
        display: flex;
        align-items: center;
        gap: 18px;
        flex: none;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      }
      .title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .overall {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .overall-bar {
        flex: 1;
        min-width: 180px;
        height: 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.18);
        overflow: hidden;
      }
      .overall-bar > i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: #fff;
        transition: width 0.4s ease;
        position: relative;
        overflow: hidden;
      }
      .overall-bar > i::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(10, 53, 146, 0.28), transparent);
        animation: bar-sheen 2.8s ease-in-out infinite;
      }
      .overall-pct {
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--brand);
        min-width: 54px;
        text-align: right;
      }
      .overall-text,
      .overall-count {
        font-size: 13px;
        color: rgba(255, 255, 255, 0.86);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .close,
      .stop {
        flex: none;
        height: 34px;
        padding: 0 15px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 8px;
        background: transparent;
        color: #fff;
        font-size: 13px;
        cursor: default;
      }
      .close:hover,
      .stop:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .stop {
        border-color: rgba(245, 63, 63, 0.85);
        background: rgba(245, 63, 63, 0.16);
      }
      .grid {
        flex: 1;
        min-height: 0;
        display: grid;
        gap: 22px;
        padding-top: 22px;
        align-content: stretch;
        grid-auto-rows: minmax(0, 1fr);
      }
      .tile {
        background: transparent;
        color: var(--ink);
        border-radius: 10px;
        box-shadow: none;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
        cursor: pointer;
        border: 1px solid transparent;
        padding: 16px 18px;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.2s ease;
        animation: tile-in 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .tile:nth-child(2) {
        animation-delay: 0.06s;
      }
      .tile:nth-child(3) {
        animation-delay: 0.12s;
      }
      .tile:nth-child(4) {
        animation-delay: 0.18s;
      }
      .tile:nth-child(5) {
        animation-delay: 0.24s;
      }
      .tile:nth-child(6) {
        animation-delay: 0.3s;
      }
      .tile:hover {
        transform: translateY(-2px);
      }
      .tile.wide {
        grid-column: 1 / -1;
      }
      @keyframes tile-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .tile.normal {
        border-color: rgba(0, 180, 42, 0.42);
        box-shadow: inset 0 0 0 1px rgba(0, 180, 42, 0.08);
      }
      .tile.abnormal {
        border-color: rgba(245, 63, 63, 0.48);
        box-shadow: inset 0 0 0 1px rgba(245, 63, 63, 0.1);
        animation: alert-pulse 2.4s ease-in-out infinite;
      }
      @keyframes alert-pulse {
        0%,
        100% {
          border-color: rgba(245, 63, 63, 0.42);
        }
        50% {
          border-color: rgba(245, 63, 63, 0.78);
        }
      }
      .tile.pending {
        border-color: #ff7d00;
        box-shadow:
          0 0 0 4px rgba(255, 125, 0, 0.18),
          0 8px 26px rgba(0, 0, 0, 0.18);
      }
      .tile-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 17px 10px;
        flex: none;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c9cdd4;
        flex: none;
      }
      .dot.running {
        background: var(--success);
      }
      .dot.starting {
        background: var(--warning);
      }
      .dot.warning {
        background: var(--warning);
      }
      .dot.failed {
        background: var(--danger);
      }
      .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 600;
      }
      .state {
        flex: none;
        font-size: 12px;
        color: var(--muted);
      }
      .tile-progress {
        flex: none;
        padding: 0 17px 13px;
      }
      .logs {
        flex: 1;
        min-height: 0;
        margin: 0 12px 12px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #f7f8fa;
        color: #1d2129;
        overflow-y: auto;
        font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
        font-size: 11px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .logline {
        padding: 1px 0;
      }
      .logs .empty {
        color: #86909c;
        font-family: inherit;
        text-align: center;
        padding-top: 18px;
      }
      .task-label {
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-height: 18px;
      }
      .bar {
        height: 10px;
        margin: 8px 0 6px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
        position: relative;
      }
      .bar > i {
        position: relative;
        overflow: hidden;
      }
      .bar > i::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
        animation: bar-sheen 2.4s ease-in-out infinite;
      }
      .bar.failed > i::after {
        animation: none;
      }
      @keyframes bar-sheen {
        0%,
        30% {
          transform: translateX(-100%);
        }
        70%,
        100% {
          transform: translateX(100%);
        }
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: var(--brand);
        transition: width 0.4s ease;
      }
      .bar.failed > i {
        background: var(--danger);
      }
      .bar.done > i {
        background: var(--success);
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 11px;
        color: #86909c;
        font-variant-numeric: tabular-nums;
      }
      .meta span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty {
        grid-column: 1 / -1;
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
        font-size: 15px;
        padding: 40px;
      }
      /* 不再使用白色卡片：信息直接铺在蓝色背景上，左侧色条表达状态。 */
      .tile {
        background: transparent;
        color: #fff;
        border: 0;
        border-left: 3px solid rgba(255, 255, 255, 0.22);
        border-radius: 0;
        box-shadow: none;
        padding-left: 18px;
        overflow: visible;
      }
      .tile.normal {
        border-left-color: #00b42a;
        background: rgba(0, 180, 42, 0.045);
        box-shadow: none;
      }
      .tile.abnormal {
        border-left-color: #f53f3f;
        background: rgba(245, 63, 63, 0.07);
        box-shadow: none;
        animation: alert-bg 2.4s ease-in-out infinite;
      }
      .tile.warning {
        border-left-color: #ff7d00;
        background: rgba(255, 125, 0, 0.045);
        box-shadow: none;
      }
      .tile.pending {
        border-left-color: #ff7d00;

        box-shadow: none;
      }
      @keyframes alert-bg {
        0%,
        100% {
          background: rgba(245, 63, 63, 0.05);
        }
        50% {
          background: rgba(245, 63, 63, 0.12);
        }
      }
      .tile-head {
        padding: 0 0 9px;
      }
      .name {
        color: #fff;
      }
      .state {
        color: rgba(255, 255, 255, 0.66);
      }
      .open {
        flex: none;
        height: 28px;
        padding: 0 10px;

        border-radius: 6px;
        background: transparent;

      }
      .open:hover {

      }

        padding: 0;
      }

      }

      }

      /* 浅色「政企蓝白」主题：背景不再用深蓝大色块。 */
      body {

      .legend.bad {
        background: #f53f3f;
      }
      .legend.wait {
        background: #ff7d00;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(16, 24, 40, 0.42);
      }
      .modal.open {
        display: flex;
      }
      .modal-card {
        width: min(440px, 100%);
        background: #fff;
        border: 1px solid #e5e6eb;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        padding: 22px;
      }
      .modal-title {
        font-size: 16px;
        font-weight: 700;
        color: #1d2129;
        margin-bottom: 8px;
      }
      .modal-text {
        font-size: 12px;
        line-height: 1.7;
        color: #4e5969;
        margin-bottom: 18px;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .modal-btn {
        height: 32px;
        padding: 0 14px;
        border-radius: 8px;
        border: 1px solid #e5e6eb;
        background: #f7f8fa;
        color: #4e5969;
        font-size: 12px;
        cursor: pointer;
      }
      .modal-btn:hover {
        background: #eef0f3;
      }
      .modal-btn.primary {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .modal-btn.primary:hover {
        background: #0a3592;
      }
      .modal-btn.danger {
        background: #f53f3f;
        border-color: #f53f3f;
        color: #fff;
      }
      .modal-btn.danger:hover {
        background: #d9363e;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
      @media (max-width: 900px) {
        body {
          padding: 14px 16px;
        }
        .title {
          font-size: 18px;
        }
        .overall-count {
          display: none;
        }
        .close {
          padding: 0 10px;
        }
      }
    </style>
  </head>
  <body>
    <header class="head">
      <img class="brand-logo" src="./src/assets/icon.png" alt="Shade" draggable="false" />
      <div class="title">Shade 壹匣 · 机巡审核</div>
      <button class="stop" id="stopAllBtn" type="button">停止全部</button>
      <button class="close" id="closeBtn" type="button">关闭大屏</button>
    </header>
    <div class="stage">
      <section class="overall-panel">
        <div class="overall">
          <span class="overall-pct" id="overallPct">0%</span>
          <div class="overall-bar"><i id="overallBar"></i></div>
          <span class="overall-text" id="overallText">准备中</span>
          <span class="overall-count" id="overallCount"></span>
        </div>
      </section>
      <main class="grid" id="grid">
        <div class="empty">正在连接实例…</div>
      </main>
    </div>
    <footer class="foot">
      <span><i class="legend ok"></i>正常运行</span>
      <span><i class="legend wait"></i>正在恢复 / 等待重试</span>
      <span><i class="legend bad"></i>卡死 / 恢复循环 / 失败</span>
      <span class="foot-note">图片加载失败属跳过处理，卡片保持正常绿色轨</span>
      <span class="foot-brand">Shade Desk · 实时大屏</span>
    </footer>
    <div class="modal" id="stopModal">
      <div class="modal-card">
        <div class="modal-title">确定停止全部审核任务？</div>
        <div class="modal-text">
          所有正在运行的实例都会停止，已审核完成的结果会保留。停止后可在客户端重新启动。
        </div>
        <div class="modal-actions">
          <button class="modal-btn" type="button" data-close="stopModal">取消</button>
          <button class="modal-btn danger" id="confirmStopAll" type="button">确认停止全部</button>
        </div>
      </div>
    </div>
    <div class="modal" id="closeModal">
      <div class="modal-card">
        <div class="modal-title">关闭实时大屏？</div>
        <div class="modal-text">
          仅关闭大屏界面，后台审核任务会继续运行；可随时从客户端重新打开实时大屏。
        </div>
        <div class="modal-actions">
          <button class="modal-btn" type="button" data-close="closeModal">取消</button>
          <button class="modal-btn primary" id="confirmClose" type="button">确认关闭</button>
        </div>
      </div>
    </div>
    <script type="module" src="./screensaver.js"></script>
  </body>
</html>
