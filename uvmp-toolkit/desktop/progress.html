<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>机巡审核进度</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #card {
        box-sizing: border-box;
        height: calc(100% - 12px);
        margin: 6px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 10px 14px 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #1d2129;
        padding-bottom: 6px;
        border-bottom: 1px solid #e5e6eb;
        cursor: move;
        user-select: none;
        -webkit-user-select: none;
      }
      .head .state {
        margin-left: auto;
        font-weight: 400;
        font-size: 11px;
        color: #86909c;
        font-variant-numeric: tabular-nums;
      }
      .close {
        flex: none;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #86909c;
        font-size: 18px;
        line-height: 18px;
        cursor: pointer;
      }
      .close:hover {
        background: #f7f8fa;
        color: #1d2129;
      }
      .rows {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding-right: 2px;
      }
      .row {
        padding: 7px 0;
        border-bottom: 1px dashed #e5e6eb;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row-head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
      }
      .dot {
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #c9cdd4;
      }
      .dot.running {
        background: #00b42a;
      }
      .dot.pending {
        background: #ff7d00;
      }
      .dot.done {
        background: #0e3da8;
      }
      .dot.failed {
        background: #f53f3f;
      }
      .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
        color: #1d2129;
      }
      .state-text {
        flex: none;
        font-size: 11px;
        color: #86909c;
      }
      .bar {
        height: 5px;
        margin: 5px 0 3px;
        border-radius: 3px;
        background: #e8f0ff;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 3px;
        background: #0e3da8;
        transition: width 0.3s ease;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 11px;
        color: #86909c;
        font-variant-numeric: tabular-nums;
      }
      .meta .label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty,
      .error {
        padding: 18px 4px;
        font-size: 12px;
        color: #86909c;
        text-align: center;
      }
      .error {
        color: #f53f3f;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .grip {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 14px;
        height: 14px;
        cursor: nwse-resize;
        background: linear-gradient(135deg, transparent 50%, #c9cdd4 50%);
        border-radius: 0 0 8px 0;
      }
      .grip:hover {
        background: linear-gradient(135deg, transparent 50%, #86909c 50%);
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="head" id="head">
        <span>机巡审核进度</span>
        <span class="state" id="updated">加载中…</span>
        <button class="close" id="close" type="button" title="关闭浮窗">×</button>
      </div>
      <div class="rows" id="rows">
        <div class="empty">加载中…</div>
      </div>
      <span class="grip" id="grip" title="拖动调整大小"></span>
    </div>
    <script type="module" src="/src/progresspanel/main.js"></script>
  </body>
</html>
