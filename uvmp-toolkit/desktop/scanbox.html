<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>scanbox</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #frame {
      box-sizing: border-box; width: 100%; height: 100%;
      border: 2px solid #0E3DA8;                 /* 品牌蓝 */
      background: rgba(14, 61, 168, 0.12);     /* 透明窗命中测试需非零 alpha，0.05 曾被当 0 穿透 */
      border-radius: 4px;
      cursor: move; user-select: none; -webkit-user-select: none;
      position: relative;
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .tag {
      position: absolute; top: -2px; left: -2px;
      background: #0E3DA8; color: #fff; font-size: 12px; line-height: 1;
      padding: 4px 8px; border-radius: 4px 0 4px 0; letter-spacing: 1px;
    }
    .close {
      position: absolute; top: -2px; right: -2px; width: 22px; height: 22px;
      background: #0E3DA8; color: #fff; font-size: 14px; line-height: 20px;
      text-align: center; border-radius: 0 4px 0 4px; cursor: pointer;
    }
    .close:hover { background: #F53F3F; }
    .grip {
      position: absolute; right: -2px; bottom: -2px; width: 16px; height: 16px;
      cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 50%, #0E3DA8 50%);
      border-radius: 0 0 3px 0;
    }
  </style>
</head>
<body>
  <div id="frame">
    <span class="tag" id="tag"></span>
    <span class="close" id="close" title="隐藏此框（可在「题库搜题」页重新开启）">×</span>
    <span class="grip" id="grip"></span>
  </div>
  <script type="module" src="/src/scanbox/main.js"></script>
</body>
</html>
