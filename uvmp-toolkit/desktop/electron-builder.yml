appId: cn.j1.uvmp-toolkit
# 安装后显示名（开始菜单/桌面快捷方式/卸载列表），全端统一「Shade 壹匣 - 内网」：
# Windows 用此 productName；Linux 由 CI --c.productName=uvmp-toolkit 覆盖（WM_CLASS 需 ASCII），
# 显示名走下方 linux.desktop.Name（同名）
productName: Shade 壹匣 - 内网
copyright: Shade 壹匣
directories:
  output: ../dist-electron
  buildResources: build
files:
  - dist/**
  - electron/**
  - package.json
  # 题库搜题 OCR 运行时（原生模块；打包时按目标架构剪枝，见 build/prune-ort.cjs）
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/ws/**
  # 题库 Excel 解析/模板生成由**渲染层**动态 import（electron/quizsearch/workbook.mjs、
  # template.mjs）。Vite 构建时把 read-excel-file / write-excel-file 一并打进 dist，
  # 安装包不再在运行时从 node_modules 解析它们（这两个包仍留在 package.json 供构建用）。
  #
  # 联调/诊断脚本仅开发期使用（依赖本机调试端口与真实屏幕），不进安装包
  - '!electron/quizsearch/tools/**'
  - '!electron/**/__probe_cjs.cjs'
asarUnpack:
  # 托盘/窗口图标必须解包成真实文件：asar 内路径在部分 Linux 托盘实现下会间歇丢失图标
  - electron/icon.png
  # OCR 模型与推理线程脚本：onnx 原生库直读模型文件，不能走 asar
  - electron/quizsearch/**
  # 自动登录验证码 OCR：Python 核心以 ELECTRON_RUN_AS_NODE 直接读取真实文件
  - electron/ocr/**
  # .node 原生模块必须解包加载；onnxruntime-common 同样必须解包——
  # 推理线程在 asar 外运行，按真实目录解析依赖，漏解包即 Cannot find module（已踩坑）
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
afterPack: build/prune-ort.cjs
extraResources:
  # Python 核心（PyInstaller onedir，CI 先行构建，构件下载到 dist-core/core/ → resources/core/）
  - from: ../dist-core/core
    to: core

win:
  target: [nsis, zip]
  icon: build/icon.png
  executableName: uvmp-toolkit # exe 保持 ASCII（产物命名规范；显示名由 productName 承担）
  artifactName: uvmp-toolkit-${version}-win-portable.${ext} # nsis 目标由 nsis.artifactName 覆盖
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Shade 壹匣 - 内网
  artifactName: uvmp-toolkit-Setup-${version}.${ext}
  include: installer.nsh

linux:
  target: [deb, tar.gz]
  category: Utility
  # 不显式设 linux.icon：单文件 png 只会装出单一尺寸（已踩坑）；
  # 留空则回退 build/icons/ 目录（make-icons.cjs 生成的 16~1024 全尺寸 hicolor 集合）
  executableName: uvmp-toolkit
  artifactName: uvmp-toolkit-${version}-${arch}.${ext}
  desktop:
    # electron-builder 26 起 desktop 只接受 entry / desktopActions；[Desktop Entry] 的键必须放进
    # entry 里（直接写 Name/Comment/StartupWMClass 会被 scheme 判为 additionalProperties 违规）。
    entry:
      Name: Shade 壹匣 - 内网
      Comment: 派车同步 / 轨迹导出 / 题库搜题
      # WM_CLASS 关联名（Unicode 产品名做 StartupWMClass 在 X11 下匹配失败，已踩坑）；
      # 与 main.cjs 的 app.setDesktopName('uvmp-toolkit.desktop') 对应
      StartupWMClass: uvmp-toolkit
deb:
  # deb 控制字段 Package 与此一致（= desktop/package.json 的 name），
  # afterInstall/afterRemove 的 dpkg 版本查询、部署说明的卸载命令都必须用同一名字
  packageName: uvmp-toolkit-desktop
  afterInstall: build/afterInstall.sh
  afterRemove: build/afterRemove.sh
  artifactName: uvmp-toolkit_${version}_${arch}.${ext}
  # Chromium 运行时依赖：只列 GTK/NSS/GBM/ALSA 等最小必需集，避免在麒麟/统信上拖入无用包。
  # 带 | 的是 Debian 13 / Ubuntu 24.04 的 t64 重命名包（麒麟 V10、统信 20 用原名的老包）；
  # dpkg 依赖支持「甲 | 乙」择一，两个时代都能满足。
  depends:
    - libatomic1 # arm64 麒麟跑 Chromium 需要（amd64 也无害）
    - libgtk-3-0 | libgtk-3-0t64
    - libnss3
    - libgbm1
    - libasound2 | libasound2t64
    - libatk1.0-0 | libatk1.0-0t64
    - libatk-bridge2.0-0 | libatk-bridge2.0-0t64
    - libatspi2.0-0 | libatspi2.0-0t64
    - libcups2 | libcups2t64
    - libpango-1.0-0 | libpango-1.0-0t64
    - libcairo2
    - libdrm2
    - libnotify4 # 桌面通知（Electron Notification 走 libnotify）
    - libxcb-dri3-0 # Chromium GPU/合成路径
    - libxkbcommon0
    - libxcomposite1
    - libxdamage1
    - libxfixes3
    - libxrandr2
    - libxss1
    - libxtst6
    # afterInstall 用 xdg-desktop-menu forceupdate 刷新菜单；不声明依赖时，
    # 装完要等重新登录才在开始菜单出现（精简装机常缺 xdg-utils）
    - xdg-utils
    # Linux X11 圆角裁剪需读取真实 X11 外框（desktop/electron/window-native-bounds.cjs）
    - x11-utils
