# 统一容器网络：j1toolkit（外部网络，须先 docker network create j1toolkit）。
# 本 compose 仅含 Shade 服务端本身；OpenList（网盘中转）、ONLYOFFICE（在线编辑）等配套容器由部署者自装，
# 均加入 j1toolkit 网络即可按容器名互通（如 NETDISK_API_URL=http://openlist:5244、OO_INTERNAL_URL=http://onlyoffice）。
networks:
  j1toolkit:
    external: true

# Shade 壹匣服务端（Go API + Vue3 网页端同端口）—— docker compose 部署
# 用法：cp .env.example .env → 按实际填写（IMAGE 必填）→ docker compose up -d
# 镜像由 GitHub Actions 发版产线构建推腾讯云 TCR（推 tag release-vX.Y.Z → 镜像 :X.Y.Z，规则见 README「后端部署」）；
# 镜像本体 = Go 1.27 服务二进制（go/cmd/shade）+ Vue3 Vite 构建的 web/dist（SPA 与 /api/v1 同端口托管）；
# 升级：改 .env 的 IMAGE 版本号 → docker compose pull && docker compose up -d
services:
  j1toolkit:
    image: ${IMAGE:?请在 .env 中配置 IMAGE（镜像完整地址，含版本标签）}
    container_name: j1toolkit
    restart: always
    # 停止宽限：server.Shutdown 10s + 日志持久层 CloseContext 5s，留足余量，
    # 避免 docker 默认 10s 后 SIGKILL 抢占关停流程（在飞后台任务仍为 best-effort）。
    stop_grace_period: 25s
    networks:
      - j1toolkit
    ports:
      # 容器内外同端口（.env 的 PORT 经 env_file 传入容器作为监听端口；缺省 3000 与服务端默认一致）
      - '${PORT:-3000}:${PORT:-3000}'
    env_file:
      - .env
    volumes:
      # 可写数据（安全日记录、应用日志 data/logs、OO 保存 staging 等）持久化到本目录 data/。
      # 注意：不要给本服务加 logging.options.max-size/max-file 等 stdout 轮转；
      # stdout 只是排障副本，持久日志由服务写入 data/logs 并默认永久保留。
      - ./data:/app/server/data
