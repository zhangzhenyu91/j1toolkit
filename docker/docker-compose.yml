# Shade 壹匣后端（API + 网页端同端口）—— docker compose 部署
# 用法：cp .env.example .env → 按实际填写（IMAGE 必填）→ docker compose up -d
# 镜像由 GitHub Actions 发版产线构建推腾讯云 TCR（推 tag release-vX.Y.Z → 镜像 :X.Y.Z，规则见 README「后端部署」）；
# 升级：改 .env 的 IMAGE 版本号 → docker compose pull && docker compose up -d
services:
  j1toolkit:
    image: ${IMAGE:?请在 .env 中配置 IMAGE（镜像完整地址，含版本标签）}
    container_name: j1toolkit
    restart: always
    ports:
      # 容器内外同端口（.env 的 PORT 经 env_file 传入容器作为监听端口）
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    volumes:
      # 可写数据（安全日记录等）持久化到本目录 data/
      - ./data:/app/server/data

  # 团队网盘存储引擎（OpenList）：仅 compose 内网可达，不映射公网端口；
  # j1toolkit 经 http://openlist:5244 访问（.env 的 NETDISK_API_URL 保持此值）；
  # 管理页访问：SSH 隧道转发 5244 端口后开 http://127.0.0.1:5244（如 ssh -L 5244:127.0.0.1:5244 <服务器>）
  openlist:
    image: ${OPENLIST_IMAGE:-openlistteam/openlist:v4.2.4}
    container_name: openlist
    restart: always
    expose:
      - "5244"
    environment:
      - UMASK=022
      - TZ=Asia/Shanghai
    volumes:
      # OpenList 配置/数据库持久化到本目录 openlist/data/（含存储挂载与索引，删除需重建）
      - ./openlist/data:/opt/openlist/data
