# docx-mcp 反代配置（1Panel 用）
# 放置位置：/www/sites/mcp.j1net.com/proxy/docx-mcp.conf
# 放好后在 1Panel 重载 OpenResty 配置（或执行 docker exec <openresty容器> openresty -s reload）
#
# 方式一（推荐）：整域名反代
#   Dify 的 MCP 地址填：https://mcp.j1net.com/mcp/
#   把下面"方式一"整段取消注释，并删除"方式二"。
#
# location / {
#     proxy_pass http://10.2.24.13:8002;
#     proxy_http_version 1.1;
#     proxy_set_header Host 127.0.0.1;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto https;
#     proxy_set_header Connection "";
#     proxy_set_header Accept-Encoding "";
#     proxy_buffering off;
#     proxy_cache off;
#     proxy_read_timeout 600s;
#     proxy_send_timeout 600s;
# }

# 方式二：子路径反代 https://mcp.j1net.com/docx/ → http://10.2.24.13:8002/
#   Dify 的 MCP 地址填：https://mcp.j1net.com/docx/mcp/
#   注意 proxy_pass 结尾的 / 不能少：/docx/mcp/ 才会映射成后端的 /mcp/；
#   少了结尾斜杠，后端收到的还是 /docx/mcp/，直接 404。
location ^~ /docx/ {
    proxy_pass http://10.2.24.13:8002/;
    proxy_http_version 1.1;
    # Host 固定为 127.0.0.1：新版 FastMCP/mcp SDK 默认校验 Host 头
    # （DNS rebinding 防护，非法 Host 直接 403——你之前直连 8002 的 403 就是它），
    # 后端是单租户服务，不需要真实 Host，固定为 localhost 直接绕过该校验。
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # 流式响应（text/event-stream）必需：禁用缓冲、长超时
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
