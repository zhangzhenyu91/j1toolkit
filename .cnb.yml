# Shade 壹匣 · CNB：tag 发版时在国内侧接力（GitHub 跨境到国内平台的大文件传输不可靠——已踩坑）：
#   1) 服务端镜像：重建多架构镜像推 CNB 制品库 + 腾讯云 TCR（国内互传快）
#   2) Release 附件：下载 GitHub Release 的 Go+Fyne 客户端三件套 → 传 CNB Release 附件
#      （预签名 URL 三段式上传，国内直传、无 Gitee 那种 100MB 附件限制）；
#      取件/断言/上传逻辑抽在 docker/cnb-relay-release-assets.sh（tag_push 接力与
#      api_trigger 补传共用，2026-10-29）。只接受 Go+Fyne 三件套，旧 Electron+Python 附件判失败。
#   3) 自动创建 CNB Release（git:release，挂源码包）
#   4) api_trigger 补传（2026-10-29）：publish 附加产物就位后，GitHub 侧 release.yml 的
#      fyne-cnb-relay job 经 CNB CLI（cnb build start-build --event api_trigger
#      --tag <tag> --sync true）触发本文件 api_trigger 流水线，对同一 GitHub Release 重新取件
#      补传并统一断言 Go+Fyne 3 件（overwrite 幂等；不重建镜像、不动 tag）——正式 tag 接力
#      只随 release-final 推 tag 跑一次，publish 补传不会重走 tag_push 通道。
#
# 分工（2026-10 定稿）：GitHub Actions 全量构建（服务端镜像推 GHCR + Docker Hub；客户端安装包
# 传 GitHub Release），国内侧全部由本文件接力。Gitee 已弃用（附件限制 + 跨境上传不稳）。
# tag 由 GitHub Actions release-final 回推触发；两条 tag 线都接。
# 客户端未定版时，GitHub release.yml 的“仅服务端镜像”手动模式会推 server-v<版本>-<commit>
# 专用 tag，只走下方 server-v* 通道构建 TCR/CNB 镜像，不建 Release、不传客户端附件。
#
# 敏感配置走 CNB 密钥仓库 imports（本仓「设置」里没有环境变量面板）：
# 密钥仓库 j1net/j1toolkit/keys，内含 envs.yml：
#   TCR_USERNAME: <腾讯云账号 UIN>   TCR_PASSWORD: <TCR 个人版访问凭证密码>
#   TCR_IMAGE: ccr.ccs.tencentyun.com/<命名空间>/j1toolkit

server-v*:
  tag_push:
    - name: 服务端镜像（预发，仅镜像）
      services:
        - docker
      imports: https://cnb.cool/j1net/j1toolkit/keys/-/blob/main/envs.yml
      git:
        submodules: false
      stages:
        - name: buildx build and push（CNB + TCR）
          script: |
            VERSION=$(echo "${CNB_BRANCH}" | sed -E 's/^server-v//; s/-[0-9a-f]{7}$//')
            echo "构建版本: ${VERSION}"
            echo "${TCR_PASSWORD}" | docker login "${TCR_IMAGE%%/*}" -u "${TCR_USERNAME}" --password-stdin
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${VERSION} \
              -t ${TCR_IMAGE}:${VERSION} --push .

v*:
  tag_push:
    - name: 服务端镜像（版本）+ Release
      services:
        - docker
      imports: https://cnb.cool/j1net/j1toolkit/keys/-/blob/main/envs.yml
      git:
        submodules: false
      stages:
        - name: 创建 Release
          type: git:release
          options:
            name: ${CNB_BRANCH}
            description: ${CNB_TAG_MESSAGE}
        - name: buildx build and push（CNB + TCR）
          script: |
            VERSION=$(echo "${CNB_BRANCH}" | sed -E 's/^(release-)?v//')
            echo "构建版本: ${VERSION}"
            echo "${TCR_PASSWORD}" | docker login "${TCR_IMAGE%%/*}" -u "${TCR_USERNAME}" --password-stdin
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${VERSION} \
              -t ${TCR_IMAGE}:${VERSION} --push .
    - name: 上传 Release 附件（GitHub 资产 → CNB Release）
      services:
        - docker
      imports: https://cnb.cool/j1net/j1toolkit/keys/-/blob/main/envs.yml
      git:
        submodules: false
      stages:
        - name: 下载并上传
          timeout: 30m
          script: bash docker/cnb-relay-release-assets.sh
  api_trigger:
    - name: 补传 Release 附件（api_trigger：Fyne publish 后接力）
      services:
        - docker
      git:
        submodules: false
      stages:
        - name: 下载并上传（断言 Go+Fyne 3 件）
          timeout: 30m
          script: RELAY_REQUIRE_FYNE=1 bash docker/cnb-relay-release-assets.sh

release-v*:
  tag_push:
    - name: 服务端镜像（版本）+ Release
      services:
        - docker
      imports: https://cnb.cool/j1net/j1toolkit/keys/-/blob/main/envs.yml
      git:
        submodules: false
      stages:
        - name: 创建 Release
          type: git:release
          options:
            name: ${CNB_BRANCH}
            description: ${CNB_TAG_MESSAGE}
        - name: buildx build and push（CNB + TCR）
          script: |
            VERSION=$(echo "${CNB_BRANCH}" | sed -E 's/^(release-)?v//')
            echo "构建版本: ${VERSION}"
            echo "${TCR_PASSWORD}" | docker login "${TCR_IMAGE%%/*}" -u "${TCR_USERNAME}" --password-stdin
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${VERSION} \
              -t ${TCR_IMAGE}:${VERSION} --push .
    - name: 上传 Release 附件（GitHub 资产 → CNB Release）
      services:
        - docker
      imports: https://cnb.cool/j1net/j1toolkit/keys/-/blob/main/envs.yml
      git:
        submodules: false
      stages:
        - name: 下载并上传
          timeout: 30m
          script: bash docker/cnb-relay-release-assets.sh
  api_trigger:
    - name: 补传 Release 附件（api_trigger：Fyne publish 后接力）
      services:
        - docker
      git:
        submodules: false
      stages:
        - name: 下载并上传（断言 Go+Fyne 3 件）
          timeout: 30m
          script: RELAY_REQUIRE_FYNE=1 bash docker/cnb-relay-release-assets.sh
