# Shade 壹匣 · CNB：仅自动创建 CNB Release（挂源码包）。
#
# 2026-10 起构建全部收口 GitHub Actions（仓根 .github/workflows/release.yml：amd64/arm64 原生
# 双架构构建，镜像推 ACR + CNB 制品库 docker.cnb.cool/j1net/j1toolkit/j1toolkit，Release 同步
# GitHub / Gitee 公开仓），本文件不再构建镜像，仅保留 tag → CNB Release 的自动创建。
# tag 由 release.yml 回推到本仓（cnb.cool/j1net/j1toolkit）后触发；两条 tag 线都接。

v*:
  tag_push:
    - name: 创建 Release
      stages:
        - name: 创建 Release
          type: git:release
          options:
            name: ${CNB_BRANCH}
            description: ${CNB_TAG_MESSAGE}

release-v*:
  tag_push:
    - name: 创建 Release
      stages:
        - name: 创建 Release
          type: git:release
          options:
            name: ${CNB_BRANCH}
            description: ${CNB_TAG_MESSAGE}
