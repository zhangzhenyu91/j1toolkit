# Shade 壹匣 · CNB：tag 发版时在国内侧接力（GitHub 跨境到国内平台的大文件传输不可靠——已踩坑）：
#   1) 服务端镜像：重建多架构镜像推 CNB 制品库 + 腾讯云 TCR（国内互传快）
#   2) Release 附件：下载 GitHub Release 客户端安装包（3 件）→ 传 CNB Release 附件
#      （预签名 URL 三段式上传，国内直传、无 Gitee 那种 100MB 附件限制）
#   3) 自动创建 CNB Release（git:release，挂源码包）
#
# 分工（2026-10 定稿）：GitHub Actions 全量构建（服务端镜像推 GHCR + Docker Hub；客户端安装包
# 传 GitHub Release），国内侧全部由本文件接力。Gitee 已弃用（附件限制 + 跨境上传不稳）。
# tag 由 GitHub Actions release-final 回推触发；两条 tag 线都接。
# 客户端未定版时，GitHub release.yml 的“仅服务端镜像”手动模式会推 server-v<版本>-<commit>
# 专用 tag，只走下方 server-v* 通道构建 TCR/CNB 镜像，不建 Release、不传客户端附件。
#
# 敏感配置走 CNB 密钥仓库 imports（本仓「设置」里没有环境变量面板）：
# 密钥仓库 j1net/j1toolkit/keys，内含 envs.yml：
#   TCR_USERNAME: <腾讯云账号 UIN>   TCR_PASSWORD: <TCR 个人版访问凭证密码>
#   TCR_IMAGE: ccr.ccs.tencentyun.com/<命名空间>/j1toolkit

server-v*:
  tag_push:
    - name: 服务端镜像（预发，仅镜像）
      services:
        - docker
      imports: https://cnb.cool/j1net/j1toolkit/keys/-/blob/main/envs.yml
      git:
        submodules: false
      stages:
        - name: buildx build and push（CNB + TCR）
          script: |
            VERSION=$(echo "${CNB_BRANCH}" | sed -E 's/^server-v//; s/-[0-9a-f]{7}$//')
            echo "构建版本: ${VERSION}"
            echo "${TCR_PASSWORD}" | docker login "${TCR_IMAGE%%/*}" -u "${TCR_USERNAME}" --password-stdin
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${VERSION} \
              -t ${TCR_IMAGE}:${VERSION} --push .

v*:
  tag_push:
    - name: 服务端镜像（版本）+ Release
      services:
        - docker
      imports: https://cnb.cool/j1net/j1toolkit/keys/-/blob/main/envs.yml
      git:
        submodules: false
      stages:
        - name: 创建 Release
          type: git:release
          options:
            name: ${CNB_BRANCH}
            description: ${CNB_TAG_MESSAGE}
        - name: buildx build and push（CNB + TCR）
          script: |
            VERSION=$(echo "${CNB_BRANCH}" | sed -E 's/^(release-)?v//')
            echo "构建版本: ${VERSION}"
            echo "${TCR_PASSWORD}" | docker login "${TCR_IMAGE%%/*}" -u "${TCR_USERNAME}" --password-stdin
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${VERSION} \
              -t ${TCR_IMAGE}:${VERSION} --push .
    - name: 上传 Release 附件（GitHub 资产 → CNB Release）
      services:
        - docker
      imports: https://cnb.cool/j1net/j1toolkit/keys/-/blob/main/envs.yml
      git:
        submodules: false
      stages:
        - name: 下载并上传
          timeout: 30m
          script: |
            VERSION=$(echo "${CNB_BRANCH}" | sed -E 's/^(release-)?v//')
            command -v jq >/dev/null || { apt-get update -qq && apt-get install -y -qq jq; }
            mkdir -p /tmp/arts && cd /tmp/arts
            # 取件按 GitHub Release 资产清单过滤 exe/deb 逐个下载，不拼精确文件名：
            # 资产名模板见 uvmp-toolkit/desktop/electron-builder.yml（uvmp-toolkit-Setup-<版本>.exe、
            # uvmp-toolkit_<版本>_{amd64,arm64}.deb），其中 <版本> 取 desktop/package.json 的 version，
            # 与发版 tag 版本可脱钩（v1.10.0 的资产实名 1.9.6，按 tag 拼名下载 404——已踩坑）。
            # 公开仓匿名列清单即可；若遇 GitHub API 限流，在密钥仓库 envs.yml 加 GITHUB_TOKEN 会自动带上。
            LIST_URL="https://api.github.com/repos/zhangzhenyu91/j1toolkit/releases/tags/${CNB_BRANCH}"
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              ASSETS=$(curl -sfL --connect-timeout 15 --max-time 60 -H "Authorization: Bearer ${GITHUB_TOKEN}" "$LIST_URL" \
                | jq -r '.assets[]?.name | select(test("\\.(exe|deb)$"))')
            else
              ASSETS=$(curl -sfL --connect-timeout 15 --max-time 60 "$LIST_URL" | jq -r '.assets[]?.name | select(test("\\.(exe|deb)$"))')
            fi
            # API 限流/失败时改读公开发布页的资产清单，仍按真实文件名过滤，不回退到易错的按版本拼名
            if [ -z "$ASSETS" ]; then
              echo "GitHub API 未取到附件清单，改读公开 expanded_assets"
              ASSETS=$(curl -sfL --connect-timeout 15 --max-time 60 \
                "https://github.com/zhangzhenyu91/j1toolkit/releases/expanded_assets/${CNB_BRANCH}" \
                | sed -nE 's#.*/releases/download/[^/]*/([^"/?]*[.](exe|deb))".*#\1#p' | sort -u)
            fi
            [ -n "$ASSETS" ] || { echo "GitHub Release ${CNB_BRANCH} 无 exe/deb 资产（API 与公开页面均未取到）"; exit 1; }
            for f in $ASSETS; do
              downloaded=0
              for t in 1 2 3; do
                rm -f -- "$f"
                if curl -sfL --connect-timeout 20 --max-time 300 -o "$f" "https://github.com/zhangzhenyu91/j1toolkit/releases/download/${CNB_BRANCH}/${f}" && [ -s "$f" ]; then
                  downloaded=1
                  break
                fi
                echo "重试下载 $f（第 $t 次）"; sleep 10
              done
              [ "$downloaded" -eq 1 ] || { rm -f -- "$f"; echo "下载失败 $f"; exit 1; }
              echo "已下载 $f（$(du -h "$f" | cut -f1)）"
            done
            API="https://api.cnb.cool/${CNB_REPO_SLUG}"
            AH="Authorization: Bearer ${CNB_TOKEN}"
            # CNB Release 由同事件「服务端镜像」流水线的 git:release 创建，等它就绪（最多 10 分钟；
            # 本流水线先跑完时自建兜底——撞车则由 git:release 复用/覆盖）
            REL_ID=""
            for i in $(seq 1 10); do
              REL_ID=$(curl -s -H "$AH" -H "Accept: application/vnd.cnb.api+json" "${API}/-/releases/tags/${CNB_BRANCH}" | jq -r '.id // empty')
              [ -n "$REL_ID" ] && break
              curl -s -X POST -H "$AH" -H "Accept: application/vnd.cnb.api+json" -H "Content-Type: application/json" \
                "${API}/-/releases" -d "{\"tag_name\":\"${CNB_BRANCH}\",\"name\":\"v${VERSION}\"}" > /dev/null
              REL_ID=$(curl -s -H "$AH" -H "Accept: application/vnd.cnb.api+json" "${API}/-/releases/tags/${CNB_BRANCH}" | jq -r '.id // empty')
              [ -n "$REL_ID" ] && break
              echo "等 CNB Release 就绪（$i）"; sleep 60
            done
            [ -n "$REL_ID" ] || { echo "CNB Release 未就绪"; exit 1; }
            # 空 glob 不展开会把 "*.exe" 字面量留给 stat/curl，报错后仍可能以 0 退出（伪成功）——
            # nullglob 让未匹配数组为空；上传/确认关联一律 curl -f，HTTP 错误显式判失败退出
            shopt -s nullglob
            FILES=( *.exe *.deb )
            [ "${#FILES[@]}" -eq 3 ] || { echo "客户端附件应为 3 件，实际 ${#FILES[@]} 件"; exit 1; }
            for f in "${FILES[@]}"; do
              SIZE=$(stat -c%s "$f")
              # 预签名三段式：取上传地址 → PUT 文件 → 确认关联（overwrite 允许重跑覆盖）
              UP=$(curl -s -X POST -H "$AH" -H "Accept: application/vnd.cnb.api+json" -H "Content-Type: application/json" \
                "${API}/-/releases/${REL_ID}/asset-upload-url" \
                -d "{\"asset_name\":\"$f\",\"size\":$SIZE,\"overwrite\":true}")
              UPLOAD_URL=$(echo "$UP" | jq -r '.upload_url // empty')
              VERIFY_URL=$(echo "$UP" | jq -r '.verify_url // empty')
              [ -n "$UPLOAD_URL" ] && [ -n "$VERIFY_URL" ] || { echo "取上传地址失败 $f：$UP"; exit 1; }
              curl -sf -X PUT -T "$f" "$UPLOAD_URL" -o /dev/null || { echo "上传失败 $f"; exit 1; }
              curl -sf -X POST -H "$AH" -H "Accept: application/vnd.cnb.api+json" "$VERIFY_URL" -o /dev/null || { echo "确认关联失败 $f"; exit 1; }
              echo "已传 $f"
            done
            echo "CNB Release 附件 ${#FILES[@]} 件就绪"

