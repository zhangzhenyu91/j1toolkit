# Shade 壹匣 · CNB：tag 发版时在国内侧构建服务端多架构镜像推 CNB 制品库 + 腾讯云 TCR（国内互传快），
# 并自动创建 CNB Release（git:release，挂源码包）。
#
# 分工（2026-10 起）：GitHub Actions 全量构建（服务端 + 客户端）推 Docker Hub / GHCR（美国同岸快）；
# 本文件负责国内侧服务端镜像分发（TCR 正线 + CNB 制品库）。客户端安装包分发走 Gitee/GitHub Release
# 直链 + GHCR 产物镜像（客户端产物镜像不入 TCR/CNB 服务端仓库，保持服务端仓库只有版本 tag）。
# 客户端（含 Windows）只在 GitHub 构建（CNB 无 Windows 节点）。
# tag 由 GitHub Actions release-final 在 Gitee 附件就绪后回推触发；两条 tag 线都接。
#
# 敏感配置走 CNB 密钥仓库 imports（本仓「设置」里没有环境变量面板）：
# 新建密钥仓库 j1net/j1toolkit/keys，内含 envs.yml：
#   TCR_USERNAME: <腾讯云账号 UIN>   TCR_PASSWORD: <TCR 个人版访问凭证密码>
#   TCR_IMAGE: ccr.ccs.tencentyun.com/<命名空间>/j1toolkit

v*:
  tag_push:
    - name: 服务端镜像（版本）+ Release
      services:
        - docker
      imports: https://cnb.cool/j1net/j1toolkit/keys/-/blob/main/envs.yml
      git:
        submodules: false
      stages:
        - name: 创建 Release
          type: git:release
          options:
            name: ${CNB_BRANCH}
            description: ${CNB_TAG_MESSAGE}
        - name: buildx build and push（CNB + TCR）
          script: |
            VERSION=$(echo "${CNB_BRANCH}" | sed -E 's/^(release-)?v//')
            echo "构建版本: ${VERSION}"
            echo "${TCR_PASSWORD}" | docker login "${TCR_IMAGE%%/*}" -u "${TCR_USERNAME}" --password-stdin
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${VERSION} \
              -t ${TCR_IMAGE}:${VERSION} --push .

release-v*:
  tag_push:
    - name: 服务端镜像（版本）+ Release
      services:
        - docker
      imports: https://cnb.cool/j1net/j1toolkit/keys/-/blob/main/envs.yml
      git:
        submodules: false
      stages:
        - name: 创建 Release
          type: git:release
          options:
            name: ${CNB_BRANCH}
            description: ${CNB_TAG_MESSAGE}
        - name: buildx build and push（CNB + TCR）
          script: |
            VERSION=$(echo "${CNB_BRANCH}" | sed -E 's/^(release-)?v//')
            echo "构建版本: ${VERSION}"
            echo "${TCR_PASSWORD}" | docker login "${TCR_IMAGE%%/*}" -u "${TCR_USERNAME}" --password-stdin
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${VERSION} \
              -t ${TCR_IMAGE}:${VERSION} --push .
