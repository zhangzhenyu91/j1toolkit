# 临时诊断 workflow：定位 windows runner 上安装冒烟「快捷方式 TargetPath 为空」失败。
# 排查完毕后删除本文件。仅 workflow_dispatch 手动触发，不进任何发版链路。
name: 调试-lnk空目标
on:
  workflow_dispatch:

jobs:
  debug-lnk:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: uvmp-toolkit
    steps:
      - uses: actions/checkout@v4
      - name: 安装 NSIS 构建工具
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $maker = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $maker) { $maker = "C:\Program Files (x86)\NSIS\makensis.exe" }
          if (-not (Test-Path $maker)) { throw "NSIS 安装后仍未找到 makensis: $maker" }
          "UVMP_NSIS_MAKENSIS=$maker" >> $env:GITHUB_ENV
          & $maker -VERSION
      - name: 真实装配（dummy payload，图标管线走真实代码）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force dist-fyne/windows-amd64/models, dist-fyne/windows-amd64/native | Out-Null
          Set-Content dist-fyne/windows-amd64/uvmp-toolkit.exe "dummy"
          Set-Content dist-fyne/windows-amd64/uvmp-core.exe "dummy"
          Set-Content dist-fyne/windows-amd64/uvmp-export.exe "dummy"
          Set-Content dist-fyne/windows-amd64/models/det.onnx "dummy"
          Set-Content dist-fyne/windows-amd64/models/rec.onnx "dummy"
          Set-Content dist-fyne/windows-amd64/native/onnxruntime.dll "dummy"
          powershell -NoProfile -File packaging/fyne/assemble_nsis.ps1
      - name: 静默实装 + 快捷方式全面诊断
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/fyne/debug_lnk.ps1
