name: 仓库同步

# main 有推送即同步到 CNB（单一写入方、时序可控；Gitee 已弃用）。
# 2026-10-09 起：本工作流只同步 main，不再带 --tags——否则 main/tag 同批推送时
# release tag 会经此提前到达 CNB，CNB 侧「上传 Release 附件」流水线在 GitHub
# 客户端安装包还没构建完时就下载、重试 3 次后判失败（已踩坑）。
# release tag 一律由 release.yml 的 release-final 在全部构建完成后回推
# （发布段补跑走 release-publish.yml）；非 release tag 按发版纪律本就不存在。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 推送 main 到 CNB（tag 由 release.yml 发版完成后回推，此处不同步）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          REMOTE="https://cnb:${CNB_TOKEN}@cnb.cool/j1net/j1toolkit/j1toolkit.git"
          git push "$REMOTE" HEAD:main
