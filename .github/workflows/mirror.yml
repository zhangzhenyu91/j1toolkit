name: 仓库同步

# main 有推送即同步到 Gitee / CNB（取代 Gitee「仓库镜像」功能：Actions 主动推送，单一写入方、
# 时序可控；Gitee 镜像的强制同步语义与 5 分钟级延迟不再依赖）。
# release tag 同时由 release.yml 在发版时回推（Gitee Release 要求 tag 先于 Release 存在），
# 此处 --tags 兜底同步其余 tag；远端已存在的引用为 up-to-date 跳过，不做强制推送。

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 推送 main + tags 到 Gitee / CNB
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          rc=0
          for REMOTE in \
            "https://oauth2:${GITEE_TOKEN}@gitee.com/j1net/j1toolkit.git" \
            "https://cnb:${CNB_TOKEN}@cnb.cool/j1net/j1toolkit/j1toolkit.git"; do
            git push "$REMOTE" HEAD:main || rc=1
            git push "$REMOTE" --tags || rc=1
          done
          exit $rc
