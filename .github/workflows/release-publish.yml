name: 补跑发布段

# 发布段恢复通道：release.yml 全量流水线若在 release-final 阶段失败
# （产物已齐：客户端安装包在 GitHub Release、服务端镜像 digest 已在 Docker Hub），
# 不必重跑构建——手动 Run workflow 并填写 tag 即可只补跑发布段。
# 内容需与 release.yml 的 release-final 保持一致（改一边要同步另一边）。
# 注意：用 inputs.tag 而非分支/标签下拉选择 ref——workflow 文件始终读 main 最新版，
# 避免「tag 上固化着旧版发布逻辑」的回旋镖（已踩坑）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发版 tag（如 v1.0.1，须已存在且 GitHub Release 资产齐全）
        required: true

env:
  TAG: ${{ inputs.tag }}
  CNB_IMAGE: docker.cnb.cool/j1net/j1toolkit/j1toolkit
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  TCR_IMAGE: ${{ vars.TCR_IMAGE || secrets.TCR_IMAGE }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          VERSION=$(echo "${TAG}" | sed -E 's/^(release-)?v//')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "补跑版本: ${VERSION}（tag ${TAG}）"

  # 服务端镜像补拷：Docker Hub → GHCR（两仓同在美国，仓内秒级；发版主链已直推双仓时可跳过）
  mirror-server:
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      packages: write   # 推 GHCR
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR + Docker Hub 并补拷镜像
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
          docker buildx imagetools create \
            -t "ghcr.io/zhangzhenyu91/j1toolkit:${VERSION}" \
            "docker.io/${DOCKERHUB_USERNAME}/j1toolkit:${VERSION}"

  release-final:
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: 下载 Release 客户端安装包（Gitee 回传用；只取 exe + deb 三件）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-assets
          gh release download "${TAG}" -R ${{ github.repository }} --dir dist-assets --clobber \
            --pattern "*.exe" --pattern "*.deb"
      - name: 补全 GitHub Release 说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "${TAG}" --notes "$(cat <<EOF
          服务端镜像 ${VERSION}（linux/amd64 + linux/arm64）：
          腾讯云 TCR（国内正线，CNB 构建推送）：docker pull ${TCR_IMAGE}:${VERSION}
          GHCR（GitHub 构建）：docker pull ghcr.io/zhangzhenyu91/j1toolkit:${VERSION}
          Docker Hub（GitHub 构建）：docker pull docker.io/${DOCKERHUB_USERNAME}/j1toolkit:${VERSION}
          CNB 制品库：docker pull ${CNB_IMAGE}:${VERSION}

          内网客户端安装包（Windows exe、麒麟 amd64/arm64 deb）见下方 Assets。

          部署见仓根 README.md 与 docker/.env.example（数据卷挂 /app/server/data，配置全走环境变量）。
          EOF
          )"
      - name: 回推 tag 到 Gitee（Gitee Release 前置）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          REMOTE="https://oauth2:${GITEE_TOKEN}@gitee.com/j1net/j1toolkit.git"
          if git ls-remote "$REMOTE" "refs/tags/${TAG}" | grep -q .; then
            echo "远端已存在 ${TAG}，跳过"
          else
            git push "$REMOTE" "refs/tags/${TAG}"
          fi
      - name: Gitee 公开仓 Release（删旧重建 + 附件整传/分卷 + 清理历史 Release）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          API="https://gitee.com/api/v5/repos/j1net/j1toolkit"
          BODY="服务端镜像 ${VERSION}（linux/amd64 + linux/arm64）：腾讯云 TCR（国内正线，CNB 构建推送）：docker pull ${TCR_IMAGE}:${VERSION}；GHCR（GitHub 构建）：docker pull ghcr.io/zhangzhenyu91/j1toolkit:${VERSION}；Docker Hub（GitHub 构建）：docker pull docker.io/${DOCKERHUB_USERNAME}/j1toolkit:${VERSION}；CNB 制品库：docker pull ${CNB_IMAGE}:${VERSION}。内网客户端安装包（Windows exe、麒麟 amd64/arm64 deb）见下方附件；若某附件显示为 *.part-* 分卷（跨境上传保底策略），下载同一文件全部卷后合并：cat 文件名.part-* > 文件名。部署见仓根 README.md 与 docker/.env.example。"
          # 按 .id 判断存在性（Gitee 对无 Release 的 tag 也可能回 200 空体——已踩坑），有则删旧重建保证幂等
          curl -s -o /tmp/rel.json "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}"
          OLD_REL=$(jq -r '.id // empty' /tmp/rel.json)
          if [ -n "$OLD_REL" ]; then
            curl -s -X DELETE "${API}/releases/${OLD_REL}?access_token=${GITEE_TOKEN}" -o /dev/null
            echo "已删旧 Release ${OLD_REL}"
          fi
          # Gitee 建 Release 必须带 target_commitish（缺了报 target_commitish is missing——已踩坑）；
          # tag 已存在时该字段不影响锚点
          RESP=$(curl -s -X POST "${API}/releases" \
            -d "access_token=${GITEE_TOKEN}" -d "tag_name=${TAG}" \
            -d "target_commitish=main" \
            -d "name=v${VERSION}" --data-urlencode "body=${BODY}")
          REL_ID=$(echo "$RESP" | jq -r '.id // empty')
          [ -n "$REL_ID" ] || { echo "Gitee Release 创建失败，响应：$RESP"; exit 1; }
          cd dist-assets
          # 整传优先（页面干净），失败转 20MB 分卷+单卷重试（跨境整传曾挂死 85 分钟——已踩坑，分卷保底）
          for f in *; do
            ok=0
            for t in 1 2 3; do
              if curl -s --http1.1 --connect-timeout 30 --max-time 900 -X POST \
                   "${API}/releases/${REL_ID}/attach_files" \
                   -F "access_token=${GITEE_TOKEN}" -F "file=@${f}" -o /dev/null; then
                echo "已传 ${f}"; ok=1; break
              fi
              echo "整传失败 ${f}（第 $t 次）"; sleep 5
            done
            [ "$ok" = "1" ] && continue
            echo "${f} 转 20MB 分卷上传"
            split -b 20m "$f" "$f.part-"
            for p in "$f".part-*; do
              ok=0
              for t in 1 2 3 4 5; do
                if curl -s --http1.1 --connect-timeout 30 --max-time 300 -X POST \
                     "${API}/releases/${REL_ID}/attach_files" \
                     -F "access_token=${GITEE_TOKEN}" -F "file=@${p}" -o /dev/null; then
                  echo "已传分卷 ${p}"; ok=1; break
                fi
                echo "重试 ${p}（第 $t 次失败）"; sleep 5
              done
              [ "$ok" = "1" ] || { echo "附件 ${p} 上传失败"; exit 1; }
            done
          done
          # 附件总量 1GB 限制：Gitee 公开仓仅留当前 Release（连同附件整删历史 Release；完整历史在 GitHub）
          curl -s "${API}/releases?access_token=${GITEE_TOKEN}&per_page=100" \
            | jq -r '.[] | select(.tag_name != "'"${TAG}"'") | .id' \
            | while read -r OLD_ID; do
                curl -s -X DELETE "${API}/releases/${OLD_ID}?access_token=${GITEE_TOKEN}" -o /dev/null
                echo "已清理历史 Release ${OLD_ID}"
              done
      - name: 回推 tag 到 CNB（触发 CNB 侧服务端镜像重建推 TCR/CNB + git:release）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          REMOTE="https://cnb:${CNB_TOKEN}@cnb.cool/j1net/j1toolkit/j1toolkit.git"
          if git ls-remote "$REMOTE" "refs/tags/${TAG}" | grep -q .; then
            echo "远端已存在 ${TAG}，跳过"
          else
            git push "$REMOTE" "refs/tags/${TAG}"
          fi
