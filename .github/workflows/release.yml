name: 发版

# 发版产线（2026-10 起构建收口 GitHub Actions，后端镜像 + Electron+PyInstaller 内网客户端同一条版本线 vX.Y.Z）：
#   prepare        版本号剥离（release-v / v 前缀）
#   release-init   仅 tag：先建空 GitHub Release，避免三个客户端构建 job 并发抢建 422（已踩坑）
#   build-server   服务端镜像：amd64（ubuntu-latest）+ arm64（ubuntu-24.04-arm 原生构建机，公开仓免费）
#                  分架构原生构建，按 digest 双 output 同推 GHCR + Docker Hub（美国同岸快；
#                  --output 的 name 不支持逗号多值，多仓用多个 output——已踩坑；带 GHCR 层缓存）
#   client-*       内网客户端三平台（Windows exe + 冒烟；麒麟 amd64/arm64 deb + 冒烟），
#                  Python 核心由 PyInstaller 构建（纯 Python selfcheck + unittest + CDP 冒烟；
#                  desktop 走 node --test 纯函数测试），界面由随包 Electron 本体承担；
#                  产物随建随传 GitHub Release（无中转构件：artifact 存储额度曾被挤爆——已踩坑）
#   manifest       合并服务端多架构 manifest :X.Y.Z（GHCR/Docker Hub 各自仓内合并，不跨仓拷 blob）
#   release-final  GitHub Release 补全说明 → 回推 tag 到 CNB → CNB 侧 .cnb.yml 接力：重建服务端
#                  镜像推 TCR + CNB 制品库 + git:release 建 CNB Release + 下载 GitHub 附件传
#                  CNB Release（GitHub→国内平台大附件跨境上传不可靠——已踩坑，国内接力执行）
# 触发：推 release-vX.Y.Z 或 vX.Y.Z tag（等价幂等，二选一即可）；workflow_dispatch 只构建冒烟不发布。
# 服务端镜像预发：workflow_dispatch 填 server_version（如 1.24.0-beta.5）时只构建并发布服务端
# 镜像，跳过三个客户端 job 与 GitHub Release；push_cnb=true 时再推 server-v<版本> tag 到 CNB，
# 由 .cnb.yml 的 server-v* 通道只构建 TCR/CNB 镜像。客户端未定版时先发镜像走此通道。
#
# 需在仓库配置（Settings → Secrets and variables → Actions）：
#   Secrets: CNB_TOKEN（CNB 个人访问令牌：仓库 git 写 + 制品库权限——回推发版 tag 与
#            server-v 预发 tag 用）、DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（Docker Hub 推送）
#   Variables 或 Secrets: TCR_IMAGE（服务端镜像全路径 ccr.ccs.tencentyun.com/<命名空间>/j1toolkit；
#            仅用于 Release 说明文案，TCR 推送在 CNB 侧）
# 另需 CNB 密钥仓库 j1net/j1toolkit/keys 的 envs.yml：TCR_USERNAME / TCR_PASSWORD / TCR_IMAGE
# （CNB 侧推 TCR 用）

on:
  push:
    tags: ['release-v*', 'v*', 'client-v*']
  workflow_dispatch: # tag 补跑选对应 tag；仅发服务端镜像时在 main 填 server_version
    inputs:
      server_version:
        description: '仅发服务端镜像的版本号（如 1.24.0-beta.5；留空=按 ref 常规构建/补跑）'
        required: false
      push_cnb:
        description: '服务端镜像同步到 CNB/TCR（填写 server_version 时生效）'
        type: boolean
        default: false

env:
  CNB_IMAGE: docker.cnb.cool/j1net/j1toolkit/j1toolkit
  # Docker Hub：GitHub 构建机同在美国，推送快（服务端镜像的 GitHub 侧落点；国内正线 TCR 由 CNB 构建推送，见 .cnb.yml）
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  # TCR_IMAGE 放 Variable 或 Secret 均可（双源回退；本工作流仅用于 Release 说明文案，TCR 推送在 CNB 侧）
  TCR_IMAGE: ${{ vars.TCR_IMAGE || secrets.TCR_IMAGE }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      server_only: ${{ steps.v.outputs.server_only }}
    steps:
      - id: v
        env:
          INPUT_SERVER_VERSION: ${{ inputs.server_version }}
        run: |
          if [ -n "${INPUT_SERVER_VERSION}" ]; then
            VERSION="${INPUT_SERVER_VERSION#v}"
            case "$VERSION" in
              *[!0-9A-Za-z._-]*) echo "::error::server_version 含非法字符"; exit 1 ;;
            esac
            echo "server_only=true" >> "$GITHUB_OUTPUT"
            echo "仅服务端镜像构建版本: ${VERSION}"
          else
            VERSION=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^(release-|client-)?v//')
            echo "server_only=false" >> "$GITHUB_OUTPUT"
            echo "构建版本: ${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  release-init:
    needs: prepare
    if: github.ref_type == 'tag' && needs.prepare.outputs.server_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2 # 建（或复用）空 Release
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
      - if: github.ref_type != 'tag'
        run: echo "非 tag 构建：只编译冒烟，不发 Release"

  build-server:
    needs: prepare
    # client-v* 只构建客户端；服务端变更仍走 v*/release-v* 全量轨。
    if: ${{ !startsWith(github.ref_name, 'client-v') }}
    # 服务端镜像与内网客户端共用同一正式发版轨（客户端只发 Release 附件，无镜像）
    permissions:
      packages: write # 推 GHCR
    strategy:
      matrix:
        include:
          - { suffix: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { suffix: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR + Docker Hub
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] \
            || { echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 未配置"; exit 1; }
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: 原生构建并按 digest 推 GHCR + Docker Hub（${{ matrix.platform }}）
        run: |
          # GHCR/Docker Hub 均美国同岸，双 output 同推（国内仓只由 CNB 侧构建推送，见 .cnb.yml）
          # --provenance=false：buildx 默认附加 SLSA 溯源证明（OCI empty config 清单），
          # 部分仓库不认该 manifest class 拒收（unknown manifest class ... oci.empty.v1）——已踩坑
          # registry 层缓存（GHCR）：LibreOffice 等不变层只在首次上传，后续发版只传变化层
          GITHUB_IMAGE="ghcr.io/zhangzhenyu91/j1toolkit"
          DH_IMAGE="docker.io/${DOCKERHUB_USERNAME}/j1toolkit"
          docker buildx build --platform ${{ matrix.platform }} --provenance=false \
            --output type=image,name=${GITHUB_IMAGE},push-by-digest=true,name-canonical=true,push=true \
            --output type=image,name=${DH_IMAGE},push-by-digest=true,name-canonical=true,push=true \
            --cache-from type=registry,ref=${GITHUB_IMAGE}:buildcache \
            --cache-to type=registry,ref=${GITHUB_IMAGE}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true \
            --metadata-file /tmp/meta.json .
          jq -r '."containerimage.digest"' /tmp/meta.json > "digest-${{ matrix.suffix }}.txt"
      - name: 传递 digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: digest-${{ matrix.suffix }}.txt
          retention-days: 1

  # ===== Electron+PyInstaller 内网客户端（三平台正式轨）=====
  # release-init 仅 tag 运行；非 tag 的 workflow_dispatch 只编译冒烟、不发 Release，
  # 故 needs 用 always() 显式放行；tag 时必须等 release-init 成功（否则附件无落点）。
  client-windows:
    needs: [release-init, prepare]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.server_only != 'true' &&
      (github.ref_type != 'tag' || needs.release-init.result == 'success')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: uvmp-toolkit
    env:
      # Windows runner 默认 cp1252，Python 中文 print 在重定向场景会抛 UnicodeEncodeError
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python 依赖 + 纯 Python 冒烟与单元测试
        shell: pwsh
        run: |
          pip install pyinstaller requests gmssl pypdf websocket-client playwright==1.62.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python toolkit/app.py selfcheck
          if ($LASTEXITCODE -ne 0) { throw "纯 Python selfcheck 失败" }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Python 单元测试失败" }
      - name: PyInstaller 构建核心（console onedir）
        run: |
          python -m PyInstaller --name uvmp-core --onedir --clean --noconfirm `
            --add-data "toolkit/apps;apps" `
            --add-data "toolkit/config.example.json;." `
            --add-data "course_autoplay_trial.py;." `
            --collect-all playwright --collect-all greenlet `
            --hidden-import pyee --hidden-import typing_extensions `
            --hidden-import browser_automation `
            --hidden-import uvmp --hidden-import vehicle_export --hidden-import official_track `
            --hidden-import xlsx_util --hidden-import devmock --hidden-import rpc `
            --hidden-import usb_agent --hidden-import usb_protocol `
            --hidden-import selftest --hidden-import websocket --hidden-import pypdf `
            toolkit/app.py
      - name: 装配与冒烟（selfcheck + rpc ping）
        shell: pwsh
        run: |
          Copy-Item config.ini dist\uvmp-core\config.ini
          Copy-Item toolkit\config.example.json dist\uvmp-core\config.example.json
          Copy-Item packaging\config.initial.json dist\uvmp-core\config.initial.json
          Copy-Item packaging\run-usb-agent.vbs dist\uvmp-core\run-usb-agent.vbs
          Copy-Item README.md dist\uvmp-core\README.md
          Copy-Item -Recurse install dist\uvmp-core\install
          & "dist\uvmp-core\uvmp-core.exe" selfcheck
          if ($LASTEXITCODE -ne 0) { throw "selfcheck 失败" }
          $ping = '{"id":1,"method":"ping"}' | & "dist\uvmp-core\uvmp-core.exe" rpc
          if (-not ($ping -match '"ok": true')) { throw "rpc ping 失败" }
      - name: 'CDP 冒烟（纯 Python data 自检；缺宿主浏览器时明确报告）'
        shell: pwsh
        run: |
          if (-not (Test-Path packaging/cdp_smoke.py)) { throw "缺少 packaging/cdp_smoke.py（Task 5B 构建门禁）" }
          python packaging/cdp_smoke.py --core dist\uvmp-core\uvmp-core.exe --timeout 240
          $code = $LASTEXITCODE
          if ($code -eq 2) { Write-Host "::notice::CDP 冒烟跳过：宿主无可用浏览器（未验证 CDP 链路）"; exit 0 }
          if ($code -ne 0) { throw "CDP 冒烟失败 exit=$code" }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uvmp-toolkit/desktop/package-lock.json
      - name: 对齐客户端版本号（仅 tag；非 tag 沿用 desktop/package.json）
        # 非 tag 的 workflow_dispatch 只做冒烟构建：不拿 main 等 ref 名注入版本
        if: github.ref_type == 'tag'
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version --prefix desktop
      - name: desktop 依赖与单元测试（node --test）
        shell: pwsh
        run: |
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location desktop
          node --test test/*.test.mjs test/*.test.cjs
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }
      - name: 前端构建 + 打包（NSIS 安装程序 + zip）
        run: |
          New-Item -ItemType Directory -Force dist-core | Out-Null
          Copy-Item -Recurse dist\uvmp-core dist-core\core
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # electron-builder 须在 desktop/ 内运行：afterPack 钩子路径按工作目录解析（已踩坑）
          # npx 钉版本 25.1.8（=desktop lockfile）：裸名会拉最新版，26.15.3 起 schema 拒绝 linux 配置段（已踩坑）；
          # npm ci 失败必须显式退出（pwsh 原生命令失败不自动停步——v1.1.1 曾因此带病走到打包才炸）
          Push-Location desktop
          npx electron-builder@25.1.8 --win
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }
      - name: GUI 冒烟（UVMP_CI_SMOKE：窗口加载后断言 #app 真实渲染）
        shell: pwsh
        run: |
          $exe = (Get-ChildItem "dist-electron\win-unpacked\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1)
          if (-not $exe) { throw "未找到 dist-electron\win-unpacked\*.exe" }
          $env:UVMP_CI_SMOKE = "1"
          $env:ELECTRON_ENABLE_LOGGING = "1"
          # Start-Process -PassThru 对 Electron 进程取不到 ExitCode（空值会误判失败），改走 .NET Process + 异步读输出
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe.FullName
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo = $psi
          $null = $proc.Start()
          $outTask = $proc.StandardOutput.ReadToEndAsync()
          $errTask = $proc.StandardError.ReadToEndAsync()
          if (-not $proc.WaitForExit(180000)) {
            & taskkill /PID $proc.Id /T /F | Out-Null
            throw "GUI 冒烟超时（180s）"
          }
          $proc.WaitForExit()
          Write-Host "---- smoke stdout ----"; ($outTask.Result -split "`r?`n") | Select-Object -Last 20
          Write-Host "---- smoke stderr ----"; ($errTask.Result -split "`r?`n") | Select-Object -Last 30
          if ($proc.ExitCode -ne 0) { throw "GUI 冒烟失败 exit=$($proc.ExitCode)" }
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uvmp-toolkit/dist-electron/*.exe

  client-linux-amd64:
    needs: [release-init, prepare]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.server_only != 'true' &&
      (github.ref_type != 'tag' || needs.release-init.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: uvmp-toolkit
    steps:
      - uses: actions/checkout@v4
      - name: 在 debian:buster 容器内构建核心（glibc 2.28 对齐麒麟 V10 SP1）
        # 容器 -w 直接进 uvmp-toolkit/，脚本内部相对路径（packaging/build_unix.sh 等）不变
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            debian:buster bash packaging/build_linux_container.sh
      - name: 'CDP 冒烟（纯 Python data 自检；缺宿主浏览器时明确报告）'
        run: |
          [ -f packaging/cdp_smoke.py ] || { echo "::error::缺少 packaging/cdp_smoke.py（Task 5B 构建门禁）"; exit 1; }
          code=0
          python3 packaging/cdp_smoke.py --core dist/uvmp-core/uvmp-core --timeout 240 || code=$?
          if [ "$code" -eq 2 ]; then
            echo "::notice::CDP 冒烟跳过：宿主无可用浏览器（未验证 CDP 链路）"
            exit 0
          fi
          exit "$code"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uvmp-toolkit/desktop/package-lock.json
      - name: 对齐客户端版本号（仅 tag；非 tag 沿用 desktop/package.json）
        # 非 tag 的 workflow_dispatch 只做冒烟构建：不拿 main 等 ref 名注入版本
        if: github.ref_type == 'tag'
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version --prefix desktop
      - name: desktop 依赖与单元测试（node --test）
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          npm ci --prefix desktop
          ( cd desktop && node --test test/*.test.mjs test/*.test.cjs )
      - name: 前端构建 + 打包（deb + tar.gz）
        env:
          # onnxruntime-node 的 postinstall 在 linux/x64 会联网拉 CUDA 库，CPU 场景必须跳过
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          mkdir -p dist-core
          cp -r dist/uvmp-core dist-core/core
          chmod +x dist-core/core/uvmp-core   # 容器出来权限位正常，这里兜底
          npm ci --prefix desktop
          npm run build --prefix desktop
          # electron-builder 须在 desktop/ 内运行：afterPack 钩子路径按工作目录解析（已踩坑）
          cd desktop && npx electron-builder@25.1.8 --linux --x64 --c.productName=uvmp-toolkit
      - name: OCR 运行时 glibc 门禁（麒麟 V10 SP1 = glibc 2.28，超版本即失败并降级重钉）
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" debian:buster bash -c '
            set -e
            # 双点号通配：只取带版本号的实体 .so，避开 libonnxruntime.so.1 软链（多行结果会炸 grep）
            lib=$(ls /src/uvmp-toolkit/desktop/node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime.so.*.*)
            max=$(grep -ao "GLIBC_2\.[0-9]*" "$lib" | sort -Vu | tail -1)
            echo "onnxruntime-node 最高依赖 $max（门禁 ≤ GLIBC_2.28）"
            minor=${max#GLIBC_2.}
            [ -n "$minor" ] && [ "$minor" -le 28 ]
          '
      - name: GUI 冒烟（xvfb + UVMP_CI_SMOKE：断言 #app 真实渲染）
        # --no-sandbox 必须走命令行参数：SUID 沙箱检查在 JS 执行前的 C++ 引导阶段，
        # appendSwitch 赶不上（已踩坑）
        run: |
          sudo apt-get update -qq
          # openbox 提供窗口管理器：无 WM 的裸 Xvfb 下 maximize/minimize 断言必失败
          sudo apt-get install -y -qq xvfb openbox libgtk-3-0 libgbm1 libnss3 libasound2t64 >/dev/null
          UVMP_CI_SMOKE=1 ELECTRON_ENABLE_LOGGING=1 xvfb-run -a sh -c \
            'openbox >/dev/null 2>&1 & sleep 1; exec ./dist-electron/linux-unpacked/uvmp-toolkit --no-sandbox --disable-gpu'
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uvmp-toolkit/dist-electron/*.deb

  client-linux-arm64:
    needs: [release-init, prepare]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.server_only != 'true' &&
      (github.ref_type != 'tag' || needs.release-init.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: uvmp-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # arm64 模拟（较慢，约 10-20 分钟）
      - name: 在 arm64v8/debian:buster 容器内构建核心
        # build_unix.sh 末尾含 selfcheck + rpc ping（arm64 经 QEMU 真实执行）
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            arm64v8/debian:buster bash packaging/build_linux_container.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uvmp-toolkit/desktop/package-lock.json
      - name: 对齐客户端版本号（仅 tag；非 tag 沿用 desktop/package.json）
        # 非 tag 的 workflow_dispatch 只做冒烟构建：不拿 main 等 ref 名注入版本
        if: github.ref_type == 'tag'
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version --prefix desktop
      - name: desktop 依赖与单元测试（node --test）
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          npm ci --prefix desktop
          ( cd desktop && node --test test/*.test.mjs test/*.test.cjs )
      - name: 前端构建 + 打包（deb + tar.gz；纯打包不执行 arm64 代码）
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          mkdir -p dist-core
          cp -r dist/uvmp-core dist-core/core
          chmod +x dist-core/core/uvmp-core
          npm ci --prefix desktop
          npm run build --prefix desktop
          cd desktop && npx electron-builder@25.1.8 --linux --arm64 --c.productName=uvmp-toolkit
      - name: OCR 运行时 glibc 门禁（arm64，文件检查非执行）
        run: |
          docker run --rm --platform linux/arm64 -v "$GITHUB_WORKSPACE:/src" arm64v8/debian:buster bash -c '
            set -e
            lib=$(ls /src/uvmp-toolkit/desktop/node_modules/onnxruntime-node/bin/napi-v3/linux/arm64/libonnxruntime.so.*.*)
            max=$(grep -ao "GLIBC_2\.[0-9]*" "$lib" | sort -Vu | tail -1)
            echo "onnxruntime-node(arm64) 最高依赖 $max（门禁 ≤ GLIBC_2.28）"
            minor=${max#GLIBC_2.}
            [ -n "$minor" ] && [ "$minor" -le 28 ]
          '
      - name: arm64 冒烟口径说明（本 job 未执行 GUI/CDP）
        run: echo "::notice::arm64 本 job 运行在 ubuntu-latest x64 + QEMU（非原生 arm64），仅做纯打包与 OCR 文件门禁，未执行 GUI/CDP 冒烟；GUI/CDP 由 Windows 与 Linux amd64 两 job 真实执行"
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uvmp-toolkit/dist-electron/*.deb

  manifest:
    needs: [prepare, build-server]
    if: ${{ (github.ref_type == 'tag' || needs.prepare.outputs.server_only == 'true') && !startsWith(github.ref_name, 'client-v') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write # 推 GHCR
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: 登录 GHCR + Docker Hub
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: 合并多架构 manifest（:${{ needs.prepare.outputs.version }}，GHCR/Docker Hub 各自仓内合并）
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          GITHUB_IMAGE="ghcr.io/zhangzhenyu91/j1toolkit"
          DH_IMAGE="docker.io/${DOCKERHUB_USERNAME}/j1toolkit"
          D_AMD64=$(cat digests/digest-amd64.txt)
          D_ARM64=$(cat digests/digest-arm64.txt)
          docker buildx imagetools create -t "${GITHUB_IMAGE}:${VERSION}" \
            "${GITHUB_IMAGE}@${D_AMD64}" "${GITHUB_IMAGE}@${D_ARM64}"
          docker buildx imagetools create -t "${DH_IMAGE}:${VERSION}" \
            "${DH_IMAGE}@${D_AMD64}" "${DH_IMAGE}@${D_ARM64}"
          # 国内正线 TCR/CNB 由 CNB 侧构建推送（见 .cnb.yml），此处不跨境复制

  publish-cnb-server:
    # 仅服务端预发：把带 commit 的 server-v 专用 tag 只推到 CNB，不建 GitHub tag/Release；
    # CNB 的 server-v* 通道只构建 TCR/CNB 镜像，不碰客户端与 Release 附件。
    needs: [prepare, manifest]
    if: github.ref_type != 'tag' && needs.prepare.outputs.server_only == 'true' && inputs.push_cnb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 推送服务端专用 tag 到 CNB（只触发镜像构建）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [ -n "$CNB_TOKEN" ] || { echo "::error::CNB_TOKEN 未配置"; exit 1; }
          TAG="server-v${VERSION}-${GITHUB_SHA::7}"
          REMOTE="https://cnb:${CNB_TOKEN}@cnb.cool/j1net/j1toolkit/j1toolkit.git"
          if git ls-remote "$REMOTE" "refs/tags/${TAG}" | grep -q .; then
            echo "CNB 已存在 ${TAG}，跳过重复触发"
            exit 0
          fi
          git tag "$TAG"
          git push "$REMOTE" "refs/tags/${TAG}"
          echo "已触发 CNB 镜像构建：${TAG} -> ${TCR_IMAGE}:${VERSION} / ${CNB_IMAGE}:${VERSION}"

  release-final:
    # needs 收齐全部构建产物：服务端多架构 manifest + 三客户端安装包（客户端只走 Release 附件，无产物镜像）
    needs: [prepare, manifest, client-windows, client-linux-amd64, client-linux-arm64]
    if: ${{ github.ref_type == 'tag' && needs.prepare.outputs.server_only != 'true' && !startsWith(github.ref_name, 'client-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 补全 GitHub Release 说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --notes "$(cat <<EOF
          服务端镜像 ${VERSION}（linux/amd64 + linux/arm64）：
          腾讯云 TCR（国内正线，CNB 构建推送）：docker pull ${TCR_IMAGE}:${VERSION}
          GHCR（GitHub 构建）：docker pull ghcr.io/zhangzhenyu91/j1toolkit:${VERSION}
          Docker Hub（GitHub 构建）：docker pull docker.io/${DOCKERHUB_USERNAME}/j1toolkit:${VERSION}
          CNB 制品库：docker pull ${CNB_IMAGE}:${VERSION}

          内网客户端安装包（Windows exe、麒麟 amd64/arm64 deb）见下方 Assets。

          部署见仓根 README.md 与 docker/.env.example（数据卷挂 /app/server/data，配置全走环境变量）。
          EOF
          )"
      - name: 回推 tag 到 CNB（触发 CNB 侧：服务端镜像重建推 TCR/CNB + git:release + Release 附件接力）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          REMOTE="https://cnb:${CNB_TOKEN}@cnb.cool/j1net/j1toolkit/j1toolkit.git"
          if git ls-remote "$REMOTE" "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            echo "远端已存在 ${GITHUB_REF_NAME}，跳过"
          else
            git push "$REMOTE" "refs/tags/${GITHUB_REF_NAME}"
          fi

  client-final:
    # client-v* 只跑三客户端 job；这里补全 Release 说明，不触发服务端/CNB。
    needs: [prepare, client-windows, client-linux-amd64, client-linux-arm64]
    if: startsWith(github.ref_name, 'client-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 补全客户端 Release 说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --notes "$(cat <<EOF
          内网客户端 ${VERSION}（client-only 构建，不重建服务端镜像）。
          Windows exe、麒麟 amd64/arm64 deb 见下方 Assets。
          运行期以桌面用户执行；Linux 安装仍需 root/admin 一次。
          EOF
          )"
