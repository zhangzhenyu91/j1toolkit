name: 发版

# 发版产线（2026-10 起构建收口 GitHub Actions，后端镜像 + 内网客户端同一条版本线 vX.Y.Z）：
#   prepare        版本号剥离（release-v / v 前缀）
#   release-init   仅 tag：先建空 GitHub Release，避免三个客户端构建 job 并发抢建 422（已踩坑）
#   build-server   服务端镜像：amd64（ubuntu-latest）+ arm64（ubuntu-24.04-arm 原生构建机，公开仓免费）
#                  分架构原生构建，按 digest 同推 TCR + CNB（双 --output 单 name，name 不支持逗号多值——已踩坑）
#   client-*       内网客户端三平台（Windows NSIS/zip + 冒烟；麒麟 amd64/arm64 deb/tar.gz + 冒烟），
#                  产物随建随传 GitHub Release（无中转构件：artifact 存储额度曾被挤爆——已踩坑）
#   manifest       合并服务端多架构 manifest :X.Y.Z（TCR/CNB 各自仓内 server 侧合并，不跨仓拷 blob）
#   publish-images 客户端产物镜像同推 TCR（优先）/ GHCR（备用）/ CNB（第三副本）
#   release-final  GitHub Release 补全说明 → 回推 tag 到 Gitee/CNB（CNB Release 由 .cnb.yml
#                  git:release 接力）→ Gitee 公开仓 Release（删旧重建 + 6 件附件，>95MiB 分卷，
#                  受单仓附件总量 1GB 限制仅保留最新一份 Release）
# 触发：推 release-vX.Y.Z 或 vX.Y.Z tag（等价幂等，二选一即可）；workflow_dispatch 只构建冒烟不发布。
#
# 需在仓库配置（Settings → Secrets and variables → Actions）：
#   Secrets: TCR_USERNAME（腾讯云账号 UIN）/ TCR_PASSWORD（TCR 个人版访问凭证密码）、
#            CNB_TOKEN（仓库 git 写 + 制品库权限）、GITEE_TOKEN（Gitee 私人令牌，projects 权限，
#            粘贴勿带空格/换行——否则 git 推送报 "credential url cannot be parsed"）
#   Variables 或 Secrets: TCR_IMAGE（服务端镜像全路径 ccr.ccs.tencentyun.com/<命名空间>/j1toolkit，
#            客户端产物镜像按同命名空间拼 uvmp-toolkit；顶部 env 双源回退）

on:
  push:
    tags: ["release-v*", "v*"]
  workflow_dispatch: {}   # 手动补跑：「运行分支」处选择对应 tag

env:
  CNB_IMAGE: docker.cnb.cool/j1net/j1toolkit/j1toolkit
  CNB_CLIENT_IMAGE: docker.cnb.cool/j1net/j1toolkit/j1toolkit-private
  GHCR_CLIENT_IMAGE: ghcr.io/zhangzhenyu91/uvmp-toolkit
  # Docker Hub：GitHub 构建机同在美国，推送快（服务端镜像的 GitHub 侧落点；国内正线 TCR 由 CNB 构建推送，见 .cnb.yml）
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  # TCR_IMAGE 放 Variable 或 Secret 均可（双源回退；本工作流仅用于 Release 说明文案，TCR 推送在 CNB 侧）
  TCR_IMAGE: ${{ vars.TCR_IMAGE || secrets.TCR_IMAGE }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          VERSION=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^(release-)?v//')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "构建版本: ${VERSION}"

  release-init:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2   # 建（或复用）空 Release
      - if: github.ref_type != 'tag'
        run: echo "非 tag 构建：只编译冒烟，不发 Release"

  build-server:
    needs: prepare
    strategy:
      matrix:
        include:
          - { suffix: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { suffix: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登录 Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] \
            || { echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 未配置"; exit 1; }
          echo "DOCKERHUB_USERNAME=$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: 原生构建并按 digest 推 Docker Hub（${{ matrix.platform }}）
        run: |
          # 推 Docker Hub（GitHub 构建机同在美国，快）；国内正线 TCR/CNB 由 CNB 侧构建推送（见 .cnb.yml）
          # --provenance=false：buildx 默认附加 SLSA 溯源证明（OCI empty config 清单），
          # 部分仓库不认该 manifest class 拒收（unknown manifest class ... oci.empty.v1）——已踩坑
          # registry 层缓存：LibreOffice 等不变层只在首次上传，后续发版只传变化层
          DH_IMAGE="docker.io/${DOCKERHUB_USERNAME}/j1toolkit"
          docker buildx build --platform ${{ matrix.platform }} --provenance=false \
            --output type=image,name=${DH_IMAGE},push-by-digest=true,name-canonical=true,push=true \
            --cache-from type=registry,ref=${DH_IMAGE}:buildcache \
            --cache-to type=registry,ref=${DH_IMAGE}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true \
            --metadata-file /tmp/meta.json .
          jq -r '."containerimage.digest"' /tmp/meta.json > "digest-${{ matrix.suffix }}.txt"
      - name: 传递 digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: digest-${{ matrix.suffix }}.txt
          retention-days: 1

  client-windows:
    needs: release-init
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: uvmp-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller 构建核心（console onedir）
        run: |
          pip install pyinstaller requests gmssl pypdf websocket-client
          python -m PyInstaller --name uvmp-core --onedir --clean --noconfirm `
            --add-data "toolkit/apps;apps" `
            --add-data "toolkit/config.example.json;." `
            --hidden-import uvmp --hidden-import vehicle_export --hidden-import official_track `
            --hidden-import xlsx_util --hidden-import devmock --hidden-import rpc `
            --hidden-import pypdf `
            toolkit/app.py
      - name: 装配与冒烟（selfcheck + rpc ping）
        shell: pwsh
        run: |
          Copy-Item config.ini dist\uvmp-core\config.ini
          Copy-Item toolkit\config.example.json dist\uvmp-core\config.example.json
          Copy-Item packaging\config.initial.json dist\uvmp-core\config.initial.json
          Copy-Item packaging\run-daily-export.vbs dist\uvmp-core\run-daily-export.vbs
          Copy-Item README.md dist\uvmp-core\README.md
          Copy-Item -Recurse install dist\uvmp-core\install
          & "dist\uvmp-core\uvmp-core.exe" selfcheck
          if ($LASTEXITCODE -ne 0) { throw "selfcheck 失败" }
          $ping = '{"id":1,"method":"ping"}' | & "dist\uvmp-core\uvmp-core.exe" rpc
          if (-not ($ping -match '"ok": true')) { throw "rpc ping 失败" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: uvmp-toolkit/desktop/package-lock.json
      - name: 前端构建 + 打包（NSIS 安装程序 + zip）
        run: |
          New-Item -ItemType Directory -Force dist-core | Out-Null
          Copy-Item -Recurse dist\uvmp-core dist-core\core
          npm ci --prefix desktop
          npm run build --prefix desktop
          # electron-builder 须在 desktop/ 内运行：afterPack 钩子路径按工作目录解析（已踩坑）
          Push-Location desktop
          npx electron-builder --win
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }
      - name: GUI 冒烟（UVMP_CI_SMOKE：窗口加载后断言 #app 真实渲染）
        shell: pwsh
        run: |
          $exe = (Get-ChildItem "dist-electron\win-unpacked\*.exe" | Select-Object -First 1).FullName
          $env:UVMP_CI_SMOKE = "1"
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $p = Start-Process -FilePath $exe -PassThru -Wait `
            -RedirectStandardOutput smoke-out.log -RedirectStandardError smoke-err.log
          Write-Host "---- smoke stdout ----"; Get-Content smoke-out.log -ErrorAction SilentlyContinue
          Write-Host "---- smoke stderr ----"; Get-Content smoke-err.log -ErrorAction SilentlyContinue | Select-Object -Last 30
          if ($p.ExitCode -ne 0) { throw "GUI 冒烟失败 exit=$($p.ExitCode)" }
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uvmp-toolkit/dist-electron/*.exe
            uvmp-toolkit/dist-electron/*.zip

  client-linux-amd64:
    needs: release-init
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: uvmp-toolkit
    steps:
      - uses: actions/checkout@v4
      - name: 在 debian:buster 容器内构建核心（glibc 2.28 对齐麒麟 V10 SP1）
        # 容器 -w 直接进 uvmp-toolkit/，脚本内部相对路径（packaging/build_unix.sh 等）不变
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            debian:buster bash packaging/build_linux_container.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: uvmp-toolkit/desktop/package-lock.json
      - name: 前端构建 + 打包（deb + tar.gz）
        env:
          # onnxruntime-node 的 postinstall 在 linux/x64 会联网拉 CUDA 库，CPU 场景必须跳过
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          mkdir -p dist-core
          cp -r dist/uvmp-core dist-core/core
          chmod +x dist-core/core/uvmp-core   # 容器出来权限位正常，这里兜底
          npm ci --prefix desktop
          npm run build --prefix desktop
          # electron-builder 须在 desktop/ 内运行：afterPack 钩子路径按工作目录解析（已踩坑）
          cd desktop && npx electron-builder --linux --x64 --c.productName=uvmp-toolkit
      - name: OCR 运行时 glibc 门禁（麒麟 V10 SP1 = glibc 2.28，超版本即失败并降级重钉）
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" debian:buster bash -c '
            set -e
            # 双点号通配：只取带版本号的实体 .so，避开 libonnxruntime.so.1 软链（多行结果会炸 grep）
            lib=$(ls /src/uvmp-toolkit/desktop/node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime.so.*.*)
            max=$(grep -ao "GLIBC_2\.[0-9]*" "$lib" | sort -Vu | tail -1)
            echo "onnxruntime-node 最高依赖 $max（门禁 ≤ GLIBC_2.28）"
            minor=${max#GLIBC_2.}
            [ -n "$minor" ] && [ "$minor" -le 28 ]
          '
      - name: GUI 冒烟（xvfb + UVMP_CI_SMOKE：断言 #app 真实渲染）
        # --no-sandbox 必须走命令行参数：SUID 沙箱检查在 JS 执行前的 C++ 引导阶段，
        # appendSwitch 赶不上（已踩坑）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64 >/dev/null
          UVMP_CI_SMOKE=1 ELECTRON_ENABLE_LOGGING=1 \
            xvfb-run -a ./dist-electron/linux-unpacked/uvmp-toolkit --no-sandbox --disable-gpu
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uvmp-toolkit/dist-electron/*.deb
            uvmp-toolkit/dist-electron/*.tar.gz

  client-linux-arm64:
    needs: release-init
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: uvmp-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # arm64 模拟（较慢，约 10-20 分钟）
      - name: 在 arm64v8/debian:buster 容器内构建核心
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            arm64v8/debian:buster bash packaging/build_linux_container.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: uvmp-toolkit/desktop/package-lock.json
      - name: 前端构建 + 打包（deb + tar.gz；纯打包不执行 arm64 代码）
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          mkdir -p dist-core
          cp -r dist/uvmp-core dist-core/core
          chmod +x dist-core/core/uvmp-core
          npm ci --prefix desktop
          npm run build --prefix desktop
          cd desktop && npx electron-builder --linux --arm64 --c.productName=uvmp-toolkit
      - name: OCR 运行时 glibc 门禁（arm64，文件检查非执行）
        run: |
          docker run --rm --platform linux/arm64 -v "$GITHUB_WORKSPACE:/src" arm64v8/debian:buster bash -c '
            set -e
            lib=$(ls /src/uvmp-toolkit/desktop/node_modules/onnxruntime-node/bin/napi-v3/linux/arm64/libonnxruntime.so.*.*)
            max=$(grep -ao "GLIBC_2\.[0-9]*" "$lib" | sort -Vu | tail -1)
            echo "onnxruntime-node(arm64) 最高依赖 $max（门禁 ≤ GLIBC_2.28）"
            minor=${max#GLIBC_2.}
            [ -n "$minor" ] && [ "$minor" -le 28 ]
          '
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uvmp-toolkit/dist-electron/*.deb
            uvmp-toolkit/dist-electron/*.tar.gz

  manifest:
    needs: [prepare, build-server]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: 登录 Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "DOCKERHUB_USERNAME=$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: 合并多架构 manifest（:${{ needs.prepare.outputs.version }}，仓内合并不拷 blob）
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          DH_IMAGE="docker.io/${DOCKERHUB_USERNAME}/j1toolkit"
          D_AMD64=$(cat digests/digest-amd64.txt)
          D_ARM64=$(cat digests/digest-arm64.txt)
          docker buildx imagetools create -t "${DH_IMAGE}:${VERSION}" \
            "${DH_IMAGE}@${D_AMD64}" "${DH_IMAGE}@${D_ARM64}"
          # 国内正线 TCR/CNB 由 CNB 侧构建推送（见 .cnb.yml），此处不跨境复制

  publish-images:
    needs: [prepare, client-windows, client-linux-amd64, client-linux-arm64]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 跨境推送抖动宁可快速失败（可用 release-publish.yml 补跑），不挂死数小时
    permissions:
      contents: read
      packages: write   # 推 GHCR
    steps:
      - uses: actions/checkout@v4   # Dockerfile.dist 在仓内，必须 checkout（无 .git 时 gh 也会挂——已踩坑）
      - name: 下载 Release 全部安装包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-assets
          # 显式 -R 指定仓库（不依赖 checkout 出的 .git，双保险）
          gh release download "$GITHUB_REF_NAME" -R ${{ github.repository }} --dir dist-assets --clobber \
            --pattern "*.exe" --pattern "*.zip" --pattern "*.deb" --pattern "*.tar.gz"
          ls -lh dist-assets
      - uses: docker/setup-buildx-action@v3   # container 驱动 builder，支持多架构 --push（纯 COPY 无需 QEMU）
      - name: 客户端产物镜像推 GHCR（TCR/CNB 由 CNB 侧从 Gitee Release 国内补齐，见 .cnb.yml）
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
            -f uvmp-toolkit/packaging/Dockerfile.dist \
            -t "${GHCR_CLIENT_IMAGE}:${VERSION}" \
            --push dist-assets/

  release-final:
    # 不依赖 publish-images：产物镜像推送（跨境）抖动不应阻塞 Release 发布（已踩坑）
    needs: [prepare, manifest, client-windows, client-linux-amd64, client-linux-arm64]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 下载 Release 全部安装包（Gitee 回传用）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-assets
          gh release download "$GITHUB_REF_NAME" -R ${{ github.repository }} --dir dist-assets --clobber \
            --pattern "*.exe" --pattern "*.zip" --pattern "*.deb" --pattern "*.tar.gz"
      - name: 补全 GitHub Release 说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --notes "$(cat <<EOF
          服务端镜像 ${VERSION}（linux/amd64 + linux/arm64）：
          腾讯云 TCR（国内正线，CNB 构建推送）：docker pull ${TCR_IMAGE}:${VERSION}
          Docker Hub（GitHub 构建）：docker pull docker.io/${DOCKERHUB_USERNAME}/j1toolkit:${VERSION}
          CNB 制品库：docker pull ${CNB_IMAGE}:${VERSION}

          内网客户端安装包（Windows exe/zip、麒麟 amd64/arm64 deb/tar.gz）见下方 Assets；
          产物镜像：${TCR_IMAGE%/*}/uvmp-toolkit:${VERSION}（TCR）/ ${GHCR_CLIENT_IMAGE}:${VERSION}（GHCR）/ ${CNB_CLIENT_IMAGE}:${VERSION}（CNB）。

          部署见仓根 README.md 与 docker/.env.example（数据卷挂 /app/server/data，配置全走环境变量）。
          EOF
          )"
      - name: 回推 tag 到 Gitee / CNB（远端已存在则跳过）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          for REMOTE in \
            "https://oauth2:${GITEE_TOKEN}@gitee.com/j1net/j1toolkit.git" \
            "https://cnb:${CNB_TOKEN}@cnb.cool/j1net/j1toolkit/j1toolkit.git"; do
            if git ls-remote "$REMOTE" "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
              echo "远端已存在 ${GITHUB_REF_NAME}，跳过"
            else
              git push "$REMOTE" "refs/tags/${GITHUB_REF_NAME}"
            fi
          done
      - name: Gitee 公开仓 Release（删旧重建 + 6 件附件分卷上传 + 清理历史 Release）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -e
          API="https://gitee.com/api/v5/repos/j1net/j1toolkit"
          BODY="服务端镜像 ${VERSION}（linux/amd64 + linux/arm64）：腾讯云 TCR（国内正线，CNB 构建推送）：docker pull ${TCR_IMAGE}:${VERSION}；Docker Hub（GitHub 构建）：docker pull docker.io/${DOCKERHUB_USERNAME}/j1toolkit:${VERSION}；CNB 制品库：docker pull ${CNB_IMAGE}:${VERSION}。内网客户端安装包（Windows exe/zip、麒麟 amd64/arm64 deb/tar.gz）见下方附件；*.part-* 为分卷（Gitee 单附件限 100MB），下载全部卷后合并：cat 文件名.part-* > 文件名。产物镜像：${TCR_IMAGE%/*}/uvmp-toolkit:${VERSION}（TCR）/ ${GHCR_CLIENT_IMAGE}:${VERSION}（GHCR）/ ${CNB_CLIENT_IMAGE}:${VERSION}（CNB）。部署见仓根 README.md 与 docker/.env.example。"
          # 按 .id 判断存在性（Gitee 对无 Release 的 tag 也可能回 200 空体——已踩坑），有则删旧重建保证幂等
          curl -s -o /tmp/rel.json "${API}/releases/tags/${GITHUB_REF_NAME}?access_token=${GITEE_TOKEN}"
          OLD_REL=$(jq -r '.id // empty' /tmp/rel.json)
          if [ -n "$OLD_REL" ]; then
            curl -s -X DELETE "${API}/releases/${OLD_REL}?access_token=${GITEE_TOKEN}" -o /dev/null
            echo "已删旧 Release ${OLD_REL}"
          fi
          # Gitee 建 Release 必须带 target_commitish（缺了报 target_commitish is missing——已踩坑）；
          # tag 已存在时该字段不影响锚点
          RESP=$(curl -s -X POST "${API}/releases" \
            -d "access_token=${GITEE_TOKEN}" -d "tag_name=${GITHUB_REF_NAME}" \
            -d "target_commitish=main" \
            -d "name=v${VERSION}" --data-urlencode "body=${BODY}")
          REL_ID=$(echo "$RESP" | jq -r '.id // empty')
          [ -n "$REL_ID" ] || { echo "Gitee Release 创建失败，响应：$RESP"; exit 1; }
          cd dist-assets
          for f in *; do
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -gt 99614720 ]; then
              split -b 95m "$f" "$f.part-"
              for p in "$f".part-*; do
                curl -s -X POST "${API}/releases/${REL_ID}/attach_files" \
                  -F "access_token=${GITEE_TOKEN}" -F "file=@${p}" -o /dev/null
                echo "已传分卷 ${p}"
              done
            else
              curl -s -X POST "${API}/releases/${REL_ID}/attach_files" \
                -F "access_token=${GITEE_TOKEN}" -F "file=@${f}" -o /dev/null
              echo "已传 ${f}"
            fi
          done
          # 附件总量 1GB 限制：Gitee 公开仓仅留当前 Release（连同附件整删历史 Release；完整历史在 GitHub）
          curl -s "${API}/releases?access_token=${GITEE_TOKEN}&per_page=100" \
            | jq -r '.[] | select(.tag_name != "'"${GITHUB_REF_NAME}"'") | .id' \
            | while read -r OLD_ID; do
                curl -s -X DELETE "${API}/releases/${OLD_ID}?access_token=${GITEE_TOKEN}" -o /dev/null
                echo "已清理历史 Release ${OLD_ID}"
              done
