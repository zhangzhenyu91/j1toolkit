          files: uvmp-toolkit/dist-fyne/linux-arm64/*.tar.gz

  fyne-cnb-relay:
    # Fyne publish 后的 CNB 附件补传接力（2026-10-29）：正式 tag 发版时 release-final 只把
    # tag 推一次 CNB、tag_push 附件接力只跑一次；之后 fyne_track=publish 补传的 -fyne- 3 件
    # CNB 不会自动接力（release-final 见 tag 已存在即跳过——已踩坑）。故三平台附件就位后经
    # CNB CLI 触发 .cnb.yml 的 api_trigger 流水线：CNB 侧共用脚本 docker/cnb-relay-release-assets.sh
    # 从同一 GitHub Release 取件、断言正式3+Fyne3 后补传 CNB Release（overwrite 幂等），
    # 不重建镜像、不动 tag。仅 fyne_track=publish 且 ref 为 tag 时跑（三平台成功才触发）；
    # --sync 等 CNB 接力结果，接力失败即本 job 失败（重跑本 job 即可补触发，幂等）。
    needs: [prepare, fyne-windows, fyne-linux-amd64, fyne-linux-arm64]
    if: >-
      github.ref_type == 'tag' &&
      needs.prepare.outputs.server_only != 'true' &&
      inputs.fyne_track == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: 触发 CNB api_trigger 附件接力（--sync 等结果）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELAY_TAG: ${{ github.ref_name }}
        run: |
          [ -n "$CNB_TOKEN" ] || { echo "::error::CNB_TOKEN 未配置"; exit 1; }
          # 仓库 slug 与 CNB git 远端一致（cnb.cool/j1net/j1toolkit/j1toolkit）；
          # --env 显式传 RELAY_TAG 兜底（api_trigger 下 CNB_BRANCH 亦应为 tag 名，双保险）。
          # 事件名须为 api_trigger 或 api_trigger_*（CNB 文档）；--sync true 等接力完成再出结果。
          npx --yes @cnbcool/cnb-cli build start-build \
            --repo j1net/j1toolkit/j1toolkit \
            --tag "$RELAY_TAG" \
            --event api_trigger \
            --title "Fyne 附件 CNB 接力 ${RELAY_TAG}" \
            --env "RELAY_TAG=${RELAY_TAG}" \
            --sync true

  manifest:
    needs: [prepare, build-server]
    if: github.ref_type == 'tag' || needs.prepare.outputs.server_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write # 推 GHCR
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: 登录 GHCR + Docker Hub
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: 合并多架构 manifest（:${{ needs.prepare.outputs.version }}，GHCR/Docker Hub 各自仓内合并）
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          GITHUB_IMAGE="ghcr.io/zhangzhenyu91/j1toolkit"
          DH_IMAGE="docker.io/${DOCKERHUB_USERNAME}/j1toolkit"
          D_AMD64=$(cat digests/digest-amd64.txt)
          D_ARM64=$(cat digests/digest-arm64.txt)
          docker buildx imagetools create -t "${GITHUB_IMAGE}:${VERSION}" \
            "${GITHUB_IMAGE}@${D_AMD64}" "${GITHUB_IMAGE}@${D_ARM64}"
          docker buildx imagetools create -t "${DH_IMAGE}:${VERSION}" \
            "${DH_IMAGE}@${D_AMD64}" "${DH_IMAGE}@${D_ARM64}"
          # 国内正线 TCR/CNB 由 CNB 侧构建推送（见 .cnb.yml），此处不跨境复制

  publish-cnb-server:
    # 仅服务端预发：把带 commit 的 server-v 专用 tag 只推到 CNB，不建 GitHub tag/Release；
    # CNB 的 server-v* 通道只构建 TCR/CNB 镜像，不碰客户端与 Release 附件。
    needs: [prepare, manifest]
    if: github.ref_type != 'tag' && needs.prepare.outputs.server_only == 'true' && inputs.push_cnb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 推送服务端专用 tag 到 CNB（只触发镜像构建）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [ -n "$CNB_TOKEN" ] || { echo "::error::CNB_TOKEN 未配置"; exit 1; }
          TAG="server-v${VERSION}-${GITHUB_SHA::7}"
          REMOTE="https://cnb:${CNB_TOKEN}@cnb.cool/j1net/j1toolkit/j1toolkit.git"
          if git ls-remote "$REMOTE" "refs/tags/${TAG}" | grep -q .; then
            echo "CNB 已存在 ${TAG}，跳过重复触发"
            exit 0
          fi
          git tag "$TAG"
          git push "$REMOTE" "refs/tags/${TAG}"
          echo "已触发 CNB 镜像构建：${TAG} -> ${TCR_IMAGE}:${VERSION} / ${CNB_IMAGE}:${VERSION}"

  release-final:
    # needs 收齐全部构建产物：服务端多架构 manifest + 三客户端安装包（客户端只走 Release 附件，无产物镜像）
    needs: [prepare, manifest, client-windows, client-linux-amd64, client-linux-arm64]
    if: github.ref_type == 'tag' && needs.prepare.outputs.fyne_only != 'true' && needs.prepare.outputs.server_only != 'true' && (github.event_name != 'workflow_dispatch' || inputs.fyne_track == 'off')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 补全 GitHub Release 说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --notes "$(cat <<EOF
          服务端镜像 ${VERSION}（linux/amd64 + linux/arm64）：
          腾讯云 TCR（国内正线，CNB 构建推送）：docker pull ${TCR_IMAGE}:${VERSION}
          GHCR（GitHub 构建）：docker pull ghcr.io/zhangzhenyu91/j1toolkit:${VERSION}
          Docker Hub（GitHub 构建）：docker pull docker.io/${DOCKERHUB_USERNAME}/j1toolkit:${VERSION}
          CNB 制品库：docker pull ${CNB_IMAGE}:${VERSION}

          内网客户端安装包（Windows exe、麒麟 amd64/arm64 deb）见下方 Assets。

          部署见仓根 README.md 与 docker/.env.example（数据卷挂 /app/server/data，配置全走环境变量）。
          EOF
          )"
      - name: 回推 tag 到 CNB（触发 CNB 侧：服务端镜像重建推 TCR/CNB + git:release + Release 附件接力）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          REMOTE="https://cnb:${CNB_TOKEN}@cnb.cool/j1net/j1toolkit/j1toolkit.git"
          if git ls-remote "$REMOTE" "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            echo "远端已存在 ${GITHUB_REF_NAME}，跳过"
          else
            git push "$REMOTE" "refs/tags/${GITHUB_REF_NAME}"
          fi

  release-fyne-final:
    # 仅 v2.0.0-rc.1 / release-v2.0.0-rc.1：镜像 + Fyne 三件套，不依赖旧 Electron job。
    needs: [prepare, manifest, fyne-windows, fyne-linux-amd64, fyne-linux-arm64]
    if: github.ref_type == 'tag' && needs.prepare.outputs.fyne_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 补全 Fyne-only RC Release 说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --notes "$(cat <<EOF
          服务端镜像 ${VERSION}（linux/amd64 + linux/arm64）：
          腾讯云 TCR（国内正线，CNB 构建推送）：docker pull ${TCR_IMAGE}:${VERSION}
          GHCR（GitHub 构建）：docker pull ghcr.io/zhangzhenyu91/j1toolkit:${VERSION}
          Docker Hub（GitHub 构建）：docker pull docker.io/${DOCKERHUB_USERNAME}/j1toolkit:${VERSION}
          CNB 制品库：docker pull ${CNB_IMAGE}:${VERSION}

          Go + Fyne 内网客户端安装包（Windows exe、Linux amd64/arm64 deb）见下方 Assets。
          本 RC 不包含旧 Electron 客户端或便携 ZIP/tar.gz 附件。

          部署见仓根 README.md 与 docker/.env.example（数据卷挂 /app/server/data，配置全走环境变量）。
          EOF
          )"
      - name: 回推 RC tag 到 CNB（镜像重建 + Release + Fyne 三件套接力）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          REMOTE="https://cnb:${CNB_TOKEN}@cnb.cool/j1net/j1toolkit/j1toolkit.git"
          if git ls-remote "$REMOTE" "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            echo "远端已存在 ${GITHUB_REF_NAME}，跳过"
          else
            git push "$REMOTE" "refs/tags/${GITHUB_REF_NAME}"
          fi
