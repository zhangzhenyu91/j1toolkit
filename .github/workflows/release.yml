name: 发版

# 发版产线（2026-10 起构建收口 GitHub Actions，后端镜像 + Go+Fyne 内网客户端同一条版本线 vX.Y.Z）：
#   prepare        版本号剥离（release-v / v 前缀）
#   release-init   仅 tag：先建空 GitHub Release，避免三个客户端构建 job 并发抢建 422（已踩坑）
#   build-server   服务端镜像：amd64（ubuntu-latest）+ arm64（ubuntu-24.04-arm 原生构建机，公开仓免费）
#                  分架构原生构建，按 digest 双 output 同推 GHCR + Docker Hub（带 GHCR 层缓存）
#   fyne-*         Go+Fyne 客户端唯一正式构建轨：Windows NSIS exe + 麒麟 amd64/arm64 deb。
#                  三平台 CGO 构建（Windows MSYS2；Linux debian:buster 原生容器，arm64 使用
#                  ubuntu-24.04-arm 原生构建机）+ ONNX 装配（固定版本 + SHA256）+ NSIS/deb 装配 +
#                  glibc/ldd、GUI/CDP/OCR、安装冒烟门禁。tag 发版默认上传三件套；publish 可附加
#                  便携 ZIP/tar.gz。产物保留 -fyne- 中缀和 .exe/.deb 后缀（CNB 取件口径）。
#   fyne-cnb-relay publish 后按需经 CNB CLI 触发 .cnb.yml api_trigger 附件补传（幂等）。
#   manifest       合并服务端多架构 manifest :X.Y.Z（GHCR/Docker Hub 各自仓内合并，不跨仓拷 blob）
#   release-final  GitHub Release 补全说明 → 回推 tag 到 CNB → CNB 侧 .cnb.yml 接力：重建服务端
#                  镜像推 TCR + CNB 制品库 + git:release 建 CNB Release + 下载 GitHub 附件传
#                  CNB Release（GitHub→国内平台大附件跨境上传不可靠——已踩坑，国内接力执行）
# 触发：推 release-vX.Y.Z 或 vX.Y.Z tag（等价幂等，二选一即可）；workflow_dispatch 只构建冒烟不发布。
# 服务端镜像预发：workflow_dispatch 填 server_version 时只构建并发布服务端镜像，跳过三个客户端
# job 与 GitHub Release；push_cnb=true 时再推 server-v<版本> tag 到 CNB。
#
# 需在仓库配置（Settings → Secrets and variables → Actions）：
#   Secrets: CNB_TOKEN（CNB 个人访问令牌：仓库 git 写 + 制品库权限 + 流水线触发
#            repo-cnb-trigger:rw——fyne-cnb-relay 经 CNB CLI 触发 api_trigger 用）、
#            DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（Docker Hub 推送）
#   Variables 或 Secrets: TCR_IMAGE（服务端镜像全路径 ccr.ccs.tencentyun.com/<命名空间>/j1toolkit；
#            仅用于 Release 说明文案，TCR 推送在 CNB 侧）
# 另需 CNB 密钥仓库 j1net/j1toolkit/keys 的 envs.yml：TCR_USERNAME / TCR_PASSWORD / TCR_IMAGE
# （CNB 侧推 TCR 用）

on:
  push:
    tags: ['release-v*', 'v*']
  workflow_dispatch: # tag 补跑选对应 tag；仅发服务端镜像时在 main 填 server_version
    inputs:
      server_version:
        description: '仅发服务端镜像的版本号（如 1.24.0-beta.5；留空=按 ref 常规构建/补跑）'
        required: false
      push_cnb:
        description: '服务端镜像同步到 CNB/TCR（填写 server_version 时生效）'
        type: boolean
        default: false
      fyne_track:
        description: 'Go+Fyne 客户端附加产物（off=仅正式 exe/deb；build=仅构建门禁；publish=另传便携 ZIP/tar.gz）'
        type: choice
        options:
          - off
          - build
          - publish
        default: off

env:
  CNB_IMAGE: docker.cnb.cool/j1net/j1toolkit/j1toolkit
  # Docker Hub：GitHub 构建机同在美国，推送快（服务端镜像的 GitHub 侧落点；国内正线 TCR 由 CNB 构建推送，见 .cnb.yml）
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  # TCR_IMAGE 放 Variable 或 Secret 均可（双源回退；本工作流仅用于 Release 说明文案，TCR 推送在 CNB 侧）
  TCR_IMAGE: ${{ vars.TCR_IMAGE || secrets.TCR_IMAGE }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      server_only: ${{ steps.v.outputs.server_only }}
    steps:
      - id: v
        env:
          INPUT_SERVER_VERSION: ${{ inputs.server_version }}
        run: |
          if [ -n "${INPUT_SERVER_VERSION}" ]; then
            VERSION="${INPUT_SERVER_VERSION#v}"
            case "$VERSION" in
              *[!0-9A-Za-z._-]*) echo "::error::server_version 含非法字符"; exit 1 ;;
            esac
            echo "server_only=true" >> "$GITHUB_OUTPUT"
            echo "仅服务端镜像构建版本: ${VERSION}"
          else
            VERSION=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^(release-)?v//')
            echo "server_only=false" >> "$GITHUB_OUTPUT"
            echo "构建版本: ${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  release-init:
    needs: prepare
    # fyne_track=build 只跑 Fyne 构建门禁，不建 Release；publish 才创建附件落点
    if: github.ref_type == 'tag' && needs.prepare.outputs.server_only != 'true' && inputs.fyne_track != 'build'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2 # 建（或复用）空 Release
        with:
          prerelease: ${{ contains(github.ref_name, '-alpha.') || contains(github.ref_name, '-beta.') || contains(github.ref_name, '-rc.') }}
      - if: github.ref_type != 'tag'
        run: echo "非 tag 构建：只编译冒烟，不发 Release"

  build-server:
    needs: prepare
    # 服务端镜像与 Go+Fyne 客户端共用同一正式发版轨
    if: github.event_name != 'workflow_dispatch' || inputs.fyne_track == 'off'
    permissions:
      packages: write # 推 GHCR
    strategy:
      matrix:
        include:
          - { suffix: amd64, platform: linux/amd64, runner: ubuntu-latest }
          - { suffix: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR + Docker Hub
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] \
            || { echo "::error::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 未配置"; exit 1; }
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: 原生构建并按 digest 推 GHCR + Docker Hub（${{ matrix.platform }}）
        run: |
          # GHCR/Docker Hub 均美国同岸，双 output 同推（国内仓只由 CNB 侧构建推送，见 .cnb.yml）
          # --provenance=false：buildx 默认附加 SLSA 溯源证明（OCI empty config 清单），
          # 部分仓库不认该 manifest class 拒收（unknown manifest class ... oci.empty.v1）——已踩坑
          # registry 层缓存（GHCR）：LibreOffice 等不变层只在首次上传，后续发版只传变化层
          GITHUB_IMAGE="ghcr.io/zhangzhenyu91/j1toolkit"
          DH_IMAGE="docker.io/${DOCKERHUB_USERNAME}/j1toolkit"
          docker buildx build --platform ${{ matrix.platform }} --provenance=false \
            --output type=image,name=${GITHUB_IMAGE},push-by-digest=true,name-canonical=true,push=true \
            --output type=image,name=${DH_IMAGE},push-by-digest=true,name-canonical=true,push=true \
            --cache-from type=registry,ref=${GITHUB_IMAGE}:buildcache \
            --cache-to type=registry,ref=${GITHUB_IMAGE}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true \
            --metadata-file /tmp/meta.json .
          jq -r '."containerimage.digest"' /tmp/meta.json > "digest-${{ matrix.suffix }}.txt"
      - name: 传递 digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: digest-${{ matrix.suffix }}.txt
          retention-days: 1

  # ===== Go+Fyne 客户端正式轨（唯一客户端构建链）=====
  # tag 发版默认构建三平台 exe/deb；workflow_dispatch 的 build/publish 仍可仅做门禁或补传便携包。
  # needs 用 always() 显式放行：release-init 仅 tag 跑、非 tag dispatch 被跳过时本轨仍须构建。
  fyne-windows:
    needs: [release-init, prepare]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.server_only != 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: uvmp-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5 # 与 core-go/go.mod 同版本线（uvmp-export + Fyne GUI 同模块）
        with:
          go-version-file: uvmp-toolkit/core-go/go.mod
          cache-dependency-path: uvmp-toolkit/core-go/go.sum
      - uses: msys2/setup-msys2@v2 # Fyne CGO 工具链（mingw-w64 gcc；path-type inherit 后普通步骤可用）
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-gcc make pkg-config
      - name: Fyne CGO 构建（MSYS2 mingw-w64：uvmp-toolkit + uvmp-core + uvmp-export）
        shell: pwsh
        run: powershell -NoProfile -File packaging/fyne/build_fyne_core.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uvmp-toolkit/desktop/package-lock.json
      - name: OCR 运行时装配（onnxruntime 库 + 模型，SHA256 校验）
        shell: pwsh
        run: |
          # onnxruntime-node 只取 CPU EP 预编译库；postinstall CUDA 拉取必须跳过
          $env:ONNXRUNTIME_NODE_INSTALL_CUDA = "skip"
          npm ci --prefix desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -File packaging/fyne/assemble_onnx.ps1
      - name: 安装 NSIS 构建工具
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $maker = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $maker) { $maker = "C:\Program Files (x86)\NSIS\makensis.exe" }
          if (-not (Test-Path $maker)) { throw "NSIS 安装后仍未找到 makensis: $maker" }
          "UVMP_NSIS_MAKENSIS=$maker" >> $env:GITHUB_ENV
      - name: 准备 Windows 软件 OpenGL（Mesa 26.2.4 + SHA256）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "26.2.4"
          $expected = "351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695"
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/${version}/mesa3d-${version}-release-msvc.7z"
          $zip = Join-Path $env:TEMP "mesa3d-${version}-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Mesa SHA256 不匹配: $actual" }
          $dest = Join-Path $env:TEMP "uvmp-mesa-${version}"
          New-Item -ItemType Directory -Force $dest | Out-Null
          & "desktop/node_modules/7zip-bin/win/x64/7za.exe" x $zip "-o$dest" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Mesa 解包失败: $LASTEXITCODE" }
          if (-not (Test-Path "$dest\x64\opengl32.dll")) { throw "Mesa x64 opengl32.dll 缺失" }
          Copy-Item "$dest\x64\*" "dist-fyne/windows-amd64/" -Recurse -Force
          "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV
      - name: NSIS 装配（Setup exe + 绿色 zip，-fyne- 中缀）
        shell: pwsh
        env:
          UVMP_FYNE_VERSION: ${{ github.ref_type == 'tag' && needs.prepare.outputs.version || '' }} # tag 构建用 tag 版本；非 tag（workflow_dispatch）回退 uvmp-toolkit/version.json（与 desktop/package.json 解耦）
        run: powershell -NoProfile -File packaging/fyne/assemble_nsis.ps1
      - name: 门禁（DLL 依赖 + GUI/CDP/OCR 冒烟）
        shell: pwsh
        run: powershell -NoProfile -File packaging/fyne/gate_smoke.ps1
      - name: 安装冒烟（NSIS 静默装 / 静默卸）
        shell: pwsh
        run: powershell -NoProfile -File packaging/fyne/install_smoke.ps1
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: uvmp-toolkit/dist-fyne/windows-amd64/uvmp-toolkit-fyne-Setup-*.exe
      - if: github.ref_type == 'tag' && inputs.fyne_track == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          files: uvmp-toolkit/dist-fyne/windows-amd64/*.zip

  fyne-linux-amd64:
    needs: [release-init, prepare]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.server_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: uvmp-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: uvmp-toolkit/core-go/go.mod
          cache-dependency-path: uvmp-toolkit/core-go/go.sum
      - name: Fyne CGO 构建（debian:buster 原生 amd64，glibc 2.28 对齐麒麟 V10 SP1）
        # 容器内 build_fyne_core.sh 自装 gcc/X11·GL 开发头与 Go 工具链、原生 CGO 构建
        # uvmp-toolkit + uvmp-core + uvmp-export（CGO 交叉禁用：arm64 走原生构建机，不冒充）
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            debian:buster bash packaging/fyne/build_fyne_core.sh linux-amd64
      - name: 回收容器构建产物权限
        run: sudo chown -R "$(id -u):$(id -g)" dist-fyne
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uvmp-toolkit/desktop/package-lock.json
      - name: OCR 运行时装配（onnxruntime 库 + 模型，SHA256 校验）
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          npm ci --prefix desktop
          bash packaging/fyne/assemble_onnx.sh linux-amd64
      - name: deb 装配（deb + tar.gz，-fyne- 中缀）
        env:
          UVMP_FYNE_VERSION: ${{ github.ref_type == 'tag' && needs.prepare.outputs.version || '' }} # tag 构建用 tag 版本；非 tag（workflow_dispatch）回退 uvmp-toolkit/version.json（与 desktop/package.json 解耦）
        run: |
          docker run --rm -e UVMP_FYNE_VERSION \
            -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            debian:buster bash packaging/fyne/assemble_deb.sh linux-amd64
      - name: 门禁（glibc/ldd + GUI/CDP/OCR 冒烟，buster 容器；CDP 用容器内 chromium 代宿主 360ent）
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            debian:buster bash packaging/fyne/gate_smoke.sh dist-fyne/linux-amd64 linux-amd64
      - name: 安装冒烟（dpkg 实装 → launcher 实跑 → 卸载清理，buster 容器）
        run: |
          DEB=$(ls dist-fyne/linux-amd64/*.deb | head -1)
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            debian:buster bash packaging/fyne/install_smoke.sh "$DEB"
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: uvmp-toolkit/dist-fyne/linux-amd64/*.deb
      - if: github.ref_type == 'tag' && inputs.fyne_track == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          files: uvmp-toolkit/dist-fyne/linux-amd64/*.tar.gz

  fyne-linux-arm64:
    # ubuntu-24.04-arm 原生构建机（公开仓免费）：arm64v8/debian:buster 原生容器 CGO 构建，
    # 不挂 QEMU（测试/冒烟均为原生执行，不冒充）
    needs: [release-init, prepare]
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.server_only != 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    defaults:
      run:
        working-directory: uvmp-toolkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: uvmp-toolkit/core-go/go.mod
          cache-dependency-path: uvmp-toolkit/core-go/go.sum
      - name: Fyne CGO 构建（arm64v8/debian:buster 原生 arm64）
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            arm64v8/debian:buster bash packaging/fyne/build_fyne_core.sh linux-arm64
      - name: 回收容器构建产物权限
        run: sudo chown -R "$(id -u):$(id -g)" dist-fyne
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: uvmp-toolkit/desktop/package-lock.json
      - name: OCR 运行时装配（onnxruntime 库 + 模型，SHA256 校验）
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          npm ci --prefix desktop
          bash packaging/fyne/assemble_onnx.sh linux-arm64
      - name: deb 装配（deb + tar.gz，-fyne- 中缀）
        env:
          UVMP_FYNE_VERSION: ${{ github.ref_type == 'tag' && needs.prepare.outputs.version || '' }} # tag 构建用 tag 版本；非 tag（workflow_dispatch）回退 uvmp-toolkit/version.json（与 desktop/package.json 解耦）
        run: |
          docker run --rm -e UVMP_FYNE_VERSION \
            -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            arm64v8/debian:buster bash packaging/fyne/assemble_deb.sh linux-arm64
      - name: 回收装配产物权限（容器内出包后属主为 root）
        run: sudo chown -R "$(id -u):$(id -g)" dist-fyne
      - name: CDP 门禁浏览器（arm64 buster 源无 chromium：临时装配 Electron 回退资产，仅门禁用、不入 deb）
        # deb/tar.gz 已在上一步出包，此处再装配不会进包；门禁以 UVMP_GATE_ELECTRON=1 走回退链路
        run: bash packaging/fyne/fetch_browser_runtime.sh linux-arm64
      - name: 门禁（glibc/ldd + GUI/CDP/OCR 冒烟，arm64 原生容器；CDP 走临时 Electron 回退资产）
        env:
          UVMP_GATE_ELECTRON: '1'
        run: |
          docker run --rm -e UVMP_GATE_ELECTRON -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            arm64v8/debian:buster bash packaging/fyne/gate_smoke.sh dist-fyne/linux-arm64 linux-arm64
      - name: 安装冒烟（dpkg 实装 → launcher 实跑 → 卸载清理，arm64 原生容器）
        run: |
          DEB=$(ls dist-fyne/linux-arm64/*.deb | head -1)
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src/uvmp-toolkit \
            arm64v8/debian:buster bash packaging/fyne/install_smoke.sh "$DEB"
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: uvmp-toolkit/dist-fyne/linux-arm64/*.deb
      - if: github.ref_type == 'tag' && inputs.fyne_track == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          files: uvmp-toolkit/dist-fyne/linux-arm64/*.tar.gz

  fyne-cnb-relay:
    # Fyne publish 后的 CNB 附件补传接力（2026-10-29）：正式 tag 发版时 release-final 只把
    # tag 推一次 CNB、tag_push 附件接力只跑一次；之后 fyne_track=publish 补传的 -fyne- 3 件
    # CNB 不会自动接力（release-final 见 tag 已存在即跳过——已踩坑）。故三平台附件就位后经
    # CNB CLI 触发 .cnb.yml 的 api_trigger 流水线：CNB 侧共用脚本 docker/cnb-relay-release-assets.sh
    # 从同一 GitHub Release 取件、统一断言 Go+Fyne 3 件后补传 CNB Release（overwrite 幂等），
    # 不重建镜像、不动 tag。仅 fyne_track=publish 且 ref 为 tag 时跑（三平台成功才触发）；
    # --sync 等 CNB 接力结果，接力失败即本 job 失败（重跑本 job 即可补触发，幂等）。
    needs: [prepare, fyne-windows, fyne-linux-amd64, fyne-linux-arm64]
    if: >-
      github.ref_type == 'tag' &&
      needs.prepare.outputs.server_only != 'true' &&
      inputs.fyne_track == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: 触发 CNB api_trigger 附件接力（--sync 等结果）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELAY_TAG: ${{ github.ref_name }}
        run: |
          [ -n "$CNB_TOKEN" ] || { echo "::error::CNB_TOKEN 未配置"; exit 1; }
          # 仓库 slug 与 CNB git 远端一致（cnb.cool/j1net/j1toolkit/j1toolkit）；
          # --env 显式传 RELAY_TAG 兜底（api_trigger 下 CNB_BRANCH 亦应为 tag 名，双保险）。
          # 事件名须为 api_trigger 或 api_trigger_*（CNB 文档）；--sync true 等接力完成再出结果。
          npx --yes @cnbcool/cnb-cli build start-build \
            --repo j1net/j1toolkit/j1toolkit \
            --tag "$RELAY_TAG" \
            --event api_trigger \
            --title "Fyne 附件 CNB 接力 ${RELAY_TAG}" \
            --env "RELAY_TAG=${RELAY_TAG}" \
            --sync true

  manifest:
    needs: [prepare, build-server]
    if: (github.ref_type == 'tag' && (github.event_name != 'workflow_dispatch' || inputs.fyne_track != 'build')) || needs.prepare.outputs.server_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write # 推 GHCR
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: 登录 GHCR + Docker Hub
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin
      - name: 合并多架构 manifest（:${{ needs.prepare.outputs.version }}，GHCR/Docker Hub 各自仓内合并）
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          GITHUB_IMAGE="ghcr.io/zhangzhenyu91/j1toolkit"
          DH_IMAGE="docker.io/${DOCKERHUB_USERNAME}/j1toolkit"
          D_AMD64=$(cat digests/digest-amd64.txt)
          D_ARM64=$(cat digests/digest-arm64.txt)
          docker buildx imagetools create -t "${GITHUB_IMAGE}:${VERSION}" \
            "${GITHUB_IMAGE}@${D_AMD64}" "${GITHUB_IMAGE}@${D_ARM64}"
          docker buildx imagetools create -t "${DH_IMAGE}:${VERSION}" \
            "${DH_IMAGE}@${D_AMD64}" "${DH_IMAGE}@${D_ARM64}"
          # 国内正线 TCR/CNB 由 CNB 侧构建推送（见 .cnb.yml），此处不跨境复制

  publish-cnb-server:
    # 仅服务端预发：把带 commit 的 server-v 专用 tag 只推到 CNB，不建 GitHub tag/Release；
    # CNB 的 server-v* 通道只构建 TCR/CNB 镜像，不碰客户端与 Release 附件。
    needs: [prepare, manifest]
    if: github.ref_type != 'tag' && needs.prepare.outputs.server_only == 'true' && inputs.push_cnb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 推送服务端专用 tag 到 CNB（只触发镜像构建）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          [ -n "$CNB_TOKEN" ] || { echo "::error::CNB_TOKEN 未配置"; exit 1; }
          TAG="server-v${VERSION}-${GITHUB_SHA::7}"
          REMOTE="https://cnb:${CNB_TOKEN}@cnb.cool/j1net/j1toolkit/j1toolkit.git"
          if git ls-remote "$REMOTE" "refs/tags/${TAG}" | grep -q .; then
            echo "CNB 已存在 ${TAG}，跳过重复触发"
            exit 0
          fi
          git tag "$TAG"
          git push "$REMOTE" "refs/tags/${TAG}"
          echo "已触发 CNB 镜像构建：${TAG} -> ${TCR_IMAGE}:${VERSION} / ${CNB_IMAGE}:${VERSION}"

  release-final:
    # needs 收齐全部构建产物：服务端多架构 manifest + Go+Fyne 三客户端安装包（客户端只走 Release 附件，无产物镜像）
    needs: [prepare, manifest, fyne-windows, fyne-linux-amd64, fyne-linux-arm64]
    if: github.ref_type == 'tag' && needs.prepare.outputs.server_only != 'true' && (github.event_name != 'workflow_dispatch' || inputs.fyne_track != 'build')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 补全 GitHub Release 说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --notes "$(cat <<EOF
          服务端镜像 ${VERSION}（linux/amd64 + linux/arm64）：
          腾讯云 TCR（国内正线，CNB 构建推送）：docker pull ${TCR_IMAGE}:${VERSION}
          GHCR（GitHub 构建）：docker pull ghcr.io/zhangzhenyu91/j1toolkit:${VERSION}
          Docker Hub（GitHub 构建）：docker pull docker.io/${DOCKERHUB_USERNAME}/j1toolkit:${VERSION}
          CNB 制品库：docker pull ${CNB_IMAGE}:${VERSION}

          Go + Fyne 内网客户端安装包（Windows exe、麒麟 amd64/arm64 deb）见下方 Assets。
          本 Release 不包含旧 Electron+Python 客户端；便携 ZIP/tar.gz 仅在 fyne_track=publish 时附加。

          部署见仓根 README.md 与 docker/.env.example（数据卷挂 /app/server/data，配置全走环境变量）。
          EOF
          )"
      - name: 回推 tag 到 CNB（触发 CNB 侧：服务端镜像重建推 TCR/CNB + git:release + Release 附件接力）
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          REMOTE="https://cnb:${CNB_TOKEN}@cnb.cool/j1net/j1toolkit/j1toolkit.git"
          if git ls-remote "$REMOTE" "refs/tags/${GITHUB_REF_NAME}" | grep -q .; then
            echo "远端已存在 ${GITHUB_REF_NAME}，跳过"
          else
            git push "$REMOTE" "refs/tags/${GITHUB_REF_NAME}"
          fi
