      - if: github.ref_type == 'tag' && inputs.fyne_track == 'publish' && needs.prepare.outputs.fyne_only != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: uvmp-toolkit/dist-fyne/linux-amd64/*.tar.gz

